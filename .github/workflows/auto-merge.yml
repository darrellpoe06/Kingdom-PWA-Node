# Auto-merge bootstrap — hands-off promotion to main, gated by branch protection.
#
# For PRs that TARGET main from feat/*, fix/*, merge/*, docs/*, or claude/*
# branches (claude/* is the remote/web session lane — added 2026-07-05 so agent
# PRs stop stalling until a human clicks merge),
# this enables GitHub's native auto-merge (squash). The PR then merges itself
# the moment the required status checks pass — and ONLY then. This never
# bypasses protection: auto-merge respects every required check and review
# rule on main, and a PR whose checks fail simply never merges.
#
# Auth is the workflow's own GITHUB_TOKEN (granted below). gh runs INSIDE the
# Action; nothing here calls gh from a local shell. Nothing here touches the
# protection rules themselves. No force, ever.
#
# WHY THE SWEEP (2026-06-16): the original version fired only on pull_request
# events. PR #192 — the PR that first turned the repo's "Allow auto-merge"
# setting ON — could not enable auto-merge on itself: the setting was OFF when
# its pull_request run fired, and the workflow never re-fired without a fresh
# push. Classic chicken-and-egg. The fix is to also run on check_suite:completed
# (a PR that went green BEFORE auto-merge was enabled now gets picked up when
# its checks finish, no push needed) and on workflow_dispatch (a manual sweep
# button), and to make the job SWEEP every eligible open PR rather than only the
# one in the triggering event's payload. Enabling auto-merge is idempotent, so
# a PR that already has it stays untouched.
#
# HOLD OPT-OUT: a PR labeled `hold` is skipped. Auto-merge is the default;
# holding is the explicit, human-governed exception — the gate for Tier C work
# that is intentionally soaking (RELEASE-TIERS.md) or awaiting family/Governor
# review. Remove the label when the soak/review is done and the next sweep (or
# any pull_request event) enables auto-merge.
#
# Pairs with ci.yml (the required checks this defers to) and RELEASE-TIERS.md.

name: Auto-merge

on:
  pull_request:
    # `closed` (2026-07-08, DR-0107 follow-through; CORRECTED same night): a
    # native auto-merge lands with NO subsequent event this workflow hears —
    # the GITHUB_TOKEN merge emits no push and main-CI doesn't run. `closed`
    # was added to make the merge run the deploy step below, but PROVED (PR
    # #697, watched) to be suppressed for auto-merges too: the close is a
    # GITHUB_TOKEN action, and GitHub suppresses workflow runs for every
    # event a GITHUB_TOKEN action emits — push, closed, all of it. `closed`
    # stays because it DOES fire for human-clicked merges/closes; for
    # auto-merges the real catcher is the armed-PR wait loop in the deploy
    # step (sized to span a full CI run), with the deploy-freshness cron
    # (best-effort, observed ~hourly) as the outer net.
    types: [opened, reopened, ready_for_review, synchronize, closed]
    branches: [main]
  check_suite:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write   # to dispatch db-migrate after a migration auto-merges

# One sweep at a time; a newer run supersedes an in-flight one.
concurrency:
  group: auto-merge-sweep
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: enable auto-merge (squash) on eligible PRs
    runs-on: ubuntu-latest
    steps:
      - name: Enable native auto-merge on every eligible open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Eligible = open, non-draft, targets main, head branch is a release
          # lane (feat|fix|merge|docs|claude), NOT labeled `hold`, and auto-merge is NOT
          # already enabled. Filtering happens here (not in a job-level `if:`) so
          # the same job works uniformly across pull_request / check_suite /
          # workflow_dispatch — only pull_request events carry a single PR.
          mapfile -t prs < <(
            gh pr list --repo "$REPO" --state open --base main \
              --json number,headRefName,isDraft,autoMergeRequest,labels \
              --jq '.[]
                    | select(.isDraft == false)
                    | select(.headRefName | test("^(feat|fix|merge|docs|claude)/"))
                    | select(.autoMergeRequest == null)
                    | select(any(.labels[].name; . == "hold") | not)
                    | .number'
          )
          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No eligible PRs awaiting auto-merge."
            exit 0
          fi
          echo "Eligible PRs: ${prs[*]}"
          for n in "${prs[@]}"; do
            echo "Enabling auto-merge (squash) on #$n"
            # Never fail the sweep on one PR: it may have merged or become
            # ineligible (e.g. a required check already failed) between the
            # list and the enable. Auto-merge still respects branch protection.
            if ! gh pr merge --repo "$REPO" --auto --squash "$n"; then
              echo "::warning::could not enable auto-merge on #$n (may have just merged or become ineligible)"
            fi
          done

      # db-migrate (push: main, paths: migrations) does NOT fire when auto-merge
      # lands a migration, because the merge push is by GITHUB_TOKEN and GitHub
      # suppresses push-triggered runs from the token (anti-recursion). That gap
      # silently stopped migrations from reaching the cloud DB on 2026-06-16
      # (it broke the Choir tab — grant fix 0024 never applied). workflow_dispatch
      # by the token IS allowed (unlike push), so when main's tip commit touched
      # a migration, dispatch db-migrate here. db-migrate is idempotent (applies
      # all guarded SQL every run), so a redundant dispatch is harmless.
      - name: Apply migrations if main's tip added one (closes the GITHUB_TOKEN push gap)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          touched=$(gh api "repos/$REPO/commits/main" \
            --jq 'any(.files[]?.filename; startswith("infra/supabase/migrations-auto/"))' 2>/dev/null || echo false)
          if [ "$touched" = "true" ]; then
            echo "main tip touched a migration — dispatching db-migrate."
            gh workflow run db-migrate.yml --repo "$REPO" --ref main \
              || echo "::warning::could not dispatch db-migrate (it can be run manually)"
          else
            echo "main tip has no migration change; nothing to apply."
          fi

      # SAME GITHUB_TOKEN gap, for PRODUCTION DEPLOY (2026-07-06). deploy-
      # cloudflare-pages.yml fires on push:main — which GitHub SUPPRESSES for the
      # GITHUB_TOKEN merge push (anti-recursion), exactly like db-migrate above.
      # So when auto-merge went live, every auto-merged PR landed on main but
      # NEVER deployed: poetech.us froze on the last HUMAN-merged build (6bfae29)
      # while main ran far ahead. workflow_dispatch by the token IS allowed, so
      # dispatch the deploy here whenever main's tip has not been deployed yet.
      # Gated on the deploy workflow's own last head_sha so a merge triggers
      # exactly ONE build (protects the CF Pages free build budget); a run already
      # queued/running for this same tip is a no-op. Deploy is single-flight
      # (its own concurrency group), so a redundant dispatch cannot stampede.
      #
      # WHY THE WAIT LOOP (2026-07-08, after the SECOND miss): this step RACES
      # the merge it exists to heal. The sweep fires on the green check_suite —
      # the same moment GitHub's native auto-merge performs the squash — so on
      # PR #685 (2026-07-07) and again PR #690 (2026-07-08) the check below ran
      # a beat BEFORE the merge landed, saw main's tip already deployed, and
      # exited; the merge push itself fires no event (token-suppressed), so the
      # heal never re-ran and both deploys had to be dispatched by hand. Fix:
      # when the tips match but ARMED PRs exist (auto-merge enabled, i.e. a
      # merge may be seconds away), poll for main to advance and dispatch the
      # moment it does. When nothing is armed, the old single check is
      # unchanged — no idle sweeps burn wait time.
      #
      # WHY THE WINDOW IS 6 MINUTES (2026-07-08, after the THIRD miss, PR
      # #697): the sweep that arms a fresh PR fires at PR-OPEN, when its CI
      # has only just started — the old 2-minute poll expired a beat before
      # the ~3-minute CI went green and the merge landed, and NO later event
      # fired (the auto-merge close is token-suppressed; see the `closed` note
      # at the top). 6 minutes spans a full CI run plus queue margin from the
      # earliest moment a sweep can arm a PR. Bounded cost: the poll runs only
      # while armed PRs exist, and a superseding sweep cancels it
      # (concurrency). CI failures exit via the armed PR never merging; the
      # cron remains the outer net.
      - name: Deploy main's tip if it isn't the last-deployed commit (closes the GITHUB_TOKEN push gap for CF Pages)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deploy_if_stale() {
            main_sha=$(gh api "repos/$REPO/commits/main" --jq '.sha' 2>/dev/null || echo "")
            last_deployed=$(gh api "repos/$REPO/actions/workflows/deploy-cloudflare-pages.yml/runs?per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || echo "")
            if [ -n "$main_sha" ] && [ "$main_sha" != "$last_deployed" ]; then
              echo "main tip $main_sha not yet deployed (last deployed $last_deployed) — dispatching CF Pages deploy."
              gh workflow run deploy-cloudflare-pages.yml --repo "$REPO" --ref main \
                || echo "::warning::could not dispatch deploy (it can be run manually)"
              return 0
            fi
            return 1
          }
          if deploy_if_stale; then exit 0; fi
          armed=$(gh pr list --repo "$REPO" --state open --base main \
            --json autoMergeRequest --jq '[.[] | select(.autoMergeRequest != null)] | length' 2>/dev/null || echo 0)
          if [ "$armed" -gt 0 ]; then
            echo "main tip already deployed, but $armed armed PR(s) may merge momentarily — polling up to 6 minutes."
            for i in $(seq 1 24); do
              sleep 15
              if deploy_if_stale; then exit 0; fi
            done
            echo "No merge landed within the wait; the next sweep or the scheduled freshness check covers it."
          else
            echo "main tip already deployed and no armed PRs; nothing to dispatch."
          fi
