# =============================================================================
# Push notifications — the sender's database credentials ride the record.
# =============================================================================
# Darrell, 2026-09-09, phone screenshots: the app says "Notifications on",
# mrspoe06's "Hello" landed at 8:57 PM, and the Android shade showed nothing.
#
# THE MEASURED CAUSE. /api/push-send (the Pages Function that buzzes a phone)
# needs SUPABASE_URL + SUPABASE_SERVICE_KEY in the Pages project environment:
# without them it answers 503 not-configured, and the app — fire-and-forget by
# design, DR-0334 — swallows that. Nothing in this repository ever installed
# those two names (push-vapid-keys.yml installs the VAPID three and stops).
# One layer under that: the app has read the SOVEREIGN stack since REPOINT-ARMED
# (2026-08-19, DR-0310), so the subscriptions a phone files live on the NAS —
# the sender must read the SAME database, not the hosted project (whose
# push_subscriptions table is empty and whose newest message is from July).
#
# THE FIX IS THE SAME WAY THE DEPLOY ALREADY USES (DR-0108: challenge "must be
# by hand"). deploy-cloudflare-pages.yml joins the tailnet and reads the anon
# key out of the NAS's own /volume1/docker/supabase/.env; nas-clock.yml reads
# SERVICE_ROLE_KEY from the same file. This job does exactly that, installs the
# pair onto the Pages project with wrangler (the VAPID job's mechanism), and
# then PROVES it three ways instead of reporting an exit code (DR-0076):
#   1. the URL+key pair answers from the runner BEFORE anything is installed;
#   2. Cloudflare lists the names back;
#   3. the LIVE site's /api/push-send stops answering 503 (DR-0125: prove the
#      site, not the pipeline) — after the deploy that binds the new values,
#      which this job dispatches and waits for (Pages binds env at deploy time,
#      the lesson push-vapid-keys.yml recorded).
#
# WHY THE FUNNEL URL AND NOT poetech.us/sb: the Function runs ON poetech.us; a
# fetch to its own origin would re-enter Pages routing. The /sb proxy is only a
# same-origin door for BROWSERS (the Funnel throttles cross-origin browser
# fetches); server-to-server the Function reaches the Funnel's /sb mount
# directly, exactly as functions/_lib/funnel-proxy.js does on every request.
#
# BRAKES: dispatch-only, no clock — not the runaway class. Idempotent: re-
# installing the same values changes nothing a device can feel (these keys do
# not bind subscriptions; only the VAPID pair does, and this job never touches
# it). The secrets it needs already exist on the repository and are used by the
# deploy (TS_AUTHKEY, NAS_SSH_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
name: Push notifications — install the sender's database credentials

on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: 'Dispatch Deploy (Cloudflare Pages) after installing and wait for it, so the live Function binds the values. Leave "yes".'
        required: false
        default: 'yes'

permissions:
  contents: read
  actions: write

concurrency:
  group: push-sender-credentials
  cancel-in-progress: false

jobs:
  install:
    name: read from the NAS + install + prove the live sender
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: poetech-app
      # The Funnel's /sb mount — the same upstream functions/_lib/funnel-proxy.js
      # fronts for browsers, reached directly by the Function (server-to-server).
      SOVEREIGN_REST_ORIGIN: https://poetech.tail5a2f35.ts.net/sb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The credentials must exist, and the record must say the app is sovereign
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          MISSING=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          [ -n "$TS_AUTHKEY" ] || MISSING="$MISSING TS_AUTHKEY"
          [ -n "$NAS_SSH_KEY" ] || MISSING="$MISSING NAS_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Repository secrets missing:$MISSING — the same ones deploy-cloudflare-pages.yml uses. Nothing was changed."
            exit 1
          fi
          if [ ! -f infra/nas-supabase/REPOINT-ARMED ]; then
            echo "::error::infra/nas-supabase/REPOINT-ARMED is absent, so the app reads the HOSTED project and the sender must too. This job installs SOVEREIGN credentials only; it refuses to guess. Nothing was changed."
            exit 1
          fi

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Read the sovereign keys from the NAS itself (never displayed)
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          OUT=$(ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            dpoe@poetech.tail5a2f35.ts.net \
            "sudo -n sed -n -e 's/^ANON_KEY=/ANON=/p' -e 's/^SERVICE_ROLE_KEY=/SERVICE=/p' /volume1/docker/supabase/.env")
          rm -f /tmp/nas_key
          ANON=$(printf '%s\n' "$OUT" | sed -n 's/^ANON=//p' | head -1 | tr -d '[:space:]')
          SERVICE=$(printf '%s\n' "$OUT" | sed -n 's/^SERVICE=//p' | head -1 | tr -d '[:space:]')
          for PAIR in "ANON_KEY:$ANON" "SERVICE_ROLE_KEY:$SERVICE"; do
            NAME=${PAIR%%:*}; VAL=${PAIR#*:}
            case "$VAL" in
              eyJ*.eyJ*.*) : ;;
              *) echo "::error::$NAME read from the NAS is ${#VAL} bytes, not a JWT — nothing was installed."; exit 1 ;;
            esac
          done
          echo "::add-mask::$ANON"
          echo "::add-mask::$SERVICE"
          printf '{"SUPABASE_URL":"%s","SUPABASE_SERVICE_KEY":"%s","SUPABASE_ANON_KEY":"%s"}\n' \
            "$SOVEREIGN_REST_ORIGIN" "$SERVICE" "$ANON" > /tmp/creds.json
          echo "read both keys from the NAS (masked); URL = $SOVEREIGN_REST_ORIGIN"

      # PROOF 1 — the pair the Function will use answers from OUTSIDE the tailnet
      # (a GitHub runner on the public internet, like Cloudflare's egress). A
      # 200 on push_subscriptions under the service key is the exact read the
      # sender performs. Fail here and nothing is installed.
      - name: PROVE the URL + key pair before installing anything
        run: |
          SERVICE=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/creds.json","utf8")).SUPABASE_SERVICE_KEY)')
          CODE=$(curl -sS --max-time 30 -o /tmp/probe.txt -w '%{http_code}' \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" \
            "$SOVEREIGN_REST_ORIGIN/rest/v1/push_subscriptions?select=id&limit=1" || echo 000)
          echo "GET $SOVEREIGN_REST_ORIGIN/rest/v1/push_subscriptions -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::The sovereign REST did not answer 200 under the service key (HTTP $CODE): $(head -c 300 /tmp/probe.txt). Nothing was installed."
            rm -f /tmp/creds.json; exit 1
          fi
          ROWS=$(node -e 'const a=JSON.parse(require("fs").readFileSync("/tmp/probe.txt","utf8"));process.stdout.write(String(Array.isArray(a)?a.length:0))')
          echo "push_subscriptions answered (sample rows: $ROWS) — the sender can read the phones the app files."

      - name: Install onto the Pages project
        run: |
          set -o pipefail
          npx --yes wrangler@3 pages secret bulk /tmp/creds.json --project-name="$PROJECT" 2>&1 | tee /tmp/upload.out
          shred -u /tmp/creds.json 2>/dev/null || rm -f /tmp/creds.json

      - name: Leave no key behind
        if: ${{ always() }}
        run: rm -f /tmp/creds.json /tmp/probe.txt

      # PROOF 2 — Cloudflare lists the names back (values are never returned).
      - name: VERIFY — read the names back from Cloudflare
        run: |
          set -o pipefail
          npx --yes wrangler@3 pages secret list --project-name="$PROJECT" > /tmp/after.txt 2>&1
          MISSING=""
          for NAME in SUPABASE_URL SUPABASE_SERVICE_KEY SUPABASE_ANON_KEY VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY VAPID_SUBJECT; do
            grep -q "$NAME" /tmp/after.txt || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Cloudflare does not list:$MISSING. The sender is half-configured — re-run this workflow."
            exit 1
          fi
          echo "all six sender names present on $PROJECT"

      # Pages binds environment at DEPLOY time. Dispatch the deploy (the same
      # token-dispatch the lane uses for every merge) and wait for it, so the
      # witness below measures the Function that actually holds the values.
      - name: Dispatch the deploy and wait for it
        if: ${{ github.event.inputs.redeploy != 'no' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(gh run list --workflow deploy-cloudflare-pages.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run deploy-cloudflare-pages.yml --ref main
          echo "deploy dispatched; waiting for a run newer than $BEFORE"
          RUN=0
          for i in $(seq 1 30); do
            sleep 10
            RUN=$(gh run list --workflow deploy-cloudflare-pages.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            [ "$RUN" != "$BEFORE" ] && [ "$RUN" != "0" ] && break
          done
          if [ "$RUN" = "$BEFORE" ] || [ "$RUN" = "0" ]; then
            echo "::error::No new deploy run appeared within 5 minutes — dispatch Deploy (Cloudflare Pages) by hand and re-run this job with redeploy=no to witness."
            exit 1
          fi
          echo "watching deploy run $RUN"
          gh run watch "$RUN" --exit-status
          echo "deploy $RUN completed green"

      # PROOF 3 — the LIVE sender. An empty body is refused for its CONTENT
      # (400 bad-json / bad-request) only once the environment check passed;
      # 503 means it still sees no database. Either answer is JSON from the
      # Function; anything else means the route fell through to the SPA.
      - name: WITNESS — the live /api/push-send no longer answers not-configured
        run: |
          CODE=$(curl -sS --max-time 30 -o /tmp/live.txt -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{}' https://poetech.us/api/push-send || echo 000)
          BODY=$(head -c 400 /tmp/live.txt)
          echo "POST /api/push-send {} -> HTTP $CODE :: $BODY"
          {
            echo "### The live sender, measured just now"
            echo ""
            echo "\`POST https://poetech.us/api/push-send {}\` -> **HTTP $CODE** \`$BODY\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          case "$CODE:$BODY" in
            400:*bad-json*|400:*bad-request*)
              echo "**CONFIGURED.** The Function sees its database and VAPID keys and refused the empty body for its content — a real send from the app now reaches the phones it names." >> "$GITHUB_STEP_SUMMARY" ;;
            503:*)
              echo "**STILL NOT CONFIGURED** — the Function's environment is missing: $BODY. If the deploy ran after the install, the names above are on the project but not bound; dispatch Deploy (Cloudflare Pages) once more." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::live /api/push-send still answers 503: $BODY"; exit 1 ;;
            *)
              echo "**NOT ROUTED — a fault, not a wait.** The path did not answer the Function's JSON." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::unexpected answer from the live sender (HTTP $CODE): $BODY"; exit 1 ;;
          esac
