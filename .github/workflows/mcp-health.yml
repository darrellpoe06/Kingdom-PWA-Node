# mcp-health -- the sovereign MCP server's own witness (DR-0244; brought up to
# THE-WAY-A-SERVICE-COMES-HOME on 2026-10-20, the audit).
#
# Two eyes. First, the outside-in probe this workflow was born with: an
# unauthenticated discover through the Funnel, where 401/403 is the healthy
# posture (up and refusing), 200 is a misconfig, anything else is not serving.
# Then the Way, step 6: over the tailnet, the open /health on loopback (503
# with the reason when the token is unset or the briefing dir does not
# resolve), then ONE real question with the token read on the NAS -- a
# server/discover round-trip -- passing only when the server names itself.
# Read-only; the token never leaves the box; the output is the judged fields
# only. A failing pass opens (or comments on) ONE rolling issue labelled
# `incident` + `mcp-incident`; the next passing run closes it. On a failure,
# where the install stands is printed first.
#
# Brakes: one discover per run, a 12-minute job ceiling, one run at a time,
# a daily schedule.
name: mcp-health

on:
  schedule:
    - cron: '57 13 * * *'
  workflow_dispatch:
    inputs:
      ask:
        description: 'Ask one discover through the door with the token (off: /health only)'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-health
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe /mcp via the Funnel (unauthenticated discover; the outside-in eye, DR-0244)
        run: |
          set -u
          URL="https://poetech.tail5a2f35.ts.net/mcp"
          CODE=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 \
            -X POST "$URL" \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover"}' 2>&1) || CODE=000
          echo "HTTP $CODE from $URL"
          head -c 400 /tmp/body || true; echo ""
          case "$CODE" in
            401|403) echo "outside-in: LIVE -- up and refusing unauthenticated calls (correct posture)" ;;
            200)     echo "outside-in: UP BUT UNAUTHENTICATED 200 -- auth appears unset; the inside eye below says why" ;;
            *)       echo "outside-in: NOT SERVING (HTTP $CODE) -- the inside eye below says where the install stands" ;;
          esac
          echo "$CODE" > /tmp/outside_code

      - name: Check secrets (no-op with instructions when absent)
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Ask the NAS (read-only, judged fields only)
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          ASK_IN: ${{ inputs.ask }}
        run: |
          umask 077
          ASK="${ASK_IN:-true}"
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH "ASK='$ASK' sh -s" <<'EOS' > /tmp/witness.json || echo '{"reachable": false}' > /tmp/witness.json
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          TOK="$(cat /volume1/PoeTech/secrets/mcp-token.txt 2>/dev/null || sudo -n cat /volume1/PoeTech/secrets/mcp-token.txt 2>/dev/null)"
          export TOK ASK
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          out = {"reachable": True, "at": int(time.time()), "asked": os.environ.get("ASK") == "true",
                 "health_code": None, "health": None, "ask_code": None, "server": None, "error": None}
          def call(method, path, auth=False, timeout=10, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("http://127.0.0.1:8795" + path, data=data, method=method)
              if auth:
                  req.add_header("Authorization", "Bearer " + os.environ.get("TOK", ""))
                  req.add_header("MCP-Protocol-Version", "2026-07-28")
                  req.add_header("Mcp-Method", "server/discover")
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode() or "{}")
                  except Exception: return e.code, {}
              except Exception as e:
                  return None, {"error": str(e)[:200]}
          code, h = call("GET", "/health")
          out["health_code"] = code
          out["health"] = {k: h.get(k) for k in ("ok", "tools", "code", "briefingDirResolves", "cageStateDirResolves", "reason")} if isinstance(h, dict) else {"reason": str(h)[:200]}
          if out["asked"] and code == 200:
              code, d = call("POST", "/mcp", auth=True, timeout=30, body={"jsonrpc": "2.0", "id": 1, "method": "server/discover"})
              out["ask_code"] = code
              info = ((d.get("result") or {}).get("serverInfo") or {}) if isinstance(d, dict) else {}
              out["server"] = info.get("name")
              out["error"] = ((d.get("error") or {}).get("message") or d.get("error")) if isinstance(d, dict) else None
          print(json.dumps(out))
          PY
          EOS
          cat /tmp/witness.json

      - name: Judge and report
        if: steps.gate.outputs.go == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          w = json.load(open("/tmp/witness.json"))
          problems = []
          if not w.get("reachable"):
              problems.append("the NAS did not answer over SSH")
          elif w.get("health_code") != 200:
              problems.append(f"/health answered {w.get('health_code')}: {(w.get('health') or {}).get('reason')}")
          elif w.get("asked"):
              if w.get("ask_code") != 200:
                  problems.append(f"the door answered {w.get('ask_code')} to a discover with the token: {w.get('error')}")
              elif w.get("server") != "poetech-nas-mcp":
                  problems.append(f"the door answered but the server did not name itself (got {w.get('server')!r})")
          verdict = "PASS" if not problems else "FAIL"
          lines = [f"## mcp road: {verdict}", "", "```json", json.dumps(w, indent=2), "```"]
          if problems: lines += ["", "**Why:**"] + [f"- {p}" for p in problems]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh: fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          json.dump({"pass": not problems, "problems": problems, "witness": w}, open("/tmp/verdict.json", "w"))
          PY

      # When the road is dark, say WHERE THE INSTALL STANDS first (the Way,
      # step 6), then what each piece says for itself. Runs only on a failed
      # verdict; read-only; anything key-shaped scrubbed.
      - name: "Diagnose a dark road: where the install stands"
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/verdict.json'))['pass'] else 1)"; then
            echo "verdict passed -- nothing to diagnose"; exit 0
          fi
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH 'sh -s' <<'EOS' | sed -E 's/(Bearer|token|secret|key|password)([^ ,"]*)["=: ]+[^ ,"]+/\1\2=<scrubbed>/Ig' || true
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          REPO=/volume1/PoeTech/repos/Kingdom-PWA-Node
          rd() { cat "$1" 2>/dev/null || sudo -n cat "$1" 2>/dev/null; }
          echo "---- where the install stands ----"
          echo "repo checkout: $(git -C "$REPO" rev-parse --short HEAD 2>/dev/null || sudo -n git -C "$REPO" rev-parse --short HEAD 2>/dev/null || echo unknown)"
          echo "server running code: $(rd /volume1/PoeTech/secrets/.mcp-server-code.sha || echo none) / repo code: $(sha256sum "$REPO/infra/nas-mcp/mcp_server.py" 2>/dev/null | cut -c1-16)"
          echo "unit: $(systemctl is-active poetech-mcp 2>/dev/null || echo unknown)"
          if [ -x /volume1/PoeTech/venvs/mcp/bin/uvicorn ]; then echo "venv: uvicorn present"; else echo "venv: uvicorn ABSENT -- the installer's venv step did not finish"; fi
          if [ -s /volume1/PoeTech/secrets/mcp-token.txt ] || sudo -n test -s /volume1/PoeTech/secrets/mcp-token.txt 2>/dev/null; then echo "token: present on the box"; else echo "token: ABSENT -- the installer generates it"; fi
          if [ -d /volume1/PoeTech/poetech-briefing ]; then echo "briefing dir: present"; else echo "briefing dir: ABSENT -- the reel and the dispatch state cannot be read"; fi
          echo "health (loopback): $(curl -sS -m 8 http://127.0.0.1:8795/health 2>&1 | head -c 300)"
          TSB=/var/packages/Tailscale/target/bin/tailscale
          echo "funnel /mcp: $(sudo -n $TSB funnel status 2>/dev/null | grep -c '/mcp' || echo 0) mount line(s)"
          echo "---- last lines of the service ----"
          (journalctl -u poetech-mcp -n 25 --no-pager 2>/dev/null || sudo -n journalctl -u poetech-mcp -n 25 --no-pager 2>/dev/null || echo "(no journal this user can read)") | cut -c1-300
          EOS
      - name: "Ledger: a dark road is an incident; the next pass closes it"
        if: steps.gate.outputs.go == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('/tmp/verdict.json', 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'mcp-incident';
            for (const name of ['incident', label]) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color: 'D93F0B', description: name === label ? 'The MCP road witness ledger (DR-0244)' : 'The downtime ledger' }); }
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 5 });
            const issue = open.data.find((i) => i.title.startsWith('MCP road'));
            const now = new Date().toISOString();
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const foot = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const why = v.problems.map((p) => `- ${p}`).join('\n');
            if (!v.pass) {
              const body = `mcp road failed its witness at ${now} ([run](${run})):\n${why}\n\n\`\`\`json\n${JSON.stringify(v.witness)}\n\`\`\``;
              if (!issue) await github.rest.issues.create({ owner, repo, title: 'MCP road is dark', body: body + foot, labels: ['incident', label] });
              else await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: body + foot });
              core.setFailed('mcp-health: ' + v.problems.join('; '));
            } else if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `mcp road answered again at ${now} ([run](${run})): the server named itself through the door.${foot}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
