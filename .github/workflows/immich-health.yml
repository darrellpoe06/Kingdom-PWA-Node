# immich-health -- the photo-backup road's own witness (DR-1120).
#
# THE-WAY-A-SERVICE-COMES-HOME, step 6: a witness asks the service one real
# question on a schedule and on dispatch, and when the answer is wrong it says
# WHERE THE INSTALL STANDS before anything else. This one joins the tailnet,
# asks the forwarder on the NAS for /health, then asks ONE question through
# the door with the family key -- GET /api/server/version, the same door and
# the same header the phones use -- and passes only when Immich's own version
# comes back through it. Read-only on the box; the key is read on the NAS and
# never leaves it; the output is the judged fields only.
# A failing pass opens (or comments on) ONE rolling issue labelled
# `incident` + `photo-backup-incident`, the downtime ledger the OpsBoard reads;
# the next passing run closes it with the time it came back.
#
# Brakes: one question per run, a 12-minute job ceiling, one run at a time,
# and a daily schedule; a question costs Immich nothing but a version lookup.
name: immich-health

on:
  schedule:
    - cron: '53 13 * * *'
  workflow_dispatch:
    inputs:
      ask:
        description: 'Ask one question through the door with the family key (off: /health only)'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: immich-health
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check secrets (no-op with instructions when absent)
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Ask the NAS (read-only, judged fields only)
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          ASK_IN: ${{ inputs.ask }}
        run: |
          umask 077
          ASK="${ASK_IN:-true}"
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH "ASK='$ASK' sh -s" <<'EOS' > /tmp/witness.json || echo '{"reachable": false}' > /tmp/witness.json
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          TOK="$(cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null || sudo -n cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null)"
          export TOK ASK
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          out = {"reachable": True, "at": int(time.time()), "asked": os.environ.get("ASK") == "true",
                 "health_code": None, "health": None, "ask_code": None, "version": None, "error": None}
          def call(method, path, auth=False, timeout=10):
              req = urllib.request.Request("http://127.0.0.1:8801" + path, method=method)
              if auth: req.add_header("X-Family-Key", os.environ.get("TOK", ""))
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode() or "{}")
                  except Exception: return e.code, {}
              except Exception as e:
                  return None, {"error": str(e)[:200]}
          code, h = call("GET", "/health")
          out["health_code"] = code
          out["health"] = {k: h.get(k) for k in ("ok", "version", "free_gb", "library", "code", "reason")}
          if out["asked"] and code == 200:
              code, v = call("GET", "/api/server/version", auth=True, timeout=30)
              out["ask_code"] = code
              if isinstance(v, dict) and "major" in v:
                  out["version"] = ".".join(str(v.get(k, "?")) for k in ("major", "minor", "patch"))
              out["error"] = v.get("error") if isinstance(v, dict) else None
          print(json.dumps(out))
          PY
          EOS
          cat /tmp/witness.json

      - name: Judge and report
        if: steps.gate.outputs.go == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          w = json.load(open("/tmp/witness.json"))
          problems = []
          if not w.get("reachable"):
              problems.append("the NAS did not answer over SSH")
          elif w.get("health_code") != 200:
              problems.append(f"/health answered {w.get('health_code')}: {(w.get('health') or {}).get('reason')}")
          elif w.get("asked"):
              if w.get("ask_code") != 200:
                  problems.append(f"the door answered {w.get('ask_code')} to a version lookup with the family key: {w.get('error')}")
              elif not w.get("version"):
                  problems.append("the door passed the request but Immich's version did not come back through it")
              elif w.get("version") != (w.get("health") or {}).get("version"):
                  problems.append(f"the version through the door ({w.get('version')}) is not the one /health saw ({(w.get('health') or {}).get('version')})")
          verdict = "PASS" if not problems else "FAIL"
          lines = [f"## photo-backup road: {verdict}", "", "```json", json.dumps(w, indent=2), "```"]
          if problems: lines += ["", "**Why:**"] + [f"- {p}" for p in problems]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh: fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          json.dump({"pass": not problems, "problems": problems, "witness": w}, open("/tmp/verdict.json", "w"))
          PY

      # When the road is dark, say WHERE THE INSTALL STANDS first (the Way,
      # step 6), then what each piece says for itself. Runs only on a failed
      # verdict; read-only; anything key-shaped scrubbed.
      - name: "Diagnose a dark road: where the install stands"
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/verdict.json'))['pass'] else 1)"; then
            echo "verdict passed -- nothing to diagnose"; exit 0
          fi
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH 'sh -s' <<'EOS' | sed -E 's/(Bearer|token|secret|key|password)([^ ,"]*)["=: ]+[^ ,"]+/\1\2=<scrubbed>/Ig' || true
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          DATA=/volume1/docker/immich
          LIB=/volume1/PoeTech/immich
          REPO=/volume1/PoeTech/repos/Kingdom-PWA-Node
          rd() { cat "$1" 2>/dev/null || sudo -n cat "$1" 2>/dev/null; }
          echo "---- where the install stands ----"
          echo "repo checkout: $(git -C "$REPO" rev-parse --short HEAD 2>/dev/null || sudo -n git -C "$REPO" rev-parse --short HEAD 2>/dev/null || echo unknown)"
          echo "forwarder running code: $(rd "$DATA/.forwarder.code.sha" || echo none) / repo code: $(sha256sum < "$REPO/infra/nas-immich/immich_forwarder.py" 2>/dev/null | cut -c1-16)"
          if [ -d "$LIB" ]; then echo "library: $LIB present, $(ls "$LIB" 2>/dev/null | wc -l) entries at the top"; else echo "library: $LIB ABSENT -- the installer has not run, or the pool is not mounted"; fi
          echo "pool: $(df -Pk "$LIB" 2>/dev/null | awk 'NR==2 {printf "%d GB free of %d GB", $4/1024/1024, $2/1024/1024}')"
          if [ -e "$DATA/immich.env" ]; then echo "config: immich.env present"; else echo "config: immich.env ABSENT -- never seeded"; fi
          echo "unit: $(systemctl is-active poetech-photo-backup 2>/dev/null || echo unknown)"
          echo "immich ping (loopback): $(curl -sS -m 6 http://127.0.0.1:2283/api/server/ping 2>&1 | head -c 80)"
          D=""
          for CAND in docker /usr/local/bin/docker /var/packages/ContainerManager/target/usr/bin/docker; do
            command -v "$CAND" >/dev/null 2>&1 || continue
            if "$CAND" ps >/dev/null 2>&1; then D="$CAND"; break; fi
            if sudo -n "$CAND" ps >/dev/null 2>&1; then D="sudo -n $CAND"; break; fi
          done
          [ -n "$D" ] && $D ps --filter name=poetech-immich --format '{{.Names}} {{.Status}}' || echo "(no docker this user can run)"
          for C in poetech-immich poetech-immich-postgres poetech-immich-ml; do
            echo "---- last lines of $C ----"
            [ -n "$D" ] && $D logs --tail 25 "$C" 2>&1 | cut -c1-300 || echo "(no docker this user can run)"
          done
          EOS
      - name: "Ledger: a dark road is an incident; the next pass closes it"
        if: steps.gate.outputs.go == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('/tmp/verdict.json', 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'photo-backup-incident';
            for (const name of ['incident', label]) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color: 'D93F0B', description: name === label ? 'The photo-backup road witness ledger (DR-1120)' : 'The downtime ledger' }); }
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 5 });
            const issue = open.data.find((i) => i.title.startsWith('Photo-backup road'));
            const now = new Date().toISOString();
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const foot = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const why = v.problems.map((p) => `- ${p}`).join('\n');
            if (!v.pass) {
              const body = `The photo-backup road (DR-1120) failed its witness at ${now} ([run](${run})):\n${why}\n\n\`\`\`json\n${JSON.stringify(v.witness)}\n\`\`\``;
              if (!issue) await github.rest.issues.create({ owner, repo, title: 'Photo-backup road is dark (DR-1120)', body: body + foot, labels: ['incident', label] });
              else await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: body + foot });
              core.setFailed('photo-backup road: ' + v.problems.join('; '));
            } else if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `The photo-backup road answered again at ${now} ([run](${run})): Immich's version came back through the door.${foot}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
