# The NAS reports its own Funnel state (DR-1619). funnel_watchdog.py on the box
# sends this dispatch when the public road is dark (at most every 30 min) and
# when it heals, so its state is readable without the tailnet. It puts the
# box's words on the funnel-incident ledger. Never runs the payload.
name: nas-funnel-report
on:
  repository_dispatch:
    types: [nas-funnel-report]
permissions:
  issues: write
concurrency:
  group: nas-funnel-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Put what the NAS says on the funnel-incident ledger
        uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload || {};
            const { owner, repo } = context.repo;
            const label = 'funnel-incident';
            const text = '```\n' + JSON.stringify(p, null, 2).slice(0, 6000) + '\n```';
            const head = `The NAS reports its public road **${String(p.result)}** (Tailscale ${String(p.backend_state)}) at ${new Date().toISOString()}:`;
            core.summary.addRaw(head + '\n\n' + text).write();
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 5 });
            const issue = open.data.find((i) => i.title.startsWith('The public Funnel'));
            const body = head + '\n\n' + text + '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            if (issue) await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            else if (p.result === 'dark') await github.rest.issues.create({ owner, repo, title: 'The public Funnel is dark or short a mount', body, labels: ['incident', label] });
