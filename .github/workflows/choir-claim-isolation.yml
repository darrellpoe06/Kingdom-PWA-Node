# choir-claim-isolation — PROVE the 0110 choir roster self-claim RPCs enforce their
# guards, in CI, against the real database, using the SAME SUPABASE_DB_URL secret the
# db-migrate lane already uses. This is the enablement GATE for the choir account-linking
# feature (DR-0220 / DR-0187): no claim surface is trusted in the app until this is GREEN
# (DR-0076; the delegated-pm-isolation / tv-sharing-isolation precedent).
#
# What it does (self-contained + idempotent, safe against prod):
#   1. Applies infra/supabase/migrations-auto/0110-choir-member-self-claim.sql
#      (idempotent; db-migrate applies it on merge anyway — this removes ordering doubt).
#   2. Runs infra/supabase/tests/0110-choir-claim-smoke.sql, which sets up two church
#      instances + unclaimed roster rows IN A TRANSACTION and asserts: a non-owner/admin
#      cannot mint, a wrong code links nothing, a correct code links exactly the claimant
#      and is one-time, minting for an already-linked row is refused, one account links to
#      at most one roster row per instance, and my_choir_membership never leaks across the
#      instance boundary, then ROLLS BACK (leaves no data). A wrong grant RAISEs -> psql
#      exits non-zero -> RED. 'CHOIR CLAIM SMOKE: PASS' + exit 0 -> GREEN.
#
# Manual (workflow_dispatch) or automatically after db-migrate finishes on main.
# Deploy-path only; not self-arming (respects the Cage). The SUPABASE_DB_URL secret is
# whitespace-stripped exactly like scripts/db-migrate-apply.sh (a trailing newline in the
# secret otherwise folds into the dbname -> "database \"postgres\\n\" does not exist").
name: choir-claim-isolation

on:
  workflow_dispatch:
  workflow_run:
    workflows: [db-migrate]
    types: [completed]

concurrency:
  group: choir-claim-isolation
  cancel-in-progress: false

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Apply 0110 (idempotent) then run the choir-claim smoke test
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Sanitize the URL exactly like scripts/db-migrate-apply.sh (strip whitespace;
          # the secret carries a trailing newline that raw psql folds into the dbname).
          DBURL=$(printf '%s' "${SUPABASE_DB_URL:-}" | tr -d '[:space:]')
          if [ -z "$DBURL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set (same secret db-migrate uses)."
            exit 1
          fi
          echo "=== applying 0110-choir-member-self-claim.sql (idempotent) ==="
          psql "$DBURL" --single-transaction -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations-auto/0110-choir-member-self-claim.sql
          echo "=== running the choir-claim smoke test (rolls back) ==="
          # ON_ERROR_STOP so a RAISE from any assertion fails the job (red).
          psql "$DBURL" -v ON_ERROR_STOP=1 \
            -f infra/supabase/tests/0110-choir-claim-smoke.sql
          echo "choir-claim smoke test completed without a wrong grant (see 'CHOIR CLAIM SMOKE: PASS' above)"
