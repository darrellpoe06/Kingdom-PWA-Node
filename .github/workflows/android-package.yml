# Android package — build the sovereign PoeTech app package (DR-0152, door 1).
#
# WHY (Darrell, 2026-07-10): "We need a sustainable solution for chrome to let
# me download this app period." Chrome's install offer is discretionary — it
# withholds the one-tap on postures, heuristics, and installed-already guesses
# nobody controls. This workflow removes Chrome from the equation: it builds a
# REAL Android package (TWA via Bubblewrap) from the live manifest and attaches
# the .apk/.aab as a run artifact — downloaded and installed like any app.
#
# SIGNING (held constraint, DR-0152): this run generates a fresh TESTING key
# each time — right for family sideload testing, NOT the Play key. The Play
# keystore is generated once, offline, and custodied by Darrell like a title
# deed before the first Play upload; assetlinks.json ships live only with that
# real fingerprint.
#
# THE THREE BRAKES: dispatch-only (no schedule), one bounded job with a hard
# timeout, no repo writes, no compute spawned beyond the single Gradle build.
name: Android package (TWA, sideload-testing)

on:
  workflow_dispatch: {}

concurrency:
  group: android-package
  cancel-in-progress: false

permissions:
  contents: read

# FOUR BRANDS, FOUR REAL APPS (DR-0227, Darrell 2026-07-23: each app in the
# family on the phone, SEPARATED — "anyone anywhere... able to use them
# independently"). All four PWAs share one origin scope, so Android resumes
# the ONE installed window wherever it last sat — the "PoeTech turns into
# Love Corner" morph. A TWA per brand is the phone-side perpetual fix: four
# distinct Android packages, each with its own task, icon, and resume state.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: poetech
            package_id: us.poetech.app
            app_name: PoeTech Family OS
            launcher: PoeTech
            start_url: /poetech-app/
            web_manifest: https://poetech.us/manifest.webmanifest
            icon: https://poetech.us/icon-512.png
            maskable: https://poetech.us/icon-maskable-512.png
          - brand: lovecorner
            package_id: us.poetech.lovecorner
            app_name: The Love Corner
            launcher: Love Corner
            start_url: /poetech-app/?view=church
            web_manifest: https://poetech.us/manifest-lovecorner.webmanifest
            icon: https://poetech.us/lovecorner-icon-512.png
            maskable: https://poetech.us/lovecorner-icon-maskable-512.png
          - brand: tlc
            package_id: us.poetech.tlc
            app_name: TLC Therapy Solutions
            launcher: TLC Therapy
            start_url: /poetech-app/?tlc=1
            web_manifest: https://poetech.us/manifest-tlc.webmanifest
            icon: https://poetech.us/tlc-icon-512.png
            maskable: https://poetech.us/tlc-icon-512.png
          - brand: moore
            package_id: us.poetech.moore
            app_name: Moore Divahs
            launcher: Moore Divahs
            start_url: /poetech-app/?moore=1
            web_manifest: https://poetech.us/manifest-moore.webmanifest
            # HER OWN mark (DR-0227) — derived from the MOORE_BRAND record;
            # swaps in one file when supplied artwork lands.
            icon: https://poetech.us/moore-icon-512.png
            maskable: https://poetech.us/moore-icon-maskable-512.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the sideload-testing keystore (per-run; NOT the Play key)
        id: keys
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$PWD/android.keystore" -alias poetech \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=PoeTech Sideload Testing, O=PoeTech, C=US"
          echo "::add-mask::$PASS"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Assemble the TWA manifest from the repo template + the brand matrix
        run: |
          set -euo pipefail
          mkdir -p twa-build
          jq --arg ks "$PWD/android.keystore" \
             --arg pkg "${{ matrix.package_id }}" \
             --arg name "${{ matrix.app_name }}" \
             --arg launcher "${{ matrix.launcher }}" \
             --arg start "${{ matrix.start_url }}" \
             --arg wm "${{ matrix.web_manifest }}" \
             --arg icon "${{ matrix.icon }}" \
             --arg mask "${{ matrix.maskable }}" '
            del(._comment, ._signingNote)
            | .packageId = $pkg
            | .name = $name
            | .launcherName = $launcher
            | .startUrl = $start
            | .webManifestUrl = $wm
            | .iconUrl = $icon
            | .maskableIconUrl = $mask
            | .signingKey = { path: $ks, alias: "poetech" }
          ' store/twa-manifest.template.json > twa-build/twa-manifest.json
          cat twa-build/twa-manifest.json

      - name: Stage Bubblewrap's own Android cmdline-tools (measured requirement)
        # Bubblewrap's AndroidSdkTools.validatePath requires the given path to
        # contain `tools/` or `bin/` (the cmdline-tools layout) — the runner's
        # SDK ROOT has neither, which is exactly how run 1 died ("the provided
        # androidSdk isn't correct"; verified in @bubblewrap/core 1.24 source).
        # Bubblewrap then uses that same path as its own --sdk_root and installs
        # the build-tools it wants into it, so stage a private, writable copy
        # and pre-accept the licenses non-interactively.
        run: |
          set -euo pipefail
          curl -sSLo "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/bwsdk"
          SDK_DIR="$RUNNER_TEMP/bwsdk/cmdline-tools"
          yes | "$SDK_DIR/bin/sdkmanager" --licenses --sdk_root="$SDK_DIR" > /dev/null || true
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK_DIR" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Build the package (Bubblewrap -> Gradle -> signed .apk + .aab)
        working-directory: twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ steps.keys.outputs.pass }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ steps.keys.outputs.pass }}
          # AGP hard-fails when ANDROID_HOME and ANDROID_SDK_ROOT disagree — the
          # runner image exports ANDROID_SDK_ROOT=/usr/local/lib/android/sdk while
          # Bubblewrap uses the staged SDK (run 30025408093, all four brands, the
          # measured error). Pin BOTH to the staged path so there is one answer.
          ANDROID_HOME: ${{ runner.temp }}/bwsdk/cmdline-tools
          ANDROID_SDK_ROOT: ${{ runner.temp }}/bwsdk/cmdline-tools
        # `yes |` answers Bubblewrap's interactive prompts (run 2 died on
        # "have you run bubblewrap update? (Y/n)" — CI has no stdin; Y is
        # correct: generate the Android project from the manifest).
        run: yes | npx --yes @bubblewrap/cli@1 build --skipPwaValidation

      - name: Name what was built
        run: |
          set -euo pipefail
          ls -la twa-build/*.apk twa-build/*.aab 2>/dev/null || { echo "::error::no package produced"; exit 1; }
          {
            echo "## Android package built (sideload-testing) — ${{ matrix.app_name }}"
            echo "- Package: \`${{ matrix.package_id }}\` · opens ${{ matrix.start_url }} — its OWN app, its own task, its own resume state."
            echo "- Download the .apk from this run's Artifacts, open it on the phone, allow the install prompt."
            echo "- Signed with a PER-RUN testing key: updating requires uninstall/reinstall. The Play keystore is a Governor step (DR-0152)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the package as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand }}-android-sideload-testing
          path: |
            twa-build/*.apk
            twa-build/*.aab
          retention-days: 30
          if-no-files-found: error
