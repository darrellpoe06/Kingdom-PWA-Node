# rls-isolation — ONE matrix workflow proves every feature's RLS isolation
# against the real database, replacing six near-identical copies
# (choir-claim / delegated-pm / role-control / support-door / tv-sharing /
# viewer-readonly), 362 lines -> this file (2026-07-30 comprehensive review).
#
# WHY ONE FILE (gate-the-class, DR-0239): the 2026-07-29 never-firing
# workflow_run fix was applied to viewer-readonly only; the other five stayed
# silently inert — five shipped features' DR-0076 enablement gates producing
# no observations while green history said otherwise. A single workflow can't
# drift feature-by-feature: db-migrate dispatches THIS file once and every
# proof runs.
#
# WHY max-parallel: 1 — the smokes run against the REAL production database
# (same SUPABASE_DB_URL secret db-migrate uses), and migration 0075 runs
# ALTER PUBLICATION supabase_realtime, the statement class that deadlocked two
# concurrent runs on 2026-07-01 (db-migrate.yml's own lock exists for this).
# Serial keeps the proofs deadlock-free; fail-fast: false keeps each feature's
# red/green independent, visible per matrix leg.
#
# Each leg is self-contained + idempotent, safe against prod:
#   1. Applies the feature's migrations (idempotent; db-migrate applies them on
#      merge anyway — this just removes ordering doubt).
#   2. Runs the feature's isolation smoke(s): each sets up its actors IN A
#      TRANSACTION, asserts the isolation contract, then ROLLS BACK (leaves no
#      data). A leak RAISEs -> psql exits non-zero -> RED.
#
# Fired by db-migrate's explicit workflow_dispatch call after every migration
# apply (workflow_run from token-driven runs is suppressed — the DR-0107
# class), or by hand. Deploy-path only; not self-arming (respects the Cage).
name: rls-isolation

on:
  workflow_dispatch:

concurrency:
  group: rls-isolation
  cancel-in-progress: false

jobs:
  isolate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - feature: tv-sharing
            migrations: "0074-tv-circle-sharing.sql 0141-account-unification-person-links.sql"
            smokes: "0074-isolation-smoke.sql"
          - feature: delegated-pm
            migrations: "0075-delegated-property-management.sql 0150-poe-properties-app-invite-claim-and-household.sql 0151-invite-by-phone-and-linked-identity.sql"
            smokes: "0075-isolation-smoke.sql"
          # The Poe Properties App's own gate (DR-0313): the invite->claim seam,
          # the tenant's family arms, the field-worker ceiling, and the books-side
          # posting guard. 0075 applies first — 0150 extends its policies.
          - feature: poe-properties
            migrations: "0075-delegated-property-management.sql 0150-poe-properties-app-invite-claim-and-household.sql 0151-invite-by-phone-and-linked-identity.sql 0152-vacancies-and-no-account-applications.sql 0153-property-timeline-photos.sql 0154-photo-captions-editable-and-archivable.sql 0155-what-a-door-is-offered-as.sql 0156-our-own-home-is-not-a-rental-door.sql 0157-the-landlord-orders-his-own-shelf.sql 0158-the-address-is-shown-when-he-says-so.sql 0159-nothing-a-landlord-types-lives-only-on-his-phone.sql 0160-a-door-says-what-it-is-unit-room-or-bed.sql 0161-the-landlord-orders-a-doors-pictures.sql"
            smokes: "0150-poe-properties-isolation-smoke.sql 0152-public-vacancy-smoke.sql"
          - feature: choir-claim
            migrations: "0110-choir-member-self-claim.sql 0131-stale-role-constraint-and-nullsafe-guards.sql 0144-standings-at-will-and-the-sons-wall.sql"
            smokes: "0110-choir-claim-smoke.sql"
          # 2026-08-24: 0143/0144 legitimately RE-CREATED list_instance_members
          # with new columns (classification, relationship), and CREATE OR
          # REPLACE cannot change a return type — 0111 alone now fails with
          # "cannot change return type of existing function" (runs 30/31).
          # Same dependency-order principle as books-role-wall below: drop the
          # function first (pre), then apply the FULL chain so the live DB only
          # ever reaches the final combined state. The smoke counts rows, so it
          # holds across the shape change.
          - feature: role-control
            pre: "DROP FUNCTION IF EXISTS public.list_instance_members(uuid);"
            migrations: "0111-set-member-role.sql 0112-list-my-admin-instances.sql 0130-assistant-provisioning-and-office-workspace.sql 0131-stale-role-constraint-and-nullsafe-guards.sql 0143-member-worker-classification.sql 0144-standings-at-will-and-the-sons-wall.sql"
            smokes: "0111-role-control-smoke.sql"
          - feature: support-door
            migrations: "0114-governed-support-door.sql 0115-support-user-initiated-self-grant.sql 0131-stale-role-constraint-and-nullsafe-guards.sql 0144-standings-at-will-and-the-sons-wall.sql"
            smokes: "0114-support-door-smoke.sql 0115-support-self-grant-smoke.sql"
          - feature: viewer-readonly
            migrations: "0125-viewer-true-readonly-and-invite-target.sql 0126-member-capability-checklist.sql"
            smokes: "0125-viewer-readonly-smoke.sql 0126-capability-checklist-smoke.sql"
          # Folded in 2026-07-30 (access evaluation): 0127 briefly lived in its
          # own sovereign-noise-thought-isolation.yml — the exact per-feature
          # drift class this matrix was created to end, reintroduced the same
          # day the matrix landed. One matrix, every proof, no siblings.
          - feature: sovereign-noise-thought
            migrations: "0127-sovereign-noise-and-thought.sql"
            smokes: "0127-sovereign-noise-thought-smoke.sql"
          # Added 2026-07-30 (REV-0216 access-evaluation carried item): the
          # core-books ROLE wall. 0082 (child walled / successor read-only) and
          # 0100 (assistant walled) both shipped their DB gate but had NO live
          # proof here — their own headers name an "adversarial LIVE RLS test"
          # as the DR-0111 re-review item, and until now nothing ran it. ONE
          # leg, BOTH migrations in dependency order (0100 re-gates the same
          # five tables 0082 does — applying 0082 alone would DROP the assistant
          # exclusion and REGRESS the wall on prod), so the live DB only ever
          # reaches the final combined state. Two smokes assert the full
          # contract against that state: child+successor (0082) and assistant +
          # a no-regression guard (0100). Proven-to-catch: a books read/write
          # policy that stops excluding child/assistant, or narrows successor
          # read / member write, RAISEs -> the leg goes RED.
          - feature: books-role-wall
            migrations: "0082-successor-role-and-books-rls.sql 0100-assistant-role-and-books-rls.sql 0131-stale-role-constraint-and-nullsafe-guards.sql 0144-standings-at-will-and-the-sons-wall.sql"
            smokes: "0082-successor-books-smoke.sql 0100-assistant-books-smoke.sql"
          # Added 2026-08-04 (DR-0271, Christina's assistant-rights request):
          # the ASSISTANT becomes grantable (invite/role/remove RPCs) and is
          # scoped by a RESTRICTIVE deny-overlay to the shared office_records
          # workspace + the six participation tables — "everything in the
          # Assistant tab", nothing on the other tabs. The smoke proves both
          # directions live: the assistant works the workspace, a member sees
          # the assistant's rows, and the books + membership-gated family data
          # (inquiries) read as ZERO rows for the assistant. Static shape proof
          # runs every merge in scripts/assistant-scope-guard.mjs.
          - feature: assistant-scope
            migrations: "0130-assistant-provisioning-and-office-workspace.sql 0131-stale-role-constraint-and-nullsafe-guards.sql 0144-standings-at-will-and-the-sons-wall.sql"
            smokes: "0130-assistant-scope-smoke.sql"
    name: isolate — ${{ matrix.feature }}
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Apply ${{ matrix.feature }} migrations (idempotent) then run the isolation smoke(s)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Sanitize the URL EXACTLY like scripts/db-migrate-apply.sh does — the
          # SUPABASE_DB_URL secret carries a trailing newline, and raw
          # `psql "$SUPABASE_DB_URL"` reads it into the dbname (FATAL: database
          # "postgres\n" does not exist). Match its proven handling.
          DBURL=$(printf '%s' "${SUPABASE_DB_URL:-}" | tr -d '[:space:]')
          if [ -z "$DBURL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set (same secret db-migrate uses)."
            exit 1
          fi
          # A leg's optional pre-step SQL (matrix.pre) runs BEFORE its chain —
          # e.g. role-control drops list_instance_members so 0111 can recreate
          # it and 0143/0144 can rebuild it to the current shape (run 33 proved
          # the key alone does nothing without this executor).
          PRE=${{ toJSON(matrix.pre || '') }}
          if [ -n "$PRE" ]; then
            echo "=== running pre-step SQL ==="
            psql "$DBURL" -v ON_ERROR_STOP=1 -c "$PRE"
          fi
          for mig in ${{ matrix.migrations }}; do
            echo "=== applying ${mig} (idempotent) ==="
            psql "$DBURL" --single-transaction -v ON_ERROR_STOP=1 \
              -f "infra/supabase/migrations-auto/${mig}"
          done
          for smoke in ${{ matrix.smokes }}; do
            echo "=== running ${smoke} (rolls back) ==="
            psql "$DBURL" -v ON_ERROR_STOP=1 \
              -f "infra/supabase/tests/${smoke}"
          done
          echo "isolation smoke(s) completed without a leak for ${{ matrix.feature }}"
