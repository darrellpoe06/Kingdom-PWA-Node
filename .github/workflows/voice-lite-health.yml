# voice-lite-health -- the NAS reading voice's own witness (DR-0627; the audit
# of the services born before THE-WAY-A-SERVICE-COMES-HOME, 2026-10-20).
#
# The Way, step 6: a witness asks the service one real question on a schedule
# and on dispatch, and when the answer is wrong it says WHERE THE INSTALL
# STANDS before anything else. This one joins the tailnet, asks the server on
# the NAS for /health (200 only when piper and a voice are on the box; 503
# with the reason otherwise), then asks ONE question with the family key --
# POST /speak with one short sentence, the same door and bearer the reader
# uses -- and passes only when real audio comes back. Read-only on the box;
# the key is read on the NAS and never leaves it; the clip is measured, never
# kept. A failing pass opens (or comments on) ONE rolling issue labelled
# `incident` + `voice-lite-incident`; the next passing run closes it.
#
# Brakes: one sentence per run (seconds of NAS CPU), a 12-minute job ceiling,
# one run at a time, a daily schedule.
name: voice-lite-health

on:
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:
    inputs:
      ask:
        description: 'Ask one sentence through the door with the family key (off: /health only)'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: voice-lite-health
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check secrets (no-op with instructions when absent)
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Ask the NAS (read-only, judged fields only)
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          ASK_IN: ${{ inputs.ask }}
        run: |
          umask 077
          ASK="${ASK_IN:-true}"
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH "ASK='$ASK' sh -s" <<'EOS' > /tmp/witness.json || echo '{"reachable": false}' > /tmp/witness.json
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          TOK="$(cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null || sudo -n cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null)"
          export TOK ASK
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          out = {"reachable": True, "at": int(time.time()), "asked": os.environ.get("ASK") == "true",
                 "health_code": None, "health": None, "ask_code": None, "audio_type": None, "audio_bytes": 0, "ask_ms": None, "error": None}
          def call(method, path, body=None, auth=False, timeout=10):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("http://127.0.0.1:8772" + path, data=data, method=method)
              if data is not None: req.add_header("Content-Type", "application/json")
              if auth: req.add_header("Authorization", "Bearer " + os.environ.get("TOK", ""))
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read()
                      return r.status, r.headers.get("Content-Type", ""), raw
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("Content-Type", ""), e.read()
              except Exception as e:
                  return None, "", str(e)[:200].encode()
          code, _, raw = call("GET", "/health")
          out["health_code"] = code
          try: h = json.loads(raw.decode() or "{}")
          except Exception: h = {"reason": raw.decode(errors="replace")[:200]}
          out["health"] = {k: h.get(k) for k in ("ok", "voices", "formats", "code", "error", "reason")}
          if out["asked"] and code == 200:
              t0 = time.time()
              code, ctype, raw = call("POST", "/speak", {"text": "The reading voice on the house is answering.", "voice": "male"}, auth=True, timeout=90)
              out["ask_ms"] = int((time.time() - t0) * 1000)
              out["ask_code"] = code
              out["audio_type"] = ctype
              out["audio_bytes"] = len(raw) if isinstance(raw, bytes) else 0
              if code != 200:
                  try: out["error"] = json.loads(raw.decode() or "{}").get("reason") or raw.decode(errors="replace")[:200]
                  except Exception: out["error"] = raw.decode(errors="replace")[:200] if isinstance(raw, bytes) else str(raw)
          print(json.dumps(out))
          PY
          EOS
          cat /tmp/witness.json

      - name: Judge and report
        if: steps.gate.outputs.go == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          w = json.load(open("/tmp/witness.json"))
          problems = []
          if not w.get("reachable"):
              problems.append("the NAS did not answer over SSH")
          elif w.get("health_code") != 200:
              problems.append(f"/health answered {w.get('health_code')}: {(w.get('health') or {}).get('reason')}")
          elif w.get("asked"):
              if w.get("ask_code") != 200:
                  problems.append(f"the door answered {w.get('ask_code')} to one sentence with the family key: {w.get('error')}")
              elif not str(w.get("audio_type") or "").startswith("audio/") or (w.get("audio_bytes") or 0) < 1000:
                  problems.append(f"the door passed the request but no real clip came back ({w.get('audio_type')}, {w.get('audio_bytes')} bytes)")
          verdict = "PASS" if not problems else "FAIL"
          lines = [f"## voice-lite road: {verdict}", "", "```json", json.dumps(w, indent=2), "```"]
          if problems: lines += ["", "**Why:**"] + [f"- {p}" for p in problems]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh: fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          json.dump({"pass": not problems, "problems": problems, "witness": w}, open("/tmp/verdict.json", "w"))
          PY

      # When the road is dark, say WHERE THE INSTALL STANDS first (the Way,
      # step 6), then what each piece says for itself. Runs only on a failed
      # verdict; read-only; anything key-shaped scrubbed.
      - name: "Diagnose a dark road: where the install stands"
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/verdict.json'))['pass'] else 1)"; then
            echo "verdict passed -- nothing to diagnose"; exit 0
          fi
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH 'sh -s' <<'EOS' | sed -E 's/(Bearer|token|secret|key|password)([^ ,"]*)["=: ]+[^ ,"]+/\1\2=<scrubbed>/Ig' || true
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          REPO=/volume1/PoeTech/repos/Kingdom-PWA-Node
          rd() { cat "$1" 2>/dev/null || sudo -n cat "$1" 2>/dev/null; }
          echo "---- where the install stands ----"
          echo "repo checkout: $(git -C "$REPO" rev-parse --short HEAD 2>/dev/null || sudo -n git -C "$REPO" rev-parse --short HEAD 2>/dev/null || echo unknown)"
          HOME=/volume1/PoeTech/voice-lite
          echo "server running code: $(rd "$HOME/.code.sha" || echo none) / repo code: $(sha256sum < "$REPO/infra/nas-voice-lite/voice_lite_server.py" 2>/dev/null | cut -c1-16)"
          echo "unit: $(systemctl is-active poetech-voice-lite 2>/dev/null || echo unknown)"
          if [ -x "$HOME/piper/piper" ]; then echo "piper: present"; else echo "piper: ABSENT at $HOME/piper/piper -- the installer downloads it one file per cycle"; fi
          echo "voices on disk: $(ls "$HOME/voices" 2>/dev/null | grep -c '\.onnx$' || echo 0) .onnx"
          echo "cache: $(du -sh "$HOME/cache" 2>/dev/null | cut -f1 || echo none)"
          echo "health (loopback): $(curl -sS -m 8 http://127.0.0.1:8772/health 2>&1 | head -c 300)"
          TSB=/var/packages/Tailscale/target/bin/tailscale
          echo "funnel /voice-lite: $(sudo -n $TSB funnel status 2>/dev/null | grep -c '/voice-lite' || echo 0) mount line(s)"
          echo "---- last lines of the service ----"
          (journalctl -u poetech-voice-lite -n 25 --no-pager 2>/dev/null || sudo -n journalctl -u poetech-voice-lite -n 25 --no-pager 2>/dev/null || echo "(no journal this user can read)") | cut -c1-300
          EOS
      - name: "Ledger: a dark road is an incident; the next pass closes it"
        if: steps.gate.outputs.go == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('/tmp/verdict.json', 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'voice-lite-incident';
            for (const name of ['incident', label]) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color: 'D93F0B', description: name === label ? 'The voice-lite road witness ledger (DR-0627)' : 'The downtime ledger' }); }
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 5 });
            const issue = open.data.find((i) => i.title.startsWith('Voice-lite road'));
            const now = new Date().toISOString();
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const foot = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const why = v.problems.map((p) => `- ${p}`).join('\n');
            if (!v.pass) {
              const body = `voice-lite road failed its witness at ${now} ([run](${run})):\n${why}\n\n\`\`\`json\n${JSON.stringify(v.witness)}\n\`\`\``;
              if (!issue) await github.rest.issues.create({ owner, repo, title: 'Voice-lite road is dark', body: body + foot, labels: ['incident', label] });
              else await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: body + foot });
              core.setFailed('voice-lite-health: ' + v.problems.join('; '));
            } else if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `voice-lite road answered again at ${now} ([run](${run})): a real clip came back through the door.${foot}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
