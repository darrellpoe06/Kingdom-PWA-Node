# Install health — prove poetech.us is INSTALLABLE as a PWA, from outside.
#
# WHY (2026-07-10, Darrell: "I can't download the PoeTech app — it should be
# one button. Users are going to have this problem too."): site-health proves
# UP+FRESH, boot-check proves it BOOTS — nothing ever asked Chrome whether it
# would OFFER THE INSTALL. scripts/install-health.mjs asks, in a real browser
# on the runner (the sandbox has no route to poetech.us; the runner is the
# team's eye — DR-0125): Chrome's own installability verdict plus a fetch of
# every install-critical artifact. One installable app per brand door: the
# main app AND each branded door (TLC, Church/Love Corner, Moore) is its own
# PWA, so each gets its own verdict (a matrix, one harness call per door).
#
# On the shared probe harness since DR-1342 (DR-1330 D13): this file is the
# trigger, the brakes and the doors; _browser-probe.yml is the rest.
# THE THREE BRAKES: dispatch-only (no timer), one browser session per door
# with a hard job timeout, no compute spawned, no writes anywhere.
name: Install health (PWA installability, outside-in)

on:
  workflow_dispatch: {}

concurrency:
  group: install-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  door:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PoeTech (main)
            url: https://poetech.us/poetech-app/
          - label: TLC Therapy door
            url: https://poetech.us/poetech-app/?tlc=1
          - label: Church / Love Corner door
            url: https://poetech.us/poetech-app/?view=church
          - label: Moore Divahs door
            url: https://poetech.us/poetech-app/?moore=1
    uses: ./.github/workflows/_browser-probe.yml
    with:
      script: scripts/install-health.mjs
      args: ${{ format('"{0}"', matrix.url) }}
      title: ${{ format('Does Chrome offer the install — {0}', matrix.label) }}
      timeout-minutes: 12
