# Public shelf witness — THE STRANGER'S SCREEN GETS ITS OWN EYE (DR-0973)
#
# WHY THIS EXISTS. On 2026-10-11 Darrell found three faults on his own public
# listing, from his phone, while every pipeline check was green:
#
#   "0.5 Bedroom or 1-Bedroom?!!!!!?????!!!!!"
#   "None say co-living!!!!!!!!!!!!!!!!!!!!!!"
#   "Why don't we show the same photos for both listings??????!!!!!!!!!"
#
# All three came from ONE NULL column (`rentals.rentable_level`, added by 0160
# and written by nothing) read as though it had been filled in. Tests passed,
# the migration applied, the deploy succeeded on the exact SHA, and a fix was
# reported to him as live while it rendered nothing for nine days.
#
# Every instrument we had watches the PIPELINE. site-health (DR-0125) proves
# the site is up and fresh; it has never had an opinion about whether a card
# tells the truth. Nothing read the page a stranger sees.
#
# TWO READINGS, COMPARED — and this is the part that matters. A DOM-only
# witness CANNOT catch the founding incident: before the fix the card read
# "1-bed multi-family in Champaign, Illinois", which is character for
# character what a genuine one-bedroom reads. The fact that made it wrong is
# not on the page.
#
# So this takes a SECOND, INDEPENDENT reading from the database — what each
# advertised door is CALLED (rentals.unit + display_name) — derives the level
# from those labels with its own regex, and compares that against what
# public_vacancies() tells the shelf to say. A door named "...Bed A" that the
# shelf advertises as "1-bed" is the disagreement, and it is exactly the
# 2026-10-11 bug. The witness is proven against that shape in
# the-public-shelf-has-a-witness.test.js.
#
# WHAT IT REFUSES TO READ. Counts and labels only. Never a storage_path, never
# a thumb_path, never a caption, never a street address, never a tenant name.
# A diagnostic has no business printing the inside of somebody's home into an
# Actions log (the apt2-photos-probe rule, kept).
#
# THE THREE BRAKES (CLAUDE.md, deterministic class per DR-0248: budget + lock):
#   1. BUDGET — one runner, hard 12-minute timeout, one page load, one query.
#   2. LOCK   — concurrency group `public-shelf-witness`, single-instance.
#   3. STOP   — repo variable PUBLIC_SHELF_WITNESS_ENABLED='false', or disable
#      in the Actions UI. Unset => runs. Read-only against product and
#      database alike.
name: Public shelf witness

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Public shelf URL to read'
        required: false
        default: 'https://poetech.us/properties/app/'
  schedule:
    - cron: '41 14 * * *' # once a day, off the hour (server traffic)

concurrency:
  group: public-shelf-witness
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # the rolling incident ledger, same as site-health

jobs:
  witness:
    if: ${{ vars.PUBLIC_SHELF_WITNESS_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BASE: ${{ github.event.inputs.base || 'https://poetech.us/properties/app/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ---------------------------------------------------------------------
      # READING ONE: what the doors are CALLED, straight from the database.
      # This is the independent opinion. It derives the level from the door's
      # own labels rather than trusting rentable_level, which is the column
      # that was NULL on every door and broke three surfaces at once.
      # ---------------------------------------------------------------------
      - name: Join the tailnet (to reach the live database)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # A JOIN STEP IS NOT A WITNESS OF THE JOIN (DR-1284). `tailscale up` can
      # be refused five times and the action still closes
      # `outcome=success; conclusion=success`. Measured on this very lane:
      # runs 40757911515 / 40943512224 / 41116974336 / 41230844184 /
      # 41340322457 / 41540819357 all show step 4 SUCCESS and step 5 failing
      # with no route to the NAS. This step asks, so a shut road fails HERE,
      # at the key, with the key's name on it — before one word is published
      # about the shelf.
      - name: Verify the tailnet actually joined
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tailscale status --peers=false > /tmp/ts-join.txt 2>&1; then
            echo "::error::Tailnet join FAILED — TS_AUTHKEY invalid or consumed (needs Reusable + Ephemeral). This is NOT a shelf finding: neither the database nor the page was read."
            node scripts/tailnet-key-incident.mjs \
              --workflow "public-shelf-witness (tailnet join)" \
              --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --measured-file /tmp/ts-join.txt || true
            exit 1
          fi
          tailscale status --peers=false

      - name: What each advertised door IS, by its own labels (labels only)
        id: doors
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -uo pipefail
          cat > /tmp/doors.sql <<'SQL'
          BEGIN READ ONLY;
          \echo == advertised doors (level_from_labels|shelf_label|photos_offered) ==
          SELECT
            CASE
              WHEN lower(concat_ws(' ', coalesce(r.unit,''), coalesce(r.display_name,''))) ~ '\mbed\M'  THEN 'bed'
              WHEN lower(concat_ws(' ', coalesce(r.unit,''), coalesce(r.display_name,''))) ~ '\mroom\M' THEN 'room'
              ELSE 'unit'
            END                                             AS level_from_labels,
            v.label                                         AS shelf_label,
            (SELECT count(*) FROM public.public_vacancy_photos(r.id)) AS photos_offered
          FROM public.public_vacancies() v
          JOIN rentals r ON r.id = v.id
          ORDER BY 1, 2;
          COMMIT;
          SQL
          if ! out=$(bash scripts/live-sql.sh '|' < /tmp/doors.sql); then
            echo "::error::could not read the live database — that is itself the finding"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out"
          printf '%s\n' "$out" > /tmp/doors.txt

      # ---------------------------------------------------------------------
      # READING TWO: what a stranger's browser actually renders.
      # ---------------------------------------------------------------------
      - name: Read the shelf in a real browser
        id: shelf
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright-core@1.47.2 >/dev/null 2>&1
          npx --yes playwright@1.47.2 install chromium >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/scripts/public-shelf-rules.mjs" .
          cp "$GITHUB_WORKSPACE/scripts/public-shelf-witness.mjs" .
          OUT_DIR="$GITHUB_WORKSPACE/shots" node public-shelf-witness.mjs | tee /tmp/shelf.txt
          echo "CARDS_READ=$(grep -oE 'Cards read: [0-9]+' /tmp/shelf.txt | grep -oE '[0-9]+' || echo unknown)" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # THE COMPARISON. A door CALLED a bed that the shelf advertises with a
      # bedroom count is the 2026-10-11 bug, and it is the one thing a
      # DOM-only reading can never see.
      # ---------------------------------------------------------------------
      # A COMPARISON THAT NEVER RAN IS NOT A DISAGREEMENT (DR-1186).
      #
      # This step's OUTCOME used to be the ledger's trigger, and it is the
      # wrong question. `exit 1` here means two different things: "the two
      # readings disagree" (a shelf finding) and "a reading never happened"
      # (an UNKNOWN, and never a statement about the shelf). DR-1023 already
      # narrowed the ledger from the JOB's status to this step's — a real
      # improvement that stopped the 2026-10-14 false line — but a step
      # outcome is still a proxy. So the step now says WHICH it is, in
      # `verdict`, and the ledger reads that word instead of an outcome.
      - name: Do the two readings agree?
        id: compare
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f /tmp/doors.txt ]; then
            echo "verdict=unknown-no-database-reading" >> "$GITHUB_OUTPUT"
            echo "::error::no database reading — nothing was compared, so NOTHING is being said about the shelf (DR-1186: a failed read is UNKNOWN, never a finding)"
            exit 1
          fi
          if [ "${{ steps.shelf.outcome }}" != 'success' ]; then
            echo "verdict=unknown-no-browser-reading" >> "$GITHUB_OUTPUT"
            echo "::error::the shelf was not read in a browser — nothing was compared, so NOTHING is being said about the shelf (DR-1186)"
            exit 1
          fi
          # The decision lives in scripts/public-shelf-rules.mjs, unit-tested
          # against the founding incident. This step only feeds it the rows.
          rc=0
          node scripts/public-shelf-compare.mjs /tmp/doors.txt | tee /tmp/compare.txt || rc=$?
          echo "DOORS_CHECKED=$(grep -oE 'shared doors checked: [0-9]+' /tmp/compare.txt | grep -oE '[0-9]+' || echo unknown)" >> "$GITHUB_ENV"
          if [ "$rc" -ne 0 ]; then
            echo "verdict=disagree" >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi
          echo "verdict=agree" >> "$GITHUB_OUTPUT"

      - name: Upload what a stranger saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-shelf
          path: shots/
          if-no-files-found: warn
          retention-days: 30

      # A WITNESS WHOSE SILENCE IS AMBIGUOUS IS NOT A WITNESS.
      #
      # SILENCE on this log means the witness did not run — not that the shelf
      # is fine. site-health learned this on 2026-09-18: it filed only on
      # failure, so "no issue" meant either "healthy" or "never ran", and the
      # question it was dispatched to answer had no answer. This appends on
      # EVERY run, pass or fail, so a missing line is itself the finding.
      - name: Record the run (rolling log, every run, pass or fail)
        if: always()
        run: |
          set -uo pipefail
          line="$(date -u +%FT%TZ) — shelf: ${{ job.status }}, verdict: ${{ steps.compare.outputs.verdict || 'unknown-not-compared' }}. Base: ${BASE}. Shared doors checked: ${DOORS_CHECKED:-unknown}. Cards read: ${CARDS_READ:-unknown}. Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          num=$(gh issue list --repo "$REPO" --state open --search "in:title public shelf witness run log" --json number --jq '.[0].number // ""')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$REPO" --body "$line"
          else
            intro="Every run of the public shelf witness appends here, pass or fail (DR-0973). SILENCE on this log means the witness did not run — never that the shelf is fine."
            printf '%s\n\n%s\n' "$intro" "$line" > /tmp/runlog-body.md
            gh issue create --repo "$REPO" --title "public shelf witness run log" --body-file /tmp/runlog-body.md
          fi

      # The finding is the COMPARISON'S VERDICT, not the job's status and not
      # the compare step's outcome. Two measured corrections live in this
      # guard, and both were a step outcome standing in for a question:
      #
      #   2026-10-14, run 38597741280 (fixed by DR-1023): both readings agreed,
      #   then GitHub answered the run-log write with a GraphQL error, the JOB
      #   went red, and this step — keyed on the job — filed "the public shelf
      #   disagrees". So the guard moved to the compare step's own outcome.
      #
      #   2026-10-28 → 11-02, runs 40757911515 / 40943512224 / 41116974336 /
      #   41230844184 / 41340322457 / 41540819357 (DR-1302): the tailnet key
      #   was refused, the database was never asked, `Read the shelf in a real
      #   browser` was SKIPPED on every one of the six — and the compare step
      #   still exited 1 (for a missing file), so this guard passed and filed
      #   the bolded "the public shelf disagrees with what the doors are
      #   called" six times onto #2127. Not one card had been loaded. A step
      #   outcome cannot tell "they disagree" from "nothing was read"; only a
      #   verdict can, so the verdict is what this reads.
      - name: File the finding on the incident ledger
        if: failure() && steps.compare.outputs.verdict == 'disagree'
        run: |
          set -uo pipefail
          body="$(date -u +%FT%TZ) — **the public shelf disagrees with what the doors are called.** Both readings were taken and they do not match. Base: ${BASE}. Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID} (DR-0973)."
          num=$(gh issue list --repo "$REPO" --label incident --state open --search "in:title shelf" --json number --jq '.[0].number // ""')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "incident: the public shelf is advertising a door as something it is not" --label incident --body "$body"
          fi
