# nas-health — READ-ONLY observation over the remote-hands channel (DR-0249,
# DR-0108). Answers "what is the NAS actually doing right now?" — GPU state,
# container state, service state — WITHOUT the bootstrap's services-sync, so
# diagnosing never mutates what it observes (DR-0076 §5: characterize before
# you change; born from 2026-08-03, "did whatever we did shut down the CUDA
# GPUs?" — the channel could re-sync services but could not simply LOOK).
# Same secrets + tailnet join as nas-bootstrap.yml; missing secrets => a clear
# no-op with instructions. Dispatch-only, never a timer (three-brakes rule:
# this is observation, but the runner still only fires on a hand or a session).
name: nas-health
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secrets (no-op with instructions when absent)
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY, then re-dispatch."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Verify the tailnet actually joined
        if: steps.gate.outputs.go == 'true'
        run: |
          if ! tailscale status --peers=false >/dev/null 2>&1; then
            echo "::error::Tailnet join FAILED — TS_AUTHKEY invalid or consumed (needs Reusable + Ephemeral). Update the secret, re-dispatch."
            exit 1
          fi
          tailscale status --peers=false
      - name: Outside-in transport proof (the runner IS the outside)
        if: steps.gate.outputs.go == 'true'
        run: |
          # DR-0125 applied to the cutover transport: the sandbox has no route
          # to poetech.us, so THIS runner is the team's outside eye. Three
          # hops measured end-to-end: Pages function /sb -> Funnel path-mount
          # -> kong mirror route -> GoTrue. The literal code, never inferred.
          curl -s -o /dev/null -w 'OUTSIDE-IN https://poetech.us/sb/auth/v1/health HTTP %{http_code}\n' --max-time 20 https://poetech.us/sb/auth/v1/health || echo "OUTSIDE-IN probe unreachable"
          # SIGN-IN SHAPED probes (2026-08-19, live report: "We can't reach our
          # service" on the repointed app while health answered 200). Health
          # never exercises the routes sign-in needs; these do, with junk
          # creds. A 400/401/422 means the SERVICE answered (route alive); a
          # 404/5xx/000 names the missing hop.
          BODY=$(mktemp)
          C=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 20 -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"probe@example.invalid","password":"probe-not-real"}' \
            "https://poetech.us/sb/auth/v1/token?grant_type=password" 2>/dev/null) || C="000"
          echo "OUTSIDE-IN POST /sb/auth/v1/token HTTP $C :: $(head -c 200 "$BODY")"
          # Deep path on purpose: the /sb proxy re-joins segments and drops a
          # trailing slash, and kong's /sb/rest/v1/ PREFIX needs the slash -- a
          # bare /sb/rest/v1/ probe 404s as an artifact (measured 2026-08-19)
          # while every real app call, which goes deeper, matches fine.
          # KEYLESS on purpose, so know what its 401 MEANS: kong's key-auth
          # answering "No API key found" proves ROUTING only. It says NOTHING
          # about whether a real key is accepted — the 2026-08-20 incident hid
          # exactly there (this probe read "route alive" while key-auth was
          # rejecting every real key). The keyed probes below carry that proof.
          C=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 20 \
            "https://poetech.us/sb/rest/v1/rpc/probe_nonexistent" 2>/dev/null) || C="000"
          echo "OUTSIDE-IN GET /sb/rest/v1/rpc/... (keyless, routing only) HTTP $C :: $(head -c 200 "$BODY")"
          # The app's REAL create-profile shape (phone-pin synthetic email,
          # DR-0172) with a PROBE phone -- captures the true signup verdict a
          # reader hit ("can't reach our service", 2026-08-19). A 200 creates
          # one deletable probe user; any 4xx/5xx prints GoTrue's own reason.
          C=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 20 -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"15555550100@phone.poetech.us","password":"090909","data":{"name":"Probe User","phone":"+15555550100","login_method":"phone-pin"}}' \
            "https://poetech.us/sb/auth/v1/signup" 2>/dev/null) || C="000"
          echo "OUTSIDE-IN POST /sb/auth/v1/signup (app shape) HTTP $C :: $(head -c 300 "$BODY")"
          # Sign the probe user IN (its hash was minted BY sovereign GoTrue at
          # creation): 200 = password verification works end-to-end; anything
          # else = GoTrue itself cannot verify, and no migrated hash stood a
          # chance (2026-08-19 "same PIN doesn't work" triage).
          C=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 20 -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"15555550100@phone.poetech.us","password":"090909"}' \
            "https://poetech.us/sb/auth/v1/token?grant_type=password" 2>/dev/null) || C="000"
          echo "OUTSIDE-IN probe-user SIGN-IN HTTP $C :: $(head -c 120 "$BODY" | sed -E 's/\"(access|refresh)_token\":\"[^\"]+\"/\"\1_token\":\"<present>\"/g')"
          # Keep the probe session's token IN MEMORY for the keyed REST probe
          # below — never printed (the sed above is what reaches the log).
          PROBE_TOKEN=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("access_token",""))' "$BODY" 2>/dev/null || true)
          # WHICH key does the LIVE app carry? The bundle inlines the anon key
          # (public-by-design); its decoded payload names it -- a hosted key
          # carries a "ref" claim, the sovereign-minted one is iss-only with
          # iat 2026-08-14. Answers whether the repoint's key half is already
          # done without touching the secret store.
          # Prior run: bare urllib got HTTP 403 (Cloudflare challenges the
          # default python UA) while curl passed -- so curl fetches, python
          # only decodes.
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          HTML=$(curl -sL -A "$UA" --max-time 20 https://poetech.us/poetech-app/) || echo "LIVE-BUNDLE html fetch failed"
          # Vite MPA input names the entry chunk "main", and the key can sit
          # in any chunk -- scan every .js the shell references.
          ASSETS=$(printf '%s' "$HTML" | grep -oE 'assets/[A-Za-z0-9_.-]+\.js' | sort -u | head -12)
          echo "LIVE-BUNDLE assets found: $(printf '%s' "$ASSETS" | tr '\n' ' ')"
          if [ -z "$ASSETS" ]; then echo "LIVE-BUNDLE: no assets in html ($(printf '%s' "$HTML" | wc -c) bytes)"; fi
          # The key may be a legacy JWT (eyJ...) OR the new sb_publishable_
          # format; the inlined *.supabase.co / poetech.us URL names the URL
          # half directly. Report all three signatures per chunk.
          FOUND=0
          for A in $ASSETS; do
            OUT=$(curl -sL -A "$UA" --max-time 30 "https://poetech.us/poetech-app/$A" | python3 -c '
          import re, base64, sys
          js = sys.stdin.read()
          for tok in dict.fromkeys(re.findall(r"eyJ[\w-]{8,}\.eyJ[\w-]{8,}\.[\w-]{8,}", js)):
              p = tok.split(".")[1]
              print("LIVE-BUNDLE KEY PAYLOAD:", base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)).decode())
          for k in dict.fromkeys(re.findall(r"sb_(?:publishable|secret)_[A-Za-z0-9_-]{8,}", js)):
              print("LIVE-BUNDLE KEY (new format):", k[:24] + "...")
          for u in dict.fromkeys(re.findall(r"https://[a-z0-9-]+\.supabase\.co", js)):
              print("LIVE-BUNDLE SUPABASE URL:", u)
          if re.search(r"poetech\.us/sb", js): print("LIVE-BUNDLE SUPABASE URL: poetech.us/sb (sovereign transport)")
          ' 2>&1) || OUT="LIVE-BUNDLE decode failed for $A"
            if [ -n "$OUT" ]; then echo "[$A] $OUT"; FOUND=1; fi
          done
          [ "$FOUND" = 1 ] || echo "LIVE-BUNDLE: no key or supabase URL signature in any referenced chunk"
          # THE APP'S FIRST DATA CALL, exactly as the served bundle makes it
          # (2026-08-20 incident: sign-in passed — the auth route carries no
          # key-auth — then every data call answered kong's own "Invalid
          # authentication credentials", because the mounted kong.yml still
          # held the un-substituted $SUPABASE_ANON_KEY placeholder as the
          # key-auth credential; kong 2.8 never templates declarative config).
          # This probe uses the LIVE BUNDLE's own anon key (public-by-design),
          # so it fails exactly when a real reader fails, whatever the cause:
          # placeholder config, key rotation drift, or a broken route. The
          # kong rejection text is the tripwire — PostgREST answers anything
          # else (200/401/404 with its own wording) once the key is accepted.
          BKEY=""
          for A in $ASSETS; do
            BKEY=$(curl -sL -A "$UA" --max-time 30 "https://poetech.us/poetech-app/$A" | grep -oE 'eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}' | head -1)
            [ -n "$BKEY" ] && break
          done
          if [ -z "$BKEY" ]; then
            echo "OUTSIDE-IN REST-with-key: SKIPPED — no anon key found in the live bundle"
          else
            C=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 20 -X POST \
              -H "apikey: $BKEY" -H "Authorization: Bearer $BKEY" \
              -H 'Content-Type: application/json' -d '{}' \
              "https://poetech.us/sb/rest/v1/rpc/has_user_pin" 2>/dev/null) || C="000"
            echo "OUTSIDE-IN REST rpc has_user_pin (bundle key, anon bearer) HTTP $C :: $(head -c 160 "$BODY")"
            if grep -q 'Invalid authentication credentials' "$BODY"; then
              echo "::error::KONG REJECTS THE LIVE BUNDLE'S KEY — every reader's data calls are failing right now (sign-in still passes; the failure appears one screen later)"
            fi
            if [ -n "$PROBE_TOKEN" ]; then
              # Signed-in shape: the probe user's real session, the same call
              # PinGate makes on Darrell's screen. 200 = the whole signed-in
              # data path is open end-to-end from outside.
              C=$(curl -sS -o "$BODY" -w '%{http_code}' --max-time 20 -X POST \
                -H "apikey: $BKEY" -H "Authorization: Bearer $PROBE_TOKEN" \
                -H 'Content-Type: application/json' -d '{}' \
                "https://poetech.us/sb/rest/v1/rpc/has_user_pin" 2>/dev/null) || C="000"
              echo "OUTSIDE-IN REST rpc has_user_pin (probe user's SESSION) HTTP $C :: $(head -c 160 "$BODY")"
            else
              echo "OUTSIDE-IN REST (session shape): SKIPPED — probe sign-in returned no token above"
            fi
          fi
      - name: Observe (read-only — GPU, containers, services, disk, uptime)
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          # Run #1 (30869376840) taught two Synology facts: nvidia-smi is not
          # on the non-login PATH (probe the @appstore package paths), and the
          # docker socket denies dpoe's plain shell (fall back to sudo -n when
          # the narrow grant covers it, else PROCESS-level observation via ps,
          # which needs no socket at all). Every command remains read-only.
          $SSH 'sh -s' <<'EOS'
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          SUDO=""; sudo -n true 2>/dev/null && SUDO="sudo -n"
          echo "=== uptime / load ==="
          uptime
          echo "=== GPU driver (proc — no PATH or root needed) ==="
          cat /proc/driver/nvidia/version 2>/dev/null || echo "no /proc/driver/nvidia — NVIDIA kernel driver not loaded"
          ls /proc/driver/nvidia/gpus 2>/dev/null && echo "^ GPUs enumerated by the driver" || true
          echo "=== GPU (nvidia-smi, probed paths) ==="
          NSMI=$(command -v nvidia-smi 2>/dev/null || ls /usr/local/bin/nvidia-smi /volume1/@appstore/NVIDIARuntimeLibrary/nvidia/bin/nvidia-smi /volume1/@appstore/*/bin/nvidia-smi 2>/dev/null | head -1)
          if [ -n "$NSMI" ]; then "$NSMI" 2>&1 || $SUDO "$NSMI" 2>&1 || true; else echo "nvidia-smi binary not found on known Synology paths"; fi
          echo "=== containers (docker, when the grant allows) ==="
          $SUDO docker ps --format "table {{.Names}}\t{{.Status}}" 2>&1 || docker ps --format "table {{.Names}}\t{{.Status}}" 2>&1 || true
          $SUDO docker ps -a --filter status=exited --format "table {{.Names}}\t{{.Status}}" 2>&1 || true
          echo "=== GPU/AI service PROCESSES (no socket needed) ==="
          ps aux 2>/dev/null | grep -iE "ollama|whisper|xtts|voice-studio|llama" | grep -v grep || echo "no ollama/whisper/xtts/voice-studio/llama processes running"
          echo "=== poetech systemd units ==="
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -iE "poetech|ollama|whisper|voice" || echo "no matching units listed"
          echo "=== python + pip (the assumption two installers made and got wrong) ==="
          # 2026-08-11: the transcript rider's dependency fix used `python3 -m pip
          # install --user`, and choir_dates_install.sh line 22 already recorded
          # that this DSM ships WITHOUT pip. Two installers assumed a package
          # manager nobody had verified. Measure it instead of assuming it again.
          command -v python3 && python3 -V 2>&1 || echo "no python3 on PATH"
          python3 -m pip --version 2>&1 | head -1 || echo "python3 -m pip: NOT AVAILABLE"
          python3 -c 'import youtube_transcript_api; print("youtube_transcript_api: importable")' 2>&1 | tail -1
          python3 -c 'import yt_dlp; print("yt_dlp: importable")' 2>&1 | tail -1
          echo "=== the SAME import, as ROOT (which is who services-sync runs it as) ==="
          # The whole hypothesis in one line. dpoe can import it; the loop runs
          # as root via sudo -n. If these two disagree, the per-user site-packages
          # are the fault and nothing about YouTube or the network matters yet.
          ${SUDO} python3 -c 'import youtube_transcript_api; print("as root: importable")' 2>&1 | tail -1
          ls -d /volume1/PoeTech/repos/Kingdom-PWA-Node/infra/nas-sme-pipeline/.vendor 2>&1 | tail -1
          echo "=== docker reachability, unprivileged vs sudo -n ==="
          docker ps >/dev/null 2>&1 && echo "docker: OK unprivileged" || echo "docker: DENIED unprivileged"
          sudo -n docker ps >/dev/null 2>&1 && echo "docker: OK via sudo -n" || echo "docker: not available via sudo -n"
          echo "=== can a container reach YouTube at all? (the choir-dates wrapper path) ==="
          ${SUDO} docker run --rm --network host curlimages/curl:latest -s -o /dev/null -w 'youtube HTTP %{http_code}\n' --max-time 20 https://www.youtube.com 2>&1 | tail -1
          echo "=== the trickle stamp (read-only; running the installer would burn a slot) ==="
          ls -la /volume1/PoeTech/repos/Kingdom-PWA-Node/infra/nas-sme-pipeline/out/.transcript-trickle.last 2>&1 | tail -1
          # ---------------------------------------------------------------
          # 2026-08-14: IS THE LOOP EVEN RUNNING? The file-level trace of
          # transcript_trickle_install.sh CONTRADICTS ITSELF against the
          # 2026-08-11 reading, which is why these lines exist:
          #   .vendor absent  => `mkdir -p "$VENDOR"` (line 105) never ran
          #                   => the import check (line 103) SUCCEEDED
          #   but if 103 succeeded, control reaches line 125 and the stamp is
          #   rewritten -- and the stamp has not moved since Aug 11.
          # Both branches cannot be true. So the installer is probably not
          # being RUN at all, and the fault is upstream in services-sync, not
          # in the installer. Everything below discriminates that: an armed,
          # clocked, freshly-pulled loop that is firing looks completely
          # different from one that never starts. Measure it (DR-0076 §5:
          # characterize before you change) instead of patching a script that
          # may be innocent.
          REPO=/volume1/PoeTech/repos/Kingdom-PWA-Node
          LOOPS=$REPO/infra/nas-loops
          echo "=== is the fleet ARMED? (all three arms — DR-0247) ==="
          ls -la "$LOOPS/ARMED-BY-RECORD" 2>&1 | tail -1
          ls -la "$LOOPS/.env" 2>&1 | tail -1
          grep -c LOOPS_ARMED "$LOOPS/.env" 2>/dev/null || echo "no LOOPS_ARMED in .env (or no .env)"
          ls -la "$LOOPS/state/LOOPS_ARMED" 2>&1 | tail -1
          echo "=== is it CLOCKED? (an enabled-but-unclocked loop reads GREEN while nothing fires) ==="
          ${SUDO} crontab -l 2>&1 | grep -iE "run\.mjs|nas-loops|services-sync" || echo "root crontab: no nas-loops entry"
          crontab -l 2>&1 | grep -iE "run\.mjs|nas-loops|services-sync" || echo "dpoe crontab: no nas-loops entry"
          ${SUDO} cat /etc/crontab 2>/dev/null | grep -iE "run\.mjs|nas-loops" || echo "/etc/crontab: no nas-loops entry"
          echo "=== DID IT RUN? the runner's own event log (last 12) ==="
          ls -la "$LOOPS/events/events.jsonl" 2>&1 | tail -1
          tail -12 "$LOOPS/events/events.jsonl" 2>/dev/null || echo "no events.jsonl — the runner has never written an event here"
          echo "=== per-loop state: locks + today's call caps ==="
          ls -la "$LOOPS/state/" 2>&1 | tail -20
          echo "=== KILL_SWITCH / brakes in the loop tree ==="
          ls -la "$LOOPS/state/KILL_SWITCH" 2>&1 | tail -1
          echo "=== is the MIRROR fresh? (services-sync pulls FIRST; a stale mirror runs yesterday) ==="
          git -C "$REPO" log -1 --format='mirror HEAD: %h %ci %s' 2>&1 | tail -1
          git -C "$REPO" status --porcelain 2>&1 | head -5
          git -C "$REPO" rev-parse --abbrev-ref HEAD 2>&1 | tail -1
          echo "=== the reel the Dispatch Status surface reads (last 8) ==="
          tail -8 /data/poetech-briefing/_reel.jsonl 2>/dev/null || echo "no reel at /data/poetech-briefing/_reel.jsonl"
          echo "=== node present? (run.mjs needs it; no node = no loop, silently) ==="
          command -v node && node -v 2>&1 || echo "NO node on PATH — run.mjs cannot execute"
          ${SUDO} sh -c 'command -v node' 2>/dev/null || echo "NO node on root PATH either"
          echo "=== disk (the volume the services live on) ==="
          df -h /volume1 2>&1 | tail -1
          # ---------------------------------------------------------------
          # 2026-08-15: WHY do the sovereign Supabase legs restart? Observed
          # at 05:06Z: storage restart-looping since birth, studio unhealthy,
          # and now auth + rest joining the restart loop — and NO probe ever
          # captured a single container log line, so the cutover sprint's
          # first target had a symptom but never a reason. Read-only tails,
          # restarting/unhealthy legs only; healthy legs stay unlogged (noise
          # discipline). docker logs needs the socket => sudo -n, same grant
          # as the ps table above.
          # The installer's own words from the last cycles — the reconcile
          # verdict lines the event capture kept truncating (three blind
          # passes of the password cure). The cron log holds full stdout.
          # The direct witness (DR-0076): the literal HTTP code from kong,
          # read fresh -- a passing installer is inferred; this is measured.
          echo "=== sovereign gateway: does kong answer? (direct probe) ==="
          curl -s -o /dev/null -w 'auth/v1/health HTTP %{http_code}\n' --max-time 5 http://127.0.0.1:8800/auth/v1/health 2>&1 || echo "gateway unreachable"
          echo "=== the installer's own words (nas-supabase lines, cron log) ==="
          ${SUDO} grep -a "nas-supabase:" "$LOOPS/events/cron-services-sync.log" 2>/dev/null | tail -10 || echo "no cron log readable"
          # FOURTH blindness (2026-08-15 22:52Z): the cron log records only
          # FAILING installers -- the moment the gateway went green every
          # verdict line vanished from it. The status file is written by
          # install.sh every run regardless of exit; this is its reader.
          echo "=== does MAINTAIN survive the dump filter? (measure, not infer) ==="
          ${SUDO} grep -n "MAINTAIN" /volume1/docker/supabase/hosted-baseline.sql 2>/dev/null | head -4 || echo "no MAINTAIN lines in the filtered dump"
          echo "=== cutover status file (written EVERY run, success included) ==="
          ${SUDO} cat /volume1/docker/supabase/cutover.status 2>/dev/null || echo "no cutover.status yet — installer predates the status-file fix or has not run"
          echo "=== replay ledger, read straight from the database (not inferred) ==="
          SUPA_PW=$(${SUDO} grep '^POSTGRES_PASSWORD=' /volume1/docker/supabase/.env 2>/dev/null | head -1 | cut -d= -f2-)
          if [ -n "$SUPA_PW" ]; then
            ${SUDO} docker exec -e PGPASSWORD="$SUPA_PW" supabase-db \
              psql -h 127.0.0.1 -U supabase_admin -d postgres -t -A \
              -c "SELECT 'ledger '||count(*)||' applied, latest: '||COALESCE(max(fname),'none') FROM public._sovereign_replay;" 2>&1 | tail -2
            ${SUDO} docker exec -e PGPASSWORD="$SUPA_PW" supabase-db \
              psql -h 127.0.0.1 -U supabase_admin -d postgres -t -A \
              -c "SELECT 'sovereign auth.users: '||count(*) FROM auth.users;" 2>&1 | tail -1
          else
            echo "no POSTGRES_PASSWORD readable — ledger not queryable this probe"
          fi
          echo "=== the sovereign ANON_KEY (public-by-design: inlined into every client bundle; the repoint's paste value) ==="
          ${SUDO} grep '^ANON_KEY=' /volume1/docker/supabase/.env 2>/dev/null | head -1 || echo "no ANON_KEY readable"
          # The raw key printed *** -- the runner masks values equal to ANY repo
          # secret, which is itself evidence the sovereign key EQUALS a stored
          # one (most plausibly the hosted VITE_SUPABASE_ANON_KEY, i.e. the box
          # .env was minted hosted-compatible and the repoint needs only the
          # URL). Verify by DECODING the JWT payload: its text differs from the
          # key string so masking cannot hide it, and its iss/ref names which
          # key this is.
          echo "=== the ANON_KEY's decoded payload (names WHICH key; cannot be masked) ==="
          ${SUDO} python3 -c "import base64; t=[l for l in open('/volume1/docker/supabase/.env') if l.startswith('ANON_KEY=')][0].strip().split('=',1)[1]; p=t.split('.')[1]; print(base64.urlsafe_b64decode(p+'='*(-len(p)%4)).decode())" 2>&1 | tail -2
          echo "=== triggers by schema (naming the +1 the parity comparator flagged) ==="
          if [ -n "$SUPA_PW" ]; then
            ${SUDO} docker exec -e PGPASSWORD="$SUPA_PW" supabase-db \
              psql -h 127.0.0.1 -U supabase_admin -d postgres -t -A \
              -c "SELECT n.nspname||' schema: '||count(*)||' triggers' FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE NOT t.tgisinternal GROUP BY n.nspname ORDER BY 1;" 2>&1 | tail -8
          fi
          echo "=== /sb mirror routes: does kong answer on the CUTOVER path? ==="
          curl -s -o /dev/null -w '/sb/auth/v1/health HTTP %{http_code}\n' --max-time 5 http://127.0.0.1:8800/sb/auth/v1/health 2>&1 || echo "/sb probe unreachable"
          # Sign-in's follow-up leg (2026-08-19 live 404): rest through kong.
          # 401 "No API key" = route ALIVE (key-auth answered); 404 = kong is
          # serving a config older than the repo's kong.yml.
          curl -s -o /dev/null -w '/sb/rest/v1/ HTTP %{http_code}\n' --max-time 5 http://127.0.0.1:8800/sb/rest/v1/ 2>&1 || echo "/sb/rest probe unreachable"
          echo "=== kong config freshness (mirror file vs stamped hash vs container age) ==="
          md5sum /volume1/PoeTech/repos/Kingdom-PWA-Node/infra/nas-supabase/kong.yml 2>/dev/null || echo "mirror kong.yml unreadable"
          echo "stamped: $(cat /volume1/docker/supabase/.kong.hash 2>/dev/null || echo 'no hash stamped')"
          ${SUDO} docker inspect -f 'kong started: {{.State.StartedAt}}' supabase-kong 2>/dev/null || echo "kong inspect unavailable"
