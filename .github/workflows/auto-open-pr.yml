# Auto-open PR — push a release-lane branch, get a PR to main with zero local gh.
#
# WHY (2026-06-16): opening PRs with `gh pr create` from a local session threw an
# interactive "Approve once" gate at the operator — the exact manual bottleneck
# we are removing. This moves PR-opening INTO the Action, authed by the
# workflow's own GITHUB_TOKEN. Push a feat/|fix/|merge/|docs/ branch and a PR to
# main appears and (unless labeled `hold`) gets native auto-merge enabled, so it
# lands on green with no human approval and no local gh.
#
# CI NOTE: a PR opened by GITHUB_TOKEN does NOT trigger `pull_request` workflows
# (GitHub's anti-recursion rule), so the required checks would never attach. That
# is why ci.yml ALSO runs on `push` to these lanes — the push that fires THIS
# workflow runs CI on the same commit, and those checks attach to the SHA the PR
# uses. Auto-merge then has real required checks to wait on. (auto-merge.yml's
# check_suite sweep is the belt-and-suspenders that also picks it up.)
#
# Pairs with auto-merge.yml (the merge half), scripts/release-tier-gate.mjs (the
# tier PARAMETER), and RELEASE-TIERS.md.
#
# TIER GATE (2026-07-05, Darrell "Yes tighten that"): the lane no longer arms
# auto-merge on EVERY green PR. scripts/release-tier-gate.mjs classifies the PR's
# changed files; auto-merge is armed ONLY for Tier A (provably low-risk: docs /
# memory / tests / copy). Tier B/C (product code, and especially schema, CI,
# money, front-door, onboarding, automation) is HELD for the family's soak/
# review and merges only once a human applies the `ship` label. `hold` remains
# the independent hard human brake. "No waiting" was about not waiting on the
# human for LOW-RISK work — the tiers still gate the rest.

name: Auto-open PR

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'merge/**'
      - 'docs/**'
      # The remote/web sessions (Claude Code on the web) push their work on
      # `claude/*` branches. They were excluded from the merge lane, so EVERY
      # agent PR was invisible to auto-open + auto-merge and could only be
      # landed by Darrell's hand -- the "we don't move when I'm not pushing"
      # stall (2026-07-05). Bringing `claude/**` into the same sanctioned
      # default (auto-merge on green; `hold` to soak) closes that gap.
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write

# One open-attempt per branch at a time.
concurrency:
  group: auto-open-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    name: open a PR to main (token-only) and enable auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open a PR if none exists, then enable auto-merge unless held
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: skip creation if a PR for this branch is already open.
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            num="$existing"
            echo "PR #$num already open for $BRANCH."
          else
            title=$(git log -1 --pretty=%s)
            body=$(git log -1 --pretty=%b)
            num=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
                    --title "$title" \
                    --body "${body:-Opened automatically on push. Rides auto-merge on green CI; label \`hold\` to keep it out of the merge lane.}" \
                  | grep -oE '[0-9]+$' | tail -1)
            echo "Opened PR #$num for $BRANCH."
          fi
          # `hold` = the human hard-brake: never arm.
          has_hold=$(gh pr view "$num" --repo "$REPO" --json labels --jq 'any(.labels[].name; .=="hold")')
          if [ "$has_hold" = "true" ]; then
            echo "PR #$num is labeled 'hold'; leaving auto-merge OFF."
            exit 0
          fi
          # `ship` = a human's explicit release of a reviewed Tier B/C PR: arm.
          has_ship=$(gh pr view "$num" --repo "$REPO" --json labels --jq 'any(.labels[].name; .=="ship")')
          # Otherwise consult the tier PARAMETER on the PR's changed files.
          auto_merge="$has_ship"
          if [ "$has_ship" = "true" ]; then
            echo "PR #$num is labeled 'ship'; arming auto-merge (human release)."
          else
            # Changed paths on this branch vs main (three-dot = since divergence).
            mapfile -t changed < <(git diff --name-only "origin/main...HEAD" || true)
            gate=$(printf '%s\n' "${changed[@]}" | node scripts/release-tier-gate.mjs)
            echo "tier-gate: $gate"
            auto_merge=$(printf '%s' "$gate" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).autoMerge?"true":"false")}catch{process.stdout.write("false")}})')
            tier=$(printf '%s' "$gate" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).tier||"B")}catch{process.stdout.write("B")}})')
          fi
          if [ "$auto_merge" = "true" ]; then
            gh pr merge --repo "$REPO" --auto --squash "$num" \
              || echo "::warning::could not enable auto-merge on #$num (may merge immediately or be ineligible)"
          else
            echo "PR #$num is Tier ${tier:-B}; NOT arming auto-merge — held for soak/review."
            # Post the tier explanation ONCE (idempotent: skip if the marker is present).
            marker="<!-- tier-gate -->"
            already=$(gh pr view "$num" --repo "$REPO" --json comments --jq "any(.comments[].body; contains(\"$marker\"))")
            if [ "$already" != "true" ]; then
              body=$(printf '%s\n%s\n\n%s' \
                "$marker" \
                "🚦 **Tier ${tier:-B} — held for review, not auto-merged.** The delivery lane auto-merges only provably low-risk (Tier A) changes; this one touches product code or a higher-risk surface (RELEASE-TIERS.md / DR-0105)." \
                "CI still runs and must be green. When you've reviewed/soaked it, add the \`ship\` label to release it (it will then auto-merge on green). Use \`hold\` to keep it parked regardless.")
              gh pr comment "$num" --repo "$REPO" --body "$body" \
                || echo "::warning::could not post tier comment on #$num"
            fi
          fi
