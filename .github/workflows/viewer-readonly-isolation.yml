# viewer-readonly-isolation — PROVE the 0125 viewer deny-overlay and the explicit
# invite target hold, in CI, against the real database, using the SAME
# SUPABASE_DB_URL secret the db-migrate lane uses. Enablement GATE for the
# "Viewer (read-only)" role label (DR-0241): the label may promise read-only only
# while this is GREEN (DR-0076; the role-control-isolation precedent).
#
# What it does (self-contained + idempotent, safe against prod):
#   1. Applies infra/supabase/migrations-auto/0125-viewer-true-readonly-and-invite-target.sql
#      (idempotent — the overlay function re-creates its policies).
#   2. Runs infra/supabase/tests/0125-viewer-readonly-smoke.sql, which sets up a
#      family + business + church instance with an owner/member/viewer IN A
#      TRANSACTION and asserts: the viewer reads but cannot INSERT/UPDATE/DELETE
#      the ledger, the viewer can still DM a leader (participation exception),
#      a member still writes, the invite honors an explicit target, a non-leader
#      or church target RAISES, and the legacy family-first resolution stands —
#      then ROLLS BACK. A wrong grant RAISEs -> psql non-zero -> RED.
#
# FIRING: db-migrate dispatches this EXPLICITLY as its last step — the
# `workflow_run` trigger below never fires for the lane's token-driven
# db-migrate runs (GitHub suppresses events from GITHUB_TOKEN-caused runs;
# the DR-0107 class, observed twice 2026-07-29). workflow_run stays only as
# belt-and-suspenders for a HUMAN-dispatched db-migrate. Manual dispatch works
# any time. Deploy-path only; not self-arming (respects the Cage).
# SUPABASE_DB_URL is whitespace-stripped exactly like scripts/db-migrate-apply.sh.
name: viewer-readonly-isolation

on:
  workflow_dispatch:
  workflow_run:
    workflows: [db-migrate]
    types: [completed]

concurrency:
  group: viewer-readonly-isolation
  cancel-in-progress: false

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Apply 0125+0126 (idempotent) then run both isolation smoke tests
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          DBURL=$(printf '%s' "${SUPABASE_DB_URL:-}" | tr -d '[:space:]')
          if [ -z "$DBURL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set (same secret db-migrate uses)."
            exit 1
          fi
          echo "=== applying 0125-viewer-true-readonly-and-invite-target.sql (idempotent) ==="
          psql "$DBURL" --single-transaction -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations-auto/0125-viewer-true-readonly-and-invite-target.sql
          echo "=== applying 0126-member-capability-checklist.sql (idempotent) ==="
          psql "$DBURL" --single-transaction -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations-auto/0126-member-capability-checklist.sql
          echo "=== running the viewer-readonly smoke test (rolls back) ==="
          psql "$DBURL" -v ON_ERROR_STOP=1 \
            -f infra/supabase/tests/0125-viewer-readonly-smoke.sql
          echo "=== running the capability-checklist smoke test (rolls back) ==="
          psql "$DBURL" -v ON_ERROR_STOP=1 \
            -f infra/supabase/tests/0126-capability-checklist-smoke.sql
          echo "both isolation smokes completed without a wrong grant (PASS lines above)"
