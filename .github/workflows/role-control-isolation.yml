# role-control-isolation — PROVE the 0111 set_member_role / list_instance_members
# guards hold, in CI, against the real database, using the SAME SUPABASE_DB_URL secret
# the db-migrate lane uses. Enablement GATE for the in-app role controls (DR-0220
# Phase 3): no Choir/Admin role-change surface is trusted until this is GREEN (DR-0076;
# the choir-claim-isolation / delegated-pm-isolation precedent).
#
# What it does (self-contained + idempotent, safe against prod):
#   1. Applies infra/supabase/migrations-auto/0111-set-member-role.sql (idempotent).
#   2. Runs infra/supabase/tests/0111-role-control-smoke.sql, which sets up two
#      instances + owners/admins/members IN A TRANSACTION and asserts: a member can't
#      change roles, an admin can't grant/alter admin, owners are untouchable, no
#      self-change, 'owner' is never grantable, an owner CAN promote to admin, and no
#      cross-instance change or member-list leak, then ROLLS BACK. A wrong grant RAISEs
#      -> psql exits non-zero -> RED. 'ROLE CONTROL SMOKE: PASS' + exit 0 -> GREEN.
#
# Manual (workflow_dispatch) or automatically after db-migrate finishes on main.
# Deploy-path only; not self-arming (respects the Cage). SUPABASE_DB_URL is
# whitespace-stripped exactly like scripts/db-migrate-apply.sh.
name: role-control-isolation

on:
  workflow_dispatch:
  workflow_run:
    workflows: [db-migrate]
    types: [completed]

concurrency:
  group: role-control-isolation
  cancel-in-progress: false

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Apply 0111 (idempotent) then run the role-control smoke test
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          DBURL=$(printf '%s' "${SUPABASE_DB_URL:-}" | tr -d '[:space:]')
          if [ -z "$DBURL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set (same secret db-migrate uses)."
            exit 1
          fi
          echo "=== applying 0111-set-member-role.sql (idempotent) ==="
          psql "$DBURL" --single-transaction -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations-auto/0111-set-member-role.sql
          echo "=== applying 0112-list-my-admin-instances.sql (idempotent) ==="
          psql "$DBURL" --single-transaction -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations-auto/0112-list-my-admin-instances.sql
          echo "=== running the role-control smoke test (rolls back) ==="
          psql "$DBURL" -v ON_ERROR_STOP=1 \
            -f infra/supabase/tests/0111-role-control-smoke.sql
          echo "role-control smoke test completed without a wrong grant (see 'ROLE CONTROL SMOKE: PASS' above)"
