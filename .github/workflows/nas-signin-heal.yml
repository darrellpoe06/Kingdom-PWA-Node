# nas-signin-heal — bring the sovereign sign-in road back, from the NAS itself.
#
# WHY THIS EXISTS. On 2026-10-09 Darrell was locked out of his own app: a POST
# to poetech.us/sb/auth/v1/token returned an EMPTY BODY, so the browser called
# .json() on nothing and died with "Unexpected end of JSON input", on both the
# email-link path and the phone-PIN path. A GET to /sb/auth/v1/health answered
# 200 the whole time, which is why every probe read green. The cloud sandbox
# has no route to the NAS, so the only thing the agent could do was hand him
# commands to paste. His answer: "You do it!!!!!!"
#
# So this is the hand. It joins the tailnet the same way cams-diag does, SSHes
# to the NAS as dpoe, and restarts ONLY the sovereign Supabase containers that
# carry sign-in. The container list is HARDCODED on purpose: this workflow
# takes no command input of any kind, so there is nothing to inject into it on
# a public repository. It restarts what it names and nothing else.
#
# It then MEASURES rather than assumes (DR-0076): the same POST that failed,
# first from the NAS loopback (is the stack itself answering?) and then from
# the runner through poetech.us/sb (does the whole road carry a body?). An
# empty body after the restart fails the run, so a heal that did not heal says
# so instead of reporting success.
name: nas-signin-heal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nas-signin-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check secrets (no-op with instructions when absent)
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY, then re-dispatch."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify the tailnet actually joined
        if: steps.gate.outputs.go == 'true'
        run: |
          if ! tailscale status --peers=false >/dev/null 2>&1; then
            echo "::error::Tailnet join FAILED — TS_AUTHKEY invalid or consumed (needs Reusable + Ephemeral)."
            exit 1
          fi

      - name: Before — what the stack says, and does a POST work on the box
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH 'sh -s' <<'EOS'
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          scrub() { sed -E 's/([?&"]?(password|pass|pwd|token|api_key|key|secret|anon|service_role)[=:"]+)[^&" ,}]*/\1***/Ig'; }
          SUDO=""; sudo -n true 2>/dev/null && SUDO="sudo -n"
          echo "=== supabase containers, before ==="
          $SUDO docker ps -a --format '{{.Names}}\t{{.Status}}' 2>/dev/null | grep -i supabase | scrub || echo "(docker ps gave nothing)"
          echo
          echo "=== the auth container's own last words ==="
          $SUDO docker logs --tail 40 supabase-auth 2>&1 | scrub | tail -40 || echo "(no supabase-auth log)"
          echo
          # NEVER GUESS THE PORT AGAIN. Measured 2026-10-09: the first cut of
          # this workflow probed 127.0.0.1:8000 because that is kong's default,
          # and got "Failed to connect ... after 0 ms" — which the probe then
          # counted as a 68-byte body because it folded stderr in with 2>&1.
          # Two bugs reading as one outage. The real door on this box is the
          # Caddy gateway on :8800, which nas-health.yml has probed all along
          # (nas-health.yml:295 /auth/v1/health, :369 /sb/auth/v1/health); kong
          # itself is docker-internal. So the ports are LISTED here, every run,
          # and the probe reads the door the app actually rides.
          echo "=== what is actually listening on this box (so no probe guesses) ==="
          { netstat -lnt 2>/dev/null || ss -lnt 2>/dev/null; } | awk 'NR==1 || /:(8000|8800|8771|5432|3000|9999)[^0-9]/' || echo "(no netstat/ss)"
          echo
          echo "=== kong's published ports, from docker itself ==="
          $SUDO docker port supabase-kong 2>/dev/null || echo "(kong publishes no host ports — it is reached through the gateway)"
          echo
          # What the Funnel is pointed at. If this says :8800 the road is whole;
          # if it says something dark, THAT is the outage, not the stack.
          echo "=== what the Funnel serves (the road Cloudflare rides to get here) ==="
          tailscale serve status 2>/dev/null || tailscale funnel status 2>/dev/null || echo "(tailscale serve/funnel status unavailable to this user)"
          echo
          # Bodies and codes measured SEPARATELY, and stderr kept OUT of the
          # body, so "N bytes" means N bytes of answer and nothing else.
          probe_post() {
            _u="$1"; _label="$2"
            _code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -X POST \
                      -H 'Content-Type: application/json' \
                      -d '{"email":"heal-probe@poetech.invalid","password":"not-a-real-password"}' \
                      "$_u" 2>/dev/null || echo "000")
            _body=$(curl -s -m 20 -X POST -H 'Content-Type: application/json' \
                      -d '{"email":"heal-probe@poetech.invalid","password":"not-a-real-password"}' \
                      "$_u" 2>/dev/null || printf '')
            echo "$_label -> HTTP $_code, ${#_body} bytes"
            printf '%s' "$_body" | head -c 200 | scrub; echo
          }
          echo "=== POST on the box itself — the verb sign-in actually uses ==="
          probe_post 'http://127.0.0.1:8800/sb/auth/v1/token?grant_type=password' 'gateway :8800 /sb (the app path)'
          probe_post 'http://127.0.0.1:8800/auth/v1/token?grant_type=password'    'gateway :8800 bare  (the mirror path)'
          probe_post 'http://127.0.0.1:8000/auth/v1/token?grant_type=password'    'kong :8000 direct   (expected closed)'
          EOS

      # DO NOT RESTART A HEALTHY STACK. Measured 2026-10-09 run 37958313908:
      # the NAS answered the sign-in POST with a healthy 81-byte 400 BOTH
      # before and after a restart of kong, auth and rest — the restart was
      # pure risk to a live service the family depends on, taken because the
      # earlier probe asked a port that was never open. A heal only heals what
      # is actually broken, so the restart is now gated on the box's own
      # answer: if the gateway returns a body, the containers are left alone
      # and the run goes straight to measuring the road.
      - name: Does the box already answer? (decides whether to restart at all)
        id: precheck
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          PRE=$($SSH 'curl -s --max-time 20 -X POST -H "Content-Type: application/json" -d "{\"email\":\"heal-probe@poetech.invalid\",\"password\":\"not-a-real-password\"}" "http://127.0.0.1:8800/sb/auth/v1/token?grant_type=password" 2>/dev/null || printf ""')
          echo "pre-restart gateway POST bytes: ${#PRE}"
          if [ -n "$PRE" ]; then
            echo "The stack ALREADY answers a sign-in POST (${#PRE} bytes). Not restarting anything."
            echo "- Stack already answering (**${#PRE} bytes**) — no restart performed" >> "$GITHUB_STEP_SUMMARY"
            echo "stack_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "The stack does NOT answer a sign-in POST. Restarting the sign-in containers."
            echo "- Stack silent on a sign-in POST — restarting kong/auth/rest" >> "$GITHUB_STEP_SUMMARY"
            echo "stack_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restart the sign-in road (hardcoded containers, nothing else)
        if: steps.gate.outputs.go == 'true' && steps.precheck.outputs.stack_ok != 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH 'sh -s' <<'EOS'
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          SUDO=""; sudo -n true 2>/dev/null && SUDO="sudo -n"
          # ONLY these, and only if they exist. No input reaches this list.
          for c in supabase-kong supabase-auth supabase-rest; do
            if $SUDO docker inspect "$c" >/dev/null 2>&1; then
              echo "restarting $c ..."
              $SUDO docker restart "$c" >/dev/null 2>&1 && echo "  $c restarted" || echo "  $c RESTART FAILED"
            else
              echo "$c is not a container on this box (skipped)"
            fi
          done
          echo "waiting 25s for the stack to come back up"
          sleep 25
          $SUDO docker ps --format '{{.Names}}\t{{.Status}}' 2>/dev/null | grep -i supabase || true
          EOS

      - name: After — measure the POST, on the box and through poetech.us
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          SB_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"

          echo "### After the restart" >> "$GITHUB_STEP_SUMMARY"

          # No key material reaches this public log, even from an error body.
          scrub_edge() { sed -E 's/([?&"]?(password|pass|pwd|token|api_key|key|secret|anon|service_role)[=:"]+)[^&" ,}]*/\1***/Ig'; }

          # The gateway on :8800, /sb path — the door the app rides (see the
          # before-step comment; :8000 is kong-internal and never answered).
          LOOP=$($SSH 'curl -s --max-time 20 -X POST -H "Content-Type: application/json" -d "{\"email\":\"heal-probe@poetech.invalid\",\"password\":\"not-a-real-password\"}" "http://127.0.0.1:8800/sb/auth/v1/token?grant_type=password" 2>/dev/null || printf ""')
          echo "- POST on the NAS gateway (:8800 /sb) -> **${#LOOP} bytes**" >> "$GITHUB_STEP_SUMMARY"
          echo "loopback POST body bytes: ${#LOOP}"

          # The whole road, the way a browser rides it.
          EDGE=""
          if [ -n "${SB_ANON:-}" ]; then
            EDGE=$(curl -sS --max-time 25 -X POST \
              -H "apikey: $SB_ANON" -H 'Content-Type: application/json' \
              -d '{"email":"heal-probe@poetech.invalid","password":"not-a-real-password"}' \
              "https://poetech.us/sb/auth/v1/token?grant_type=password" 2>/dev/null || echo "")
            [ -n "$EDGE" ] || { sleep 8; EDGE=$(curl -sS --max-time 25 -X POST \
              -H "apikey: $SB_ANON" -H 'Content-Type: application/json' \
              -d '{"email":"heal-probe@poetech.invalid","password":"not-a-real-password"}' \
              "https://poetech.us/sb/auth/v1/token?grant_type=password" 2>/dev/null || echo ""); }
          fi
          echo "- POST through poetech.us/sb -> **${#EDGE} bytes**" >> "$GITHUB_STEP_SUMMARY"
          echo "edge POST body bytes: ${#EDGE}"

          # WHAT IS THE EDGE ACTUALLY SAYING? Measured 2026-10-09 run
          # 37958313908: the NAS answered this POST with a healthy 81-byte
          # 400 (invalid_credentials) while the SAME POST through poetech.us
          # came back 0 bytes. "0 bytes" alone cannot tell a dropped body from
          # a bodiless 503 throttle from a connection reset — and this file's
          # own factory comment says the Funnel throttles with 503. So the
          # status line, curl's exit code and the response headers are all
          # captured, and the Funnel is asked DIRECTLY, bypassing Cloudflare,
          # so the leg that breaks is named rather than inferred.
          echo "### Where the POST dies" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${SB_ANON:-}" ]; then
            E_CODE=$(curl -s -o /dev/null -m 25 -w '%{http_code}' -X POST \
              -H "apikey: $SB_ANON" -H 'Content-Type: application/json' \
              -d '{"email":"heal-probe@poetech.invalid","password":"not-a-real-password"}' \
              -D /tmp/edge_hdr.txt \
              "https://poetech.us/sb/auth/v1/token?grant_type=password" 2>/dev/null); E_RC=$?
            echo "- edge POST \`poetech.us/sb\` -> HTTP **${E_CODE}**, curl exit **${E_RC}**" >> "$GITHUB_STEP_SUMMARY"
            echo "edge POST: HTTP $E_CODE, curl exit $E_RC"
            echo "--- edge response headers ---"
            sed -E 's/([Ss]et-[Cc]ookie:).*/\1 ***/' /tmp/edge_hdr.txt 2>/dev/null | head -25 || echo "(no headers captured)"

            # The Funnel, asked directly. If THIS 503s, Cloudflare is innocent
            # and the throttle is Tailscale's.
            F_CODE=$(curl -s -o /tmp/funnel_body.txt -m 25 -w '%{http_code}' -X POST \
              -H "apikey: $SB_ANON" -H 'Content-Type: application/json' \
              -d '{"email":"heal-probe@poetech.invalid","password":"not-a-real-password"}' \
              "https://poetech.tail5a2f35.ts.net/sb/auth/v1/token?grant_type=password" 2>/dev/null); F_RC=$?
            F_BYTES=$(wc -c < /tmp/funnel_body.txt 2>/dev/null | tr -d ' ')
            echo "- Funnel direct (no Cloudflare) -> HTTP **${F_CODE}**, ${F_BYTES} bytes, curl exit **${F_RC}**" >> "$GITHUB_STEP_SUMMARY"
            echo "funnel direct POST: HTTP $F_CODE, $F_BYTES bytes, curl exit $F_RC"
            head -c 300 /tmp/funnel_body.txt 2>/dev/null | scrub_edge; echo

            # A GET through the SAME Funnel path, for contrast: if GET passes
            # and POST does not on the same leg, the verb is the variable.
            G_CODE=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
              "https://poetech.tail5a2f35.ts.net/sb/auth/v1/health" 2>/dev/null || echo "000")
            echo "- Funnel direct GET health -> HTTP **${G_CODE}**" >> "$GITHUB_STEP_SUMMARY"
            echo "funnel direct GET health: HTTP $G_CODE"
          fi

          # IS THAT GREEN GET EVEN THE NAS ANSWERING? Measured 2026-10-09: a
          # GET to /sb/auth/v1/health returned 200 the whole time Darrell was
          # locked out, while nothing on the box answered a POST. A cached GET
          # at Cloudflare looks identical to a healthy origin, so the GET is
          # asked TWICE — once plainly, once with a cache-busting query that
          # cannot have been cached before. If the plain GET is 200 and the
          # busted one is not, the green light was the edge talking to itself.
          GET_PLAIN=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://poetech.us/sb/auth/v1/health" 2>/dev/null || echo "000")
          GET_FRESH=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -H 'Cache-Control: no-cache' "https://poetech.us/sb/auth/v1/health?cachebust=${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}" 2>/dev/null || echo "000")
          echo "- \`GET /sb/auth/v1/health\` plain **$GET_PLAIN** / cache-busted **$GET_FRESH**" >> "$GITHUB_STEP_SUMMARY"
          echo "edge GET health: plain $GET_PLAIN, cache-busted $GET_FRESH"
          if [ "$GET_PLAIN" = "200" ] && [ "$GET_FRESH" != "200" ]; then
            echo "::warning::THE GREEN LIGHT WAS CACHED — a plain GET to /sb/auth/v1/health answered 200 but the same GET with a cache-busting query answered $GET_FRESH. Cloudflare has been serving a stored copy; the NAS is not answering this road."
          fi

          # A HEAL THAT DID NOT HEAL SAYS SO (DR-0076).
          if [ -z "$LOOP" ]; then
            echo "::error::STILL DOWN on the box — a POST to the NAS gateway (127.0.0.1:8800/sb/auth/v1/token) returned an empty body after the restart. The sovereign stack itself is not answering POSTs; this is not the Funnel and not Cloudflare. Read the before-step port listing in this same run: it names what is actually listening."
            exit 1
          fi
          # THE NAS ANSWERS AND THE EDGE DOES NOT — name WHICH leg, because the
          # Funnel and the Pages Function are different repairs. The direct
          # Funnel probe above is what separates them.
          if [ -n "${SB_ANON:-}" ] && [ -z "$EDGE" ]; then
            if [ "${F_BYTES:-0}" -gt 0 ] 2>/dev/null; then
              echo "::error::THE PAGES FUNCTION IS THE BREAK — the NAS answered this POST (${#LOOP} bytes) AND the Tailscale Funnel answered it directly (HTTP ${F_CODE}, ${F_BYTES} bytes), but the same POST through poetech.us/sb came back empty (HTTP ${E_CODE:-?}, curl exit ${E_RC:-?}). Both ends of the road are healthy, so the drop is in app/functions/sb/[[path]].js over app/functions/_lib/funnel-proxy.js. Fix that Function and deploy; nothing on the NAS needs touching."
            elif [ "${F_CODE:-000}" = "503" ]; then
              echo "::error::THE FUNNEL IS THROTTLING — the NAS answers this POST on its own gateway (${#LOOP} bytes) but the Tailscale Funnel returns a bodiless 503 to a direct POST, and poetech.us/sb returns HTTP ${E_CODE:-?} with no body. This is the documented Funnel throttle (see app/functions/_lib/funnel-proxy.js), not the stack and not Cloudflare."
            else
              echo "::error::THE ROAD IS THE BREAK — the NAS answers this POST (${#LOOP} bytes) but poetech.us/sb returns HTTP ${E_CODE:-?} with no body, and a direct POST to the Funnel returned HTTP ${F_CODE:-?} with ${F_BYTES:-?} bytes (curl exit ${F_RC:-?}). The stack healed; the carriage between Cloudflare and the NAS is dropping sign-in bodies."
            fi
            exit 1
          fi
          echo "SIGN-IN ROAD CARRIES A POST AGAIN (loopback ${#LOOP} bytes, edge ${#EDGE} bytes)."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Sign-in road carries a POST again.**" >> "$GITHUB_STEP_SUMMARY"
