# lesson-inbox-bell -- the lesson intake rings a bell instead of watching a clock
#
# WHY (2026-09-30, DR-0701). Darrell: "I don't like timers... they cost more
# than we need... don't we have a better solution/s?" The in-app lesson intake
# was a claude.ai Routine that woke an AI session every hour (24 turns a day)
# to ask whether any lesson row was waiting. Most hours none was.
#
# HOW IT RINGS (deterministic, no model):
#   1. A lesson row lands in agent_inbox on the NAS database the app reads
#      (typed in the app, a Whisper transcript, a Governor's approval).
#   2. Migration 0243's trigger rings pg_notify('lesson_inbox', <id>).
#   3. The NAS lesson builder, already LISTENing, sends ONE repository_dispatch
#      `lesson-saved` (no ids, no words) -- lesson_builder.py `Bell`.
#   4. This job reads which rows wait (scripts/lesson-inbox-waiting.sql, the
#      same query inbox-lessons-waiting.yml runs) and comments on the standing
#      bell PR ONLY when that set changed since its own last comment
#      (scripts/lesson-inbox-bell.mjs). The intake session subscribed to that
#      PR wakes on the comment. Nothing waiting = no comment = no AI turn.
#   5. One daily schedule is the safety net for a ring that never arrived.
#
# NEVER A BODY: the query selects the body's length only; the comment carries
# ids, created_by and tags.
#
# BRAKES (DR-0248 deterministic class: budget + lock; plus a kill):
#   budget  one query and at most one comment per run, 5-minute timeout
#   lock    concurrency group `lesson-inbox-bell` (a burst of rings queues one run)
#   kill    repository variable LESSON_BELL = off (every run skips), or delete
#           this file; the NAS side stops with LESSON_BELL=off in
#           /volume1/PoeTech/secrets/lesson-builder.env
#
# workflow_dispatch extras (for proof and diagnosis, never needed day to day):
#   diagnose  also report the live database's extensions, the 0243 trigger,
#             and the NAS lesson builder's state and last bell lines
#   proof     insert | delete one clearly labelled test row (tags lesson,
#             canary, bell-proof, mirrored: the builder skips canary rows and
#             the mirror skips mirrored ones), to prove the database ring end
#             to end; delete removes only rows tagged bell-proof

name: lesson-inbox-bell

on:
  repository_dispatch:
    types: [lesson-saved]
  schedule:
    - cron: '17 14 * * *'   # daily safety net, 09:17 Central (CDT)
  workflow_dispatch:
    inputs:
      diagnose:
        description: 'Also report extensions, the trigger and the NAS bell state'
        type: boolean
        default: false
      proof:
        description: 'none | insert | delete a labelled bell-proof test row'
        type: choice
        options: [none, insert, delete]
        default: none

concurrency:
  group: lesson-inbox-bell
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ring:
    if: ${{ vars.LESSON_BELL != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BELL_PR: ${{ vars.LESSON_BELL_PR || '1879' }}
      NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
      PROOF: ${{ inputs.proof || 'none' }}
      DIAGNOSE: ${{ inputs.diagnose || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Join the tailnet (to reach the live database)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: What rang
        run: |
          echo "event: ${{ github.event_name }} ${{ github.event.action }}"
          echo "source: ${{ github.event.client_payload.source || 'n/a' }}"
      - name: Proof row (insert or delete; dispatch only)
        if: ${{ env.PROOF == 'insert' || env.PROOF == 'delete' }}
        run: |
          set -uo pipefail
          if [ "$PROOF" = "insert" ]; then
            SQL="INSERT INTO public.agent_inbox (instance_id, body, tags, source, created_by)
                 SELECT instance_id, 'BELL PROOF (DR-0701): a test row that proves the lesson bell rings. Not a lesson. Deleted by lesson-inbox-bell.yml proof=delete.',
                        '[\"lesson\",\"canary\",\"bell-proof\",\"mirrored\"]'::jsonb, 'bell-proof', created_by
                 FROM public.agent_inbox WHERE created_by = 'f13843f2-742b-4f8a-82af-7ecfbdc536ec' AND instance_id IS NOT NULL
                 ORDER BY created_at DESC LIMIT 1 RETURNING id, created_at;"
          else
            SQL="DELETE FROM public.agent_inbox WHERE tags ? 'bell-proof' AND source = 'bell-proof' RETURNING id;"
          fi
          printf '%s' "$SQL" | bash scripts/live-sql.sh '|' || { echo "::error::proof $PROOF failed"; exit 1; }
      - name: Which lesson rows wait (never a body)
        run: |
          set -uo pipefail
          bash scripts/live-sql.sh '|' < scripts/lesson-inbox-waiting.sql > rows.txt || { echo "::error::could not read the live database"; exit 1; }
          echo "waiting rows: $(grep -c . rows.txt || true)"
          cut -d'|' -f1,3,5 rows.txt
      - name: The bell's own last comments
        run: |
          set -uo pipefail
          gh api --paginate "repos/$REPO/issues/$BELL_PR/comments?per_page=100" \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | .body]' | jq -s 'add // []' > comments.json
          echo "bell comments so far: $(jq length comments.json)"
      - name: Ring only on change
        run: |
          set -euo pipefail
          D=$(node scripts/lesson-inbox-bell.mjs --rows rows.txt --comments comments.json --out body.md)
          echo "$D"
          if [ "$(echo "$D" | jq -r .post)" = "true" ]; then
            gh api "repos/$REPO/issues/$BELL_PR/comments" -F body=@body.md --jq '.html_url'
          fi
          { echo "### Lesson inbox bell"; echo '```'; echo "$D"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnose (extensions, the trigger, the NAS bell)
        if: ${{ env.DIAGNOSE == 'true' }}
        run: |
          set -uo pipefail
          echo "== extensions on the live database =="
          printf '%s' "SELECT extname, extversion FROM pg_extension ORDER BY 1;" | bash scripts/live-sql.sh '|' || true
          echo "== the 0243 ring =="
          printf '%s' "SELECT tgname, tgenabled FROM pg_trigger WHERE tgname = 'agent_inbox_lesson_notify';" | bash scripts/live-sql.sh '|' || true
          echo "== the NAS lesson builder =="
          K=$(mktemp); printf '%s\n' "$NAS_SSH_KEY" > "$K"; chmod 600 "$K"
          ssh -i "$K" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes -o LogLevel=ERROR dpoe@poetech.tail5a2f35.ts.net \
            'systemctl is-active poetech-lesson-builder; cat /volume1/PoeTech/lesson-builder/.code.sha 2>/dev/null; echo; grep -o "\"state\": *\"[^\"]*\"" /volume1/PoeTech/lesson-builder/status.json 2>/dev/null; cat /volume1/PoeTech/lesson-builder/bell.json 2>/dev/null' || true
          rm -f "$K"
