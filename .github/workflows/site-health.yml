# Site health — proves poetech.us is UP and FRESH, from outside the building.
#
# WHY THIS EXISTS (2026-07-08, DR-0107 lineage). Every existing safeguard in the
# lane watches the PIPELINE: CI proves the build, deploy-freshness proves a
# deploy was DISPATCHED for main's tip, the auto-merge heal step dispatches it.
# None of them ever makes an HTTP request to the site the family actually opens.
# On 2026-07-08 Darrell reported the app down AGAIN while every deploy run in
# the ledger was green — the exact blind spot: deploy-success is not site-up.
# This workflow is the missing instrument: an outside-in probe of the served
# product (DR-0076 rule 7, independent verification; LESSONS P5/P22/P26).
#
# WHAT IT MEASURES (all against the LIVE domain, browser-shaped requests):
#   1. UP        — the root redirect (302 -> /poetech-app/) and the app shell
#                  (200, real HTML with the #root mount) both answer.
#   2. INTACT    — the hashed JS bundle index.html points at actually exists
#                  (catches the stale-shell / missing-chunk white-screen class,
#                  2026-06-30 signature).
#   3. FRESH     — the build SHA embedded in the served sw.js matches main's
#                  tip (catches the silent-stale class, 2026-07-06 incident).
#   4. ISOLATED  — the same checks against poetech-app.pages.dev, so a failure
#                  localizes to the custom domain layer vs the Pages project.
#   5. USABLE    — the BACKEND answers on the path the app uses (DR-0303).
#                  Added 2026-08-14 after every account across all four apps was
#                  locked out for ~20 hours by a Supabase 402
#                  `exceed_egress_quota` while checks 1-4 stayed green: the HTML
#                  served perfectly the entire time. Site-up is not app-usable.
#
# WHAT IT DOES WITH A FAILURE:
#   - DOWN/BROKEN: opens (or comments on) the single rolling "site-health
#     incident" issue, labeled `incident`, with the measured evidence — the
#     durable, queryable downtime record ("how many times today?" has an
#     answer). Recovery posts the close.
#   - STALE: dispatches deploy-cloudflare-pages.yml (same one-shot heal as
#     deploy-freshness; the deploy's own concurrency group makes stacking
#     impossible).
#
# THE THREE BRAKES (CLAUDE.md — timer-driven automation):
#   1. BUDGET — a handful of HTTP GETs + at most one deploy dispatch + at most
#      one issue write per fire; hard step timeout; no compute is spawned.
#   2. LOCK   — concurrency group `site-health`, single-instance; the healed
#      deploy is single-flight in its own `cf-pages-deploy` group.
#   3. KILL   — set repo variable SITE_HEALTH_ENABLED='false' (or disable in
#      the Actions UI) to pause instantly. Unset => runs (DR-0110 class: a
#      bounded, idempotent, non-spawning prober is the deploy-freshness class,
#      which ships active).

name: Site health (up + fresh, outside-in)

on:
  schedule:
    # REQUESTED every 10 min. MEASURED cadence is ~67 min (range 38–154 across
    # 28 scheduled runs, 2026-08-14): GitHub throttles scheduled workflows, so
    # this cron is a request, not a guarantee. The comment used to read "every
    # 10 min" flatly, and DR-0303 then cited that comment as if it were a
    # measurement — claiming this witness cuts a blind window to ~10 minutes
    # when the honest figure is about an hour, worst case ~2.5 hours.
    #
    # Left at */10 deliberately: asking for more than we get costs nothing and
    # takes whatever slots are free. What must not happen again is READING THIS
    # LINE AS THE CADENCE. If a class needs a real sub-10-minute guarantee, it
    # needs a different runner (a sovereign NAS loop or an external monitor) —
    # tracked in DR-0303, re-review 2026-08-21.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: site-health
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # dispatch the deploy heal
  issues: write  # the rolling incident record

jobs:
  probe:
    if: ${{ vars.SITE_HEALTH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      UA: 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36'
      # The backend probe (step 7) walks the same path the app walks. The anon
      # key is the public client key already shipped in the bundle.
      SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SB_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Probe the live site
        id: probe
        run: |
          set -uo pipefail
          fail_reasons=""
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          add_fail() { fail_reasons="${fail_reasons}${fail_reasons:+; }$1"; }

          fetch() { # fetch <url> -> sets CODE, BODY_FILE, LOC
            local url="$1"; BODY_FILE=$(mktemp)
            local out
            out=$(curl -sS -A "$UA" -o "$BODY_FILE" -w '%{http_code} %{redirect_url}' --max-time 20 "$url" 2>&1) || true
            CODE="${out%% *}"; LOC="${out#* }"
          }

          note "## Site health probe — $(date -u +%FT%TZ)"

          # 1. UP: root answers and routes into the manifest scope.
          fetch "https://poetech.us/"
          note "- \`GET /\` -> **$CODE** (redirect: ${LOC:-none})"
          case "$CODE" in
            301|302|307|308)
              case "$LOC" in *"/poetech-app/"*) : ;; *) add_fail "root redirects to '$LOC', not /poetech-app/";; esac ;;
            200) : ;; # a future distinct root landing page is legal
            *) add_fail "root returned HTTP $CODE" ;;
          esac

          # 2. UP: the app shell is real HTML with the mount point.
          fetch "https://poetech.us/poetech-app/"
          note "- \`GET /poetech-app/\` -> **$CODE**"
          if [ "$CODE" != "200" ]; then
            add_fail "app shell returned HTTP $CODE"
          elif ! grep -q 'id="root"' "$BODY_FILE"; then
            add_fail "app shell 200 but no #root mount (body starts: $(head -c 120 "$BODY_FILE" | tr -d '\n'))"
          fi
          SHELL_BODY="$BODY_FILE"

          # 3. INTACT: the hashed bundle the shell points at exists.
          asset=$(grep -o '/poetech-app/assets/[^"]*\.js' "$SHELL_BODY" | head -1 || true)
          if [ -n "$asset" ]; then
            fetch "https://poetech.us$asset"
            note "- \`GET $asset\` -> **$CODE**"
            [ "$CODE" = "200" ] || add_fail "shell's own bundle $asset returned HTTP $CODE (stale-shell/missing-chunk class)"
          fi

          # 4. FRESH: served sw.js carries main's tip. The build stamps
          # `const SW_VERSION = "abc1234";` (JSON.stringify => DOUBLE quotes —
          # vite.config.js sw-version-stamp; the first probe run missed this
          # with a single-quote pattern and read "unknown").
          main_sha=$(gh api "repos/$REPO/commits/main" --jq '.sha' 2>/dev/null | cut -c1-7 || echo "")
          fetch "https://poetech.us/poetech-app/sw.js"
          served_sha=$(grep -oE 'SW_VERSION = "[0-9a-f]{7}"' "$BODY_FILE" | grep -oE '[0-9a-f]{7}' | head -1 || true)
          stale="false"
          if [ -n "$main_sha" ] && [ -n "$served_sha" ]; then
            [ "$served_sha" != "$main_sha" ] && stale="true"
            note "- served build: **$served_sha** · main tip: **$main_sha**"
          else
            # UNKNOWN never reads as fresh. Fall back to the deploy ledger:
            # the last successful deploy's head_sha vs main's tip.
            deployed_sha=$(gh api \
              "repos/$REPO/actions/workflows/deploy-cloudflare-pages.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null | cut -c1-7 || echo "")
            [ -n "$main_sha" ] && [ -n "$deployed_sha" ] && [ "$deployed_sha" != "$main_sha" ] && stale="true"
            note "- served build: **unverified** (sw.js extraction missed) · last deployed: **${deployed_sha:-unknown}** · main tip: **${main_sha:-unknown}**"
          fi

          # 5. ISOLATE: same shell check on the Pages project domain.
          fetch "https://poetech-app.pages.dev/poetech-app/"
          note "- \`GET pages.dev/poetech-app/\` -> **$CODE** (isolates domain layer vs project)"
          PAGES_CODE="$CODE"

          # 6. PHOTO PATH (DR-0268): the sovereign photo server, outside-in —
          # the runner is the only eye that can see this hop (the sandbox has
          # no route). healthz is unauthenticated liveness; /property-history
          # answering 401 PROVES the history bridge is alive (auth-gated is
          # alive; only connect-fail/5xx is down). v1 scope: a red photo path
          # is a loud warning + its own output, NOT the site-incident ledger
          # (the NAS is a family box that can be legitimately off; escalation
          # to the ledger is re-review 2026-08-17, REV-0228).
          fetch "https://poetech.us/nas-photos/healthz"
          PHOTO_CODE="$CODE"
          note "- \`GET /nas-photos/healthz\` -> **$CODE** (sovereign photo server, via Funnel)"
          [ "$PHOTO_CODE" = "200" ] || echo "::warning::photo path DOWN — /nas-photos/healthz returned HTTP $PHOTO_CODE (photo_server.py / Funnel / Pages Function hop)"
          fetch "https://poetech.us/property-history?channel=healthprobe"
          HIST_CODE="$CODE"
          note "- \`GET /property-history\` -> **$CODE** (401 = alive+gated; 000/5xx = down)"
          case "$HIST_CODE" in 200|400|401|403|404) : ;; *) echo "::warning::history bridge DOWN — /property-history returned HTTP $HIST_CODE" ;; esac

          # 7. USABLE (DR-0303): the BACKEND answers, not just the HTML.
          #
          # 2026-08-14: every account across all four apps was signed out and
          # could not sign back in for ~20 hours, and NOTHING here moved —
          # because Cloudflare kept serving the shell perfectly while Supabase
          # answered HTTP 402 `exceed_egress_quota` on /auth/v1/token,
          # /auth/v1/signup and every /rest/v1 path. Checks 1-5 above all
          # measure HTML. A locked front door BEHIND the HTML is invisible to
          # every one of them.
          #
          # This is P31 one layer down: deploy-green is not site-up (why this
          # file exists), and site-up is not APP-USABLE (why this step exists).
          #
          # It uses the anon key so it walks the exact path the app walks — a
          # keyless probe would only prove the host resolves. The key is the
          # public client key already shipped in the bundle; it grants nothing
          # RLS does not already allow an anonymous visitor.
          #
          # A quota/billing restriction locks EVERY user out of EVERY app, so
          # unlike the photo path (a family NAS that can legitimately be off)
          # this goes on the incident ledger, not a warning.
          BACKEND_CODE="unknown"
          if [ -n "${SB_URL:-}" ] && [ -n "${SB_ANON:-}" ]; then
            sb_fetch() {
              BODY_FILE=$(mktemp)
              # NO `|| echo 000` here. curl ALREADY prints 000 on a connection
              # failure, so the fallback concatenated into "000000" — which
              # missed both the retry test and the `000` case arm below. Caught
              # by running this step against a dead port before shipping it.
              # TWO `bash -e` TRAPS LIVE IN THESE THREE LINES. This step runs
              # under GitHub's default `bash -e`, and both were proven by
              # running the block against a dead port, not by reading it:
              #
              #   1. `CODE=$(curl ...)` takes CURL'S exit status, and curl
              #      returns 7 when it cannot connect — so the assignment fails
              #      and `-e` kills the step. The original `|| echo "000"`
              #      existed to prevent exactly this; removing it to fix the
              #      "000000" concatenation reintroduced the abort. `|| CODE=""`
              #      keeps the list at exit 0 AND leaves one clean value.
              #   2. A trailing `[ -z "$CODE" ] && CODE="000"` makes the
              #      FUNCTION return 1 whenever the test is false, and the
              #      caller `sb_fetch "$url"` is a plain command, so `-e` kills
              #      the step there instead. An `if` with a false condition
              #      exits 0.
              #
              # Trap 2 was live on run 31807695303: the probe measured the real
              # 402 and died before printing it, which also skipped the incident
              # step — the witness saw the outage and could not file it.
              CODE=$(curl -sS -o "$BODY_FILE" -w '%{http_code}' --max-time 20 \
                -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" \
                "$1" 2>/dev/null) || CODE=""
              if [ -z "$CODE" ]; then CODE="000"; fi
            }
            sb_fetch "${SB_URL%/}/auth/v1/health"
            # One retry, so a single dropped connection is not an outage.
            if [ "$CODE" = "000" ]; then sleep 5; sb_fetch "${SB_URL%/}/auth/v1/health"; fi
            BACKEND_CODE="$CODE"
            # The sovereign /sb transport gets its own witness line (DR-0310):
            # measured keyless (the health route answers without an apikey), so
            # this watches the cutover backend regardless of which one the
            # secrets still name. Observe-only for now — the incident arm
            # follows once /sb is the app's live backend.
            SB_SOV=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://poetech.us/sb/auth/v1/health" 2>/dev/null) || SB_SOV="000"
            note "- \`GET poetech.us/sb/auth/v1/health\` (sovereign transport) -> **${SB_SOV:-000}**"
            violation=$(grep -oE 'exceed_[a-z_]+|restricted due to[^"]*' "$BODY_FILE" 2>/dev/null | head -1 || true)
            note "- \`GET auth/v1/health\` (anon) -> **$CODE**${violation:+ — \`$violation\`}"
            case "$CODE" in
              200|401) : ;; # answering; 401 means alive and gated
              402) add_fail "BACKEND RESTRICTED — auth returned HTTP 402${violation:+ ($violation)}: every user is locked out of every app until the plan/spend cap is resolved" ;;
              000) add_fail "backend unreachable — auth/v1/health did not answer (two attempts)" ;;
              *)   add_fail "backend auth returned HTTP $CODE${violation:+ ($violation)}" ;;
            esac
          else
            # UNKNOWN NEVER READS AS HEALTHY (DR-0076). Missing secrets means
            # this dimension was not measured — say so loudly rather than let
            # a green run imply the backend was checked.
            note "- backend probe: **NOT MEASURED** (VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY unset)"
            echo "::warning::backend probe skipped — secrets unset, so this run does NOT prove the backend is usable"
          fi

          # 8. THE BLOBS HAVE AN EYE NOW (DR-0317). Every dimension above
          # watches the shell, the bundle, or auth — so when the 2026-08-19
          # repoint moved the rows and left 455 storage objects behind, the
          # gallery was broken on the front screen for twelve days and every
          # probe stayed green. Storage was the one thing nothing looked at.
          # This walks the app's real read: ask the public RPC for a live
          # image_path (never a hardcoded name that rots), then fetch that
          # object at BOTH origins — the hosted one the bridge points at today,
          # and the sovereign one it returns to once storage_sync.py reports GO.
          # OBSERVE-ONLY, like the /sb transport line above: it reports, it does
          # not add_fail. A witness that cries wolf gets deleted; the incident
          # arm follows once the blob copy has landed and both codes are known
          # good. Unknown never reads as healthy (DR-0076) — an unmeasured
          # dimension says so.
          if [ -n "${SB_URL:-}" ] && [ -n "${SB_ANON:-}" ]; then
            piece=$(curl -sS --max-time 20 -X POST \
              -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" \
              -H 'Content-Type: application/json' \
              -d '{"p_instance_slug":"moore-divahs"}' \
              "${SB_URL%/}/rest/v1/rpc/moore_showcase" 2>/dev/null \
              | grep -o '"image_path":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            if [ -n "$piece" ]; then
              G_HOSTED=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                "${SB_URL%/}/storage/v1/object/public/moore-showcase/$piece" 2>/dev/null) || G_HOSTED="000"
              G_SOV=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                "https://poetech.us/sb/storage/v1/object/public/moore-showcase/$piece" 2>/dev/null) || G_SOV="000"
              note "- \`GET storage/.../moore-showcase/$piece\` -> hosted **${G_HOSTED:-000}** | sovereign **${G_SOV:-000}** (observe-only; sovereign turns 200 when the blob copy lands)"
              if [ "$G_HOSTED" != "200" ] && [ "$G_SOV" != "200" ]; then
                echo "::warning::gallery image resolves at NEITHER origin — the blob gap has reopened (DR-0317)"
              fi
            else
              note "- gallery blob probe: **NOT MEASURED** (the showcase RPC returned no image_path)"
            fi
          else
            note "- gallery blob probe: **NOT MEASURED** (backend secrets unset)"
          fi

          echo "backend_code=$BACKEND_CODE" >> "$GITHUB_OUTPUT"
          echo "fail_reasons=$fail_reasons" >> "$GITHUB_OUTPUT"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          echo "pages_code=$PAGES_CODE" >> "$GITHUB_OUTPUT"
          echo "photo_code=$PHOTO_CODE" >> "$GITHUB_OUTPUT"
          echo "history_code=$HIST_CODE" >> "$GITHUB_OUTPUT"
          echo "served_sha=${served_sha:-unknown}" >> "$GITHUB_OUTPUT"
          echo "main_sha=${main_sha:-unknown}" >> "$GITHUB_OUTPUT"
          if [ -n "$fail_reasons" ]; then
            note ""
            note "**DOWN/BROKEN:** $fail_reasons"
          else
            note ""
            note "**UP.**${stale:+ }$([ "$stale" = "true" ] && echo "**But STALE** — dispatching the deploy heal." || echo " Fresh.")"
          fi

      - name: Heal a stale build (one-shot deploy dispatch)
        if: ${{ steps.probe.outcome == 'success' && steps.probe.outputs.stale == 'true' && steps.probe.outputs.fail_reasons == '' }}
        run: gh workflow run deploy-cloudflare-pages.yml --repo "$REPO" --ref main || echo "::warning::could not dispatch deploy"

      # always(): A CRASH IN THE PROBE MUST NEVER SILENCE THE LEDGER.
      #
      # Without this, any non-zero exit in the probe step skips every step
      # after it — so the one job this workflow exists to do (record the
      # outage) is the first thing lost when something goes wrong. That is
      # exactly what happened on run 31807695303: a bug in the backend probe
      # aborted the step, and the incident was never filed even though the
      # backend was measurably down.
      #
      # The condition now fires on a real failure OR on a probe that died
      # before it could report one — an unexplained crash is itself a failing
      # observation, not a silent pass (DR-0076: unknown never reads healthy).
      - name: Record the incident (rolling issue, labeled `incident`)
        if: ${{ always() && (steps.probe.outputs.fail_reasons != '' || steps.probe.outcome == 'failure') }}
        env:
          REASONS: ${{ steps.probe.outputs.fail_reasons }}
          PAGES_CODE: ${{ steps.probe.outputs.pages_code }}
          SERVED: ${{ steps.probe.outputs.served_sha }}
          MAIN: ${{ steps.probe.outputs.main_sha }}
          BACKEND_CODE: ${{ steps.probe.outputs.backend_code }}
          N8N_BEARER: ${{ secrets.VITE_N8N_BEARER }}
        run: |
          set -uo pipefail
          title="site-health: poetech.us failing the outside-in probe"
          body="$(date -u +%FT%TZ) — **DOWN/BROKEN**: ${REASONS:-probe step crashed before reporting — see the run log}. pages.dev shell: HTTP ${PAGES_CODE}. backend auth: HTTP ${BACKEND_CODE}. served=${SERVED} main=${MAIN}. Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          open_issue=$(gh issue list --repo "$REPO" --label incident --state open --search "in:title site-health" --json number --jq '.[0].number // ""')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$REPO" --body "$body"
          else
            gh label create incident --repo "$REPO" --color B60205 --description "Live-site downtime record (site-health probe)" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$title" --label incident --body "$body"
          fi
          # Announce, not only record (DR-0156): push the incident to the
          # family's phones via the NAS relay (Funnel -> n8n -> ntfy). Fail-soft
          # by design — the ledger above is the record; this is the bell.
          if [ -n "${N8N_BEARER:-}" ]; then
            payload=$(printf '{"title":"poetech.us is failing the probe","message":%s,"url":"%s","priority":"5"}' \
              "$(printf '%s' "$REASONS" | head -c 800 | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
              "${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}")
            curl -sS -X POST "https://poetech.tail5a2f35.ts.net/webhook/ops-announce" \
              -H "Authorization: Bearer ${N8N_BEARER}" -H "content-type: application/json" \
              --max-time 15 -d "$payload" \
              || echo "::warning::announce relay unreachable — incident recorded on the ledger, phone push skipped"
          else
            echo "::warning::VITE_N8N_BEARER not set — announce skipped"
          fi
          exit 1 # a failing probe is a failing run — visible in the Actions list

      # Only close on a probe that actually RAN and found nothing wrong. A
      # crashed probe proves nothing and must never close an open incident.
      - name: Close a recovered incident
        if: ${{ always() && steps.probe.outcome == 'success' && steps.probe.outputs.fail_reasons == '' }}
        run: |
          set -uo pipefail
          open_issue=$(gh issue list --repo "$REPO" --label incident --state open --search "in:title site-health" --json number --jq '.[0].number // ""')
          if [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --repo "$REPO" \
              --comment "$(date -u +%FT%TZ) — RECOVERED: probe green (served build ${{ steps.probe.outputs.served_sha }})."
          fi
