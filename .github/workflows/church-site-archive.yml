# church-site-archive — the WITNESS and the walls for what the church office
# posts (DR-1596, DR-1644). The keeping and the reading moved INTO the NAS
# (DR-1649, the DR-1360 road: the house initiates): infra/nas-church-archive/
# install.sh rides the services-sync clock and collects, keeps, reads and files.
# This runner no longer reaches into the NAS (its tailnet key is retired).
# witness (dispatch): reads the public site with the app's own parser and prints
#   what the office has posted, so "is it on the site?" is answered from outside.
# walls (pull request): 0342 + 0343 apply twice on a bare PostgreSQL, smokes pass.
name: Church site archive (witness + walls)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'site = the pages as they are now; wayback = recover past months from Internet Archive snapshots'
        type: choice
        options: [site, wayback]
        default: site
  pull_request:
    paths:
      - 'infra/supabase/migrations-auto/0342-what-the-church-office-posts-is-kept.sql'
      - 'infra/supabase/tests/0342-church-site-archive-smoke.sql'
      - 'infra/supabase/migrations-auto/0343-every-event-lives-on-its-day.sql'
      - 'infra/supabase/tests/0343-every-event-lives-on-its-day-smoke.sql'
      - 'scripts/church-calendar-read*'
      - 'app/src/lib/church-calendar-read.js'
      - 'scripts/church-archive-ci-bootstrap.sql'
      - 'infra/nas-church-archive/**'
      - '.github/workflows/church-site-archive.yml'

permissions:
  contents: read

concurrency:
  group: church-site-archive-${{ github.event_name == 'pull_request' && github.ref || 'keep' }}
  cancel-in-progress: false

jobs:
  walls:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - run: bash "$GITHUB_WORKSPACE/scripts/ci-psql.sh"
      - name: 0342 applies twice and every wall holds; the keeper's selftest passes
        run: |
          set -euo pipefail
          P() { psql -v ON_ERROR_STOP=1 -q --single-transaction "$@"; }
          P -f scripts/door-work-ci-bootstrap.sql
          for f in schema-v1.sql schema-v1.1-tenant-join.sql schema-v2.1-infra.sql; do P -f "infra/supabase/$f"; done
          P -f scripts/church-archive-ci-bootstrap.sql
          P -f infra/supabase/migrations-auto/0099-ministry-ops.sql
          for i in 1 2; do P -f infra/supabase/migrations-auto/0342-what-the-church-office-posts-is-kept.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0342-church-site-archive-smoke.sql | tee "$RUNNER_TEMP/smoke.txt"
          grep -q 'CHURCH SITE ARCHIVE SMOKE: PASS' "$RUNNER_TEMP/smoke.txt"
          python3 infra/nas-church-archive/church_archive_keep.py --selftest
      - name: 0343 applies twice and every wall holds; the reads tool's selftest passes
        run: |
          set -euo pipefail
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0343-every-event-lives-on-its-day.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0342-church-site-archive-smoke.sql | tee "$RUNNER_TEMP/smoke42.txt"
          grep -q 'CHURCH SITE ARCHIVE SMOKE: PASS' "$RUNNER_TEMP/smoke42.txt"
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0343-every-event-lives-on-its-day-smoke.sql | tee "$RUNNER_TEMP/smoke43.txt"
          grep -q 'CALENDAR DAYS SMOKE: PASS' "$RUNNER_TEMP/smoke43.txt"
          python3 infra/nas-church-archive/church_calendar_reads.py --selftest

  witness:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'site' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: What the church website holds (the app's own parser; nothing is sent anywhere)
        run: node scripts/church-site-archive-collect.mjs --out "$RUNNER_TEMP/archive" --mode "$MODE" | tee -a "$GITHUB_STEP_SUMMARY"
