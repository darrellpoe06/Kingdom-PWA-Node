# church-site-probe — what the church's public website publishes, read from a
# GitHub runner (the cloud sandbox has no route to it) and printed to the log,
# so the announcements-and-events sync (Darrell 2026-11-18, DR-1540) is built
# on what the site actually publishes. Read-only; nothing is written.
name: Church site probe (read-only)
on:
  workflow_dispatch:
    inputs:
      site:
        description: The site to read
        default: https://www.thechurchofthelivinggod.com
        required: true
permissions: {}
concurrency:
  group: church-site-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the home page, its links, headings and any feed or API it offers
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          set -u
          ua="Mozilla/5.0 (compatible; PoeTechProbe/1.0; +https://poetech.us)"
          get() { curl -sS -L --max-time 30 -A "$ua" -o "$2" -w "%{http_code} %{content_type} %{size_download}B %{url_effective}\n" "$1" || echo "curl failed: $1"; }
          echo "== HOME =="; get "$SITE/" home.html
          echo "-- headings --"; grep -oiE '<h[1-3][^>]*>[^<]{1,120}' home.html | sed -E 's/<[^>]+>//' | head -40
          echo "-- feeds / APIs declared in <head> --"; grep -oiE '<link[^>]+(rss|atom|json|api)[^>]*>' home.html | head -10
          echo "-- generator --"; grep -oiE '<meta name="generator"[^>]*>' home.html | head -2
          echo "-- internal links (unique, first 80) --"; grep -oiE 'href="(https?://(www\.)?thechurchofthelivinggod\.com)?/[^"#?]*' home.html | sed -E 's/^href="//' | sort -u | head -80
          echo "-- words that name announcements or events --"; grep -oiE '[^<>]{0,60}(announcement|upcoming|event|calendar|bulletin|news|service times|schedule)[^<>]{0,60}' home.html | head -30
          echo "== CANDIDATE PAGES =="
          for p in /events /events.html /calendar /calendar.html /announcements /announcements.html /news /news.html /bulletin /blog /feed /rss.xml /feed.xml /sitemap.xml /wp-json/wp/v2/posts?per_page=3 /wp-json/tribe/events/v1/events?per_page=3 /_api/ /api/; do
            printf "%s -> " "$p"; get "$SITE$p" page.out; head -c 300 page.out | tr '\n' ' ' | sed -E 's/<[^>]+>/ /g' | tr -s ' ' | cut -c1-300; echo
          done
          echo "== EVENT-LIKE TEXT ON THE HOME PAGE (dates near words) =="
          sed -E 's/<[^>]+>/\n/g' home.html | grep -iE '(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]* [0-9]{1,2}|[0-9]{1,2}/[0-9]{1,2}/20[0-9]{2}|[0-9]{1,2}:[0-9]{2} ?(am|pm)' | sed -E 's/^\s+//' | grep -v '^$' | head -40
          echo "== ROBOTS =="; get "$SITE/robots.txt" robots.txt; head -20 robots.txt
      - name: Read the calendar, current-events and letters pages as text (tags stripped), with images, embeds and links
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          set -u
          ua="Mozilla/5.0 (compatible; PoeTechProbe/1.0; +https://poetech.us)"
          for p in /calendar.html /current-events.html /previous-events.html /letters-from-bg.html /stay-connected.html /broadcast.html; do
            echo "== PAGE $p =="
            curl -sS -L --max-time 30 -A "$ua" -o page.html -w "%{http_code} %{size_download}B\n" "$SITE$p" || { echo "curl failed: $p"; continue; }
            echo "-- title --"; grep -oiE '<title>[^<]*' page.html | sed -E 's/<title>//' | head -1
            echo "-- iframes / embeds --"; grep -oiE '<iframe[^>]+src="[^"]+"' page.html | sed -E 's/.*src="//; s/"$//' | head -10
            echo "-- images (src | alt) --"; grep -oiE '<img[^>]+>' page.html | grep -viE 'editmysite|/icons/|logo' | sed -E 's/.*src="([^"]+)".*alt="([^"]*)".*/\1 | \2/; s/.*src="([^"]+)".*/\1/' | head -40
            echo "-- outbound links --"; grep -oiE 'href="https?://[^"]+"' page.html | grep -viE 'editmysite|weebly|facebook.com/sharer|twitter.com/share|fonts\.' | sort -u | head -30
            echo "-- text (tags, scripts and styles stripped) --"
            perl -0pe 's/<script.*?<\/script>//gis; s/<style.*?<\/style>//gis; s/<(br|\/p|\/div|\/h[1-6]|\/li|\/tr|\/td)[^>]*>/\n/gi; s/<[^>]+>//g; s/&nbsp;/ /g; s/&amp;/&/g; s/&#8203;//g' page.html | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | grep -v '^$' | head -250
          done
      - name: Print the raw markup around the calendar image, the current-events heading, the letter and the home service times (parser fixtures)
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          set -u
          ua="Mozilla/5.0 (compatible; PoeTechProbe/1.0; +https://poetech.us)"
          show() { echo "== MARKUP $1 around /$2/ =="; curl -sS -L --max-time 30 -A "$ua" -o m.html "$SITE$1" || { echo "curl failed"; return; }; perl -0pe 's/<script.*?<\/script>//gis; s/<style.*?<\/style>//gis' m.html | tr -d '\r' | grep -n -i -B"$3" -A"$4" "$2" | cut -c1-400 | head -"$5"; }
          show /calendar.html 'calendar_orig' 30 12 90
          show /current-events.html 'Current Events' 6 40 80
          show /letters-from-bg.html 'letter_orig' 20 8 60
          show / 'WORSHIP EXPERIENCE' 20 20 60
          echo "== CONTENT WRAPPER CLASSES on /calendar.html =="; perl -0pe 's/<script.*?<\/script>//gis' m.html >/dev/null; curl -sS -L --max-time 30 -A "$ua" "$SITE/calendar.html" | grep -oE '<div[^>]+(id|class)="[^"]*(wsite|content|container|section|wrapper|main)[^"]*"' | sort | uniq -c | sort -rn | head -30
