# inbox-lessons-waiting — which lesson rows wait, read from the database the app reads
#
# WHY (2026-09-30). The hourly in-app lesson intake read the waiting rows
# through a chat connector to the hosted Supabase project. When that connector
# dropped, the intake went blind. The app reads the NAS's own database
# (scripts/live-sql.sh, REPOINT-ARMED), so the list of waiting rows comes from
# there, through the same road inbox-lesson-tag.yml writes by.
#
# WHAT IT READS (read-only; no write anywhere): every agent_inbox row tagged
# lesson that is not yet lesson-captured, lesson-building or awaiting-review:
# its id, created_at, created_by, source, tags and body LENGTH. Never a body:
# a lesson holds a person's words, and this output is visible to the repo
# (the rule voice-intake-health.yml keeps).
#
# THE BUILDER'S PROGRESS (DR-0725). Darrell 2026-10-01, of a lesson showing
# "building": "how long?" The second step prints the NAS lesson builder's
# service status, its systemd state and status.json, and for every lesson row
# in flight: its stage tags, start time, elapsed time, attempt number, the
# writer(s), each writer's gate result, and the PR once shipped
# (scripts/lesson-builder-status.sh + scripts/lesson-inbox-bell.mjs --status).
# Read-only; never a body or a prompt.
#
# BRAKES (deterministic class, DR-0248: budget + lock): dispatch only, a few
# read-only queries per run, 5 minutes; concurrency group `inbox-lessons-waiting`.

name: inbox-lessons-waiting

on:
  workflow_dispatch: {}

concurrency:
  group: inbox-lessons-waiting
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Join the tailnet (to reach the live database)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: List the waiting lesson rows (never a body)
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -uo pipefail
          # One definition of "waiting", shared with the bell (DR-0725).
          out=$(bash scripts/live-sql.sh '|' < scripts/lesson-inbox-waiting.sql) || { echo "::error::could not read the live database"; exit 1; }
          n=$(printf '%s' "$out" | grep -c . || true)
          echo "waiting lesson rows: $n"
          printf '%s\n' "$out"
          { echo "### Waiting lesson rows: $n"; echo '```'; printf '%s\n' "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The NAS lesson builder's progress (never a body)
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          bash scripts/lesson-builder-status.sh status --nas || exit 1
          node scripts/lesson-inbox-bell.mjs --status --rows status/rows.txt --versions status/versions.txt \
            --prs status/prs.json --service status/service.json --recent status/recent.txt | tee status/print.txt
          { echo "### The NAS lesson builder"; echo '```'; cat status/print.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
