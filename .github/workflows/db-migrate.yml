# db-migrate — the migration lane (2026-06-12)
#
# "You fix it first, why me?" — Darrell, on being handed SQL to paste.
# Right. This workflow makes database changes ride the same lane as code:
# any .sql file under infra/supabase/migrations-auto/ is applied to the
# cloud database automatically when it lands on main (and on manual
# dispatch). Files MUST be idempotent (the house rule already: IF NOT
# EXISTS / CREATE OR REPLACE / guarded DO blocks) because every run
# applies all of them in filename order.
#
# One-time human setup (the only Studio-adjacent step left, ever):
#   1. Supabase Dashboard -> project -> Connect -> "Session pooler"
#      connection string (postgresql://postgres.<ref>:<PASSWORD>@...:5432/postgres)
#      with the database password filled in.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret -> Name: SUPABASE_DB_URL -> paste the string.
# After that, merged SQL applies itself; the run log is the receipt.

name: db-migrate

on:
  push:
    branches: [main]
    paths:
      - 'infra/supabase/migrations-auto/**'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations (filename order, all idempotent)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. One-time setup: Supabase Dashboard -> Connect -> Session pooler URI -> GitHub Settings -> Secrets -> Actions -> SUPABASE_DB_URL"
            exit 1
          fi
          # Human-proofing (run #5, 2026-06-12): a pasted secret picked up an
          # invisible line break (the server saw database "postgres\n"). A
          # valid connection URI never contains whitespace, so strip ALL of
          # it before use - paste artifacts can never fail the lane again.
          DBURL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '[:space:]')
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          shopt -s nullglob
          files=(infra/supabase/migrations-auto/*.sql)
          if [ ${#files[@]} -eq 0 ]; then echo "no migrations"; exit 0; fi
          for f in $(printf '%s\n' "${files[@]}" | sort); do
            echo "=== applying $f ==="
            psql "$DBURL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "all migrations applied"
