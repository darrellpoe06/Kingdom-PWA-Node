# db-migrate — the migration lane (2026-06-12; made resilient 2026-07-01)
#
# "You fix it first, why me?" — Darrell, on being handed SQL to paste.
# Right. This workflow makes database changes ride the same lane as code:
# any .sql file under infra/supabase/migrations-auto/ is applied to the
# cloud database automatically when it lands on main (and on manual
# dispatch). Files MUST be idempotent (the house rule: IF NOT EXISTS /
# CREATE OR REPLACE / guarded DO blocks).
#
# RESILIENCE (2026-07-01, DR-0084): the apply logic lives in
# scripts/db-migrate-apply.sh. Each migration applies in its OWN
# --single-transaction; a failing file is recorded and the run CONTINUES
# (one poison file can never wedge the whole lane again); a _schema_migrations
# ledger records every apply as the receipt + the in-app DB Health data source;
# the run still exits non-zero if anything failed, so a real break is visibly
# RED. This is deploy-path only (push to main / manual dispatch) — NOT
# self-arming automation; it respects the Cage.
#
# One-time human setup (the only Studio-adjacent step left, ever):
#   1. Supabase Dashboard -> project -> Connect -> "Session pooler"
#      connection string (postgresql://postgres.<ref>:<PASSWORD>@...:5432/postgres)
#      with the database password filled in.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret -> Name: SUPABASE_DB_URL -> paste the string.
# After that, merged SQL applies itself; the run log + ledger are the receipt.

name: db-migrate

on:
  push:
    branches: [main]
    paths:
      - 'infra/supabase/migrations-auto/**'
      - 'scripts/db-migrate-apply.sh'
      - '.github/workflows/db-migrate.yml'
      # The sovereign replay is HOW a migration reaches the database the app
      # actually reads (DR-0317), so a change to it changes the lane's outcome
      # exactly as a change to db-migrate-apply.sh does — same reasoning, same
      # list. Learned 2026-09-02 (DR-0322): the fix for a replay that applied
      # NOTHING would not have re-run the lane that proves it, because the file
      # it fixed was not a trigger path. A lane whose own repair cannot re-run
      # it needs a human to remember, and remembering is not machinery.
      - 'scripts/sovereign-replay-over-tailnet.sh'
      - 'infra/nas-supabase/replay_migrations.sh'
  workflow_dispatch:

# Single-instance lock. Two db-migrate runs applying DDL to the SAME cloud DB at
# once deadlock on shared catalogs (esp. ALTER PUBLICATION supabase_realtime) —
# observed 2026-07-01 when a manual dispatch overlapped the push trigger and two
# migrations hit "deadlock detected". A queued run waits for the in-flight one to
# finish (cancel-in-progress: false — never abandon a half-run migration pass).
# This is the three-brakes concurrency-lock principle applied to the deploy lane.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # to dispatch the isolation proof below
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Apply migrations (resilient, idempotent, ledger-tracked)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/db-migrate-apply.sh
      # Fire the live isolation proof EXPLICITLY (DR-0241/DR-0242). The
      # viewer-readonly-isolation workflow's `workflow_run: db-migrate` trigger
      # NEVER fires in this lane: these runs are dispatched with GITHUB_TOKEN,
      # and GitHub suppresses events from token-driven runs (anti-recursion) —
      # the exact class DR-0107 documented for the deploy. Observed twice
      # (2026-07-29, after #1097 and #1098) before this explicit dispatch.
      # An explicit workflow_dispatch API call is NOT suppressed (the deploy
      # rides the same pattern). Same-lane, deploy-path only — not self-arming.
      #
      # ALL SIX isolation proofs are dispatched via the ONE rls-isolation
      # matrix workflow (2026-07-30 comprehensive review): the five siblings of
      # viewer-readonly carried the same never-firing workflow_run trigger and
      # had been silently inert since the lane took over — five shipped
      # features' DR-0076 enablement gates producing no observations. The
      # 2026-07-29 fix that was applied to one file is here generalized to the
      # class (gate-the-class, DR-0239): one dispatch, every proof runs, serial
      # against the prod DB (the 2026-07-01 ALTER PUBLICATION deadlock class).
      # The ledger is a receipt, not an observation (2026-08-27, DR-0076 §1).
      # Twice now the ledger read 'applied' while the LIVE function was an older
      # definition — reverted after the fact by an isolation leg replaying an
      # older chain. db-migrate can never heal that on its own: it skips any file
      # whose checksum already reads 'applied', so the lie is self-sealing and
      # the feature stays quietly dead. Nothing in the pipeline ever asked the
      # database what it actually holds. This step asks.
      #
      # The expectations are DERIVED from the migration files (the tokens unique
      # to the newest definition of each function), so there is no list to keep
      # up to date. Runs after the apply, on the real database, and fails the
      # run — a red db-migrate is the signal that production is behind the repo.
      - name: Witness the LIVE definitions (not the ledger)
        if: success()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Strip whitespace from the secret before handing it to psql. The
          # stored value carries a trailing newline, so a raw "$SUPABASE_DB_URL"
          # asks for a database literally named "postgres\n" and psql answers
          # FATAL: database "postgres\n" does not exist. scripts/db-migrate-apply.sh
          # has done this since it was written (line 31) — the fix was already
          # in this same lane and I did not reuse it, which is the P26 class.
          DBURL=$(printf '%s' "${SUPABASE_DB_URL:-}" | tr -d '[:space:]')
          if [ -z "$DBURL" ]; then
            echo "::error::SUPABASE_DB_URL is not set; the witness cannot observe the database."
            exit 2
          fi
          # The query is BUILT by the witness, names inlined. psql does not
          # interpolate :'vars' inside -c, so the first version of this step
          # sent the placeholder to the server, got nothing back, and reported
          # all ten functions "absent" — a false alarm, which is a broken gate
          # exactly as surely as a silent one. No substitution step, no fault.
          node scripts/live-definition-witness.mjs --sql > "$RUNNER_TEMP/witness.sql"
          psql "$DBURL" -At -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/witness.sql" > "$RUNNER_TEMP/witness.json"
          # Empty output means the query never ran; --check exits 2 rather than
          # inventing findings out of a plumbing fault.
          node scripts/live-definition-witness.mjs --check < "$RUNNER_TEMP/witness.json"

      # THE OTHER DATABASE — the one the app actually reads (DR-0317).
      #
      # Everything above this point applies to SUPABASE_DB_URL, which names the
      # HOSTED project. The app has read the SOVEREIGN stack since REPOINT-ARMED
      # landed 2026-08-19, and nothing replayed migrations there. So a migration
      # merged green, this lane went green, the live-definition witness above
      # went green — and the change had landed on a database the app no longer
      # reads. CI could not see it because CI was only ever looking at hosted.
      #
      # MEASURED 2026-09-01 by sovereign-drift: 28 migrations missing from the
      # live database. It surfaced as Darrell's Properties tab being unable to
      # load at all — 0150-0161 were among the 28, so rental_tenancies did not
      # exist and rentals had no showcase_order column. Also 0164-0166, the
      # Road-to-150 food log. Twelve days, every gate green.
      #
      # This step closes it at the SOURCE rather than by remembering to run a
      # backfill: the same merge that applies a migration to hosted now lands it
      # on the sovereign database too, so the two can never diverge again.
      #
      # It rides the SAME RECORD the deploy rides — infra/nas-supabase/
      # REPOINT-ARMED. One source of truth for "which database is live", so the
      # migration lane and the deploy cannot disagree about it; reverting that
      # file turns both back together.
      #
      # if: always() — a hosted failure must NOT leave the live database behind.
      # The step reports its own before/after ledger and goes red on a real
      # break, and the run's overall status still reflects both halves.
      - name: Land the same migrations on the SOVEREIGN database (repoint armed only)
        if: ${{ always() && hashFiles('infra/nas-supabase/REPOINT-ARMED') != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Replay onto the sovereign database
        if: ${{ always() && hashFiles('infra/nas-supabase/REPOINT-ARMED') != '' }}
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: bash scripts/sovereign-replay-over-tailnet.sh

      - name: Dispatch the isolation proofs (all features, one matrix)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rls-isolation.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "isolation proofs dispatched (rls-isolation matrix)"
