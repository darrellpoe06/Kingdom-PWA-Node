# db-migrate — the migration lane (2026-06-12; made resilient 2026-07-01)
#
# "You fix it first, why me?" — Darrell, on being handed SQL to paste.
# Right. This workflow makes database changes ride the same lane as code:
# any .sql file under infra/supabase/migrations-auto/ is applied to the
# cloud database automatically when it lands on main (and on manual
# dispatch). Files MUST be idempotent (the house rule: IF NOT EXISTS /
# CREATE OR REPLACE / guarded DO blocks).
#
# RESILIENCE (2026-07-01, DR-0084): the apply logic lives in
# scripts/db-migrate-apply.sh. Each migration applies in its OWN
# --single-transaction; a failing file is recorded and the run CONTINUES
# (one poison file can never wedge the whole lane again); a _schema_migrations
# ledger records every apply as the receipt + the in-app DB Health data source;
# the run still exits non-zero if anything failed, so a real break is visibly
# RED. This is deploy-path only (push to main / manual dispatch) — NOT
# self-arming automation; it respects the Cage.
#
# One-time human setup (the only Studio-adjacent step left, ever):
#   1. Supabase Dashboard -> project -> Connect -> "Session pooler"
#      connection string (postgresql://postgres.<ref>:<PASSWORD>@...:5432/postgres)
#      with the database password filled in.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret -> Name: SUPABASE_DB_URL -> paste the string.
# After that, merged SQL applies itself; the run log + ledger are the receipt.

name: db-migrate

on:
  push:
    branches: [main]
    paths:
      - 'infra/supabase/migrations-auto/**'
      - 'scripts/db-migrate-apply.sh'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

# Single-instance lock. Two db-migrate runs applying DDL to the SAME cloud DB at
# once deadlock on shared catalogs (esp. ALTER PUBLICATION supabase_realtime) —
# observed 2026-07-01 when a manual dispatch overlapped the push trigger and two
# migrations hit "deadlock detected". A queued run waits for the in-flight one to
# finish (cancel-in-progress: false — never abandon a half-run migration pass).
# This is the three-brakes concurrency-lock principle applied to the deploy lane.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # to dispatch the isolation proof below
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Apply migrations (resilient, idempotent, ledger-tracked)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/db-migrate-apply.sh
      # Fire the live isolation proof EXPLICITLY (DR-0241/DR-0242). The
      # viewer-readonly-isolation workflow's `workflow_run: db-migrate` trigger
      # NEVER fires in this lane: these runs are dispatched with GITHUB_TOKEN,
      # and GitHub suppresses events from token-driven runs (anti-recursion) —
      # the exact class DR-0107 documented for the deploy. Observed twice
      # (2026-07-29, after #1097 and #1098) before this explicit dispatch.
      # An explicit workflow_dispatch API call is NOT suppressed (the deploy
      # rides the same pattern). Same-lane, deploy-path only — not self-arming.
      #
      # ALL SIX isolation proofs are dispatched via the ONE rls-isolation
      # matrix workflow (2026-07-30 comprehensive review): the five siblings of
      # viewer-readonly carried the same never-firing workflow_run trigger and
      # had been silently inert since the lane took over — five shipped
      # features' DR-0076 enablement gates producing no observations. The
      # 2026-07-29 fix that was applied to one file is here generalized to the
      # class (gate-the-class, DR-0239): one dispatch, every proof runs, serial
      # against the prod DB (the 2026-07-01 ALTER PUBLICATION deadlock class).
      - name: Dispatch the isolation proofs (all features, one matrix)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rls-isolation.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "isolation proofs dispatched (rls-isolation matrix)"
