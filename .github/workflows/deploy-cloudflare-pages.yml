# Deploy to Cloudflare Pages — the off-Vercel production pipeline.
#
# WHY THIS EXISTS: Vercel's Hobby tier caps deployments at 100/day. Many
# parallel feature branches each firing a preview build blew that cap, so a
# green merge to main stopped serving to poetech.us until the window reset.
# Cloudflare Pages has no daily-deploy cap and unlimited bandwidth on free.
# Full research + cutover plan:
#   docs/99-session-notes/2026-06-16-research-review-off-vercel-hosting.md
#
# CHURN CONTROL (the OTHER half of the root cause): this pipeline deploys ONLY
# on push to main — never a per-branch preview. The preview fan-out that blew
# the Vercel cap cannot recur here, regardless of how many lanes are active.
#
# SAFE-BY-DEFAULT / NO CUTOVER YET: the deploy job is gated on the repo variable
# CF_PAGES_ENABLED == 'true'. Until Darrell sets that variable (and adds the
# Cloudflare + VITE_ secrets below), this workflow SKIPS cleanly — it builds and
# serves nothing, so it cannot break the live Vercel path. Activation is a single
# variable flip plus secrets; see the cutover doc. This is NOT a required CI
# check, so even a failure here never blocks the auto-merge lane.
#
# The /n8n same-origin proxy moves with us: app/functions/n8n/[[path]].js is a
# Pages Function deployed alongside the static assets (replacing the Vercel
# rewrite). SPA base + cache headers ride app/public/_redirects + _headers.

name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One production deploy at a time. Do NOT cancel an in-flight deploy: a partial
# publish is worse than waiting. A newer push simply queues behind the current.
concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Gate: stays skipped until Darrell flips the variable on (post-research,
    # credentials in place). Keeps the live Vercel serving untouched until then.
    if: ${{ vars.CF_PAGES_ENABLED == 'true' }}
    outputs:
      # This build's boot-critical JS chunk paths — the propagation sentinel
      # verify-boot polls for on the domain (incident #722: the domain can serve
      # the new shell minutes before the shell's own assets are reachable).
      # ALL of them, not just the entry: index.html modulepreloads the entry,
      # the react-vendor split, AND the monolith chunk, and the app can't boot
      # until every one is served as JavaScript. Waiting on only the entry let
      # boot-check race the vendor/monolith chunks and false-fail (filing bogus
      # incidents + phone pushes) — the transient deploy failures this hardens.
      assets: ${{ steps.sentinel.outputs.assets }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        run: npm ci

      # THE REPOINT RIDES THE RECORD (DR-0310). When the committed
      # infra/nas-supabase/REPOINT-ARMED file exists, this build points the app
      # at the sovereign stack: the URL is the proven /sb transport (DR-0307
      # hop chain), and the anon key is fetched from the NAS ITSELF over the
      # team's own tailnet channel — the same TS_AUTHKEY + NAS_SSH_KEY that
      # nas-health/nas-clock already hold. The NAS is authoritative for its own
      # key; no secret-store hands, no human paste (DR-0108: a "must-be-by-
      # hand" is a premise to challenge). Fail-LOUD: armed + fetch failure =
      # the deploy fails; the running site stays up and never ships half a
      # backend (DR-0107). Reverting the record file is the whole off-switch.
      - name: Join the tailnet (repoint armed only)
        if: ${{ hashFiles('infra/nas-supabase/REPOINT-ARMED') != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Fetch the sovereign anon key from the NAS (repoint armed only)
        if: ${{ hashFiles('infra/nas-supabase/REPOINT-ARMED') != '' }}
        working-directory: .
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          KEY=$(ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            dpoe@poetech.tail5a2f35.ts.net \
            "sudo -n sed -n 's/^ANON_KEY=//p' /volume1/docker/supabase/.env" | tr -d '[:space:]')
          rm -f /tmp/nas_key
          case "$KEY" in
            eyJ*.eyJ*.*) : ;;
            *)
              echo "::error::REPOINT-ARMED but the sovereign ANON_KEY fetch returned ${#KEY} bytes, not a JWT — failing this deploy rather than shipping half a backend (DR-0107). The live site keeps its current build."
              exit 1
              ;;
          esac
          echo "::add-mask::$KEY"
          {
            echo "SOVEREIGN_SB_URL=https://poetech.us/sb"
            echo "SOVEREIGN_SB_ANON=$KEY"
          } >> "$GITHUB_ENV"
          echo "repoint: armed — this build carries the sovereign backend (poetech.us/sb + the NAS-minted anon key)."
      - name: Build (static, base /poetech-app/)
        run: npm run build
        env:
          # SW cache name + in-app build badge derive from this (vite.config.js).
          GITHUB_SHA: ${{ github.sha }}
          # All VITE_ vars are inlined into the public client bundle at build
          # time. They are public-by-design (anon key + RLS, shared-secret bearer
          # that pairs with a server gate) — copying them into CI secrets is not a
          # secret-handling risk, but the cutover is not done until each is set.
          # Sovereign values (set by the armed repoint steps above) take
          # precedence; the hosted secrets remain the un-armed fallback.
          VITE_SUPABASE_URL: ${{ env.SOVEREIGN_SB_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SOVEREIGN_SB_ANON || secrets.VITE_SUPABASE_ANON_KEY }}
          # VITE_N8N_BEARER intentionally NOT injected (2026-07-30 access
          # evaluation): a build-time var is inlined into the PUBLIC bundle, and
          # this one carried the NAS bearer gating the bank-PII webhook — any
          # visitor could extract it. The per-device localStorage bridge token
          # (n8n-base.js) is the only client source now. The secret stays for
          # the workflow-level announce path below (server-side, never bundled).
          # VITE_REVIEW_TOKEN removed for the same reason, same day — the
          # per-device localStorage token (ReviewFeed.jsx) is the only source.
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
          VITE_SYNOLOGY_CHAT_BOT_URL: ${{ secrets.VITE_SYNOLOGY_CHAT_BOT_URL }}
          # NOTE: VITE_N8N_WEBHOOK_BASE is intentionally NOT set — it defaults to
          # the same-origin "/n8n" path served by the Pages Function. Setting it
          # to the bare Funnel URL would re-open the cross-origin 503 throttle.

      - name: Name this build's boot-critical chunks (the propagation sentinel)
        id: sentinel
        # Every JS asset index.html references (entry + react-vendor + monolith),
        # de-duped, space-separated. verify-boot waits for ALL of them to serve as
        # JavaScript before it boots a real browser — see the assets output above.
        run: echo "assets=$(grep -oE 'assets/[^\"]*\.js' dist/index.html | sort -u | tr '\n' ' ' | sed 's/ *$//')" >> "$GITHUB_OUTPUT"

      # Create the Direct-Upload Pages project on the FIRST run so no one has to
      # click through the dashboard's flaky "Connect to Git" flow (which we do not
      # want anyway — a Git-connected project would double-build against this
      # Action). Idempotent: on every later run the project already exists and
      # wrangler exits non-zero with "already exists" — the `|| true` swallows only
      # that expected case so it never fails a real deploy. --production-branch=main
      # matches the --branch=main production deploy below.
      - name: Ensure the Pages project exists (idempotent, first-run create)
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create poetech-app --production-branch=main || true

      - name: Deploy to Cloudflare Pages (functions + static)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          # Run from app/ so wrangler discovers app/functions/ and publishes the
          # /n8n Pages Function alongside the static dist. --branch=main marks
          # this a PRODUCTION deployment (the custom domain serves production).
          command: pages deploy dist --project-name=poetech-app --branch=main

  # ---------------------------------------------------------------------------
  # The deploy is not done until the served app BOOTS (DR-0139). CI-green and
  # the curl probe both missed the 2026-07-10 class: the shell + assets served
  # 200 while the family photographed recovery screens — nothing ever EXECUTED
  # the JavaScript. This job loads the real production URL in headless Chrome
  # (preinstalled on the runner) and fails loudly — filing the incident ledger —
  # if the app shows a recovery screen instead of mounting. Non-required check:
  # it never blocks the merge lane; it makes a broken serve VISIBLE in minutes.
  # ---------------------------------------------------------------------------
  verify-boot:
    name: verify the served app boots (real browser)
    needs: deploy
    if: ${{ vars.CF_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install playwright-core (drives the runner's installed Chrome)
        run: npm install --no-save playwright-core@1
      # ------------------------------------------------------------------------
      # Propagation gate (incident #722, DR-0153 §2): for minutes after an
      # upload the domain can serve the NEW shell while its hashed chunks are
      # not yet reachable — the family's measured blank windows. Wait (bounded)
      # until the domain serves THIS deploy's entry chunk as JavaScript, and put
      # the measured window on the record every deploy. On timeout, fail — after
      # 15 minutes a domain still not serving the deploy IS an incident, and the
      # failure path below files it on the ledger.
      # ------------------------------------------------------------------------
      - name: Wait for the domain to serve this deploy (measured propagation window)
        env:
          ASSETS: ${{ needs.deploy.outputs.assets }}
        run: |
          if [ -z "$ASSETS" ]; then
            echo "no asset sentinel from the build — skipping the gate (boot-check below is still the judge)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Wait for EVERY boot-critical chunk, on ONE shared 15-minute deadline —
          # boot-check must not start until the entry, the react-vendor split, AND
          # the monolith chunk are all reachable as JavaScript (else it races the
          # slower-to-propagate chunk and false-fails).
          start=$(date +%s)
          deadline=$(( start + 900 ))
          for asset in $ASSETS; do
            url="https://poetech.us/poetech-app/${asset}"
            while :; do
              ctype=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "$url" || echo "unreachable")
              now=$(date +%s); elapsed=$(( now - start ))
              case "$ctype" in
                *javascript*)
                  echo "served ${asset} as JavaScript after ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
                  break ;;
              esac
              if [ "$now" -ge "$deadline" ]; then
                echo "domain did NOT serve ${asset} within 15 minutes — propagation stuck (this is an incident)" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "t+${elapsed}s: ${url} answered content-type '${ctype}' — still propagating"
              sleep 10
            done
          done
          echo "all boot chunks served as JavaScript — propagation complete" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Boot-check production (domain + pages.dev origin + the Moore door + the Church tab)
        # ?view=church added 2026-07-10 after the family photographed a white
        # screen on the Church tab during a deploy window — the tab the church
        # actually lives in is now proven booting on every deploy, not assumed.
        run: node scripts/boot-check.mjs https://poetech.us/poetech-app/ https://poetech-app.pages.dev/poetech-app/ "https://poetech.us/poetech-app/?moore=1" "https://poetech.us/poetech-app/?view=church"
      - name: File the failing observation on the incident ledger
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          N8N_BEARER: ${{ secrets.VITE_N8N_BEARER }}
        run: |
          body="boot-check FAILED: the deployed app did not BOOT in a real browser after ${GITHUB_SHA} — recovery screen or blank mount on production. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (DR-0139; probe-green is not boot-green)."
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label incident --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "incident: deployed app failed the real-browser boot-check" --label incident --body "$body"
          fi
          # Announce, not only record (DR-0156): fail-soft phone push via the
          # NAS relay — the ledger above stays the record either way.
          if [ -n "${N8N_BEARER:-}" ]; then
            curl -sS -X POST "https://poetech.tail5a2f35.ts.net/webhook/ops-announce" \
              -H "Authorization: Bearer ${N8N_BEARER}" -H "content-type: application/json" \
              --max-time 15 \
              -d "{\"title\":\"deploy failed the real-browser boot-check\",\"message\":\"The deployed app did not boot after ${GITHUB_SHA}. Details on the incident ledger.\",\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"priority\":\"5\"}" \
              || echo "::warning::announce relay unreachable — incident recorded on the ledger, phone push skipped"
          fi
