# announce-health -- the phone bell's own witness (DR-1040/DR-1047; brought
# up to THE-WAY-A-SERVICE-COMES-HOME on 2026-10-20, the audit).
#
# The Way, step 6: a witness asks the service one real question on a schedule
# and on dispatch, and when the answer is wrong it says WHERE THE INSTALL
# STANDS before anything else. This one never rings a phone: it joins the
# tailnet, asks the relay on the NAS for /healthz (which itself probes the
# sovereign ntfy container and says why), then asks ntfy's own /v1/health
# from the box, the dependency from where the service runs. It passes only
# when both answer. Read-only; no token leaves the box; the output is the
# judged fields only. A failing pass opens (or comments on) ONE rolling
# issue labelled `incident` + `announce-incident`; the next passing run
# closes it.
#
# Brakes: two reads per run, a 12-minute job ceiling, one run at a time, a
# daily schedule.
name: announce-health

on:
  schedule:
    - cron: '13 14 * * *'
  workflow_dispatch:
    inputs:
      ask:
        description: "Also ask ntfy's own /v1/health from the box (off: the relay's /healthz only)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: announce-health
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check secrets (no-op with instructions when absent)
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Ask the NAS (read-only, judged fields only)
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          ASK_IN: ${{ inputs.ask }}
        run: |
          umask 077
          ASK="${ASK_IN:-true}"
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH "ASK='$ASK' sh -s" <<'EOS' > /tmp/witness.json || echo '{"reachable": false}' > /tmp/witness.json
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          export ASK
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          out = {"reachable": True, "at": int(time.time()), "asked": os.environ.get("ASK") == "true",
                 "health_code": None, "health": None, "ask_code": None, "ntfy": None, "error": None}
          def call(method, path, auth=False, timeout=10, base="http://127.0.0.1:8796"):
              req = urllib.request.Request(base + path, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode() or "{}")
                  except Exception: return e.code, {}
              except Exception as e:
                  return None, {"error": str(e)[:200]}
          code, h = call("GET", "/healthz")
          out["health_code"] = code
          out["health"] = {k: h.get(k) for k in ("ok", "ntfy", "reason")} if isinstance(h, dict) else {"reason": str(h)[:200]}
          if out["asked"]:
              code, n = call("GET", "/v1/health", timeout=10, base="http://127.0.0.1:8081")
              out["ask_code"] = code
              out["ntfy"] = n.get("healthy") if isinstance(n, dict) else None
              out["error"] = n.get("error") if isinstance(n, dict) else None
          print(json.dumps(out))
          PY
          EOS
          cat /tmp/witness.json

      - name: Judge and report
        if: steps.gate.outputs.go == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          w = json.load(open("/tmp/witness.json"))
          problems = []
          if not w.get("reachable"):
              problems.append("the NAS did not answer over SSH")
          elif w.get("health_code") != 200:
              problems.append(f"/healthz answered {w.get('health_code')}: {(w.get('health') or {}).get('reason')}")
          if w.get("reachable") and w.get("asked"):
              if w.get("ask_code") != 200 or w.get("ntfy") is not True:
                  problems.append(f"ntfy's own /v1/health from the box answered {w.get('ask_code')} (healthy={w.get('ntfy')}): {w.get('error')}")
          verdict = "PASS" if not problems else "FAIL"
          lines = [f"## announce road: {verdict}", "", "```json", json.dumps(w, indent=2), "```"]
          if problems: lines += ["", "**Why:**"] + [f"- {p}" for p in problems]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh: fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          json.dump({"pass": not problems, "problems": problems, "witness": w}, open("/tmp/verdict.json", "w"))
          PY

      # When the road is dark, say WHERE THE INSTALL STANDS first (the Way,
      # step 6), then what each piece says for itself. Runs only on a failed
      # verdict; read-only; anything key-shaped scrubbed.
      - name: "Diagnose a dark road: where the install stands"
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/verdict.json'))['pass'] else 1)"; then
            echo "verdict passed -- nothing to diagnose"; exit 0
          fi
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH 'sh -s' <<'EOS' | sed -E 's/(Bearer|token|secret|key|password)([^ ,"]*)["=: ]+[^ ,"]+/\1\2=<scrubbed>/Ig' || true
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          REPO=/volume1/PoeTech/repos/Kingdom-PWA-Node
          rd() { cat "$1" 2>/dev/null || sudo -n cat "$1" 2>/dev/null; }
          echo "---- where the install stands ----"
          echo "repo checkout: $(git -C "$REPO" rev-parse --short HEAD 2>/dev/null || sudo -n git -C "$REPO" rev-parse --short HEAD 2>/dev/null || echo unknown)"
          echo "server running code: $(rd /volume1/PoeTech/secrets/.announce-installed-sha | cut -c1-16 || echo none) / repo code: $(sha256sum "$REPO/infra/nas-announce/announce_server.py" 2>/dev/null | cut -c1-16)"
          echo "unit: $(systemctl is-active poetech-announce 2>/dev/null || echo unknown)"
          if [ -s /volume1/PoeTech/secrets/announce-token.txt ] || sudo -n test -s /volume1/PoeTech/secrets/announce-token.txt 2>/dev/null; then echo "token: present on the box"; else echo "token: ABSENT -- the installer generates it"; fi
          echo "healthz (loopback): $(curl -sS -m 8 http://127.0.0.1:8796/healthz 2>&1 | head -c 300)"
          echo "ntfy /v1/health (loopback): $(curl -sS -m 8 http://127.0.0.1:8081/v1/health 2>&1 | head -c 200)"
          D=""
          for CAND in docker /usr/local/bin/docker /var/packages/ContainerManager/target/usr/bin/docker; do
            command -v "$CAND" >/dev/null 2>&1 || continue
            if "$CAND" ps >/dev/null 2>&1; then D="$CAND"; break; fi
            if sudo -n "$CAND" ps >/dev/null 2>&1; then D="sudo -n $CAND"; break; fi
          done
          [ -n "$D" ] && $D ps -a --filter name=ntfy --format '{{.Names}} {{.Status}}' || echo "(no docker this user can run)"
          TSB=/var/packages/Tailscale/target/bin/tailscale
          echo "funnel /announce: $(sudo -n $TSB funnel status 2>/dev/null | grep -c '/announce' || echo 0) mount line(s)"
          echo "---- last lines of the service ----"
          (journalctl -u poetech-announce -n 25 --no-pager 2>/dev/null || sudo -n journalctl -u poetech-announce -n 25 --no-pager 2>/dev/null || echo "(no journal this user can read)") | cut -c1-300
          EOS
      - name: "Ledger: a dark road is an incident; the next pass closes it"
        if: steps.gate.outputs.go == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('/tmp/verdict.json', 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'announce-incident';
            for (const name of ['incident', label]) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color: 'D93F0B', description: name === label ? 'The announce road witness ledger (DR-1040)' : 'The downtime ledger' }); }
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 5 });
            const issue = open.data.find((i) => i.title.startsWith('Announce road'));
            const now = new Date().toISOString();
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const foot = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const why = v.problems.map((p) => `- ${p}`).join('\n');
            if (!v.pass) {
              const body = `announce road failed its witness at ${now} ([run](${run})):\n${why}\n\n\`\`\`json\n${JSON.stringify(v.witness)}\n\`\`\``;
              if (!issue) await github.rest.issues.create({ owner, repo, title: 'Announce road is dark', body: body + foot, labels: ['incident', label] });
              else await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: body + foot });
              core.setFailed('announce-health: ' + v.problems.join('; '));
            } else if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `announce road answered again at ${now} ([run](${run})): the relay and ntfy both answer from the box.${foot}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
