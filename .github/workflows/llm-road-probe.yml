# llm-road-probe — what serves Ari's road, /llm, read from a GitHub runner
# (the cloud sandbox has no route to it). Read-only; nothing is restarted,
# written or mounted. DR-1643: the port is read here before it is written
# into the watchdog, because a wrong port there closes a working door.
name: llm road probe (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: llm-road-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: The outside eye (no key) asks /llm/health on both public names
        run: |
          for u in https://poetech.us/llm/health https://poetech.tail5a2f35.ts.net/llm/health; do
            printf '%s -> ' "$u"; curl -sS -m 20 -o /tmp/b -w '%{http_code} %{content_type}' "$u" || printf 'curl failed'
            printf ' | '; head -c 200 /tmp/b 2>/dev/null | tr '\n' ' '; echo
          done
      - name: Check secrets
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" = "true" ] && [ "$KEY" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "NOT CONFIGURED (TS_AUTHKEY and NAS_SSH_KEY)"; fi
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: ./.github/actions/join-tailnet
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Ask the NAS what is mounted, listening and answering (read-only, scrubbed)
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          umask 077; printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH 'sh -s' <<'EOS' | sed -E 's/(Bearer|token|secret|key|password)([^ ,"]*)["=: ]+[^ ,"]+/\1\2=<scrubbed>/Ig' | cut -c1-240
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          TSB=/var/packages/Tailscale/target/bin/tailscale
          echo "== funnel mounts =="; (sudo -n $TSB funnel status 2>/dev/null || $TSB funnel status 2>&1) | grep -E '^\s*(https|\|--|/)' | head -40
          echo "== listening (87xx, 88xx, 11434) =="; (ss -ltnp 2>/dev/null || sudo -n ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E '[:.](87[0-9]{2}|88[0-9]{2}|11434)\b' | awk '{print $4, $NF}' | sort -u
          echo "== which port answers /llm/health, and /health =="
          for P in 8771 8772 8773 8790 8791 8792 8793 8794 8795 8796 8797 8798 8799 8800 8801 8802 8803 8804 8805; do
            A=$(curl -s -m 4 -o /tmp/a -w '%{http_code}' "http://127.0.0.1:$P/llm/health" 2>/dev/null || echo 000)
            B=$(curl -s -m 4 -o /tmp/h -w '%{http_code}' "http://127.0.0.1:$P/health" 2>/dev/null || echo 000)
            [ "$A$B" = "000000" ] || echo ":$P /llm/health $A $(head -c 90 /tmp/a 2>/dev/null | tr '\n' ' ') | /health $B $(head -c 90 /tmp/h 2>/dev/null | tr '\n' ' ')"
          done
          echo "== ollama =="; curl -s -m 6 http://127.0.0.1:11434/api/tags 2>&1 | head -c 240; echo
          echo "== where the install stands: units and processes =="; systemctl list-units 'poetech-*' --no-legend 2>/dev/null | awk '{print $1, $3, $4}' | head -40
          (pgrep -af 'llm_server|ollama serve' 2>/dev/null || sudo -n pgrep -af 'llm_server|ollama serve' 2>/dev/null || echo "no llm_server or ollama process seen") | head -6
          echo "== caddy routes naming llm =="; for f in /etc/caddy/Caddyfile /volume1/docker/caddy/Caddyfile /volume1/PoeTech/caddy/Caddyfile; do [ -r "$f" ] && grep -n -A2 'llm' "$f" | head -12; done; echo "(end)"
          EOS
