# delegated-pm-isolation — PROVE the 0075 delegated property-management RLS isolates
# people, in CI, against the real database, using the SAME SUPABASE_DB_URL secret the
# db-migrate lane already uses. This is the enablement GATE for the property-manager /
# field-worker / enabled-handyman feature: no delegate account is turned on in the app
# until this is GREEN (DR-0076 / DR-0101; the TV-sharing-isolation precedent).
#
# What it does (self-contained + idempotent, safe against prod):
#   1. Applies infra/supabase/migrations-auto/0075-delegated-property-management.sql
#      (idempotent; db-migrate applies it on merge anyway — this removes ordering doubt).
#   2. Runs infra/supabase/tests/0075-isolation-smoke.sql, which sets up two families +
#      managers + a field worker + an enabled handyman + a stranger IN A TRANSACTION and
#      asserts each manager reaches only their granted property, a worker can only view +
#      document (never message or read rent), rent.adjust is audited, the handyman channel
#      only opens when enabled, a stranger sees nothing, and NO cross-instance leak (a
#      deliberate rental_ref collision), then ROLLS BACK (leaves no data). A leak RAISEs ->
#      psql exits non-zero -> RED. 'ISOLATION SMOKE: PASS' + exit 0 -> GREEN.
#
# Manual (workflow_dispatch) or automatically after db-migrate finishes on main.
# Deploy-path only; not self-arming (respects the Cage). The SUPABASE_DB_URL secret is
# whitespace-stripped exactly like scripts/db-migrate-apply.sh (a trailing newline in the
# secret otherwise folds into the dbname -> "database \"postgres\\n\" does not exist").
name: delegated-pm-isolation

on:
  workflow_dispatch:
  workflow_run:
    workflows: [db-migrate]
    types: [completed]

concurrency:
  group: delegated-pm-isolation
  cancel-in-progress: false

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Apply 0075 (idempotent) then run the isolation smoke test
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Sanitize the URL exactly like scripts/db-migrate-apply.sh (strip whitespace;
          # the secret carries a trailing newline that raw psql folds into the dbname).
          DBURL=$(printf '%s' "${SUPABASE_DB_URL:-}" | tr -d '[:space:]')
          if [ -z "$DBURL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set (same secret db-migrate uses)."
            exit 1
          fi
          echo "=== applying 0075-delegated-property-management.sql (idempotent) ==="
          psql "$DBURL" --single-transaction -v ON_ERROR_STOP=1 \
            -f infra/supabase/migrations-auto/0075-delegated-property-management.sql
          echo "=== running the isolation smoke test (rolls back) ==="
          # ON_ERROR_STOP so a RAISE from any assertion fails the job (red).
          psql "$DBURL" -v ON_ERROR_STOP=1 \
            -f infra/supabase/tests/0075-isolation-smoke.sql
          echo "isolation smoke test completed without a leak (see 'ISOLATION SMOKE: PASS' above)"
