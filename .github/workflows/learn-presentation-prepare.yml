# Learn presentation: prepare a title + cinematic thumbnail for each new lesson, for APPROVAL only (never edits a lesson, never publishes).
# Brakes: $5 combined across all runs, retries included (lib/scope.mjs; titles <= 20% per run), one run at a time, OFF unless vars.LEARN_PRESENTATION_AUTOPREP == 'on'. Detail: docs/99-session-notes/2026-11-23-learn-presentation-redesign-phase-1-2.md
# Manual (dispatch) only until the owner approves the full library. Paid work is saved (cache + artifact) even when a later step fails.
name: Learn presentation — prepare new lessons
on:
  workflow_dispatch:
    inputs:
      only: { description: '"seed" = the 20 pilot lessons (max 20; library disabled in code). "art:samples" / "art:rest" = the new art direction (art-direction-v2.json) only', required: true, default: 'seed' }
      budget_cents: { description: 'Hard spend cap for this whole run, in cents', required: false, default: '500' }
      fresh_ledger: { description: 'Type "yes" ONLY for a first run with no saved ledger (a missing ledger otherwise stops the run before any spend)', required: false, default: 'no' }
permissions:
  contents: read
concurrency:
  group: learn-presentation-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.LEARN_PRESENTATION_AUTOPREP == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults: { run: { working-directory: app } }
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      LEARN_BFL_RAW: '1'
      CAP: ${{ github.event.inputs.budget_cents || vars.LEARN_PRESENTATION_RUN_CAP_CENTS || '500' }}
      ONLY: ${{ github.event.inputs.only || 'seed' }}
      CLI: npx vite-node scripts/learn-presentation/cli.mjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund && (cd scripts/learn-thumbs && npm ci --no-audit --no-fund && npm test) # compositor proven before any paid call
      - id: ledger
        uses: actions/cache/restore@v4
        with: { path: app/.learn-presentation, key: 'learn-presentation-ledger-${{ github.run_id }}', restore-keys: learn-presentation-ledger- }
      - name: A saved ledger is required (no double spend, no regeneration)
        if: steps.ledger.outputs.cache-matched-key == '' && github.event.inputs.fresh_ledger != 'yes'
        run: echo "::error::No saved ledger was restored; stopping before any spend. Type yes in fresh_ledger only for a first run." && exit 1
      - name: The author's lessons are intact before anything runs
        run: npx vitest run src/__tests__/learn-integrity-baseline.test.js
      - name: Titles and images (one cap for the whole run; resumes, never redoes finished work)
        run: |
          set -euo pipefail
          SCOPE="--only ${ONLY/#art:*/seed}"; TEXT_CAP=$(( CAP / 5 )); IMAGE_CAP=$(( CAP - TEXT_CAP )); echo "cap ${CAP}c = text ${TEXT_CAP}c + images ${IMAGE_CAP}c"
          $CLI status; [ "${{ github.event.inputs.fresh_ledger }}" = yes ] || $CLI verify-resume --min-cents 98 --min-text 10 --min-images 10 # recovery proven before any spend; scope validated in code (<= 20, never all)
          case "$ONLY" in art:*) $CLI art-v2 --only "${ONLY#art:}" --budget-cents "$CAP" ;; *) $CLI text $SCOPE --budget-cents "$TEXT_CAP"; $CLI images $SCOPE --provider bfl --budget-cents "$IMAGE_CAP" --concurrency 6 --per-minute 30 ;; esac
      - name: Compose thumbnails (free; a failure here never loses paid work)
        if: always()
        continue-on-error: true
        run: $CLI compose --only "${ONLY/#art:*/seed}"
      - name: Export the review package
        if: always()
        run: $CLI export --to .learn-presentation/review-export.json && $CLI status
      - uses: actions/cache/save@v4
        if: always()
        with: { path: app/.learn-presentation, key: 'learn-presentation-ledger-${{ github.run_id }}' }
      - name: The author's lessons are still intact
        if: always()
        run: npx vitest run src/__tests__/learn-integrity-baseline.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learn-presentation-review-${{ github.run_id }}
          path: |
            app/.learn-presentation/review-export.json
            app/.learn-presentation/composed/
            app/.learn-presentation/images/
            app/.learn-presentation/state/
          retention-days: 30
