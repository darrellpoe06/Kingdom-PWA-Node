# Learn presentation: prepare a title + cinematic thumbnail for each new lesson, for APPROVAL only (never edits a lesson, never publishes).
# Brakes: one spend cap per run (titles <= 20%), one run at a time, OFF unless vars.LEARN_PRESENTATION_AUTOPREP == 'on'. Detail: docs/99-session-notes/2026-11-23-learn-presentation-redesign-phase-1-2.md
name: Learn presentation — prepare new lessons
on:
  push:
    branches: [main]
    paths: ['app/src/lib/living-lessons/**', 'app/src/lib/*-course.js', 'app/src/lib/*-class.js', 'app/src/lib/learn-catalog.js', 'app/src/lib/eternal-algorithms-course.js']
  workflow_dispatch:
    inputs:
      only: { description: '"seed" = the 20-lesson pilot, or comma-separated lesson ids', required: false, default: '' }
      budget_cents: { description: 'Hard spend cap for this whole run, in cents', required: false, default: '500' }
permissions:
  contents: read
concurrency:
  group: learn-presentation-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.LEARN_PRESENTATION_AUTOPREP == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults: { run: { working-directory: app } }
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      LEARN_BFL_RAW: '1'
      CAP: ${{ github.event.inputs.budget_cents || vars.LEARN_PRESENTATION_RUN_CAP_CENTS || '500' }}
      ONLY: ${{ github.event.inputs.only || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund && (cd scripts/learn-thumbs && npm ci --no-audit --no-fund)
      - uses: actions/cache/restore@v4
        with: { path: app/.learn-presentation, key: 'learn-presentation-ledger-${{ github.run_id }}', restore-keys: learn-presentation-ledger- }
      - name: The author's lessons are intact before anything runs
        run: npx vitest run src/__tests__/learn-integrity-baseline.test.js
      - name: Titles, images, composition (one cap for the whole run; resumable)
        run: |
          set -euo pipefail
          SCOPE=""; if [ -n "$ONLY" ]; then SCOPE="--only $ONLY"; fi
          TEXT_CAP=$(( CAP / 5 )); IMAGE_CAP=$(( CAP - TEXT_CAP )); echo "cap ${CAP}c = text ${TEXT_CAP}c + images ${IMAGE_CAP}c"
          CLI="npx vite-node scripts/learn-presentation/cli.mjs"
          $CLI estimate $SCOPE
          $CLI text $SCOPE --budget-cents "$TEXT_CAP"
          $CLI images $SCOPE --provider bfl --budget-cents "$IMAGE_CAP" --concurrency 6 --per-minute 30
          $CLI compose $SCOPE
          $CLI export --to .learn-presentation/review-export.json
          $CLI status
      - uses: actions/cache/save@v4
        if: always()
        with: { path: app/.learn-presentation, key: 'learn-presentation-ledger-${{ github.run_id }}' }
      - name: The author's lessons are still intact
        run: npx vitest run src/__tests__/learn-integrity-baseline.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: learn-presentation-review-${{ github.run_id }}
          path: |
            app/.learn-presentation/review-export.json
            app/.learn-presentation/composed/
          retention-days: 30
