# fleet-census -- how many jobs, how many are on, how many have EVER run, and
# which ones nobody can account for.
#
# WHY. Darrell brought back a job-migration census in this shape:
#   Total jobs: 149 / Enabled: 131 / Enabled with a last run date: 78
#   "Do the disabled jobs need to be migrated?"
#   "Have the enabled jobs with no run dates never been run?"
# We could not answer either question about our own automation. scripts/
# fleet-census.mjs reads the shape and the enabled flags out of the repo, but
# LAST RUN is not in the repo -- it lives in GitHub's run history. This job is
# the half that can ask.
#
# THE DISTINCTION THIS EXISTS TO KEEP. For each workflow it reads total_count
# from the runs endpoint, which is the exact count of runs GitHub still holds:
#   total_count > 0  -> it has run; the date is the most recent run returned
#   total_count == 0 -> NEVER run, as far as retained history goes
#   endpoint errored -> UNKNOWN, and it is written as unknown
# "Unknown" never reads as "never" (DR-0076). The retention caveat is printed
# with every verdict rather than left for the reader to remember: GitHub keeps
# run history for a limited window, so "never" means "no run in retained
# history", which for an old workflow is not the same as "never once fired".
#
# Read-only: no writes to the repository, no deploys, nothing mutated.
# Brakes: one pass per run, a 10-minute job ceiling, one run at a time.
name: fleet-census

on:
  schedule:
    # Weekly, off the hour (most schedules land on :00 and get delayed).
    - cron: '38 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  # Only to keep its own rolling ledger issue (below). Nothing in the
  # repository, the fleet or any run is mutated.
  issues: write

concurrency:
  group: fleet-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ask GitHub for each workflow's state and whether it has ever run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GITHUB_TOKEN"]
          API = "https://api.github.com"

          def get(path):
              req = urllib.request.Request(
                  f"{API}/{path}",
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "poetech-fleet-census"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # Every workflow GitHub knows about, with the state only GitHub can
          # tell us: active / disabled_manually / disabled_inactivity. A file in
          # the repo cannot say which -- that is why this half has to be asked.
          wfs, page = [], 1
          while True:
              d = get(f"repos/{REPO}/actions/workflows?per_page=100&page={page}")
              batch = d.get("workflows") or []
              wfs.extend(batch)
              if len(wfs) >= d.get("total_count", 0) or not batch:
                  break
              page += 1
          print(f"workflows GitHub knows: {len(wfs)}")

          out = {}
          for w in wfs:
              name = os.path.basename(w.get("path") or "")
              row = {"state": w.get("state") or "unknown"}
              # total_count is the EXACT number of runs GitHub still holds for
              # this workflow id, so 0 is a real "never, in retained history"
              # rather than an inference from an empty page. The one run
              # returned supplies the date; it is the most recent run the API
              # returned, not asserted to be the newest -- a filtered runs list
              # is not reliably newest-first (P62).
              try:
                  r = get(f"repos/{REPO}/actions/workflows/{w['id']}/runs?per_page=1")
                  runs = r.get("workflow_runs") or []
                  row["runs_counted"] = r.get("total_count", 0)
                  row["last_run_at"] = (runs[0].get("run_started_at")
                                        or runs[0].get("created_at")) if runs else None
              except (urllib.error.URLError, urllib.error.HTTPError, KeyError, ValueError) as e:
                  # Asked and could not be answered -> UNKNOWN, written as
                  # unknown. It must never fall through to "never" (DR-0076).
                  row["runs_counted"] = None
                  row["why_unknown"] = str(e)[:120]
              out[name] = row
              time.sleep(0.05)

          doc = {"window": "the GitHub Actions run history retained for this repository, "
                           "read at " + time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                 "workflows": out}
          with open("/tmp/runs.json", "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2)
          ran = sum(1 for v in out.values() if v.get("last_run_at"))
          never = sum(1 for v in out.values() if v.get("runs_counted") == 0)
          unknown = sum(1 for v in out.values() if v.get("runs_counted") is None)
          print(f"asked {len(out)}: ran {ran}, never-in-retained-history {never}, unknown {unknown}")
          PY
          python3 -c "import json; json.load(open('/tmp/runs.json')); print('runs.json parses')"

      # ASK THE NAS HALF TOO (DR-1151). 28 of 118 jobs read blank because this
      # census only ever asked GitHub, while loops-health.yml measured every NAS
      # loop on the tailnet fifteen minutes apart. It publishes that witness onto
      # a rolling `loops-report` issue; this step folds it in. No tailnet here --
      # one road to one truth, and the census stays a reader.
      #
      # A missing or unreadable report leaves the NAS half exactly as it was:
      # UNKNOWN. It is never silently treated as "no loops ran" (DR-0076).
      - name: Fold in the loops witness for the NAS half
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GITHUB_TOKEN"]
          doc = json.load(open("/tmp/runs.json"))

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/{path}",
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "poetech-fleet-census"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          try:
              issues = api(f"repos/{REPO}/issues?labels=loops-report&state=all&per_page=1")
          except (urllib.error.URLError, urllib.error.HTTPError) as e:
              print(f"  !! could not read the loops report: {str(e)[:120]}")
              print("     the NAS half stays UNKNOWN -- unknown is not a no")
              raise SystemExit(0)

          issues = [i for i in issues if not i.get("pull_request")]
          if not issues:
              print("no loops-report issue yet; the NAS half stays UNKNOWN")
              raise SystemExit(0)

          body = issues[0].get("body") or ""
          m = re.search(r"```json\s*\n([\s\S]*?)\n```", body)
          if not m:
              print("the loops report carries no witness block; the NAS half stays UNKNOWN")
              raise SystemExit(0)
          try:
              w = json.loads(m.group(1))
          except ValueError as e:
              print(f"the loops witness block does not parse ({e}); the NAS half stays UNKNOWN")
              raise SystemExit(0)

          svc = w.get("services")
          if not isinstance(svc, dict):
              print("the loops witness names no services; the NAS half stays UNKNOWN")
              raise SystemExit(0)

          # Only last_run_at and its provenance cross over. No run COUNT is
          # carried, so a NAS loop can never be reported as "never".
          doc["services"] = {
              name: {"last_run_at": e.get("last_run_at"), "from": e.get("from")}
              for name, e in svc.items() if isinstance(e, dict)
          }
          doc["window"] = (doc.get("window") or "") + \
              f"; NAS loops from the loops witness read at {w.get('readAt')}"
          json.dump(doc, open("/tmp/runs.json", "w"), indent=2)
          dated = sum(1 for e in doc["services"].values() if e.get("last_run_at"))
          print(f"folded {len(doc['services'])} NAS loop(s); {dated} carry a timestamp")

          # A WITNESS THAT HAS STOPPED PUBLISHING LOOKS EXACTLY LIKE A HEALTHY
          # ONE FROM HERE (DR-1158). It did stop, for two hours, because the
          # publish step threw and `continue-on-error` reported success: the
          # report issue simply kept its old body and this fold kept folding it
          # with full confidence. So the AGE of what we just read is checked and
          # said. The loops witness runs every 15 minutes, so two hours is many
          # missed passes, not a slow night.
          from datetime import datetime, timezone
          read_at = w.get("readAt")
          age_s = None
          if read_at:
              try:
                  t = datetime.fromisoformat(str(read_at).replace("Z", "+00:00"))
                  age_s = int((datetime.now(timezone.utc) - t).total_seconds())
              except ValueError:
                  pass
          if age_s is None:
              print("::warning::the loops witness carries no readable readAt; its age is UNKNOWN, "
                    "so the NAS half below may be any age at all")
          elif age_s > 2 * 60 * 60:
              print(f"::warning::the loops witness last published {age_s // 60} minutes ago "
                    f"({read_at}); it runs every 15 minutes, so it has stopped publishing. "
                    "The NAS half below is STALE, not wrong -- nothing about the loops "
                    "themselves is implied.")
          else:
              print(f"the loops witness is {age_s // 60} minute(s) old")
          PY
          python3 -c "import json; json.load(open('/tmp/runs.json')); print('runs.json still parses')"

      - name: The census, and the two questions
        run: |
          node scripts/fleet-census.mjs --runs /tmp/runs.json | tee /tmp/census.txt
          {
            echo '## Fleet census'
            echo
            echo '```'
            cat /tmp/census.txt
            echo '```'
            echo
            echo '**Retention caveat, stated with the verdict:** GitHub keeps Actions run'
            echo 'history for a limited window. A workflow reported as NEVER RUN has no run'
            echo 'in *retained* history -- for an old workflow that is not the same claim as'
            echo '"it has never once fired". UNKNOWN means the API could not be asked.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the machine-readable census as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleet-census
          path: |
            /tmp/runs.json
            /tmp/census.txt
          retention-days: 30

      # WHY THIS STEP EXISTS (DR-1148). The census answered Darrell's two
      # questions and then put the answer in a step summary, an artifact and an
      # incident issue filed only on breakage -- three places he does not read.
      # A report nobody can see is not a report, and the app is the primary
      # artifact (DR-0065). This step keeps ONE rolling, always-open issue whose
      # BODY is rewritten every run with the measured census in a fenced json
      # block; app/src/lib/fleet-census-live.js reads that body and the OpsBoard
      # shows it. The fence is the data road on purpose: the human table beside
      # it is for a reader, and a number re-typed into prose can drift from the
      # thing it measured.
      #
      # It is labelled `fleet-census-report`, deliberately NOT `incident`: a
      # healthy census is not an outage, and the uptime strip reads `incident`.
      # The issue stays open because it is a living report, not a fault.
      - name: "Report: the census on the board"
        uses: actions/github-script@v7
        with:
          script: |
            const c = JSON.parse(require('child_process')
              .execSync('node scripts/fleet-census.mjs --runs /tmp/runs.json --json').toString());
            c.readAt = new Date().toISOString();
            const { owner, repo } = context.repo;
            const label = 'fleet-census-report';
            try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: label }); }
            const noRun = c.jobs.filter((j) => j.lastRunClass !== 'ran');
            const three = {
              'nothing fires it (on-demand only) — correct and healthy':
                noRun.filter((j) => j.onDemandOnly || j.kind === 'on-demand').length,
              'on a clock, history asked, no run — retire or fix':
                noRun.filter((j) => !j.onDemandOnly && j.kind !== 'on-demand' && j.lastRunClass === 'never').length,
              'history never asked — a gap in the REPORT, not a fault':
                noRun.filter((j) => !j.onDemandOnly && j.kind !== 'on-demand' && j.lastRunClass === 'unknown').length,
            };
            const body = [
              '**The fleet census.** Read at ' + c.readAt + '.',
              '',
              'Window: ' + (c.window || 'no last-run window was read'),
              '',
              '| measured | count |', '|---|---|',
              '| total jobs | ' + c.total + ' |',
              '| enabled | ' + c.enabled + ' |',
              '| disabled | ' + c.disabled + ' |',
              '| with a last run | ' + c.withALastRun + ' |',
              '| never, in retained history | ' + c.neverRun + ' |',
              '| no last-run answer (unknown) | ' + c.unknownLastRun + ' |',
              '',
              '**"Enabled with no last run date" is three populations, not one** —',
              'which is the whole answer to the second question Darrell asked:',
              '',
              ...Object.entries(three).map(([k, v]) => '- **' + v + '** — ' + k),
              '',
              '**Retention caveat, stated with the verdict:** GitHub keeps Actions run',
              'history for a limited window, so "never, in retained history" is not the',
              'same claim as "never once fired". UNKNOWN means nobody asked the system',
              'that keeps the history — it is never counted as "never".',
              '',
              'This body is rewritten by `.github/workflows/fleet-census.yml` on every run.',
              'The block below is what the OpsBoard reads; do not hand-edit it.',
              '',
              '```json',
              JSON.stringify(c, null, 1),
              '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const found = await github.rest.issues.listForRepo({
              owner, repo, state: 'all', labels: label, per_page: 1 });
            const open = found.data[0];
            if (open) {
              await github.rest.issues.update({ owner, repo, issue_number: open.number,
                body, state: 'open' });
              core.info(`census report updated: #${open.number}`);
            } else {
              const made = await github.rest.issues.create({ owner, repo,
                title: 'fleet census: the live report the board reads',
                labels: [label], body });
              core.info(`census report opened: #${made.data.number}`);
            }

      # WHY THIS STEP EXISTS, and why it is narrow. The interconnect guard
      # (DR-0621) refused this workflow for having no consumer: "every workflow
      # must read something real, write something real, and seed the next." A
      # census whose output only lands in a step summary nobody reads is the
      # hollow kind. But a census is not a failure detector either, so it files
      # ONLY the two things that are genuinely broken rather than merely
      # unaccounted for:
      #   * a job nothing can fire at all (inert)
      #   * a job something fires on a CLOCK that has no run in retained
      #     history -- the clock is set and nothing has ever come of it
      # "On-demand with no runs" is NOT filed: nothing is meant to fire it.
      # "Unknown" is NOT filed: that is a gap in the report, not a fault in the
      # job (DR-0076). The ledger issue is the OpsBoard's existing road.
      - name: "Ledger: a clock set with nothing behind it is an incident"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const c = JSON.parse(require('child_process')
              .execSync('node scripts/fleet-census.mjs --runs /tmp/runs.json --json').toString());
            const broken = c.jobs.filter((j) =>
              j.kind === 'inert'
              || (j.kind === 'scheduled' && j.lastRunClass === 'never'));
            const { owner, repo } = context.repo;
            const label = 'fleet-census';
            for (const name of ['incident', label]) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name }); }
            }
            const found = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 1 });
            const open = found.data[0];
            if (!broken.length) {
              core.info(`fleet census clean: ${c.total} jobs, ${c.enabled} enabled, ` +
                        `${c.withALastRun} with a last run, ${c.unknownLastRun} unknown`);
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number,
                  body: `Clean as of ${new Date().toISOString()}: ${c.total} jobs, ${c.enabled} enabled, ` +
                        `${c.withALastRun} with a last run, ${c.neverRun} never in retained history, ` +
                        `${c.unknownLastRun} unknown. No clock is set with nothing behind it.` });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
              }
              return;
            }
            const body = [
              `Read at ${new Date().toISOString()}. Window: ${c.window}`, '',
              '| job | what fires it | last run |', '|---|---|---|',
              ...broken.map((j) => `| \`${j.name}\` | ${j.kind} | ${j.lastRunClass === 'never' ? 'none in retained history' : '—'} |`),
              '',
              '**Retention caveat:** GitHub keeps run history for a limited window, so',
              '"none in retained history" is not the same claim as "never once fired".',
              'Decide per job: retire it, fix what should have been firing it, or say why',
              'it stays with a re-review date (DR-0075).',
            ].join('\n');
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
            } else {
              await github.rest.issues.create({ owner, repo,
                title: 'fleet census: a clock set with nothing behind it',
                labels: ['incident', label], body });
            }
            core.setFailed(`${broken.length} job(s) a clock should have fired and never did`);
