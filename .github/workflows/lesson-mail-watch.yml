# =============================================================================
# lesson-mail-watch — the EVENT half of the Gmail-lesson-intake Way (DR-0312)
# =============================================================================
# Darrell 2026-08-25: "I would rather an event triggered event for pulls...
# like whenever it comes from dpoe@illinois.edu... etc..."
#
# Every 5 minutes (GitHub's schedule floor; delivery is best-effort) this job
# peeks at the inbox over READ-ONLY IMAP for mail from Darrell's two addresses
# carrying his "Lesson" marker and not yet labeled Lesson-Captured. On a hit it
# comments on the permanent draft signal PR (#1346) — one comment per
# Message-ID — which wakes the subscribed capture session to pull and ship the
# lesson immediately (DR-0255: event-driven first; the 4-hour Routine stays as
# the fallback heartbeat).
#
# DORMANT until the GMAIL_WATCH_APP_PASSWORD secret is set (a value only
# Darrell holds — never pasted into chat; created at
# https://myaccount.google.com/apppasswords and stored at Settings → Secrets
# → Actions). Absent secret = clean exit, honestly logged, never a failure.
# The watcher NEVER mutates mail (peek only); labeling is the capture
# session's job, only after a lesson ships.
name: Lesson mail watch (event-driven intake)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: lesson-mail-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Peek inbox and poke the signal PR on a hit
        env:
          GMAIL_WATCH_USER: darrellpoe06@gmail.com
          GMAIL_WATCH_APP_PASSWORD: ${{ secrets.GMAIL_WATCH_APP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNAL_PR: '1346'
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import imaplib, os, subprocess, sys, json
          from email.parser import BytesHeaderParser

          # A DORMANT WATCHER SAYS SO WHERE SOMEONE WILL SEE IT (DR-0621).
          # MEASURED 2026-11-10: this workflow had 480 runs from 2026-08-25 to
          # 2026-11-09, every sampled one printing the line below and exiting 0.
          # Green, for 77 days, having read no mail at all -- and the only reason
          # anybody found out is that a session went looking at the raw log of
          # run number 480. DR-1355 already named this shape in the sibling
          # label workflow: "a run went GREEN having laboured on nothing... a
          # witness that cannot fail loudly."
          #
          # IT STILL EXITS 0 ON PURPOSE, and that is not the same mistake. The
          # label lane is dispatch-only with a required input, so dormancy there
          # means somebody asked for N locks and got none, and failing is right.
          # This lane is SCHEDULED: 480 red runs is noise, and a witness nobody
          # can bear to look at is no witness either. So it stays green and gets
          # a voice instead -- ::warning:: puts it on the run and in the Actions
          # list, and the step summary says what it costs and who can fix it.
          #
          # THIS IS THE WEAK VERSION, named as such. The house already has the
          # strong one: site-health.yml files each failing observation on a
          # rolling `incident`-labelled issue (DR-0125), which is a queryable
          # ledger and renders on the OpsBoard, so "the door has been shut for
          # 77 days" becomes a number someone reads instead of a line in log
          # 480. That needs `issues: write` here and a de-duplicating key, and
          # it is the follow-up. `re-review: 2026-11-24`.
          #
          # P61 IS THE REAL COST, stated so it is not discovered again: a
          # standing lane must not depend on one chat connector. While this is
          # dormant the ONLY road that moves lesson mail is a session querying
          # Gmail through its connector by hand, which is exactly the dependency
          # P61 forbids for a standing lane. The lane is not merely quiet; it is
          # being carried by hand.
          pw = os.environ.get('GMAIL_WATCH_APP_PASSWORD', '')
          if not pw:
              print('watcher dormant: GMAIL_WATCH_APP_PASSWORD secret not set (honest no-op)')
              print('::warning title=Lesson mail watcher is dormant::GMAIL_WATCH_APP_PASSWORD is not set, so no mail was read and no lesson can be detected automatically. Every run of this workflow has been an honest no-op since 2026-08-25.')
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a') as fh:
                      fh.write('## Lesson mail watcher — DORMANT, nothing was read\n\n')
                      fh.write('`GMAIL_WATCH_APP_PASSWORD` is not set, so this run read no mail.\n')
                      fh.write('It is green because it did exactly what it could, not because the lane works.\n\n')
                      fh.write('**What it costs:** forwarded lessons are not detected automatically, and\n')
                      fh.write('`Lesson-Captured` is never written, so the intake queue over-reports\n')
                      fh.write('already-built threads. The repo-side witness `ledger-names-its-thread.mjs`\n')
                      fh.write('is what prevents re-work meanwhile.\n\n')
                      fh.write('**The one value, which only Darrell can mint:** a Google App Password from\n')
                      fh.write('https://myaccount.google.com/apppasswords (behind 2-Step Verification),\n')
                      fh.write('pasted at Settings → Secrets and variables → Actions as\n')
                      fh.write('`GMAIL_WATCH_APP_PASSWORD`. The same 16 characters also serve\n')
                      fh.write('`SMTP_APP_PASSWORD` for the email door, and wake `lesson-mail-label.yml`.\n')
              sys.exit(0)
          user = os.environ['GMAIL_WATCH_USER']
          pr = os.environ['SIGNAL_PR']; repo = os.environ['REPO']

          M = imaplib.IMAP4_SSL('imap.gmail.com')
          M.login(user, pw)
          M.select('"[Gmail]/All Mail"', readonly=True)
          query = '{from:darrellpoe06@gmail.com from:dpoe@illinois.edu} Lesson -label:Lesson-Captured newer_than:3d'
          typ, data = M.uid('SEARCH', 'X-GM-RAW', '"%s"' % query)
          uids = data[0].split() if typ == 'OK' and data and data[0] else []
          if not uids:
              print('no unprocessed Lesson mail'); sys.exit(0)

          # Existing signal comments, for Message-ID dedup (one poke per email).
          out = subprocess.run(['gh', 'api', f'repos/{repo}/issues/{pr}/comments?per_page=100',
                                '--jq', '[.[].body] | join("\n")'],
                               capture_output=True, text=True)
          seen = out.stdout if out.returncode == 0 else ''

          parser = BytesHeaderParser()
          poked = 0
          for uid in uids[-5:]:  # newest few; budget-bounded
              typ, hd = M.uid('FETCH', uid, '(BODY.PEEK[HEADER.FIELDS (MESSAGE-ID FROM SUBJECT DATE)])')
              if typ != 'OK' or not hd or not hd[0]:
                  continue
              h = parser.parsebytes(hd[0][1])
              msgid = (h.get('Message-ID') or f'uid-{uid.decode()}').strip()
              if msgid in seen:
                  continue
              # Sender + date only — never the subject or body to a public log
              # or comment beyond what routing needs; subject stays out.
              body = (f'Lesson mail detected from {h.get("From", "?")} at {h.get("Date", "?")} — '
                      f'pull now per DR-0312.\n\n<!-- msgid: {msgid} -->\n\n'
                      '---\n_Generated by [Claude Code](https://claude.ai/code)_')
              r = subprocess.run(['gh', 'api', f'repos/{repo}/issues/{pr}/comments',
                                  '-f', f'body={body}'], capture_output=True, text=True)
              if r.returncode == 0:
                  poked += 1
                  print(f'poked signal PR for message {msgid}')
              else:
                  print(f'::warning::could not comment for {msgid}: {r.stderr[:200]}')
          print(f'done: {len(uids)} unprocessed, {poked} new pokes')
          PY
