# =============================================================================
# lesson-mail-watch — the EVENT half of the Gmail-lesson-intake Way (DR-0312)
# =============================================================================
# Darrell 2026-08-25: "I would rather an event triggered event for pulls...
# like whenever it comes from dpoe@illinois.edu... etc..."
#
# Every 5 minutes (GitHub's schedule floor; delivery is best-effort) this job
# peeks at the inbox over READ-ONLY IMAP for mail from Darrell's two addresses
# carrying his "Lesson" marker and not yet labeled Lesson-Captured. On a hit it
# comments on the permanent draft signal PR (#1346) — one comment per
# Message-ID — which wakes the subscribed capture session to pull and ship the
# lesson immediately (DR-0255: event-driven first; the 4-hour Routine stays as
# the fallback heartbeat).
#
# DORMANT until the GMAIL_WATCH_APP_PASSWORD secret is set (a value only
# Darrell holds — never pasted into chat; created at
# https://myaccount.google.com/apppasswords and stored at Settings → Secrets
# → Actions). Absent secret = clean exit, honestly logged, never a failure.
# The watcher NEVER mutates mail (peek only); labeling is the capture
# session's job, only after a lesson ships.
name: Lesson mail watch (event-driven intake)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: lesson-mail-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Peek inbox and poke the signal PR on a hit
        env:
          GMAIL_WATCH_USER: darrellpoe06@gmail.com
          GMAIL_WATCH_APP_PASSWORD: ${{ secrets.GMAIL_WATCH_APP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNAL_PR: '1346'
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import imaplib, os, subprocess, sys, json
          from email.parser import BytesHeaderParser

          pw = os.environ.get('GMAIL_WATCH_APP_PASSWORD', '')
          if not pw:
              print('watcher dormant: GMAIL_WATCH_APP_PASSWORD secret not set (honest no-op)')
              sys.exit(0)
          user = os.environ['GMAIL_WATCH_USER']
          pr = os.environ['SIGNAL_PR']; repo = os.environ['REPO']

          M = imaplib.IMAP4_SSL('imap.gmail.com')
          M.login(user, pw)
          M.select('"[Gmail]/All Mail"', readonly=True)
          query = '{from:darrellpoe06@gmail.com from:dpoe@illinois.edu} Lesson -label:Lesson-Captured newer_than:3d'
          typ, data = M.uid('SEARCH', 'X-GM-RAW', '"%s"' % query)
          uids = data[0].split() if typ == 'OK' and data and data[0] else []
          if not uids:
              print('no unprocessed Lesson mail'); sys.exit(0)

          # Existing signal comments, for Message-ID dedup (one poke per email).
          out = subprocess.run(['gh', 'api', f'repos/{repo}/issues/{pr}/comments?per_page=100',
                                '--jq', '[.[].body] | join("\n")'],
                               capture_output=True, text=True)
          seen = out.stdout if out.returncode == 0 else ''

          parser = BytesHeaderParser()
          poked = 0
          for uid in uids[-5:]:  # newest few; budget-bounded
              typ, hd = M.uid('FETCH', uid, '(BODY.PEEK[HEADER.FIELDS (MESSAGE-ID FROM SUBJECT DATE)])')
              if typ != 'OK' or not hd or not hd[0]:
                  continue
              h = parser.parsebytes(hd[0][1])
              msgid = (h.get('Message-ID') or f'uid-{uid.decode()}').strip()
              if msgid in seen:
                  continue
              # Sender + date only — never the subject or body to a public log
              # or comment beyond what routing needs; subject stays out.
              body = (f'Lesson mail detected from {h.get("From", "?")} at {h.get("Date", "?")} — '
                      f'pull now per DR-0312.\n\n<!-- msgid: {msgid} -->\n\n'
                      '---\n_Generated by [Claude Code](https://claude.ai/code)_')
              r = subprocess.run(['gh', 'api', f'repos/{repo}/issues/{pr}/comments',
                                  '-f', f'body={body}'], capture_output=True, text=True)
              if r.returncode == 0:
                  poked += 1
                  print(f'poked signal PR for message {msgid}')
              else:
                  print(f'::warning::could not comment for {msgid}: {r.stderr[:200]}')
          print(f'done: {len(uids)} unprocessed, {poked} new pokes')
          PY
