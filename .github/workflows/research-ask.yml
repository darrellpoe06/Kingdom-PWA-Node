name: research-ask
# The research road as a BUILD tool (DR-1127). Darrell, 2026-10-20: "Can this
# research tab also be used for building... testing... development... etc?"
#
# Yes -- and the road already existed; only the question was nailed down. The
# witness (research-health.yml) asks ONE fixed question on purpose, so its green
# means the same thing week to week; that question must stay fixed. This is its
# sibling: the same tailnet + SSH discipline, with the QUESTION as an input, for
# a session or a build that has hit an unknown about the outside world.
#
# WHY THIS FITS DEVELOPMENT WHEN IT DOES NOT FIT A LESSON. research.js says the
# road "marks every answer verified:false". For a lesson that is disqualifying:
# a wrong figure reaches a reader and the verifier is slow and external. For a
# build the verifier is already sitting there -- a wrong answer about an API
# costs one red check. Unverified lead plus cheap local proof is the right shape
# here, and the wrong shape there.
#
# THE RULE THIS ROAD CARRIES: the answer is a LEAD, never a finding. Nothing it
# returns may be written into a lesson, a record or a claim about our own system
# until something in this repo reproduces it (DR-0076 §8; research-intake.js
# step 2 -- "An asserted 'we have X' is checked, not believed").
#
# The family token is read ON THE NAS and never leaves it: every HTTP call runs
# over SSH on the box, exactly as the witness does it. The question travels
# base64-encoded because it is free text -- the witness only ever passes
# true/false, so its plain interpolation is safe and this one's would not be.
#
# THE PORT IS 8797 AND IS PINNED BY A TEST, because my first draft said 8099 --
# which is not an unused number: it is the PROPERTY-PHOTO server's own port
# (infra/nas-property-photos/photo_server.py). A live listener on this same box
# would have taken the question and the family-key bearer and answered 404 (that
# file 404s any POST but /upload and /media-upload), and the failure path below
# would have printed "/ask answered 404: the road refused the call" -- the photo
# server's refusal wearing the research road's name.
on:
  workflow_dispatch:
    inputs:
      question:
        description: 'One question for the research road (max 4000 chars, the forwarder cap)'
        required: true
      mode:
        description: 'speed | balanced | quality'
        required: false
        default: 'speed'
concurrency:
  group: research-ask
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is the road configured?
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Ask, on the NAS, with the key that never leaves it
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          QUESTION: ${{ inputs.question }}
          MODE: ${{ inputs.mode }}
        run: |
          umask 077
          # 4000 is the forwarder's own cap (lib/research.js MAX_QUERY_CHARS),
          # raised from 500 on 2026-10-27. This is the THIRD place the one cap is
          # written -- app, NAS door, and here -- so a raise is three edits or it
          # is not a raise. research-road and the build-tool test hold them equal.
          # refuse here rather than have the road refuse after the round trip.
          LEN=$(printf '%s' "$QUESTION" | wc -c)
          if [ "$LEN" -gt 4000 ]; then
            echo "::error::The question is $LEN characters; the road's cap is 4000."
            exit 1
          fi
          case "$MODE" in speed|balanced|quality) : ;; *) echo "::error::mode must be speed, balanced or quality (got '$MODE')"; exit 1 ;; esac
          # Free text never reaches a shell unquoted.
          Q64=$(printf '%s' "$QUESTION" | base64 -w0)
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH "Q64='$Q64' MODE='$MODE' sh -s" <<'EOS' > /tmp/answer.json || echo '{"reachable": false}' > /tmp/answer.json
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          TOK="$(cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null || sudo -n cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null)"
          export TOK Q64 MODE
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          q = base64.b64decode(os.environ.get("Q64", "")).decode("utf-8", "replace")
          out = {"reachable": True, "question": q, "code": None, "answer": None,
                 "sources": [], "model": None, "verified": None, "error": None}
          body = json.dumps({"query": q, "mode": os.environ.get("MODE", "speed")}).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:8797/ask", data=body, method="POST",
              headers={"Content-Type": "application/json",
                       "Authorization": "Bearer " + (os.environ.get("TOK") or "")})
          try:
              with urllib.request.urlopen(req, timeout=200) as r:
                  out["code"] = r.status
                  d = json.loads(r.read().decode("utf-8", "replace") or "{}")
                  out["answer"] = d.get("answer")
                  out["sources"] = [s for s in (d.get("sources") or [])
                                 if isinstance(s, dict) and str(s.get("url", "")).startswith(("https://", "http://"))][:12]
                  out["model"] = d.get("model")
                  out["verified"] = d.get("verified")
          except urllib.error.HTTPError as e:
              out["code"] = e.code
              out["error"] = "the road refused the call"
          except Exception as e:
              out["error"] = type(e).__name__
          print(json.dumps(out))
          PY
          EOS
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d = json.load(open("/tmp/answer.json"))
          print("## research-ask\n")
          if not d.get("reachable"):
              print("**The NAS did not answer.** Nothing was asked.")
              raise SystemExit(0)
          print(f"**Question.** {d.get('question','')}\n")
          print(f"**Road answered.** HTTP {d.get('code')} · model `{d.get('model')}` · "
                f"the road's own verified flag: `{d.get('verified')}`\n")
          print("> **This is a LEAD, not a finding.** The road marks every answer "
                "unverified. Nothing here may enter a lesson, a record, or a claim "
                "about our own system until something in this repo reproduces it.\n")
          a = d.get("answer") or ""
          print("### The answer\n")
          print(a if a else "_(empty)_")
          print("\n### Sources\n")
          srcs = d.get("sources") or []
          if not srcs:
              print("_none returned_")
          for s in srcs:
              u = str(s.get("url") or "")
              t = str(s.get("title") or u)
              print(f"- [{t}]({u})" if u.startswith("http") else f"- {t}")
          PY
          # Fail only when the ROAD failed, never because an answer is unwelcome.
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/answer.json"))
          if not d.get("reachable"):
              print("::error::the NAS did not answer over the tailnet"); sys.exit(1)
          if d.get("code") != 200:
              print(f"::error::/ask answered {d.get('code')}: {d.get('error')}"); sys.exit(1)
          if not (d.get("answer") or "").strip():
              print("::error::/ask answered 200 with an empty answer"); sys.exit(1)
          print("asked and answered; the sources are in the step summary.")
          PY
