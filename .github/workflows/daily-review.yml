# Daily system review — the recurring health/leverage scan (DR-0058).
#
# Runs the DETERMINISTIC, $0, read-only checks (no LLM, no spend, no runaway
# surface) and writes a system-health + leverage brief to the run summary.
# Report-only: it writes NOTHING to the repo or anywhere else.
#
# THREE-BRAKES POSTURE (binding — this is timer-class automation):
#   - BUDGET: the checks are deterministic and free (no LLM). Nothing to cap.
#     (If an LLM synthesis step is ever added, it MUST carry a token/$ budget.)
#   - CONCURRENCY LOCK: the `concurrency` group below — a new run cancels/queues,
#     never stacks.
#   - KILL-SWITCH: report-only by construction — it changes nothing, so it
#     cannot run away. Disabling = remove the schedule (see below).
#
# SHIPS INACTIVE: only `workflow_dispatch` is enabled. The daily `schedule` is
# left COMMENTED OUT. Darrell turns it on (uncomment) "with someone watching",
# per CLAUDE.md's autonomous-automation rule — never self-activating on merge.

name: daily-review

on:
  workflow_dispatch:
  # ARMED 2026-07-12 (DR-0178, "inert is a staging gate, not the resting state"):
  # enabled with Darrell present and asking to go live. Report-only + free (no
  # LLM, no repo writes) with a concurrency lock, so it cannot run away — the one
  # timer-class item whose kill-switch is "it changes nothing." 07:00 America/
  # Chicago = 12:00 UTC. To disable: re-comment the schedule below.
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: daily-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Coverage fruit queue
        run: |
          echo "## Coverage fruit (untested exports)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/fruit-scout.mjs | tail -n +1 | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Workflow conformance
        run: |
          echo "## Workflow conformance" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # --report is the FULL listing for the daily summary and exits 0 by
          # design; enforcement lives in ci.yml, which fails the build (DR-0132
          # §4). The old `|| true` here hid the exit code entirely — explicit
          # report-mode says what this is instead of swallowing it.
          node scripts/workflow-conformance.mjs --report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Tenancy guard (data isolation)
        run: |
          echo "## Tenancy guard (data isolation — DR-0060)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/tenancy-guard.mjs >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Lint + test status
        working-directory: app
        run: |
          npm ci
          echo "## Lint + tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          (npm run lint && echo "lint: clean") >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "lint: PROBLEMS" >> "$GITHUB_STEP_SUMMARY"
          (npx vitest run 2>&1 | grep -E "Test Files|Tests ") >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # Leverage is now READ FROM THE MAINTAINED LIVE SURFACES, not a frozen
      # hardcoded note (REV-0006 friction #4 / DR-0102: a review that emits stale
      # claims is itself a freshness failure — the old note cited 2026-06-13
      # findings + a "W1-W4" list as if current). The in-app OpsBoard, Quality &
      # Throughput board, and the sortable re-review backlog carry the live
      # leverage state; this step points at them instead of re-stating a snapshot
      # that rots. Keeps ship-inactive discipline (this workflow is dispatch-only).
      - name: Leverage pointer (live surfaces, not a frozen snapshot)
        run: |
          {
            echo "## Leverage — read live, not from a snapshot"
            echo "- **In-app (maintained, live):** OpsBoard (delivery-lane state), Quality & Throughput board (numbers + their why), and the sortable re-review backlog (dated commitments) — all read live from the repo/DB, so they never go stale the way a hardcoded note does."
            echo "- **The dated backlog is the leverage queue:** pull the soonest re-review item (docs/reviews/REVIEWS.md dates, surfaced in-app) and ship it through the auto-merge lane."
            echo "- **Standing model:** ORCHESTRATION-AND-VERIFICATION-OPERATING-MODEL.md (§8 delivery lane, DR-0103) + the coverage fruit queue above."
          } >> "$GITHUB_STEP_SUMMARY"
