# One-off, read-only: why did September's "internal" share change on 2026-09-30?
# Prints counts, field names and yes/no only; never a slug, description or amount.
name: family-books-probe-internal
on:
  push:
    branches: ['probe/family-books-probe-2']
concurrency: { group: family-books-probe-internal, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: tailscale/github-action@v3
        with: { authkey: '${{ secrets.TS_AUTHKEY }}' }
      - name: Read-only counts
        env: { NAS_SSH_KEY: '${{ secrets.NAS_SSH_KEY }}' }
        run: |
          set -uo pipefail
          cat > /tmp/q.sql <<'SQL'
          BEGIN READ ONLY;
          \echo == A. september rows: total|is_transfer|category transfer|either ==
          WITH s AS (SELECT * FROM transactions WHERE instance_id=(SELECT id FROM instances WHERE slug='poe-family') AND txn_date >= '2026-09-01' AND txn_date < '2026-10-01')
          SELECT count(*), count(*) FILTER (WHERE is_transfer), count(*) FILTER (WHERE lower(coalesce(category,''))='transfer'), count(*) FILTER (WHERE is_transfer OR lower(coalesce(category,''))='transfer') FROM s;
          \echo == B. flagged september IN matches 5340|OUT matches 5810|IN matches 4175|OUT matches 2147 ==
          WITH f AS (SELECT amount a FROM transactions WHERE instance_id=(SELECT id FROM instances WHERE slug='poe-family') AND txn_date >= '2026-09-01' AND txn_date < '2026-10-01' AND (is_transfer OR lower(coalesce(category,''))='transfer')),
               m AS (SELECT round(coalesce(sum(a) FILTER (WHERE a>0),0)) i, round(coalesce(-sum(a) FILTER (WHERE a<0),0)) o FROM f)
          SELECT abs(i-5340)<=1, abs(o-5810)<=1, abs(i-4175)<=1, abs(o-2147)<=1 FROM m;
          \echo == C. september rows updated today (UTC hour|who|rows|now flagged) ==
          SELECT to_char(t.updated_at AT TIME ZONE 'UTC','HH24'), CASE WHEN lower(u.email)='mrspoe06@gmail.com' THEN 'christina(created)' WHEN lower(u.email)='darrellpoe06@gmail.com' THEN 'darrell(created)' ELSE 'other' END, count(*), count(*) FILTER (WHERE t.is_transfer OR lower(coalesce(t.category,''))='transfer')
            FROM transactions t LEFT JOIN auth.users u ON u.id=t.created_by
           WHERE t.instance_id=(SELECT id FROM instances WHERE slug='poe-family') AND t.txn_date >= '2026-09-01' AND t.txn_date < '2026-10-01' AND t.updated_at >= '2026-09-30' AND t.created_at < t.updated_at - interval '1 minute'
           GROUP BY 1,2 ORDER BY 1,2;
          \echo == D. transaction edit events today (field changed|events|distinct rows|actor) ==
          SELECT k, count(*), count(DISTINCT e.record_id), coalesce(e.actor,'-')
            FROM record_events e, LATERAL jsonb_object_keys(CASE WHEN jsonb_typeof(e.changes)='object' THEN e.changes ELSE '{}'::jsonb END) k
           WHERE e.instance_id=(SELECT id FROM instances WHERE slug='poe-family') AND e.record_kind='transaction' AND e.action='update' AND e.occurred_at >= '2026-09-30'
           GROUP BY 1,4 ORDER BY 2 DESC LIMIT 30;
          \echo == E. of today's edited rows, how many are september and moved INTO transfer today (category to transfer|isTransfer to true) ==
          SELECT count(DISTINCT e.record_id) FILTER (WHERE lower(coalesce(e.changes->'category'->>'to',''))='transfer'),
                 count(DISTINCT e.record_id) FILTER (WHERE coalesce(e.changes->'isTransfer'->>'to','')='true'),
                 count(DISTINCT e.record_id) FILTER (WHERE lower(coalesce(e.changes->'category'->>'from',''))='transfer')
            FROM record_events e JOIN transactions t ON t.slug=e.record_id AND t.instance_id=e.instance_id
           WHERE e.instance_id=(SELECT id FROM instances WHERE slug='poe-family') AND e.record_kind='transaction' AND e.action='update' AND e.occurred_at >= '2026-09-30'
             AND t.txn_date >= '2026-09-01' AND t.txn_date < '2026-10-01';
          \echo == F. accounts created today|accounts total ==
          SELECT count(*) FILTER (WHERE created_at >= '2026-09-30'), count(*) FROM accounts WHERE instance_id=(SELECT id FROM instances WHERE slug='poe-family');
          \echo == G. other-account rows within 5 days of september (account|rows) ==
          SELECT account_slug, count(*) FROM transactions WHERE instance_id=(SELECT id FROM instances WHERE slug='poe-family') AND account_slug <> 'a-1782032772632' AND txn_date >= '2026-08-27' AND txn_date < '2026-10-06' GROUP BY 1 ORDER BY 1;
          ROLLBACK;
          SQL
          bash scripts/live-sql.sh '|' < /tmp/q.sql
