# trust-store-probe -- does the NAS still trust eMudhra's roots, measured before
# the trust-store fix is recorded (DR-1218)
#
# WHY (2026-10-22): eight eMudhra intermediate CA keys were found recoverable;
# browsers blocked them, but software that keeps its own trust store (Python,
# Node) still trusts them until its store is updated. The NAS scripts use the
# system store through Python's ssl. The sandbox has no route to the NAS; the
# runner joins the tailnet the way the deploy does (DR-1159, road 1).
#
# PUBLIC RUN PAGES: versions, paths, counts and public CA root names only.
#
# BRAKES (deterministic class, DR-0248: budget + lock): read only, 5 minutes,
# concurrency group `trust-store-probe`. Temporary: removed in the same PR.

name: trust-store-probe

on:
  workflow_dispatch:
  push:
    branches: [claude/node-22-trust-store]
    paths: ['.github/workflows/trust-store-probe.yml']

concurrency:
  group: trust-store-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join the tailnet (to reach the NAS)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: The NAS trust store (read only)
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -uo pipefail
          KEY="$(mktemp)"; trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$NAS_SSH_KEY" > "$KEY"; chmod 600 "$KEY"
          cat > /tmp/remote.sh <<'SH'
          echo "== python and openssl =="
          python3 -c "import sys, ssl; print(sys.version.split()[0]); print(ssl.OPENSSL_VERSION); print(ssl.get_default_verify_paths())" 2>&1
          openssl version 2>&1
          echo "== the bundle python verifies with, and the emSign roots in it =="
          B=$(python3 -c "import ssl; p=ssl.get_default_verify_paths(); print(p.cafile or p.openssl_cafile)" 2>/dev/null)
          echo "bundle: $B"
          if [ -n "$B" ] && [ -r "$B" ]; then
            echo "certs: $(grep -c 'BEGIN CERTIFICATE' "$B")"
            openssl crl2pkcs7 -nocrl -certfile "$B" 2>/dev/null | openssl pkcs7 -print_certs -noout 2>/dev/null | grep -i '^subject=.*emsign' | sed 's/^subject=//' | sort -u
            echo "emSign subjects: $(openssl crl2pkcs7 -nocrl -certfile "$B" 2>/dev/null | openssl pkcs7 -print_certs -noout 2>/dev/null | grep -ci '^subject=.*emsign')"
          fi
          echo "== certifi where python has it =="
          python3 -c "import certifi; print('certifi', certifi.__version__)" 2>&1 | tail -1
          for v in /volume1/docker/*/.venv /volume1/docker/*/venv; do [ -x "$v/bin/python" ] && echo "$v: $("$v/bin/python" -c 'import certifi; print(certifi.__version__)' 2>&1 | tail -1)"; done 2>/dev/null
          echo "== node on the NAS =="
          command -v node >/dev/null 2>&1 && node --version || echo "no host node"
          SH
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes -o LogLevel=ERROR dpoe@poetech.tail5a2f35.ts.net 'sh -s' < /tmp/remote.sh
