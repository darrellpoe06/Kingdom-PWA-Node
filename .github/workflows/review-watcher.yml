# Review watcher — drives the staged review/freshness loop (seed-review-sequences).
#
# WHY THIS EXISTS (2026-07-23, DR-0225 lineage). The dated `re-review:`
# commitments in the decision + review ledgers ARE the review backlog (DR-0075),
# but nothing ran them on a clock — the first real watcher pass found 49 of 113
# dated commitments overdue. This runner executes lib/review-watcher.js (the
# braked engine, proven in review-watcher.test.js) against the real ledgers and
# publishes the drive report — overdue (act now) + due-soon (pull forward) —
# to the run's job summary, so the backlog surfaces on a cadence instead of
# waiting for someone to open the app.
#
# ACTIVATED ON PROOF (DR-0225 / DR-0107): the watched dispatch run
# https://github.com/darrellpoe06/Kingdom-PWA-Node/actions/runs/30014172152
# (run #1, 2026-07-23 14:05 UTC) completed green in 19s — checkout → node →
# braked pass → drive report on the job summary. With the glue proven and
# every brake in place, the daily schedule below is the activation, landed
# in its own commit as this file promised.
#
# THE THREE BRAKES (CLAUDE.md — every one present before any schedule lands):
#   1. BUDGET — the engine caps items + wall-clock in-run; the job carries a
#      hard `timeout-minutes`; the run reads files and writes a summary — no
#      compute is spawned, nothing recurses.
#   2. LOCK   — concurrency group `review-watcher`, cancel-in-progress: false
#      (P34: never cancel a working run; a new fire waits, never stacks), plus
#      the engine's own single-instance lock.
#   3. KILL-SWITCH — durable + attributed: if docs/reviews/WATCHER-PAUSED.md
#      exists in the repo, the script does no work and says why (the file's
#      first line is the reason; the commit that added it is the attribution).
#      Reset = remove the file. It never auto-resumes (P11). Proven both ways
#      by a live local run 2026-07-23.

name: review-watcher

on:
  workflow_dispatch: {}
  schedule:
    # Daily at 11:23 UTC (~6:23am Central) — one braked pass per day drives
    # the review backlog onto the run summary before the working day starts.
    # Activation commit per DR-0225, on the proof run named above.
    - cron: '23 11 * * *'

permissions:
  contents: read
  issues: write  # the rolling `overdue` ledger issue (2026-07-30 actuator)

concurrency:
  group: review-watcher
  cancel-in-progress: false

jobs:
  watch:
    name: review sequences — braked watch pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the braked watcher against the real ledgers
        run: |
          set -euo pipefail
          node scripts/review-watcher.mjs | tee watch-report.md
          {
            echo "## Review watch — drive report"
            echo ""
            cat watch-report.md
          } >> "$GITHUB_STEP_SUMMARY"
      # ACTUATOR (2026-07-30 comprehensive review): 25 consecutive green runs
      # wrote step summaries nobody read while the overdue backlog grew 49→73
      # (then the same day's glob-widening measured the honest 112). Machinery
      # without an actuator is a report, not pressure — same pattern as
      # site-health's rolling `incident` issue: one open `overdue`-labeled
      # issue carries the current drive report; each daily pass updates it;
      # it closes itself the day the overdue count reaches zero.
      - name: Keep the rolling `overdue` ledger issue current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          overdue_line=$(grep -oE '\*\*Overdue \([0-9]+\)\*\*' watch-report.md | head -1 || true)
          count=$(printf '%s' "$overdue_line" | grep -oE '[0-9]+' || echo 0)
          title="review-watcher: ${count} overdue re-review commitments"
          open_issue=$(gh issue list --repo "$REPO" --label overdue --state open --search "in:title review-watcher" --json number --jq '.[0].number // ""')
          if [ "$count" = "0" ]; then
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --repo "$REPO" --comment "$(date -u +%FT%TZ) — overdue count reached ZERO. The drive is caught up."
            fi
            exit 0
          fi
          body="$(date -u +%FT%TZ) — daily drive report (run ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}):

          $(head -c 60000 watch-report.md)"
          if [ -n "$open_issue" ]; then
            gh issue edit "$open_issue" --repo "$REPO" --title "$title" --body "$body"
          else
            gh label create overdue --repo "$REPO" --color D93F0B --description "Dated re-review commitments past due (review-watcher ledger)" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$title" --label overdue --body "$body"
          fi
