          grep -q 'DOCUMENT SIGNING SMOKE: PASS' "$RUNNER_TEMP/sign.txt"
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0264-proof-before-paid-smoke.sql 2>&1 | tee "$RUNNER_TEMP/proof.txt"
          grep -q 'PROOF SMOKE: PASS' "$RUNNER_TEMP/proof.txt"
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0265-door-money-smoke.sql 2>&1 | tee "$RUNNER_TEMP/money.txt"
