          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0269-booking-calendar-smoke.sql 2>&1 | tee "$RUNNER_TEMP/booking.txt"
          grep -q 'BOOKING CALENDAR SMOKE: PASS' "$RUNNER_TEMP/booking.txt"
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0270-area-map-smoke.sql 2>&1 | tee "$RUNNER_TEMP/area.txt"
          grep -q 'AREA MAP SMOKE: PASS' "$RUNNER_TEMP/area.txt"
          # 0273 (DR-0952): a shared home says so, and the separated listings
          # of one apartment share their pictures. Needs 0160 (rentable_level,
          # room_label) and 0161 (the public photo RPC), both above.
          for f in 0160-a-door-says-what-it-is-unit-room-or-bed.sql 0161-the-landlord-orders-a-doors-pictures.sql; do
            psql -v ON_ERROR_STOP=1 -q --single-transaction -f "infra/supabase/migrations-auto/$f"
          done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0273-a-shared-home-says-so-on-the-shelf.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0273-shared-home-smoke.sql 2>&1 | tee "$RUNNER_TEMP/shared.txt"
          grep -q 'SHARED HOME SMOKE: PASS' "$RUNNER_TEMP/shared.txt"
          # 0271 (DR-0943): the upload date is the anchor, the taken date is a
          # claim. Needs the photo chain, so 0153/0154 go on before it.
          #
          # AND 0154 CANNOT GO ON AFTER 0273 WITHOUT THIS DROP (DR-0956). 0273
          # widened public_vacancy_photos()'s RETURNS TABLE with DROP + CREATE;
          # 0154's CREATE OR REPLACE carries the four-column shape, and
          # Postgres refuses the replay outright — "cannot change return type of
          # existing function". migration-replay-order-guard already enforced
          # this rule on rls-isolation.yml and could not see ci.yml, so the fix
          # went only where the guard was looking and this leg shipped red. The
          # guard now reads both files.
          psql -v ON_ERROR_STOP=1 -q -c 'DROP FUNCTION IF EXISTS public.public_vacancy_photos(uuid);'
          for f in 0153-property-timeline-photos.sql 0154-photo-captions-editable-and-archivable.sql; do
            psql -v ON_ERROR_STOP=1 -q --single-transaction -f "infra/supabase/migrations-auto/$f"
          done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0271-the-upload-date-is-the-anchor-the-taken-date-is-a-claim.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0271-photo-dates-smoke.sql 2>&1 | tee "$RUNNER_TEMP/photo-dates.txt"
          grep -q 'PHOTO DATES SMOKE: PASS' "$RUNNER_TEMP/photo-dates.txt"
          # THE CHAIN CONVERGES, which is the part a passing replay does not
          # prove on its own. Replaying 0154 left the shelf back at the
          # four-column shape — a door that borrows its sibling's pictures
          # would have silently stopped borrowing. So 0273 goes on again and
          # its smoke runs a SECOND time: whatever order the chain is replayed
          # in, it ends where it is supposed to (DR-0944's lesson, which is that
          # halfway through a chain is a real state somebody can read).
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0273-a-shared-home-says-so-on-the-shelf.sql; done
          # AND IT CONVERGES ON THE DEFINITION PRODUCTION ACTUALLY HAS (DR-0983).
          # Until 2026-10-13 this leg stopped at 0273's own public_vacancies()
          # and called the second run convergence. It was converging on a
          # composition the live database left behind three migrations ago: 0278
          # infers the level, 0280 adds the street and branches the label on it,
          # 0281 puts the room/bed descriptor back in front of that branch. So
          # the leg was GREEN on 0273's smoke while the live database failed the
          # same smoke — the regression 0281 fixes was invisible here for
          # exactly as long as this chain ended early. The second run is the
          # right place for them: the first proves 0273 in its own terms, this
          # one proves the chain's END state, which is what a replay is for.
          for f in 0278-a-bed-is-not-a-bedroom.sql 0280-the-address-shows-unless-the-family-holds-it.sql 0281-a-bed-still-says-it-is-a-bed-when-the-street-shows.sql 0283-a-held-door-shows-its-buildings-area.sql; do
            for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f "infra/supabase/migrations-auto/$f"; done
          done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0273-shared-home-smoke.sql 2>&1 | tee "$RUNNER_TEMP/shared-again.txt"
          grep -q 'SHARED HOME SMOKE: PASS' "$RUNNER_TEMP/shared-again.txt"
          # 0275 (DR-0957): a tenant waits for the landlord's yes. The whole
          # point of this migration is the DENY, so the smoke asserts it as a
          # stranger with `SET LOCAL ROLE authenticated` — postgres BYPASSES RLS
          # and the first version of the smoke, run as superuser, happily read
          # three other tenancies and called that a pass. It needs
          # rental_tenancies (0055) and door_events (0262), both already applied
          # above.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0275-a-tenant-waits-for-the-landlords-yes.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0275-portal-approval-smoke.sql 2>&1 | tee "$RUNNER_TEMP/portal.txt"
          grep -q 'PORTAL APPROVAL SMOKE: PASS' "$RUNNER_TEMP/portal.txt"
          # 0279 (DR-0976): 0275 rebuilt door_events_subject_check from 0262's
          # two values plus 'stay', DELETING 0263's 'document' and 0266's
          # 'camera'. Lease signing (three writes) and door-camera access (a
          # trigger) raised on every write for ~28 hours live while
          # rls-isolation failed 10 straight runs on 0263's smoke, which nobody
          # read. 0279 restores the UNION and gives door_events_read the
          # portal-request arm 0275 never added -- without which 0275's own
          # audit rows were written and then invisible (CASE ... ELSE false).
          # It MUST come after 0275 here, or this leg replays the bug.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0279-an-allow-list-is-added-to-never-rewritten.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0279-allow-list-smoke.sql 2>&1 | tee "$RUNNER_TEMP/allowlist.txt"
          grep -q 'ALLOW-LIST SMOKE: PASS' "$RUNNER_TEMP/allowlist.txt"
          # 0280 (DR-0977): the street shows unless the family holds it. It
          # needs 0278's public_vacancies (rentable_level_of), so 0278 goes on
          # first. Then the guard that matters most: 0280 is re-applied by the
          # replay and the isolation matrix forever, and a re-run must NEVER
          # undo a family's hold -- a held door is committed, 0280 re-applied,
          # and the door must still read after-application.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0278-a-bed-is-not-a-bedroom.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0280-the-address-shows-unless-the-family-holds-it.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0280-address-shows-smoke.sql 2>&1 | tee "$RUNNER_TEMP/address.txt"
          grep -q 'ADDRESS SHOWS SMOKE: PASS' "$RUNNER_TEMP/address.txt"
          psql -v ON_ERROR_STOP=1 -q -c "INSERT INTO auth.users (instance_id,id,aud,role,email,encrypted_password,created_at,updated_at) VALUES ('00000000-0000-0000-0000-000000000000','00000000-0000-4000-a000-0000000f0280','authenticated','authenticated','hold280@test.local','',now(),now()) ON CONFLICT (id) DO NOTHING; INSERT INTO instances (id, slug, display_name, instance_type) VALUES ('00000000-0000-4000-b000-0000000f0280','hold-280','Hold 280','business') ON CONFLICT (id) DO NOTHING; INSERT INTO rentals (id, instance_id, created_by, slug, display_name, address, city, property_type, status, address_visibility) VALUES ('00000000-0000-4000-c000-0000000f0280','00000000-0000-4000-b000-0000000f0280','00000000-0000-4000-a000-0000000f0280','HOLD-280','Held','1 Held Way','Champaign','multi-family','vacant','after-application')"
          psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0280-the-address-shows-unless-the-family-holds-it.sql
          test "$(psql -qAt -c "SELECT address_visibility FROM rentals WHERE slug = 'HOLD-280'")" = "after-application" || { echo "::error::re-applying 0280 undid a family's hold on the street"; exit 1; }
          psql -v ON_ERROR_STOP=1 -q -c "DELETE FROM rentals WHERE slug = 'HOLD-280'; DELETE FROM instances WHERE id = '00000000-0000-4000-b000-0000000f0280'"
          # 0282 (DR-0984): each door shows the apartment in its own order. It
          # needs same_apartment (0273) and 0278's public_vacancy_photos, both
          # above. The smoke proves the shelf honours sort_order again (lost in
          # 0273), that Bed B leads with the cover it chose while Bed A keeps
          # its own, and the four refusals: a door's own picture, another
          # apartment's door, a stranger's write, a stranger's read.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0282-each-door-shows-the-apartment-in-its-own-order.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0282-door-photo-order-smoke.sql 2>&1 | tee "$RUNNER_TEMP/photo-order.txt"
          grep -q 'DOOR PHOTO ORDER SMOKE: PASS' "$RUNNER_TEMP/photo-order.txt"
          # 0283 (DR-0997): a held door shows its BUILDING's area when it stored
          # none. It is the newest public_vacancies(), so it goes on LAST (0280
          # was re-applied above) and this leg ends on production's definition.
          # The smoke proves the held bed draws its building's area and lines
          # with no street, that a door's own area wins, and the two refusals:
          # another family on the same street, and "Ave" guessed as "Avenue".
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0283-a-held-door-shows-its-buildings-area.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0283-building-area-smoke.sql 2>&1 | tee "$RUNNER_TEMP/building-area.txt"
          grep -q 'BUILDING AREA SMOKE: PASS' "$RUNNER_TEMP/building-area.txt"
          # 0284 (DR-0999): the whole address and its picture archive on the
          # record. Two nullable columns and a CHECK on the archive name; the
          # smoke proves the family names an archive, a mistyped one is
          # refused by the database, a stranger cannot name it, and the open
          # shelf never carries it.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0284-the-whole-address-and-its-archive-on-the-record.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0284-archive-on-the-record-smoke.sql 2>&1 | tee "$RUNNER_TEMP/archive-record.txt"
          grep -q 'ARCHIVE ON THE RECORD SMOKE: PASS' "$RUNNER_TEMP/archive-record.txt"
          # 0285 (DR-1002): a NAS picture is filed on a door once and says
          # where it came from. One column, one shape CHECK, one partial
          # unique index; the smoke proves the second copy is refused, the
          # sibling door is allowed, a non-NAS source is refused, and a
          # stranger cannot file one.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0285-a-nas-picture-is-filed-once.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0285-nas-picture-once-smoke.sql 2>&1 | tee "$RUNNER_TEMP/nas-once.txt"
          grep -q 'NAS PICTURE ONCE SMOKE: PASS' "$RUNNER_TEMP/nas-once.txt"
          # 0286 (DR-1003): a door is priced by any cadence. Weekly and
          # every-two-weeks prices and what the building offers come through
          # the public shelf (the function is dropped and widened), and a
          # private room is offered before a bed. The smoke proves the prices
          # come through, NULL never reads as $0, a rate below zero is
          # refused, and the building's note is lent within the family only.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0286-a-door-is-priced-by-any-cadence.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0286-any-cadence-smoke.sql 2>&1 | tee "$RUNNER_TEMP/any-cadence.txt"
          grep -q 'ANY CADENCE SMOKE: PASS' "$RUNNER_TEMP/any-cadence.txt"
          # 0287 (DR-1007): a landlord gets their own space by their own hand.
          # claim_landlord_space(path) mints a landlord-type instance owned by
          # the caller ('properties'), and the person's family home beside it
          # ('poetech'); a seat already held comes back as 'already'. 0056
          # first: this database still carries schema-v1's recursive instances
          # policy, and the smoke's cross-tenant read needs the live shape.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0056-fix-instances-policy-recursion.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0287-a-landlord-gets-their-own-space.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0287-landlord-space-smoke.sql 2>&1 | tee "$RUNNER_TEMP/landlord-space.txt"
          grep -q 'LANDLORD SPACE SMOKE: PASS' "$RUNNER_TEMP/landlord-space.txt"
          # 0288 (DR-1009): a short-stays-only season advertises the night
          # alone. public_vacancies() reads rent, weekly and every-two-weeks
          # NULL while a door is offered short-term; 'both' and 'long-term'
          # advertise them; the stored prices are untouched.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0288-a-short-stays-only-season-advertises-the-night-alone.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0288-short-stays-only-smoke.sql 2>&1 | tee "$RUNNER_TEMP/short-stays-only.txt"
          grep -q 'SHORT STAYS ONLY SMOKE: PASS' "$RUNNER_TEMP/short-stays-only.txt"
          # 0289 (DR-1010): a stay picture joins the wall with the family's yes.
          # The wording is fingerprinted by the database and signed by version
          # + hash; the three attestations and the two clocks ride the row;
          # the family approves / declines / removes; the poster's ask takes it
          # off the wall and out of the listing at once; a listing copy is a
          # real listing picture under the counsel rule; the guest card road is
          # rate-limited. Needs 0275's table absent or present (the read arm is
          # conditional, as 0279's is) and 0261's guest card.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0289-a-stay-picture-joins-the-wall-with-the-familys-yes.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0289-stay-wall-smoke.sql 2>&1 | tee "$RUNNER_TEMP/stay-wall.txt"
          grep -q 'STAY WALL SMOKE: PASS' "$RUNNER_TEMP/stay-wall.txt"
          # 0290 (DR-1016): a listing's picture list never carries the bytes.
          # The same showable set as public_vacancy_photos, without
          # storage_path; one picture at a time by id, thumbnail first, NULL
          # for a picture outside the unit's set or on an unlisted door.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0290-a-listing-list-never-carries-the-bytes.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0290-listing-bytes-smoke.sql 2>&1 | tee "$RUNNER_TEMP/listing-bytes.txt"
          grep -q 'LISTING BYTES SMOKE: PASS' "$RUNNER_TEMP/listing-bytes.txt"
          # 0291 (DR-1022): borrowing goes both ways. A listed door shows its
          # own showable pictures first, then every sibling door's in the same
          # apartment, whatever the door is and whether or not it has its own;
          # never across instances, never for a door without a unit. Same
          # RETURNS shape as 0282/0290; 0290's wrappers read it.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0291-borrowing-goes-both-ways.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0291-borrowing-both-ways-smoke.sql 2>&1 | tee "$RUNNER_TEMP/borrow-both-ways.txt"
          grep -q 'BORROW BOTH WAYS SMOKE: PASS' "$RUNNER_TEMP/borrow-both-ways.txt"
          # 0302 (DR-1098): a door keeps what its meter said. The owner files a
          # meter file and its readings; a reading cannot point at another
          # door's file, mix kWh with therms, last zero seconds or go negative;
          # a re-import replaces an hour; a member reads, while a VIEWER and a
          # stranger read nothing (hourly reads show who is home); the hourly
          # fold sums quarters and never reports a partial cost; only the
          # owner or an admin takes back a file, and its readings go with it.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0302-a-door-keeps-what-its-meter-said.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0302-door-meter-smoke.sql 2>&1 | tee "$RUNNER_TEMP/door-meter.txt"
          grep -q 'DOOR METER SMOKE: PASS' "$RUNNER_TEMP/door-meter.txt"
          # 0306 (DR-1167): a tenant sees their own tenancy, from the day it
          # became theirs. A vacant unit record claimed by a new tenant shows
          # them nothing the landlord wrote before the claim; the household
          # reads what the tenant reads; the landlord reads everything; an
          # ended tenancy keeps its history for the tenant it names and shows
          # none of it to a stranger who claims it.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0306-a-tenant-sees-their-own-tenancy-from-the-day-it-became-theirs.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0306-tenant-window-smoke.sql 2>&1 | tee "$RUNNER_TEMP/tenant-window.txt"
          grep -q 'TENANT WINDOW SMOKE: PASS' "$RUNNER_TEMP/tenant-window.txt"
          # 0307 (DR-1166): a building is counted before it is built. The owner
          # keeps a development project and every record under it (budget
          # lines, change orders, commercial bays, phase checks, the capital
          # stack); an admin writes; a member reads but does not write; a
          # VIEWER and another instance read nothing; a line cannot be filed
          # under another instance's project; a passed check and an approved
          # change order must carry their dates; a blank amount stays NULL.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0307-a-building-is-counted-before-it-is-built.sql; done
          psql -v ON_ERROR_STOP=1 -f infra/supabase/tests/0307-development-smoke.sql 2>&1 | tee "$RUNNER_TEMP/development.txt"
          grep -q 'DEVELOPMENT SMOKE: PASS' "$RUNNER_TEMP/development.txt"

  # THE REQUIRED CHECK (DR-0645). Branch protection and native auto-merge wait
  # on a check named EXACTLY "app — lint + vitest". Do NOT rename this job.
  # It runs `if: always()` because a job whose `needs` failed is otherwise
  # SKIPPED, and a skipped required check counts as passing. Here, anything but
  # success in any leg (failure, cancelled, skipped) turns this check red.
  # THE DOOR JOURNEYS, END TO END (DR-0934). Every other leg stops short of the
  # whole: the smokes prove the walls with no app, vitest proves the screens on
  # a fake data layer. This one walks what a person walks, in the runner's
  # Chrome, on the real built app, through PostgREST 12.2.12 (production's
  # version) over a PostgreSQL built from the real migration chain
  # (scripts/e2e/build-door-db.sh, 0260-0280 each applied twice), and reads the
  # database after each step: a stranger sees the place but never its street,
  # books two nights with both attestations; the family sees the address,
  # confirms the ask (the clock reads asked,confirmed); records $300 cash on the
  # door with no tenant (the door's total reads 300.00); the next stranger finds
  # those nights dark; a real phone HEIC (Chromium has no HEIC decoder, like
  # Chrome on Android) is converted on the device under production's CSP and
  # filed as a full JPEG (DR-0939). Then PROVEN TO CATCH, every run: four faults (the street
  # shown, the family unable to confirm, money refused without a tenancy, the
  # calendar emptied) must each fail their own step, or this leg is red.
  door-journeys:
    name: app — door journeys end to end (Chrome + PostgREST + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      E2E_PSQL: psql
      E2E_DB_URI: postgres://postgres:postgres@localhost:5432/postgres
      E2E_POSTGREST: ${{ github.workspace }}/.e2e/postgrest
      E2E_SHOTS: ${{ github.workspace }}/e2e-shots
      E2E_HEIC: ${{ github.workspace }}/.e2e/example.heic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: PostgREST 12.2.12 (pinned release, checksum verified)
        run: |
          set -euo pipefail
          mkdir -p .e2e
          curl -sSLo .e2e/postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.12/postgrest-v12.2.12-linux-static-x86-64.tar.xz
          echo "5de4092f1719da3353c40bf96c8dec6913f2254a7cd0b61cc05f233153b557d5  .e2e/postgrest.tar.xz" | sha256sum -c -
          tar -xJf .e2e/postgrest.tar.xz -C .e2e
          .e2e/postgrest --version
      - name: A real phone HEIC (libheif's example at v1.20.2, checksum verified)
        run: |
          set -euo pipefail
          curl -sSLo .e2e/example.heic https://raw.githubusercontent.com/strukturag/libheif/v1.20.2/examples/example.heic
          echo "7f8b363e4936c0666a25f64f3a92fda10bd8e5453be4592530b65a55dd98f3f2  .e2e/example.heic" | sha256sum -c -
      - name: The database, from the real chain
        run: scripts/e2e/build-door-db.sh
      - name: Pillow for the photo server (the NAS's listing road; a bare runner has neither Pillow nor convert)
        run: python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
      - name: Install playwright-core (drives the runner's installed Chrome)
        run: npm install --no-save playwright-core@1
      - name: Build the app against the journeys' own stack
        working-directory: app
        run: |
          set -euo pipefail
          npm ci
          VITE_SUPABASE_URL=http://127.0.0.1:4173/sb VITE_SUPABASE_ANON_KEY="$(node ../scripts/e2e/door-journeys.mjs --anon-key)" npm run build
      - name: The journeys
        run: node scripts/e2e/door-journeys.mjs app/dist
      - name: Proven to catch — each fault fails its own step
        run: |
          set -euo pipefail
          for b in street confirm payment area calendar archive source cadence share pictures; do
            echo "=== --break=$b"
            node scripts/e2e/door-journeys.mjs app/dist --break=$b
          done
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: door-journeys-screens
          path: e2e-shots
          retention-days: 14

  app:
    name: app — lint + vitest
    if: always()
    needs: [guards, vitest, probes, layout, curriculum, lesson-shares, arrivals-push, contacts-walls, voice-enrollments, dm-device-keys, learner-records, vault-walls, church-onboarding, door-work, door-journeys, withdraw-walls]
    runs-on: ubuntu-latest
    steps:
      - name: Every leg passed (lint + guards, every vitest shard, build + probes, layout, curriculum, lesson shares, lesson arrival push, contacts walls, voice consent walls, sealed-message device keys walls, learner record walls, church onboarding walls, door work orders, door journeys end to end, withdraw my words walls)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # A SUPERSEDED RUN IS NOT A FAILURE, AND MUST NOT READ AS ONE (DR-1041).
          # This used to be one `select(.value.result != "success")`, which lumps
          # `cancelled` in with `failure` and printed "required legs did not pass"
          # for both. Measured on #2186: pushing the base merge cancelled the
          # previous commit's legs mid-run, and the resulting red check woke an
          # agent that spent a full investigation to find that nothing had broken.
          # A red that means "something else happened" teaches a reader to discount
          # red, which is the same lie as a gate that always passes (DR-0076 §3).
          #
          # IT STILL EXITS 1 ON CANCELLED, DELIBERATELY. This job's name is what
          # branch protection requires (DR-0617, below). If a cancelled run could
          # report success, a superseded run would satisfy the required check with
          # its tests never having run -- a gate that passes without measuring.
          # So the exit code does not move; only the words do.
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          stopped=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "failure") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::required legs FAILED: $failed"
            [ -n "$stopped" ] && echo "::notice::also did not finish (not counted as failures): $stopped"
            exit 1
          fi
          if [ -n "$stopped" ]; then
            echo "::error::THIS RUN DID NOT FINISH -- nothing failed. Legs that never completed: $stopped. The usual cause is a newer commit on this branch cancelling this run; that newer commit has its own run, and THAT is the one that counts. Re-read the PR's checks on its current head before treating this as a break."
            exit 1
          fi
          echo "All legs passed."

  # THE REQUIRED CHECK KEEPS ITS NAME; ITS JOB CHANGED (DR-0617). Branch
  # protection requires a check with this exact name, and removing the job
  # left every PR waiting on it forever (measured 2026-09-24: #1774 green on
  # lint + vitest and still "blocked"). The n8n exports and the wf36 harness
  # are gone, so the job now proves what replaced them: n8n stays contained to
  # the files held until their replacement is proven (business-systems-guard),
  # and the guard test that fails on any new n8n call. Renaming the check is a
  # branch-protection change for the repository admin; until then the name
  # stays and the work under it is real.
  workflows:
    name: n8n workflows — wf36 gatekeeper harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: n8n stays contained to the held files (the ledger and transport guard)
        run: node scripts/business-systems-guard.mjs
