            psql -v ON_ERROR_STOP=1 -q --single-transaction -f "infra/supabase/migrations-auto/$f"
          done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0260-work-is-filed-on-the-door-not-only-on-a-tenancy.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0261-a-guest-reports-a-problem-from-inside-the-door.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0262-rent-is-reported-the-way-it-is-paid-and-every-change-keeps-its-time.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0263-a-document-is-signed-in-the-app-and-filed-where-it-belongs.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0264-a-job-can-require-proof-before-it-is-done-and-paid.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0265-the-door-keeps-its-money-with-or-without-a-tenant.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0266-a-door-camera-is-asked-for-and-given-to-whoever-the-family-chooses.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0267-a-system-keeps-its-pictures.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0269-a-short-stay-door-has-a-booking-calendar.sql; done
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0270-the-public-shelf-shows-the-area-on-a-map.sql; done
          # 0276 (DR-0982) MUST FOLLOW 0269 HERE, and this leg is the reason the
          # rule needs stating twice. 0269 creates door_stays with CREATE TABLE
          # IF NOT EXISTS, and its two length caps
          # (door_stays_guest_asks_under_30_nights, door_stays_at_most_a_year)
          # are INLINE CONSTRAINTs. Against the LIVE database the rls-isolation
          # leg uses, that CREATE is a no-op and the caps 0276 dropped stay
          # dropped. THIS leg runs on a FRESH container, so the CREATE really
          # runs and really re-creates both caps -- a state production has not
          # been in since 2026-10-11. 0276 is omitted and 0269's smoke asserts
          # the new rule, and the two disagree. 0276 guards on the table
          # existing, so it is safe anywhere after 0269.
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f infra/supabase/migrations-auto/0276-a-guest-may-stay-as-long-as-they-like.sql; done
