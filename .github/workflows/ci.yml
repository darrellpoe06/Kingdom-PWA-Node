  # A LEARNER'S RECORD: 0250'S WALLS, ON A REAL POSTGRESQL (DR-0754). 0250
  # applies twice (idempotent), then the smoke proves: a learner keeps and
  # reads his own record, the row lands under his own account even when the
  # payload lies, a second reading corrects the row instead of duplicating it,
