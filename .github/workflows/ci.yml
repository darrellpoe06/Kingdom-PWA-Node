# CI — the mechanical floor under RELEASE-TIERS.md.
# Every PR and every push to main runs lint + the Vitest suite + a real
# production build. (The wf36 n8n harness job left with n8n, DR-0617.) Nothing merges with a
# red suite, regardless of tier. Added per
# docs/99-session-notes/2026-06-11-test-coverage-analysis.md (P2); the suite runs
# without app/.env.local because vitest.config.js stubs the Supabase env (P1).
#
# The `npm run build` step (added 2026-06-23) closes a hole that twice half-broke
# the live app: lint+vitest pass even when a cross-module *named export* is
# missing (e.g. the monolith importing liveStreamEmbedUrl/latestUploadEmbedUrl
# from church-live.js before church-live.js exported them). Rollup hard-fails the
# production bundle on a missing named export, but CI never ran a build, so the
# break shipped green and only surfaced as a white screen on Vercel/in vite dev.
# Running the real build in CI makes that class of failure RED here, not in prod.
# Verification Doctrine (DR-0076): a deterministic gate, proven to catch the
# break (the church-live missing-export build failure reproduces without it).

name: CI

on:
  pull_request:
  push:
    # main, plus the release lanes — a push to a lane runs CI on that commit so
    # the checks attach to the SHA a token-opened PR uses (see auto-open-pr.yml;
    # PRs opened by GITHUB_TOKEN don't trigger pull_request workflows).
    branches: [main, 'feat/**', 'fix/**', 'merge/**', 'docs/**', 'claude/**', 'ccr-**']  # ccr-**: DR-0773
  # Required checks must also run inside the merge queue's temporary ref, or a
  # queued PR would wait forever. Harmless when the queue is off.
  merge_group:
  # keep-prs-current.yml (DR-0644) merges main into a PR branch with
  # GITHUB_TOKEN, whose push fires no `push`/`pull_request` run — so it
  # dispatches this workflow on the branch, and the required check lands on
  # the new head. The one event a GITHUB_TOKEN may fire.
  workflow_dispatch:

# A newer commit on the same branch (or PR) supersedes the older run: the old
# run's legs are cancelled so they stop holding runners the new commit needs
# (DR-0645; measured 2026-09-24, 17 CI runs queued at once). Push runs and
# pull_request runs have different refs, so they never cancel each other, and
# main is never cancelled — every main commit keeps its full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# PARALLEL, NOT SERIAL (DR-0645, 2026-09-24). Darrell: "Our processes work way
# faster than this!" The one required job used to run every gate in a single
# line: ~20 minutes a PR (run 36066491340: 22:16:29 -> 22:36:28; vitest 11:34 of
# it, the chrome-layout sweep 5:48, everything else ~2 min). The same gates now
# run as parallel legs, and the required check keeps its exact name as the
# AGGREGATOR at the bottom (job id `app`): it `needs:` every leg, runs
# `if: always()`, and fails unless EVERY leg reported success. A red, cancelled
# or skipped leg is a red required check, so nothing that used to block a merge
# stops blocking it. No gate was removed; each one moved to a leg.
#
# Test coverage is whole: `vitest --shard=i/N` splits the file list into N
# disjoint parts that together are the full suite, and every shard must pass.

jobs:
  # Lint + every node guard. Kept textually BEFORE the vitest step: the
  # verify-covers-ci-guards test reads the guard list between `npm run lint`
  # and `npx vitest run`.
  guards:
    name: app — lint + guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the lesson-dates check below reads each lesson's
          # first commit, which a shallow clone cannot see (DR-0687).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Every lesson's creation day (app/src/lib/lesson-dates.json) is re-derived
      # from git and must match what is committed — no hand-edited day, no new
      # lesson without one (DR-0687). Proven-to-catch in lesson-dates.test.js.
      - run: npm run lesson-dates:check
      # Hybrid-modular boundary gate (DR-0078 §4.1 / DR-0076): the surface-mount
      # registry stays core — mounts via lazy thunks only, is shell-only, and no
      # feature reaches back into the monolith shell (outside the dated baseline).
      # Fails the build on any new re-tangle. Also covered by vitest, but run as a
      # named step so the boundary is a visible green check.
      - run: node ../scripts/module-boundary-guard.mjs
      # Monolith line-budget freeze (DR-0078 cutover / DR-0076): the forcing
      # function the boundary gate lacked. module-boundary-guard keeps the shell
      # from being re-tangled structurally, but does not cap its SIZE — so after
      # Stage 1 the monolith kept growing (8,769 -> 9,572 lines) as net-new
      # features landed inline. This freezes the shell to bug-fixes only: its line
      # count may only go DOWN. A PR that grows app/src/poe-financial-mvp-v28.jsx
      # past the frozen budget (scripts/monolith-budget.json) HARD-FAILS here, so
      # new capability must ship as its own module. Proven-to-catch in vitest.
      - run: node ../scripts/monolith-budget-guard.mjs
      # Interconnection-loop guard (DR-0076 / 2026-06-29): fails the build if a
      # module-to-module loop declared LIVE lost the wiring that makes a destination
      # read its live source — a loop can't silently go static. Also covered by
      # vitest, run as a named step so the live-data promise is a visible check.
      - run: node ../scripts/interconnect-guard.mjs
      # Source-adapter seam guard (docs/design/SOURCE-ADAPTER-INTERFACE.md / 0066):
      # fails the build if the backbone seam migration is missing, any *-ingest.py
      # adapter lacks a PLATFORM declaration, fewer than two platforms are registered,
      # or the interface doc is absent. Proven-to-catch: the guard would have failed
      # before 0066 landed (no content_sources) and before rss-ingest.py existed
      # (only one platform declared).
      - run: node ../scripts/source-adapter-guard.mjs
      # Business-systems completion guard (Darrell 2026-07-25): decisions-ledger
      # integrity (every DR file has an INDEX row, Next-ID pointer correct) +
      # retired-n8n-transport and vendor-form-endpoint containment. Proven-to-
      # catch in vitest (business-systems-guard.test.js).
      - run: node ../scripts/business-systems-guard.mjs
      # Infra transport guard (DR-0250; the 2026-07-30 outage class): any infra
      # shell script mutating the Tailscale transport must cite RECORDED-STATE.
      # Proven-to-catch in vitest (infra-transport-guard.test.js).
      - run: node ../scripts/infra-transport-guard.mjs
      # DR-0108 capability re-sync (COMPREHENSIVE-REVIEW-STANDARD dim 5; the
      # 2026-07-30 "(your hand)" miss): a review-ledger line that parks work as
      # human-only must name why no team channel drives it, or it is a fake
      # boundary. Proven-to-catch in vitest (his-hand-guard.test.js).
      - run: node ../scripts/his-hand-guard.mjs
      # Lessons→gate citation meter (DR-0239: "a miss that leaves no gate behind
      # will recur"). Every NEW extracted lesson must name its machine check or
      # its why-no-gate; shrink-only baseline grandfathers the currently-uncited.
      # Proven-to-catch in vitest (lessons-gate-coverage.test.js).
      - run: node ../scripts/lessons-gate-coverage.mjs
      # rls-isolation matrix file-reference guard (DR-0239 gate-the-class): every
      # migration + smoke the isolation matrix names by string must exist on disk.
      # The matrix runs only when db-migrate dispatches it against prod, so a
      # dangling reference is otherwise invisible until a prod dispatch — this
      # makes it RED here. Proven-to-catch in rls-isolation-matrix-guard.test.js.
      - run: node ../scripts/rls-isolation-matrix-guard.mjs
      # A replay must converge on the CURRENT definition, never restore an older
      # one (measured live 2026-08-27: the matrix had been reverting 0144's
      # set_member_role and 0151's claim_property_access on production).
      - run: node ../scripts/migration-replay-order-guard.mjs
      # The sovereign replay must decide success by asking whether every
      # migration FILE is applied, not by comparing a ledger count to a file
      # count. Measured live 2026-09-06: renaming an already-applied migration
      # left a stale ledger row, the counts diverged, and the lane reported
      # "the app's database is BEHIND the repo" about a database that was fully
      # up to date. Proven-to-catch in replay-completeness-guard.test.js.
      - run: node ../scripts/replay-completeness-guard.mjs
      # A smoke that stops at its first statement proves nothing. Measured
      # 2026-09-12: 0209's smoke opened with two top-level PERFORM statements
      # (plpgsql-only — a syntax error at the psql top level), so psql died at
      # line 52 on every run and its fourteen listed assertions were never
      # reached. The rls-isolation leg was RED from the day it was written and
      # merged anyway, because that workflow is not a required check on the PR.
      # This makes the same mistake RED here, where it is required.
      # Proven-to-catch in smoke-sql-language-guard.test.js, against the exact
      # line that shipped.
      - run: node ../scripts/smoke-sql-language-guard.mjs
      # Widening a RETURNS TABLE with a plain CREATE OR REPLACE is refused by
      # Postgres, and because db-migrate applies each file in its own
      # transaction it rolls the WHOLE migration back (measured live
      # 2026-08-27: 0153's two derived vacancy columns took property_rooms,
      # property_photos and the rentals coordinates down with them).
      - run: node ../scripts/migration-return-type-guard.mjs

      # No-prompt guard (DR-0239 gate-the-class; the 2026-07-30 "add as debt /
      # new category button not working" report): window.prompt() is blocked /
      # a no-op in the installed standalone PWA, so any input flow built on it
      # silently dies on a phone. Fails the build if a prompt() input dialog
      # returns to app/src. Proven-to-catch in no-prompt-guard.test.js.
      - run: node ../scripts/no-prompt-guard.mjs

  # The Vitest suite, split into disjoint shards that run at the same time.
  # fail-fast is OFF so a red shard still lets the others finish and report
  # every failing test, not just the first shard's.
  vitest:
    name: app — vitest shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Python selftests, the repo-root guards, the real production build and the
  # browser probes that judge it (SW navigation, read-highlight, scripture).
  probes:
    name: app — selftests + build + probes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Python for the infra unit tests and selftests (stdlib only).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      # Transcript-loader unit tests (DR-0076 / 2026-07-06): the caption-grace
      # classification — a fresh upload's missing captions are TRANSIENT (YouTube
      # is still processing them), not a durable no-caption verdict. Proven-to-catch:
      # this fails if within_caption_grace regresses to marking a day-old sermon
      # permanently caption-less. Runs inside this required job so it gates merge.
      - name: transcript loader unit tests
        working-directory: infra/nas-sme-pipeline
        run: python3 -m unittest test_load_transcripts -v
      # Sovereign LLM-health builder unit tests (DR-0218 zero-n8n / DR-0076): the
      # pure ollama_health.build_health + is_pinned that replaced the wf-llm-health
      # n8n Code node. Proven-to-catch: fails if the pinned (2026-06-06 runaway)
      # detection or the envelope shape LlmHealth.jsx reads regresses. Gates merge.
      - name: sovereign llm-health builder unit tests
        working-directory: infra/nas-llm
        run: python3 -m unittest test_ollama_health -v
      # Scribe queue-consumer brake tests (DR-0236 / DR-0068 / DR-0225): the three
      # brakes on the whisper-queue consumer — item+time budget, single-instance
      # lock, PAUSED kill-switch with auto-pause-on-consecutive-failures — each
      # FIRED by a test, plus idempotent reprocessing. Proven-to-catch: fails if
      # any brake regresses to stacking, runaway, or silent auto-continue. Gates
      # merge — these checks ARE the governance (DR-0225).
      - name: scribe queue-consumer brake tests
        working-directory: infra/nas-scribe
        run: python3 -m unittest test_scribe_consumer -v
      # Spoken-lesson Whisper loop proofs (DR-0611): the road (voice row ->
      # transcript row -> cloud copy removed), idempotency by the database, the
      # Whisper ladder order (tower first, NAS CPU last), multipart upload shape,
      # path traversal refused, budget + lock, and the honest voice-failed row
      # after three tries. Proven-to-catch; gates merge.
      - name: lesson-voice whisper loop proofs
        working-directory: infra/nas-lesson-voice
        run: python3 -m unittest test_lesson_voice test_speaker_turns -v
      # Tower parity loop proofs (DR-0671): every measure deterministic, every
      # gap class fires on a planted defect, no single defect counts toward
      # promotion, the cross-reference excludes a verse-gate failure, the
      # brakes stop (budget: wall-clock + turns; lock; kill by ARMED-BY-RECORD
      # or services.json; time-decayed auto-pause), and the first fix
      # re-measured before/after. Proven-to-catch; gates merge.
      - name: tower parity loop proofs
        working-directory: infra/nas-lesson-parity
        run: python3 -m unittest test_lesson_parity -v
      # The NAS publishes the family key itself (DR-0613): publish to named
      # owners, steady state writes nothing, missing pieces are quiet no-ops,
      # a failed call never raises, the key is never printed. Gates merge.
      - name: family-key publisher proofs
        working-directory: infra/nas-bridge-publish
        run: python3 -m unittest test_publish_family_key -v
      # The NAS lesson builder proofs (DR-0669): the verse re-verification
      # (a one-word change fails the build), the identical prompt to every
      # writer (a writer that alters it is caught), the modes, the budget, the
      # per-row lock, the stop-paths, dormant-until-a-writer, a failed push
      # never marks the row, more than one version never auto-ships, the
      # decision's composite gated again (a merged part with a drifted verse
      # fails on that part), and a backfill never replaces a lesson. Parity:
      # the repo's own gates (band_gates.mjs) agree with the Python gates on
      # a published lesson. Gates merge.
      - name: lesson-builder proofs
        working-directory: infra/nas-lesson-builder
        run: python3 -m unittest test_lesson_builder -v
      # Sovereign photo server selftest (DR-0218 zero-n8n / DR-0076): the offline
      # logic checks for the property + family photo image server, including the
      # new list_uploaded family read-back. Proven-to-catch: fails if dest path
      # containment or the read-back regresses. Gates merge.
      - name: sovereign photo server selftest
        working-directory: infra/nas-property-photos
        run: python3 photo_server.py --selftest
      # Voice forwarder selftest (DR-0076): the NAS-side lock + road for the
      # sovereign reading voice. Proven-to-catch: fails if /speak ever accepts a
      # missing or wrong bearer, if the studio's own refusal stops passing
      # through (the DR-0394 probe reads it), if the concurrency cap stops
      # refusing immediately, or if a dark studio ever reads as this process's
      # own 200 on /health. Gates merge: this is the door in front of the GPU.
      - name: sovereign voice forwarder selftest
        working-directory: infra/voice-studio
        run: python3 voice_forwarder.py --selftest
      # Voice-lite selftest (DR-0627): the NAS's own real-audio reading voice
      # (Piper), which keeps the reader playing when the phone leaves the app.
      # Proven-to-catch: fails if /speak accepts a missing or wrong bearer, if
      # /health ever reads 200 without piper installed, if a cached paragraph
      # is synthesized twice, or if the concurrency cap stops refusing at once.
      - name: voice-lite selftest
        working-directory: infra/nas-voice-lite
        run: python3 voice_lite_server.py --selftest
      # Cams forwarder selftest (DR-0756): the locked door in front of go2rtc,
      # the family camera road. Proven-to-catch: fails if /list or /ticket ever
      # accept a missing or wrong bearer, if a source URL (credentials) leaks in
      # /list, if a ticket opens another camera, if the live cap stops refusing
      # at once, if the live time brake stops ending a stream (caught a real
      # defect on its first run), if the HLS rewrite drops the ticket from a
      # segment line, or if a dark go2rtc ever reads as this process's own 200.
      - name: cams forwarder selftest
        working-directory: infra/nas-cameras
        run: python3 cams_forwarder.py --selftest
      # Recorded loops to the NAS (DR-0775): proven-to-catch -- fails if a bad
      # config is not normalized, if a disabled camera keeps recording, if a
      # dead ffmpeg is restarted without backoff, if retention or the disk
      # budget stops pruning oldest-first, or if the clip being written is
      # ever deleted.
      - name: cams recorder selftest
        working-directory: infra/nas-cameras
        run: python3 cams_recorder.py --selftest
      # The garage opens with no video in the way (DR-0777): the Wyze cloud
      # client. Proven-to-catch -- fails if the login stops sending the API
      # key headers or the triple-md5 password, if a device without the garage
      # dongle can be told to open a door, if a double tap cycles a door twice,
      # if an expired token is not refreshed once and retried, or if the
      # credential readers invent values.
      - name: wyze cloud selftest
        working-directory: infra/nas-cameras
        run: python3 wyze_cloud.py --selftest
      # Sovereign review-queue server selftest (DR-0218 zero-n8n / DR-0076): the
      # byte-faithful port of wf-review-feed + wf-review-action. Proven-to-catch:
      # fails if the dismissed-filter, id path-containment, or status-write
      # regresses. Gates merge.
      - name: sovereign review-queue server selftest
        working-directory: infra/nas-review-feed
        run: python3 review_server.py --selftest
      # Choir-dates drainer selftest (DR-0076): the pure date/classify/patch
      # logic behind the NAS backlog dater — church-local calendar day from a
      # stream's epoch start (an 8pm EST Wednesday must not file Thursday),
      # never-invent-a-date, never-clobber a stored service_type. Gates merge.
      - name: choir-dates drainer selftest
        working-directory: infra/church-media-golive
        run: python3 choir_dates_sync.py --selftest
      # The NAS's own yt-dlp (DR-0723): pinned version + sha256, a mismatch
      # deleted and never run, a failed download retried at most every 6 h,
      # a binary answering another version refused. Offline (file:// release).
      - name: nas yt-dlp installer tests
        working-directory: infra/nas-yt-dlp
        run: sh test_install.sh
      # Blob-copy selftest (DR-0317): the pure URL/skip/parity logic behind the
      # hosted -> sovereign storage copy. The repoint moved the rows on
      # 2026-08-19 and left 455 objects behind, breaking Shay's gallery and
      # Christina's 322 team documents silently for twelve days. Proven-to-catch:
      # fails if an object name's structural slash is collapsed, if a space or
      # '+' in a real name stops being encoded, if an identical object stops
      # being skipped (a re-run must stay cheap), or if a bucket that copied
      # ZERO objects is ever allowed to read as parity GO.
      - name: storage blob-copy selftest
        working-directory: infra/nas-supabase
        run: python3 storage_sync.py --selftest
      # Content-sync planner selftest (DR-0442): the pure plan/insert/verdict
      # logic behind the hosted -> sovereign content copy. The repoint moved the
      # readers on 2026-08-19 and left the NAS writers behind: four September
      # services and 699 transcripts sat on the retired backend while The Word
      # showed "0 of 901 messages". Proven-to-catch: fails if a hosted-only row
      # is not planned, if a hosted-newer edit is not planned, if a sovereign-
      # only row (the app's own write) ever enters the plan, if the insert stops
      # being conflict-safe, or if a table that copied ZERO while hosted holds
      # more is ever allowed to read GO.
      - name: sovereign content-sync selftest
        working-directory: infra/nas-supabase
        run: python3 content_sync.py --selftest
      # Writer-target resolver selftest (DR-0442): every NAS loader now resolves
      # its backend through one function that follows REPOINT-ARMED the way the
      # deploy does (DR-0310). Proven-to-catch: fails if the record + the box's
      # own sovereign .env does not resolve to the sovereign door, if the record
      # alone (no local .env: a tower, a laptop) ever leaves the secrets file,
      # or if a missing key is ever returned blank instead of falling through.
      - name: sovereign writer-target selftest
        working-directory: infra/nas-supabase
        run: python3 sovereign_target.py --selftest
      # Sovereign Ways-brain parser selftest (DR-0219): the bounded, single-shot
      # parser that turns PRINCIPLES.md + the DR files (incl. re-review dates) into
      # the live /ways/brain.json. Proven-to-catch: fails if principle parsing, DR
      # front-matter, re-review de-dup, or the newest-first order regresses.
      - name: sovereign ways-brain parser selftest
        working-directory: infra/nas-ways
        run: python3 ways_ingest.py --selftest
      # Sovereign mail archive selftest (DR-0238): the Takeout mbox -> owned
      # index. Proven-to-catch: fails if dedupe, per-year/label stats, or
      # attachment extraction regress. Was never gated until the DR-0238
      # re-review (2026-08-11) wired it in.
      - name: sovereign mail archive selftest
        working-directory: infra/nas-mail-archive
        run: python3 mail_archive.py --selftest
      # Sovereign photos archive selftest (DR-0238 re-review / DR-0291): the
      # Takeout -> owned archive for the service that actually holds the ~200 GB.
      # Proven-to-catch on BOTH halves: the re-dating/pairing/dedupe logic, and
      # the --verify DELETION GATE itself (a flipped byte and a removed file must
      # each flip GO -> NO-GO). Photos are irreplaceable; the gate that says
      # "safe to delete" is not allowed to be theater.
      - name: sovereign photos archive selftest
        working-directory: infra/nas-photos-archive
        run: python3 photos_archive.py --selftest
      # Sovereign Supabase key minter (DR-0306). The three secrets must AGREE:
      # a JWT signed by anything other than JWT_SECRET 401s every request with a
      # message that says nothing useful, and the failure surfaces only once the
      # stack is live. Proven-to-catch at its two real risks: a key signed by the
      # WRONG secret is rejected, and a payload escalated anon -> service_role is
      # rejected. Stdlib-only on purpose — this NAS runs Python 3.8.15 and root
      # cannot import dpoe's site-packages, so an installer needing pip fails.
      - name: sovereign supabase key minter selftest
        working-directory: infra/nas-supabase
        run: python3 mint_keys.py --selftest
      # Migration parity verifier (DR-0306). The DR-0291 photos lesson in SQL:
      # a partial migration is byte-perfect -- every copied row correct, and the
      # stack still wrong because rows are missing. INTEGRITY IS NOT
      # COMPLETENESS. Proven-to-catch at the three ways this bites: tables
      # short, users left behind, and the silent one -- all 183 tables and all
      # the data present with ZERO policies, which is a total tenancy breach
      # (DR-0060) that "the data is all there" hides completely.
      - name: sovereign supabase migration parity selftest
        working-directory: infra/nas-supabase
        run: python3 migrate_verify.py --selftest
      # Cutover-sync selftest (2026-09-23): the post-repoint parity verdict —
      # a public schema object missing BY NAME is NO-GO; the live side being
      # ahead is expected; the blob gap carries its record (DR-0317). Was
      # never gated before; the pre-repoint column-plan checks ride along.
      - name: sovereign cutover-sync selftest (post-repoint parity)
        working-directory: infra/nas-supabase
        run: python3 cutover_sync.py --selftest
      # Box agent consumer (DR-0132 P1; built on Darrell's arm 2026-08-15).
      # Proven-to-catch: keyless vendor rows FAIL with the why (never spin),
      # Ollama errors land verbatim, empty responses read as failure, the
      # --max budget caps every pass, and keep_alive '0' rides every Ollama
      # call (DR-0012). Pure logic; no network or db in the selftest.
      - name: box agent consumer selftest
        working-directory: infra/nas-agent
        run: python3 agent_consumer.py --selftest
      # Table a11y gate (DR-0298) — the screen-reader sibling of large-print and
      # legibility. Measured 2026-08-14: 131 <th>, only 18 scoped, so a blind
      # steward heard values with no idea which column they were in. All 131 now
      # carry scope and this holds it at zero. Captions are tracked debt.
      # working-directory is required: this job defaults to `app`, and both
      # guards live at the repo root. Without it the step resolves
      # app/scripts/… and dies MODULE_NOT_FOUND — which is a red build, not a
      # false green, but it does mean the a11y gate never actually ran on the
      # commit that introduced it.
      - name: table a11y guard (screen-reader navigability)
        working-directory: ${{ github.workspace }}
        run: node scripts/table-a11y-guard.mjs
      # Intake auto-fix scope gate (DR-0625). A claude/intake-fix-* branch is a
      # SYSTEM fix of a low-hanging note, made by an AI session: it may change
      # only components, stylesheets and tests, 30 lines at most, with no link,
      # email, phone number or bright-line subject added. Every other branch
      # passes untouched. Selftest first, so a guard that stopped catching is red.
      - name: intake auto-fix scope guard (a system fix stays small)
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/intake-autofix-scope-guard.mjs --selftest-break
          node scripts/intake-autofix-scope-guard.mjs
      # GPU preemption gate (DR-0012 §3). A compose service that is ollama/ollama
      # AND reserves `driver: nvidia` must set OLLAMA_KEEP_ALIVE=0 — the reasoner
      # frees VRAM within ~1 s when any non-Ollama CUDA process (Premiere, C4D,
      # OBS encoding a service) wants the card. Measured 2026-08-14: church-gpu-node
      # held 5m while CITING DR-0012, node1 held 15m, both on a 12 GB 4070 — and
      # one of those boxes feeds the NovaStar -> wall. A CPU/RAM-bound Ollama is
      # out of scope and never flagged. Proven-to-catch in gpu-preemption-guard.test.js.
      - name: gpu preemption guard (a GPU Ollama yields VRAM in ~1s)
        working-directory: ${{ github.workspace }}
        run: node scripts/gpu-preemption-guard.mjs
      # Static->live sweep gate (DR-0086 / 2026-07-01, Darrell: "no static data
      # unless it's a label"). The proactive surface audit runs the dynamic-not-static
      # + reachability rubric over EVERY served surface. --fail-on=critical hard-fails
      # on an unreachable surface; --fail-on-new hard-fails if a NEW (surface,item)
      # finding appeared vs the committed audit-findings.json baseline — so a new
      # painted tile / dead-end cannot creep back in without either a fix or a
      # reviewed baseline update. Proven-to-catch in surface-audit.test.js.
      - run: node ../scripts/surface-audit.mjs --fail-on=critical --fail-on-new
      # Real production bundle. Rollup hard-fails on a missing named export, so
      # this catches the cross-module-export break that lint+vitest let through.
      #
      # STUB env (2026-07-10, the gate-tested-an-unbootable-build finding): an
      # env-less build inlines undefined into createClient (lib/supabase.js),
      # which THROWS at module scope — so the dist this job built could NEVER
      # boot, and the SW gate below was judging the heal ladder, not the
      # worker. Same rationale as vitest.config.js's stub (the header comment
      # above): the gate tests the WORKER and the boot chain, not Supabase.
      # These are the vitest stub values; they are not secrets.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://test-stub.supabase.co
          VITE_SUPABASE_ANON_KEY: test-stub-anon-key
      # Asset-size guard (DR-0595, 2026-09-23 post-incident): Cloudflare Pages
      # refuses any single file over 25 MiB, and the #1756 merge's entry chunk
      # was 26.1 MiB — CI green, deploy failed, site stale. This measures the
      # REAL dist this job just built and fails within 1 MiB of the cap, so the
      # next course or lesson that would take the site stale is caught here,
      # before a merge, not by wrangler after one. Selftest first (DR-0076 §3).
      - name: Asset-size guard — selftest (must be able to fail)
        run: node ../scripts/asset-size-guard.mjs --selftest
      - name: Asset-size guard — no built file within 1 MiB of the Pages cap
        run: node ../scripts/asset-size-guard.mjs dist
      # Service-worker-controlled navigation gate (DR-0076 / 2026-07-10 outage):
      # a fresh browser's FIRST visit is never SW-controlled, so a broken worker
      # fetch handler passes lint, vitest, the build, verify-boot, AND
      # site-health while ERR_FAILING every INSTALLED device on every visit
      # (PR #750's cache-first shell did exactly that to the whole family
      # fleet). This serves the freshly built dist the way Cloudflare Pages
      # serves poetech.us (root files, /poetech-app alias, /index.html 301,
      # sw.js no-store) and proves the SECOND — worker-controlled — navigation
      # still answers. Proven-to-catch: exits 1 against the #750 worker
      # (net::ERR_FAILED), passes the network-first worker, and fails loudly
      # if the worker never takes control (no vacuous green).
      - name: Install playwright-core (drives the runner's installed Chrome)
        run: npm install --no-save playwright-core@1
        working-directory: ${{ github.workspace }}
      - name: SW-controlled navigation gate
        run: node scripts/sw-nav-check.mjs
        working-directory: ${{ github.workspace }}
      # Chrome-layout probe selftest (DR-0239 / DR-0076 §3): proves the probe
      # CAN fail on this commit's build. The real sweep runs in the `layout`
      # leg in parallel (DR-0645); both must pass for the required check.
      - name: Chrome-layout probe — selftest (must be able to fail)
        run: node scripts/chrome-layout-probe.mjs --selftest-break
        working-directory: ${{ github.workspace }}
      # Read-highlight probe (DR-0264/DR-0265 follow-along; the 2026-08-06 miss):
      # the follow-along highlight is PAINTED, not merely called. jsdom has no
      # CSS Custom Highlight API, so read-follow.test.js could only exercise the
      # unsupported branch — and a missing `win` default made every highlight a
      # silent no-op on real hardware while all pins stayed green. This asserts
      # the pixels change in a real Chromium using the exact call shape
      # TTSControl makes. Selftest FIRST (re-introduces the defect and requires
      # the paint checks to fail — anti-theater, DR-0076 §3), then the real pass.
      - name: Read-highlight probe — selftest (must be able to fail)
        run: node scripts/read-highlight-probe.mjs --selftest-break
        working-directory: ${{ github.workspace }}
      - name: Read-highlight probe — the follow-along highlight actually paints
        run: node scripts/read-highlight-probe.mjs
        working-directory: ${{ github.workspace }}
      # Microphone probe (DR-0636, "Never recorded" on 2026-09-24): the real
      # spoken-lesson recorder, bundled and driven in Chromium with a fake
      # microphone fed a voice-level tone. Record 5 s: bytes captured, the
      # level bar moves, the take decodes to sound, playback shows. The
      # selftest mutes the microphone first and must see the silence alert and
      # "Nothing was recorded" (anti-theater, DR-0076 §3).
      - name: Microphone probe — selftest (a muted mic must be told apart)
        run: node scripts/mic-record-probe.mjs --selftest-break
        working-directory: ${{ github.workspace }}
      - name: Microphone probe — the recorder really records in a real browser
        run: node scripts/mic-record-probe.mjs
        working-directory: ${{ github.workspace }}

      # SCRIPTURE INFERENCE (DR-0281). The verse-verbatim gates prove every quote
      # matches the KJV; they cannot see an error living BETWEEN two correct
      # quotes. Issue 8 shipped Genesis 15:13's 400 years and Exodus 12:41's 430
      # as one kept schedule — both quotes verbatim, every gate green, the
      # reasoning across them wrong. This guard enforces the registry of known
      # cross-verse tensions: cite both sides in one claim and the passage must
      # name what each side measures. Selftest FIRST (re-injects the exact
      # shipped defect and requires a failure — anti-theater, DR-0076 §3).
      - name: Scripture inference guard — selftest (must be able to fail)
        run: node scripts/scripture-inference-guard.mjs --selftest-break
        working-directory: ${{ github.workspace }}
      - name: Scripture inference guard — reasoning across verses holds
        run: node scripts/scripture-inference-guard.mjs
        working-directory: ${{ github.workspace }}
  # The chrome-layout sweep (real-browser page loads, the longest single
  # step) gets its own leg with its own build, so it runs beside the shards
  # instead of after them.
  layout:
    name: app — chrome-layout probe
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://test-stub.supabase.co
          VITE_SUPABASE_ANON_KEY: test-stub-anon-key
      - name: Install playwright-core (drives the runner's installed Chrome)
        run: npm install --no-save playwright-core@1
        working-directory: ${{ github.workspace }}
      # Chrome-layout probe (DR-0239 / COMPREHENSIVE-REVIEW-STANDARD dim 4):
      # the header/chrome is MEASURED in a real browser at phone/tablet/laptop
      # widths — no page overflow, the brand reads horizontally, nothing
      # overlaps the name. jsdom cannot measure geometry, which is how the
      # 2026-07-28 letter-stacked-wordmark defect survived every prior gate.
      # The selftest-break run FIRST proves the probe can fail (anti-theater,
      # DR-0076 §3) — that selftest runs in the `probes` leg on its own build
      # of the same commit, beside this sweep (DR-0645); the real pass here
      # judges the built dist.
      - name: Chrome-layout probe — chrome measured at real widths (surface sweep)
        run: node scripts/chrome-layout-probe.mjs --sweep
        working-directory: ${{ github.workspace }}

  # THE NAS COPY OF THE CURRICULUM (DR-0677). The lessons stay in the code;
  # the sovereign database holds a synchronized copy. This leg proves, on a real
  # PostgreSQL before anything merges: 0242 applies twice (idempotent); every
  # curriculum gate passes on the code and the sync SQL is written only then;
  # the sync applies twice and the second writes nothing; the preview wall holds
  # (the 0242 smoke, which also opens the wall and must see the leak); the copy
  # READ BACK from the database is lesson-for-lesson equal to the code (parity)
  # and passes every gate AS THE DATABASE HOLDS IT; and — proven-to-catch — one
  # altered band in the database is reported by lesson id and field.
  curriculum:
    name: app — curriculum NAS copy (snapshot through PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: 0242 applies, twice (idempotent)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f ../scripts/curriculum-ci-bootstrap.sql
          for i in 1 2; do psql -v ON_ERROR_STOP=1 -q --single-transaction -f ../infra/supabase/migrations-auto/0242-the-lessons-have-a-home-on-the-nas-kept-in-step-with-the-code.sql; done
      - name: Every curriculum gate on the code, then the sync SQL (refused on any failure)
        run: npx vite-node ../scripts/curriculum-cli.mjs --sql "$RUNNER_TEMP/sync.sql" --commit "${{ github.sha }}"
      - name: The sync applies, and a second sync writes nothing
        run: |
          set -euo pipefail
          psql -At -f "$RUNNER_TEMP/sync.sql" | tee "$RUNNER_TEMP/first.txt"
          psql -At -f "$RUNNER_TEMP/sync.sql" | tee "$RUNNER_TEMP/second.txt"
          grep -qx 'WRITTEN=0' "$RUNNER_TEMP/second.txt" || { echo "::error::a second sync of the same code wrote rows"; exit 1; }
      - name: The preview wall (0242 smoke; rolls back)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f ../infra/supabase/tests/0242-curriculum-preview-smoke.sql 2>&1 | tee "$RUNNER_TEMP/smoke.txt"
          grep -q 'CURRICULUM PREVIEW SMOKE: PASS' "$RUNNER_TEMP/smoke.txt"
      - name: Read the copy back; parity with the code, and every gate on the database copy
        run: |
          set -euo pipefail
          node -e "import('../scripts/curriculum-snapshot.mjs').then((m) => process.stdout.write(m.READ_BACK_SQL))" > "$RUNNER_TEMP/readback.sql"
          psql -At -f "$RUNNER_TEMP/readback.sql" > "$RUNNER_TEMP/readback.json"
          npx vite-node ../scripts/curriculum-cli.mjs --parity "$RUNNER_TEMP/readback.json" --gate-db "$RUNNER_TEMP/readback.json" | grep -v '^PARITY-JSON='
      - name: PROVEN-TO-CATCH — one altered band in the database is named by lesson and field
        run: |
          # The runner's default shell is `bash -e`; the parity call is EXPECTED
          # to exit 1 here, so -e is turned off to read its exit code.
          set +e
          set -uo pipefail
          psql -qc "update curriculum_lesson_bands set text = text || ' (edited)' where (course_key, lesson_id, band) = (select course_key, lesson_id, band from curriculum_lesson_bands order by lesson_id, band limit 1)"
          psql -At -f "$RUNNER_TEMP/readback.sql" > "$RUNNER_TEMP/drifted.json"
          npx vite-node ../scripts/curriculum-cli.mjs --parity "$RUNNER_TEMP/drifted.json" > "$RUNNER_TEMP/drift.txt" 2>&1
          rc=$?
          grep -v '^PARITY-JSON=' "$RUNNER_TEMP/drift.txt" | head -5
          [ "$rc" -eq 1 ] || { echo "::error::parity did not fail on an altered band (exit $rc) - the witness is theater"; exit 1; }
          grep -q ':: levels' "$RUNNER_TEMP/drift.txt" || { echo "::error::parity failed without naming the field"; exit 1; }
          echo "parity caught the altered band, by lesson and field."

  # THE SHARE RECORD'S WALLS, ON A REAL POSTGRESQL (DR-0698). 0244 applies
  # twice (idempotent), then the smoke proves: a signed-out browser records a
  # share and an open and reads nothing; a sharer reads only their own; opens
  # row by row are the Governor's; shape and flood limits refuse. Every check
  # RAISEs, so a leaked grant or a widened policy is a red leg.
  lesson-shares:
