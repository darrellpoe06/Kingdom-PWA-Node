# CI — the mechanical floor under RELEASE-TIERS.md.
# Every PR and every push to main runs lint + the Vitest suite + a real
# production build + the wf36 Quality Gatekeeper harness. Nothing merges with a
# red suite, regardless of tier. Added per
# docs/99-session-notes/2026-06-11-test-coverage-analysis.md (P2); the suite runs
# without app/.env.local because vitest.config.js stubs the Supabase env (P1).
#
# The `npm run build` step (added 2026-06-23) closes a hole that twice half-broke
# the live app: lint+vitest pass even when a cross-module *named export* is
# missing (e.g. the monolith importing liveStreamEmbedUrl/latestUploadEmbedUrl
# from church-live.js before church-live.js exported them). Rollup hard-fails the
# production bundle on a missing named export, but CI never ran a build, so the
# break shipped green and only surfaced as a white screen on Vercel/in vite dev.
# Running the real build in CI makes that class of failure RED here, not in prod.
# Verification Doctrine (DR-0076): a deterministic gate, proven to catch the
# break (the church-live missing-export build failure reproduces without it).

name: CI

on:
  pull_request:
  push:
    # main, plus the release lanes — a push to a lane runs CI on that commit so
    # the checks attach to the SHA a token-opened PR uses (see auto-open-pr.yml;
    # PRs opened by GITHUB_TOKEN don't trigger pull_request workflows).
    branches: [main, 'feat/**', 'fix/**', 'merge/**', 'docs/**']
  # Required checks must also run inside the merge queue's temporary ref, or a
  # queued PR would wait forever. Harmless when the queue is off.
  merge_group:

jobs:
  app:
    # Name is load-bearing: the main-lane ruleset requires a status check named
    # exactly "app — lint + vitest". Do NOT rename this job — the build step
    # below runs INSIDE this job, so a failed build still fails this required
    # check. Renaming would orphan the required check and block every PR.
    name: app — lint + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Hybrid-modular boundary gate (DR-0078 §4.1 / DR-0076): the surface-mount
      # registry stays core — mounts via lazy thunks only, is shell-only, and no
      # feature reaches back into the monolith shell (outside the dated baseline).
      # Fails the build on any new re-tangle. Also covered by vitest, but run as a
      # named step so the boundary is a visible green check.
      - run: node ../scripts/module-boundary-guard.mjs
      # Monolith line-budget freeze (DR-0078 cutover / DR-0076): the forcing
      # function the boundary gate lacked. module-boundary-guard keeps the shell
      # from being re-tangled structurally, but does not cap its SIZE — so after
      # Stage 1 the monolith kept growing (8,769 -> 9,572 lines) as net-new
      # features landed inline. This freezes the shell to bug-fixes only: its line
      # count may only go DOWN. A PR that grows app/src/poe-financial-mvp-v28.jsx
      # past the frozen budget (scripts/monolith-budget.json) HARD-FAILS here, so
      # new capability must ship as its own module. Proven-to-catch in vitest.
      - run: node ../scripts/monolith-budget-guard.mjs
      # Interconnection-loop guard (DR-0076 / 2026-06-29): fails the build if a
      # module-to-module loop declared LIVE lost the wiring that makes a destination
      # read its live source — a loop can't silently go static. Also covered by
      # vitest, run as a named step so the live-data promise is a visible check.
      - run: node ../scripts/interconnect-guard.mjs
      - run: npx vitest run
      # Real production bundle. Rollup hard-fails on a missing named export, so
      # this catches the cross-module-export break that lint+vitest let through.
      - run: npm run build

  workflows:
    name: n8n workflows — wf36 gatekeeper harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-wf36-quality-gatekeeper.js
