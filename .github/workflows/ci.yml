  # vacant door and on the family's own home with no tenancy; a row naming
  # neither is refused; another landlord cannot hang a row on this door; a
  # 1099 worker reads and files on the door he was granted only, as himself,
  # cannot move a job, and documents a job whose scope comes from the request
  # (a lie about the door is overwritten) and whose "fixed" closes it; a
  # manager moves jobs on his door only; a tenant never sees the landlord's
  # door work. Then 0261 applies twice and the guest smoke proves (DR-0898): only
  # the family opens a door's guest link and reads it; a guest with the card
