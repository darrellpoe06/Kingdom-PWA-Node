# property-photos-health -- the photo server's own witness (DR-0268; brought
# up to THE-WAY-A-SERVICE-COMES-HOME on 2026-10-20, the audit).
#
# The Way, step 6: a witness asks the service one real question on a schedule
# and on dispatch, and when the answer is wrong it says WHERE THE INSTALL
# STANDS before anything else. This one joins the tailnet, asks the server on
# the NAS for /healthz (503 with the reason when the family's upload folder is
# not writable), then asks ONE question with the family key -- GET /channels,
# which archives exist with their counts, the read the Properties and the
# family gallery make -- and passes only when the list comes back. Read-only
# on the box; the key is read on the NAS and never leaves it; the output is
# the judged fields only (a count of archives, never a name or a picture).
# A failing pass opens (or comments on) ONE rolling issue labelled `incident`
# + `property-photos-incident`; the next passing run closes it.
#
# Brakes: one read per run, a 12-minute job ceiling, one run at a time, a
# daily schedule.
name: property-photos-health

on:
  schedule:
    - cron: '9 14 * * *'
  workflow_dispatch:
    inputs:
      ask:
        description: 'Ask one archives read through the door with the family key (off: /healthz only)'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: property-photos-health
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check secrets (no-op with instructions when absent)
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Ask the NAS (read-only, judged fields only)
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          ASK_IN: ${{ inputs.ask }}
        run: |
          umask 077
          ASK="${ASK_IN:-true}"
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH "ASK='$ASK' sh -s" <<'EOS' > /tmp/witness.json || echo '{"reachable": false}' > /tmp/witness.json
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          TOK="$(cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null || sudo -n cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null)"
          export TOK ASK
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          out = {"reachable": True, "at": int(time.time()), "asked": os.environ.get("ASK") == "true",
                 "health_code": None, "health": None, "ask_code": None, "archives": None, "error": None}
          def call(method, path, auth=False, timeout=10):
              req = urllib.request.Request("http://127.0.0.1:8099" + path, method=method)
              if auth: req.add_header("Authorization", "Bearer " + os.environ.get("TOK", ""))
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode() or "{}")
                  except Exception: return e.code, {}
              except Exception as e:
                  return None, {"error": str(e)[:200]}
          code, h = call("GET", "/healthz")
          out["health_code"] = code
          out["health"] = {k: h.get(k) for k in ("ok", "reason")} if isinstance(h, dict) else {"reason": str(h)[:200]}
          if out["asked"] and code == 200:
              code, a = call("GET", "/channels", auth=True, timeout=30)
              out["ask_code"] = code
              items = a.get("channels") if isinstance(a, dict) and isinstance(a.get("channels"), list) else (a if isinstance(a, list) else None)
              out["archives"] = len(items) if isinstance(items, list) else (len(a) if isinstance(a, dict) and code == 200 else None)
              out["error"] = a.get("error") if isinstance(a, dict) else None
          print(json.dumps(out))
          PY
          EOS
          cat /tmp/witness.json

      - name: Judge and report
        if: steps.gate.outputs.go == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          w = json.load(open("/tmp/witness.json"))
          problems = []
          if not w.get("reachable"):
              problems.append("the NAS did not answer over SSH")
          elif w.get("health_code") != 200:
              problems.append(f"/healthz answered {w.get('health_code')}: {(w.get('health') or {}).get('reason')}")
          elif w.get("asked"):
              if w.get("ask_code") != 200:
                  problems.append(f"the door answered {w.get('ask_code')} to an archives read with the family key: {w.get('error')}")
              elif w.get("archives") is None:
                  problems.append("the door passed the request but no list of archives came back through it")
          verdict = "PASS" if not problems else "FAIL"
          lines = [f"## property-photos road: {verdict}", "", "```json", json.dumps(w, indent=2), "```"]
          if problems: lines += ["", "**Why:**"] + [f"- {p}" for p in problems]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh: fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          json.dump({"pass": not problems, "problems": problems, "witness": w}, open("/tmp/verdict.json", "w"))
          PY

      # When the road is dark, say WHERE THE INSTALL STANDS first (the Way,
      # step 6), then what each piece says for itself. Runs only on a failed
      # verdict; read-only; anything key-shaped scrubbed.
      - name: "Diagnose a dark road: where the install stands"
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/verdict.json'))['pass'] else 1)"; then
            echo "verdict passed -- nothing to diagnose"; exit 0
          fi
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH 'sh -s' <<'EOS' | sed -E 's/(Bearer|token|secret|key|password)([^ ,"]*)["=: ]+[^ ,"]+/\1\2=<scrubbed>/Ig' || true
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          REPO=/volume1/PoeTech/repos/Kingdom-PWA-Node
          rd() { cat "$1" 2>/dev/null || sudo -n cat "$1" 2>/dev/null; }
          echo "---- where the install stands ----"
          echo "repo checkout: $(git -C "$REPO" rev-parse --short HEAD 2>/dev/null || sudo -n git -C "$REPO" rev-parse --short HEAD 2>/dev/null || echo unknown)"
          SCRIPT=/volume1/PoeTech/scripts/photo_server.py
          echo "server running code: $(rd /volume1/PoeTech/scripts/.photo_server.code.sha || echo none) / repo code: $(sha256sum < "$REPO/infra/nas-property-photos/photo_server.py" 2>/dev/null | cut -c1-16) / the copy the unit runs: $(sha256sum < "$SCRIPT" 2>/dev/null | cut -c1-16)"
          echo "unit: $(systemctl is-active poetech-photo-server 2>/dev/null || echo unknown)"
          for D in /volume1/PoeTech/family-photos /volume1/PoeTech/phone-backup; do if [ -d "$D" ]; then echo "$(basename "$D"): present"; else echo "$(basename "$D"): ABSENT"; fi; done
          echo "health (loopback): $(curl -sS -m 8 http://127.0.0.1:8099/healthz 2>&1 | head -c 300)"
          TSB=/var/packages/Tailscale/target/bin/tailscale
          echo "funnel /nas-photos: $(sudo -n $TSB funnel status 2>/dev/null | grep -c '/nas-photos' || echo 0) mount line(s)"
          echo "---- last lines of the service ----"
          (journalctl -u poetech-photo-server -n 25 --no-pager 2>/dev/null || sudo -n journalctl -u poetech-photo-server -n 25 --no-pager 2>/dev/null || echo "(no journal this user can read)") | cut -c1-300
          EOS
      - name: "Ledger: a dark road is an incident; the next pass closes it"
        if: steps.gate.outputs.go == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('/tmp/verdict.json', 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'property-photos-incident';
            for (const name of ['incident', label]) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color: 'D93F0B', description: name === label ? 'The property-photos road witness ledger (DR-0268)' : 'The downtime ledger' }); }
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 5 });
            const issue = open.data.find((i) => i.title.startsWith('Property-photos road'));
            const now = new Date().toISOString();
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const foot = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const why = v.problems.map((p) => `- ${p}`).join('\n');
            if (!v.pass) {
              const body = `property-photos road failed its witness at ${now} ([run](${run})):\n${why}\n\n\`\`\`json\n${JSON.stringify(v.witness)}\n\`\`\``;
              if (!issue) await github.rest.issues.create({ owner, repo, title: 'Property-photos road is dark', body: body + foot, labels: ['incident', label] });
              else await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: body + foot });
              core.setFailed('property-photos-health: ' + v.problems.join('; '));
            } else if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `property-photos road answered again at ${now} ([run](${run})): the archives came back through the door.${foot}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
