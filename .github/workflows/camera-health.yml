# camera-health — the camera road's own witness after every deploy (DR-0806).
#
# Darrell 2026-10-07: "ways that updates don't break the connections and if
# they do we fix them expedited based on them being prioritized." A deploy
# proves the SITE (site-health.yml) but nothing proved the CAMERAS kept
# answering after the app or the NAS forwarder changed. This workflow joins
# the tailnet, asks the forwarder on the NAS for /health and /streams/health,
# probes one frame from every camera that is recording or has a watcher, and
# compares with the last run kept in the rolling `camera-incident` issue:
# fewer cameras answering, the forwarder dark, or the sampler silent is a
# REGRESSION and the issue is opened/updated with the numbers and the label
# `priority:cameras` -- the signal the lane treats as fix-now. Runs after each
# deploy completes, every 30 minutes, and on dispatch. Read-only on the box.
name: camera-health

on:
  # workflow_run below never fires in practice: the deploy is itself started by
  # a GITHUB_TOKEN dispatch and workflow_run from a token-driven run is
  # suppressed. deploy-cloudflare-pages.yml dispatches this workflow explicitly
  # after a successful deploy (found 2026-10-08, the first night). Kept so a
  # human-started deploy still chains.
  workflow_run:
    workflows: ["Deploy (Cloudflare Pages)"]
    types: [completed]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      probe_all:
        description: 'Probe one frame from EVERY stream (slow, 31 cameras), not only the watched/recording ones'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: camera-health
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check secrets (no-op with instructions when absent)
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Ask the NAS (read-only, scrubbed)
        if: steps.gate.outputs.go == 'true'
        id: nas
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          PROBE_ALL_IN: ${{ inputs.probe_all }}
          EVENT: ${{ github.event_name }}
        run: |
          umask 077
          # EVERY CAMERA, EVERY THREE HOURS (DR-1097). A pass probed only the cameras
          # recording or watched -- 2 of 31 at 18:41 on 2026-10-17 -- and a regression
          # was only a camera that answered last time going silent, so 28 cameras that
          # never answered were never an incident while Darrell said "Cameras never
          # work". The scheduled run in the first half of every third hour (UTC) now
          # probes all of them, and the judge holds those passes to a floor.
          PROBE_ALL="$PROBE_ALL_IN"
          if [ "$EVENT" = "schedule" ] && [ $((10#$(date -u +%H) % 3)) -eq 0 ] && [ $((10#$(date -u +%M))) -lt 30 ]; then PROBE_ALL=true; fi
          echo "probe_all=$PROBE_ALL ($EVENT)"
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH "PROBE_ALL='$PROBE_ALL' sh -s" <<'EOS' > /tmp/witness.json || echo '{"reachable": false}' > /tmp/witness.json
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          TOK="$(cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null || sudo -n cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null)"
          H="$(curl -s -m 8 http://127.0.0.1:8773/health)"
          SH="$(curl -s -m 8 -H "Authorization: Bearer $TOK" http://127.0.0.1:8773/streams/health)"
          REC="$(curl -s -m 8 -H "Authorization: Bearer $TOK" http://127.0.0.1:8773/recording)"
          STREAMS="$(curl -s -m 10 http://127.0.0.1:1984/api/streams)"
          # The first run (37704739922) judged the forwarder silent while cams-diag had just read it:
          # these four were shell variables, never exported, so the Python below saw none of them.
          export H SH REC STREAMS TOK
          python3 - "$PROBE_ALL" <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          probe_all = sys.argv[1] == "true"
          def load(v):
              try: return json.loads(v)
              except Exception: return None
          health = load(os.environ.get("H", "")) ; sh = load(os.environ.get("SH", "")) ; rec = load(os.environ.get("REC", "")) ; streams = load(os.environ.get("STREAMS", ""))
          out = {"reachable": True, "at": int(time.time()), "probe_all": probe_all, "health": None, "streams": 0, "probed": [], "answering": 0, "silent": [], "sampler_age_s": None, "resting": 0}
          if isinstance(health, dict):
              out["health"] = {k: health.get(k) for k in ("ok", "go2rtc", "streams", "forwarder", "on_disk", "live_open", "live_bytes_per_s", "max_live")}
              out["resting"] = len(health.get("resting") or [])
              shs = health.get("stream_health") or {}
              if shs.get("last_sample_at"): out["sampler_age_s"] = int(time.time() - float(shs["last_sample_at"]))
          ids = [k for k in (streams or {}).keys() if not (k.endswith("_sd") or k.endswith("_h264"))] if isinstance(streams, dict) else []
          out["streams"] = len(ids)
          want = set()
          if isinstance(rec, dict):
              for cid, c in ((rec.get("config") or {}).get("cameras") or {}).items():
                  if isinstance(c, dict) and c.get("enabled"): want.add(cid)
          if isinstance(sh, dict):
              for cid, c in (sh.get("cameras") or {}).items():
                  if isinstance(c, dict) and (c.get("watchers") or 0) > 0: want.add(cid)
          targets = ids if probe_all else [i for i in ids if i in want]
          # THE APP'S OWN ROAD (DR-1097, fourth read). A frame is asked of the forwarder's
          # /snap -- the road the Cameras tab takes, with its breaker, its held Kinesis
          # session and its 20 s Kinesis clock -- never of go2rtc behind its back. The tab
          # asks a camera that failed again after 30 s (SNAP_RETRY_FAILED_MS), so a camera
          # silent on the first ask is asked once more after 30 s: a camera the family sees
          # on the second ask is a camera that works, and the first-ask count is kept beside it.
          def ask(cid):
              t0 = time.time()
              try:
                  req = urllib.request.Request("http://127.0.0.1:8773/snap/" + urllib.parse.quote(cid) + ".jpg?w=640", headers={"Authorization": "Bearer " + os.environ.get("TOK", "")})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read(2 * 1024 * 1024)
                  return {"id": cid, "ok": len(body) > 0, "ms": int((time.time() - t0) * 1000), "bytes": len(body)}
              except urllib.error.HTTPError as e:
                  return {"id": cid, "ok": False, "ms": int((time.time() - t0) * 1000), "error": ("HTTP %d " % e.code + e.read(300).decode("utf-8", "replace"))[:120]}
              except Exception as e:
                  return {"id": cid, "ok": False, "ms": int((time.time() - t0) * 1000), "error": str(e)[:120]}
          first_at = {}
          for cid in sorted(targets):
              first_at[cid] = time.time()
              out["probed"].append(ask(cid))
          out["first_ask"] = sum(1 for p in out["probed"] if p["ok"])
          for p in out["probed"]:
              if p["ok"]:
                  continue
              wait = 30 - (time.time() - first_at[p["id"]])
              if wait > 0:
                  time.sleep(wait)
              again = ask(p["id"])
              p["again"] = {k: again[k] for k in again if k != "id"}
              if again["ok"]:
                  p["ok"] = True
          out["answering"] = sum(1 for p in out["probed"] if p["ok"])
          out["silent"] = [p["id"] for p in out["probed"] if not p["ok"]]
          print(json.dumps(out))
          PY
          EOS
          python3 - <<'PY'
          import json, re
          raw = open("/tmp/witness.json").read()
          # scrub anything credential-shaped before it reaches the log
          raw = re.sub(r'(?i)([?&"]?(enr|password|pass|pwd|token|api_key|key|refresh_token|access_token|secret)[=:"]+)[^&" ]*', r'\1***', raw)
          raw = re.sub(r'://[^/@\s]+@', '://***@', raw)
          try:
              w = json.loads(raw)
          except Exception:
              w = {"reachable": False}
          print(json.dumps(w, indent=1)[:6000])
          open("/tmp/witness.json", "w").write(json.dumps(w))
          PY

      - name: "Judge: a regression against the last witness becomes a prioritized incident"
        if: steps.gate.outputs.go == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const w = JSON.parse(fs.readFileSync('/tmp/witness.json', 'utf8'));
            const label = 'camera-incident';
            const prio = 'priority:cameras';
            const { owner, repo } = context.repo;
            for (const name of [label, prio]) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color: name === prio ? 'B60205' : 'D93F0B', description: name === prio ? 'Fix now: the family\'s cameras stopped answering after a change (DR-0806)' : 'The rolling camera-road witness ledger (DR-0806)' }); }
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 5 });
            let issue = open.data.find((i) => i.title.startsWith('Camera road witness'));
            // the last witness lives in the issue body as a fenced JSON block
            let last = null;
            if (issue) { const m = issue.body && issue.body.match(/```json\n([\s\S]*?)\n```/); if (m) { try { last = JSON.parse(m[1]); } catch { last = null; } } }
            const now = new Date().toISOString();
            const probedN = (w.probed || []).length;
            const reasons = [];
            if (!w.reachable || !w.health || w.health.ok !== true) reasons.push('the forwarder on the NAS did not answer /health');
            if (w.health && w.health.forwarder && w.health.on_disk && w.health.forwarder !== w.health.on_disk) reasons.push(`the forwarder runs ${w.health.forwarder} but ${w.health.on_disk} is on disk (services-sync did not restart it)`);
            if (w.sampler_age_s != null && w.sampler_age_s > 120) reasons.push(`the stream sampler is silent (${w.sampler_age_s} s since its last sample)`);
            // Compare like with like (run 37725930156, 04:07 UTC: a 2-camera pass read "1 of 2 answer; 11 did last time"
            // against a probe_all pass and raised a false regression). Only cameras BOTH runs probed are compared,
            // and a regression is one of them answering last time and silent now.
            const lastOk = new Map(((last && last.probed) || []).map((p) => [p.id, !!p.ok]));
            const common = (w.probed || []).filter((p) => lastOk.has(p.id));
            const lost = common.filter((p) => lastOk.get(p.id) && !p.ok).map((p) => p.id);
            const commonLastAns = common.filter((p) => lastOk.get(p.id)).length;
            const commonNowAns = common.filter((p) => p.ok).length;
            if (last && common.length > 0 && lost.length > 0) reasons.push(`${commonNowAns} of the ${common.length} cameras both passes probed answer a frame; ${commonLastAns} did last time (${lost.join(', ')} went silent)`);
            if (last && (last.streams || 0) > 0 && w.streams < last.streams) reasons.push(`go2rtc lists ${w.streams} cameras; it listed ${last.streams} last time`);
            // THE FLOOR (DR-1097): a pass that probed every camera is held to half of them
            // answering, whatever the last pass said. "Never worked" is an incident too.
            const FLOOR = 0.5;
            if (w.probe_all && probedN >= 4 && w.answering < Math.ceil(probedN * FLOOR)) reasons.push(`only ${w.answering} of the ${probedN} cameras give a frame on an every-camera pass (the floor is half); dark: ${(w.silent || []).join(', ')}`);
            const regression = reasons.length > 0;
            const summary = w.reachable ? `${w.answering}/${probedN} probed cameras answer${w.first_ask != null ? ` (${w.first_ask} on the first ask)` : ''} · ${w.streams} streams · ${w.resting} resting · forwarder ${w.health ? w.health.forwarder : '?'} · live ${w.health ? w.health.live_open : '?'} open, ${w.health ? Math.round((w.health.live_bytes_per_s || 0) * 8 / 1000) : '?'} kb/s` : 'the NAS was not reachable from the runner';
            const body = [
              `# Camera road witness (DR-0806)`,
              ``,
              `Updated ${now} by \`camera-health.yml\` (run ${context.runId}). The last witness is the JSON below; every run compares itself with it. A regression adds the \`${prio}\` label: fix now, before anything else in the lane.`,
              ``,
              `**Now:** ${summary}`,
              w.probe_all ? `\n**Every camera probed.** Dark now (${(w.silent || []).length}): ${(w.silent || []).join(', ') || 'none'}\n` : ``,
              regression ? `\n**REGRESSION:**\n${reasons.map((r) => `- ${r}`).join('\n')}\n` : `\n**No regression against the last witness.**\n`,
              '```json', JSON.stringify(w), '```',
              ``, `---`, `_Generated by [Claude Code](https://claude.ai/code)_`,
            ].join('\n');
            if (!issue) {
              issue = (await github.rest.issues.create({ owner, repo, title: 'Camera road witness — the rolling ledger (DR-0806)', body, labels: regression ? [label, prio] : [label] })).data;
            } else {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              const has = issue.labels.some((l) => (l.name || l) === prio);
              if (regression && !has) await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [prio] });
              if (!regression && has) { try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: prio }); } catch {} }
              if (regression) await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Regression at ${now} (run ${context.runId}):\n${reasons.map((r) => `- ${r}`).join('\n')}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_` });
            }
            core.summary.addHeading('Camera road witness').addRaw(summary + (regression ? `\n\nREGRESSION: ${reasons.join('; ')}` : '\n\nno regression')).write();
            if (regression) core.setFailed('camera road regression: ' + reasons.join('; '));

      # When the road regresses, say WHERE THE INSTALL STANDS first (THE-WAY-A-
      # SERVICE-COMES-HOME, step 6; 2026-10-20, the audit of the services born
      # before the Way): the box's checkout, the forwarder's and the recorder's
      # running code against the repo's, each unit, go2rtc and the bridge from
      # the box, the Funnel mount. Runs only after a failed judge; read-only;
      # anything key-shaped scrubbed.
      - name: "Diagnose a regression: where the install stands"
        if: steps.gate.outputs.go == 'true' && failure()
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH 'sh -s' <<'EOS' | sed -E 's/(Bearer|token|secret|key|password)([^ ,"]*)["=: ]+[^ ,"]+/\1\2=<scrubbed>/Ig' || true
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          DATA=/volume1/docker/go2rtc
          REPO=/volume1/PoeTech/repos/Kingdom-PWA-Node
          SRC="$REPO/infra/nas-cameras"
          rd() { cat "$1" 2>/dev/null || sudo -n cat "$1" 2>/dev/null; }
          echo "---- where the install stands ----"
          echo "repo checkout: $(git -C "$REPO" rev-parse --short HEAD 2>/dev/null || sudo -n git -C "$REPO" rev-parse --short HEAD 2>/dev/null || echo unknown)"
          echo "forwarder running code: $(rd "$DATA/.forwarder.code.sha" || echo none) / repo code: $(cat "$SRC/cams_forwarder.py" "$SRC/cams_recorder.py" "$SRC/wyze_cloud.py" 2>/dev/null | sha256sum | cut -c1-16)"
          echo "recorder running code: $(rd "$DATA/.recorder.code.sha" || echo none) / repo code: $(sha256sum < "$SRC/cams_recorder.py" 2>/dev/null | cut -c1-16)"
          echo "go2rtc release epoch: box $(rd "$DATA/.go2rtc.release.epoch" || echo none) / repo $(head -n 1 "$SRC/go2rtc.release-epoch" 2>/dev/null || echo none)"
          for U in poetech-cams poetech-cams-recorder; do echo "unit $U: $(systemctl is-active "$U" 2>/dev/null || echo unknown)"; done
          if [ -s "$DATA/go2rtc.yaml" ] || sudo -n test -s "$DATA/go2rtc.yaml" 2>/dev/null; then echo "config: go2rtc.yaml present"; else echo "config: go2rtc.yaml ABSENT -- never seeded"; fi
          echo "go2rtc /api (loopback): $(curl -sS -m 6 -o /dev/null -w '%{http_code}' http://127.0.0.1:1984/api 2>&1)"
          echo "forwarder /health (loopback): $(curl -sS -m 8 http://127.0.0.1:8773/health 2>&1 | head -c 300)"
          echo "wyze bridge /api (loopback): $(curl -sS -m 6 -o /dev/null -w '%{http_code}' http://127.0.0.1:8597/api 2>&1)"
          TSB=/var/packages/Tailscale/target/bin/tailscale
          echo "funnel /cams: $(sudo -n $TSB funnel status 2>/dev/null | grep -c '/cams' || echo 0) mount line(s)"
          D=""
          for CAND in docker /usr/local/bin/docker /var/packages/ContainerManager/target/usr/bin/docker; do
            command -v "$CAND" >/dev/null 2>&1 || continue
            if "$CAND" ps >/dev/null 2>&1; then D="$CAND"; break; fi
            if sudo -n "$CAND" ps >/dev/null 2>&1; then D="sudo -n $CAND"; break; fi
          done
          [ -n "$D" ] && $D ps --filter name=poetech- --format '{{.Names}} {{.Status}}' || echo "(no docker this user can run)"
          for C in poetech-go2rtc poetech-wyze-bridge; do
            echo "---- last lines of $C ----"
            [ -n "$D" ] && $D logs --tail 25 "$C" 2>&1 | cut -c1-300 || echo "(no docker this user can run)"
          done
          echo "---- last lines of the forwarder ----"
          (journalctl -u poetech-cams -n 25 --no-pager 2>/dev/null || sudo -n journalctl -u poetech-cams -n 25 --no-pager 2>/dev/null || echo "(no journal this user can read)") | cut -c1-300
          EOS
