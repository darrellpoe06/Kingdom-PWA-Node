# transcript-backfill — YouTube auto-caption harvest for @thelovecorner
#
# Two phases:
#   Phase 1: sync new channel uploads → choir_sermons (auto-detects today's
#            Bible study + rehearsal the moment YouTube publishes them).
#   Phase 2: fetch YouTube auto-captions → video_transcripts (the un-freeze:
#            the served app derives lessons/discernment/testimony/trivia/
#            Scripture sweep LIVE off these rows, no GPU, no Whisper, no n8n).
#
# Auth: uses SUPABASE_DB_URL (the session-pooler direct PostgreSQL URL, already
# a repo secret). Direct psql connection bypasses RLS -- no service-role JWT
# needed. youtube-transcript-api fetches public auto-captions; no OAuth.
#
# PROXY (required in practice): YouTube blocks GitHub-hosted runner IPs
# (RequestBlocked on every fetch -- observed run #2, 2026-07-02). Caption
# fetches only succeed from CI through a residential proxy. Set ONE of:
#   WEBSHARE_PROXY_USERNAME + WEBSHARE_PROXY_PASSWORD  (rotating residential)
#   YT_PROXY_URL  (any http(s) proxy URL with credentials inline)
# as repo secrets. Without a proxy the run exits non-zero (honest red) and
# writes nothing; the reliable no-proxy path is load-transcripts.py on the
# NAS, whose residential IP YouTube does not block.
#
# BRAKES (CLAUDE.md autonomous-automation rule):
#   (1) Budget  -- --max 50 per run (inputs.max overrides).
#   (2) Lock    -- concurrency group below (cancel-in-progress: false);
#                  a queued run waits; it does NOT stack.
#
# STATUS (corrected 2026-08-06, DR-0277): this workflow is dispatch-only NOT as
# a "kill-switch" -- DR-0248 removed that framing from the deterministic class,
# and DR-0254 ended ship-inactive-by-default -- but because THIS PATH DOES NOT
# WORK: YouTube hard-blocks GitHub runner IPs, so every scheduled fire would be
# a guaranteed red (proven, run #5 2026-07-11: all 50 attempts RequestBlocked).
# The LIVE path is the transcript-trickle rider on the NAS's residential IP
# (infra/nas-sme-pipeline/transcript_trickle_install.sh, armed by record).
# Arming the schedule below is pointless until residential proxy secrets exist;
# with them it becomes a real second lane, and then the ADDITIVE daily volume
# against the measured ~180/day IpBlocked ceiling must be budgeted in the same
# change (DR-0277 s5). The witness that this lane is stalled at all is
# harvest-health.yml, which runs outside the NAS.
#
# One-time setup: SUPABASE_DB_URL must be set as a repository secret
#   (Settings > Secrets > Actions). This is the same secret used by db-migrate.

name: transcript-backfill

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Max videos to fetch per run (0 = unlimited)'
        default: '50'
        required: false
      dry_run:
        description: 'Dry run — fetch captions but do not write to DB (true/false)'
        default: 'false'
        required: false
      ids:
        description: 'Specific video IDs (comma-separated). Leave blank = full corpus.'
        required: false
      skip_channel_sync:
        description: 'Skip Phase 1 channel sync (true/false)'
        default: 'false'
        required: false

  # SCHEDULE (THREE BRAKES: ship inactive — uncomment to enable polling for
  # today's new uploads; captions take minutes-to-hours post-publish):
  # schedule:
  #   - cron: '0 * * * *'   # hourly; the idempotency means re-runs are cheap

# Brake 2: single-instance lock. Two concurrent runs applying to the same DB
# table at once would double-insert; queuing (not cancelling) is correct here.
concurrency:
  group: transcript-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install youtube-transcript-api psycopg2-binary

      # DR-0442: this lane writes through a direct Postgres URL, and
      # SUPABASE_DB_URL names the RETIRED hosted project. The app has read the
      # sovereign stack since REPOINT-ARMED (2026-08-19), so a run here filed
      # rows into a database nobody reads — that is how 699 transcripts went
      # hosted-only. A write to the wrong backend is now an honest red instead
      # of a silent success. SOVEREIGN_DB_URL (a tailnet-reachable URL for the
      # NAS Postgres) unblocks it; without it, the live path is the NAS
      # transcript-trickle, whose loader follows the record by itself.
      - name: Refuse to write to the retired backend
        run: |
          if [ ! -f infra/nas-supabase/REPOINT-ARMED ]; then
            echo "REPOINT-ARMED absent: hosted is still the app's backend, so this lane is correct."
            exit 0
          fi
          if [ -n "${{ secrets.SOVEREIGN_DB_URL }}" ]; then
            echo "REPOINT-ARMED present and SOVEREIGN_DB_URL is set: writing to the database the app reads."
            exit 0
          fi
          echo "::error::REPOINT-ARMED is present (the app reads the sovereign stack) and SOVEREIGN_DB_URL is not set, so the only target here is the RETIRED hosted project. Nothing was written. Use the NAS transcript-trickle (infra/nas-sme-pipeline/transcript_trickle_install.sh), whose loader resolves the sovereign door itself (DR-0442), or add SOVEREIGN_DB_URL."
          exit 1

      - name: Phase 1 + 2 — channel sync + transcript backfill
        env:
          DATABASE_URL: ${{ secrets.SOVEREIGN_DB_URL || secrets.SUPABASE_DB_URL }}
          # Residential proxy (see PROXY note above); absent secrets = empty = direct.
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
        run: |
          ARGS="--slug colg --max ${{ inputs.max || '50' }}"
          if [ "${{ inputs.dry_run }}"          = "true" ]; then ARGS="$ARGS --dry-run";            fi
          if [ "${{ inputs.skip_channel_sync }}" = "true" ]; then ARGS="$ARGS --skip-channel-sync"; fi
          if [ -n "${{ inputs.ids }}" ];                    then ARGS="$ARGS --ids '${{ inputs.ids }}'"; fi
          python infra/nas-sme-pipeline/transcript-backfill-ci.py $ARGS
