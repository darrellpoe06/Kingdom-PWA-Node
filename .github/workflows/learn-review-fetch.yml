# One-off, branch-only (never merged): copy the pilot's saved review package (Actions cache) to the learn-review/pilot-results branch so it can be reviewed. Free: no provider call, no lesson touched.
name: Learn review fetch (one-off)
on:
  push:
    branches: [learn-review/fetch]
permissions:
  contents: write
concurrency: { group: learn-review-fetch, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v4
        with: { path: app/.learn-presentation, key: learn-presentation-ledger-none, restore-keys: learn-presentation-ledger- }
      - run: |
          set -euo pipefail
          L=app/.learn-presentation; ls -R $L | head -50; mkdir -p /tmp/out && cp -r $L/composed $L/review-export.json $L/state/records.json /tmp/out/
          cd /tmp/out && git init -q -b main && git add -A && git -c user.name=learn-review -c user.email=noreply@github.com commit -qm "pilot review package (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/learn-review/pilot-results
