# Showcase localize — resize the gallery originals and serve them from Cloudflare.
#
# WHY (2026-08-14, after the egress lockout). `moore-showcase` is a PUBLIC
# Supabase bucket of camera originals — 12 objects, 29.7 MB, top three 24.4 MB —
# served full-size to phones and billed against a 5 GB monthly free egress quota.
# Image transformations are not on the free plan, so the fix is to put a
# right-sized copy where Cloudflare Pages serves it: app/public/showcase/.
#
# WHY A WORKFLOW AND NOT A LOCAL SCRIPT. The cloud agent's sandbox has no route
# to supabase.co (verified: CONNECT tunnel 403). A runner does. This is the same
# channel that made site-health possible — the agent's reach is not the team's
# reach (DR-0108).
#
# NOTHING IS DELETED. The script only writes new files; the originals stay in the
# bucket as the fallback in showcaseImageUrl() and as the source for any future
# re-encode.
#
# MANUAL BY DESIGN. This is not on a schedule: it reads a bucket, spends egress
# to do so, and opens a PR. It runs when someone asks it to — after new pieces
# are uploaded, or once the project is out of restriction. (While the project is
# 402-restricted every object URL fails and the run reports every image as
# unreachable, which is honest rather than harmful.)

name: Showcase localize (resize + serve from Cloudflare)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the plan without writing files or opening a PR'
        type: boolean
        default: false

concurrency:
  group: showcase-localize
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install playwright-core + Chromium
        run: |
          npm install playwright-core --no-save
          npx playwright-core install chromium || npx playwright install chromium || true

      # Anti-theater (DR-0076 §3): prove the resizer actually shrinks a large
      # image and never upscales a small one BEFORE trusting a real run. This
      # needs no network, so it is a real gate even while the project is
      # restricted.
      - name: Selftest — the resizer must genuinely shrink
        run: node scripts/showcase-localize.mjs --selftest

      - name: Resize and localize
        run: node scripts/showcase-localize.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Open a PR with the results
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — nothing localized (the project may still be restricted)."
            exit 0
          fi
          branch="claude/showcase-localized-$(date -u +%Y%m%d%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add app/public/showcase app/src/lib/showcase-localized.json
          git commit -m "chore: localize showcase images (resized, served from Cloudflare)"
          git push -u origin "$branch"
          {
            echo "Resized copies of the \`moore-showcase\` originals, committed under"
            echo "\`app/public/showcase/\` so Cloudflare Pages serves them same-origin instead"
            echo "of billing Supabase egress."
            echo
            echo "- Originals are **untouched**; they remain the fallback in \`showcaseImageUrl()\`."
            echo "- The resizer selftest ran first and proved it actually shrinks (anti-theater)."
            echo "- Long edge capped at 1600px; small images are never upscaled; a \"resized\""
            echo "  file larger than its original is discarded rather than shipped."
            echo
            echo "See the run log for per-image before/after and the total saving."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/pr-body.md
          gh pr create --title "chore: localize showcase images (resized, served from Cloudflare)" \
            --body-file /tmp/pr-body.md --base main || echo "::warning::could not open PR"
