# Nearby witness — look an address up and list what is near it, from a runner
# (DR-0998 lineage). On the shared probe harness since DR-1342: this file is
# the trigger, the brakes and the script's arguments; _browser-probe.yml is
# the rest. Read-only; writes nothing anywhere.
name: Nearby witness
on:
  workflow_dispatch:
    inputs:
      street:
        description: 'Street address (house number first)'
        required: true
        default: '805 North Prospect Avenue'
      city:
        description: 'City'
        required: true
        default: 'Champaign'
      state:
        description: 'State'
        required: true
        default: 'Illinois'
permissions:
  contents: read
concurrency:
  group: nearby-witness
  cancel-in-progress: false
jobs:
  witness:
    uses: ./.github/workflows/_browser-probe.yml
    with:
      script: scripts/nearby-witness.mjs
      args: ${{ format('"{0}" "{1}" "{2}"', inputs.street, inputs.city, inputs.state) }}
      title: Look the address up and list what is near it
      chrome: false
      timeout-minutes: 15  # the whole query twice (2 min each) then ten kinds alone (45 s each) when it fails
