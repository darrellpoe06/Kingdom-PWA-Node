# cams-diag — the team's EYE on the camera road, from the NAS itself (DR-0774).
#
# The cloud sandbox has no route to the NAS and the Funnel exposes only the
# forwarder's allowlisted paths, so when a tile says "no frame" the agent could
# only guess. This workflow joins the tailnet (the same ephemeral runner the
# clock installer uses), SSHes to the NAS as dpoe, and prints what go2rtc
# itself says: its streams (kind + host, never a url), its recent log, the
# container's log, the forwarder's /health, and one timed frame probe for a
# named camera. Every line is scrubbed of enr/password/key/token values before
# it reaches the run log. Read-only: it changes nothing on the box.
name: cams-diag

on:
  workflow_dispatch:
    inputs:
      camera:
        description: 'A stream id to probe with one timed frame request (e.g. front_door_view). Empty = no probe.'
        type: string
        default: ''
      log_lines:
        description: 'How many recent go2rtc log lines to print'
        type: string
        default: '120'

permissions:
  contents: read

concurrency:
  group: cams-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets (no-op with instructions when absent)
        id: gate
        env:
          TS: ${{ secrets.TS_AUTHKEY != '' }}
          KEY: ${{ secrets.NAS_SSH_KEY != '' }}
        run: |
          if [ "$TS" != "true" ] || [ "$KEY" != "true" ]; then
            echo "NOT CONFIGURED: add repo secrets TS_AUTHKEY (Reusable + Ephemeral) and NAS_SSH_KEY, then re-dispatch."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join the tailnet (ephemeral)
        if: steps.gate.outputs.go == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify the tailnet actually joined
        if: steps.gate.outputs.go == 'true'
        run: |
          if ! tailscale status --peers=false >/dev/null 2>&1; then
            echo "::error::Tailnet join FAILED — TS_AUTHKEY invalid or consumed (needs Reusable + Ephemeral)."
            exit 1
          fi

      - name: What go2rtc says (read-only, scrubbed)
        if: steps.gate.outputs.go == 'true'
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          CAMERA: ${{ inputs.camera }}
          LOG_LINES: ${{ inputs.log_lines }}
        run: |
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key
          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 dpoe@poetech.tail5a2f35.ts.net"
          $SSH "CAMERA='$CAMERA' LOG_LINES='$LOG_LINES' sh -s" <<'EOS'
          PATH=/usr/local/bin:/opt/bin:/usr/bin:/bin:$PATH; export PATH
          # Scrub every credential-shaped value before anything is printed.
          # Masks by NAME and by SHAPE: a 32-hex token is a key whatever it is called (the bridge's access log carries ?api=<key> verbatim; fifth field read, DR-0809).
          scrub() { sed -E 's/([?&"]?(enr|password|pass|pwd|token|api|api_key|key|refresh_token|access_token|secret)[=:"]+)[^&" ]*/\1***/Ig; s#://[^/@ ]+@#://***@#g; s/\b[0-9a-f]{32}\b/***/g'; }
          SUDO=""; sudo -n true 2>/dev/null && SUDO="sudo -n"
          echo "=== forwarder /health (127.0.0.1:8773) ==="
          curl -s -m 8 http://127.0.0.1:8773/health | scrub; echo
          echo "=== stream-health.json (the forwarder's sampler, DR-0798; last hour per camera) ==="
          if [ -f /volume1/docker/go2rtc/stream-health.json ]; then head -c 6000 /volume1/docker/go2rtc/stream-health.json | scrub; echo; else echo "(no stream-health.json yet: the forwarder on this box predates DR-0798 or has not sampled)"; fi
          echo "=== go2rtc /api ==="
          curl -s -m 8 http://127.0.0.1:1984/api | scrub | head -c 400; echo
          echo "=== go2rtc streams: id, kind, host, state (never a url) ==="
          curl -s -m 10 http://127.0.0.1:1984/api/streams | python3 -c '
          import json,sys
          from urllib.parse import urlsplit
          d=json.load(sys.stdin)
          for k in sorted(d, key=str.lower):
              e=d[k] or {}
              for p in (e.get("producers") or []):
                  u=str(p.get("url",""))
                  try: host=urlsplit(u).hostname or ""
                  except Exception: host=""
                  print("%-40s %-6s %-16s state=%s medias=%s" % (k, u.split(":",1)[0], host, p.get("state",""), len(p.get("medias") or [])))
              if not e.get("producers"): print("%-40s (no producers)" % k)
          ' 2>&1 | scrub
          echo "=== go2rtc config SHAPE (never a value): files, size, mtime, top-level keys, stream lines, wyze block present ==="
          DATA=/volume1/docker/go2rtc
          ls -la "$DATA" 2>/dev/null || $SUDO ls -la "$DATA" 2>/dev/null || echo "(cannot list $DATA)"
          CFG="$DATA/go2rtc.yaml"
          if [ -r "$CFG" ] || $SUDO test -r "$CFG"; then
            $SUDO python3 - "$CFG" <<'PY'
          import re,sys
          lines=open(sys.argv[1],encoding="utf-8",errors="replace").read().splitlines()
          top=[l.split(":")[0] for l in lines if re.match(r"^[A-Za-z_][A-Za-z0-9_-]*:",l)]
          print("top-level keys:", top)
          n=0; i=0
          while i<len(lines) and not lines[i].startswith("streams:"): i+=1
          if i<len(lines):
              print("streams line:", lines[i][:40])
              for l in lines[i+1:]:
                  if l and not l.startswith((" ","\t")): break
                  if re.match(r"^\s{2}[^\s#].*:",l): n+=1
          print("streams defined:", n)
          print("wyze block present:", any(re.match(r"^wyze:",l) for l in lines))
          print("total lines:", len(lines))
          # THE LINE GO2RTC CANNOT READ (DR-1097, eighth read): go2rtc said "yaml: line 96:
          # could not find expected ':'" at its restart. The shape of every line that is not
          # a key, a list item, blank or a comment, and of the last 6 lines -- never a value:
          # indent, class, quote counts, length, and the key name only under streams:.
          def cls(l):
              t=l.strip()
              if not t: return "blank"
              if t.startswith("#"): return "comment"
              if t.startswith("- "): return "list-item"
              if re.match(r"^[^\s:]+:(\s|$)", t) or re.match(r'^"[^"]*":(\s|$)', t): return "key"
              return "NOT-A-KEY"
          blk=None
          for k,l in enumerate(lines, 1):
              if l and not l[0].isspace(): blk=(l.split(":")[0] if re.match(r"^[A-Za-z_][A-Za-z0-9_-]*:", l) else "<not-a-key>")
              c=cls(l)
              if c=="NOT-A-KEY" or k>len(lines)-6:
                  m=re.match(r"^\s*([A-Za-z0-9_.-]+):", l)
                  name=m.group(1) if (m and blk=="streams") else ("<key>" if c=="key" else "-")
                  print("line %d: block=%s indent=%d class=%s key=%s dq=%d sq=%d len=%d ends=%s" % (k, blk, len(l)-len(l.lstrip()), c, name, l.count('"'), l.count("'"), len(l), ("quote" if l.rstrip()[-1:] in "\"'" else "colon" if l.rstrip()[-1:] == ":" else "other") if l.strip() else "-"))
          PY
          else
            echo "(go2rtc.yaml unreadable)"
          fi
          echo "=== go2rtc /api/log (last $LOG_LINES lines, scrubbed) ==="
          curl -s -m 10 http://127.0.0.1:1984/api/log | tail -n "${LOG_LINES:-120}" | scrub
          echo "=== docker logs poetech-go2rtc (last 80 lines, scrubbed) ==="
          DOCKER=""
          for CAND in docker /usr/local/bin/docker /var/packages/ContainerManager/target/usr/bin/docker; do
            command -v "$CAND" >/dev/null 2>&1 || continue
            if "$CAND" ps >/dev/null 2>&1; then DOCKER="$CAND"; break; fi
            if $SUDO "$CAND" ps >/dev/null 2>&1; then DOCKER="$SUDO $CAND"; break; fi
          done
          if [ -n "$DOCKER" ]; then $DOCKER logs --tail 80 poetech-go2rtc 2>&1 | scrub; else echo "(docker not runnable by this user)"; fi
          # DR-1097 twelfth read: 78 of go2rtc's last 80 log lines were TURN clients failing to refresh
          # (Amazon's 401 on expired credentials, broken pipes). A live session refreshes; a session
          # nobody closed keeps failing. Count them, so the next read can tell a leak from a moment.
          echo "=== TURN refresh failures in go2rtc's last 10 minutes (Kinesis relay sessions still trying) ==="
          if [ -n "$DOCKER" ]; then $DOCKER logs --since 10m poetech-go2rtc 2>&1 | python3 -c '
          import re,sys
          lines=[l for l in sys.stdin if "Fail to refresh permissions" in l]
          peers=set(re.findall(r"->([0-9.]+:[0-9]+)", "".join(lines)))
          ids=set(re.findall(r"retransmissions failed for (\S+)", "".join(lines)))
          print("failures: %d | 401 Unauthorized: %d | broken pipe: %d | distinct relay servers: %d | distinct permission ids: %d" % (len(lines), sum("401" in l for l in lines), sum("broken pipe" in l for l in lines), len(peers), len(ids)))
          '; else echo "(docker not runnable by this user)"; fi
          echo "=== docker logs poetech-wyze-bridge (last 60 lines, scrubbed; DR-0809) ==="
          if [ -n "$DOCKER" ]; then $DOCKER logs --tail 60 poetech-wyze-bridge 2>&1 | scrub; else echo "(docker not runnable by this user)"; fi
          echo "=== the bridge's own word on each camera (connected / status / enabled; never a credential) ==="
          BENV=/volume1/PoeTech/secrets/wyze-bridge.env
          # The env file quotes its values (_env_quote); the bridge compares the bare key, so the quotes come off (sixth field read: 401 with them on).
          WBK="$($SUDO grep -s '^WB_API=' "$BENV" | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")"
          if [ -n "$WBK" ]; then
            curl -s -m 10 -H "api: $WBK" http://127.0.0.1:8597/api | python3 -c '
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception as e: print("(bridge /api unreadable: %s)" % e); sys.exit(0)
          cams=d.get("cameras") if isinstance(d,dict) else None
          if not isinstance(cams,dict): print("(no cameras key; keys=%s; error=%r)" % (list(d)[:8], d.get("error")) if isinstance(d,dict) else "(not an object)"); sys.exit(0)
          # The model and firmware say which road a camera can ride (DR-1097, third read):
          # only named, non-secret fields are printed; every other key by its name alone.
          SAFE=("model_name","product_model","firmware_ver","webrtc","webrtc_support","is_battery","dtls","is_gwell")
          keys=set()
          for k in sorted(cams):
              c=cams[k] if isinstance(cams[k],dict) else {}
              keys.update(c.keys())
              extra=" ".join("%s=%s" % (f, str(c.get(f))[:28]) for f in SAFE if f in c)
              print("%-36s connected=%-5s enabled=%-5s status=%-12s on_demand=%-5s %s" % (k, c.get("connected"), c.get("enabled"), c.get("status"), c.get("on_demand"), extra))
          print("fields the bridge reports per camera (names only): %s" % ", ".join(sorted(keys)))
          '
          else echo "(bridge env unreadable by this user)"; fi
          echo "=== the road judge, per camera (DR-1097): which road carried video, measured; never a line or a password ==="
          $SUDO cat "$DATA/bridge-roads.json" 2>/dev/null | python3 -c '
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception as e: print("(no roads record readable: %s)" % e); sys.exit(0)
          def p(x):
              if not isinstance(x,dict): return "-"
              return ("ok %d B in %d ms" % (x.get("bytes",0), x.get("ms",0))) if x.get("ok") else ("dark: %s" % str(x.get("error") or "")[:70])
          roads={}
          for sid in sorted(d):
              r=d[sid] if isinstance(d[sid],dict) else {}
              roads[r.get("road") or "direct"]=roads.get(r.get("road") or "direct",0)+1
              j=r.get("judged") if isinstance(r.get("judged"),dict) else {}
              line="%-32s road=%-6s reason=%-18s" % (sid, r.get("road") or "direct", r.get("reason") or "-")
              if j:
                  line+=" judged: %s=%s" % (j.get("current"), p(j.get("current_probe")))
                  if j.get("kvs_signal") is not None: line+=" | wyze webrtc says: %s" % str(j.get("kvs_signal"))[:60]
                  if j.get("alt"): line+=" | %s=%s" % (j.get("alt"), p(j.get("alt_probe")))
                  line+=" -> kept %s%s" % (j.get("kept"), " (DARK ON BOTH)" if j.get("dark") else "")
                  if j.get("go2rtc_said"): line+=" | go2rtc said: %s" % str(j["go2rtc_said"][-1])[:160]
              else:
                  line+=" (not judged yet)"
              print(line)
          print("roads: %s" % ", ".join("%s=%d" % kv for kv in sorted(roads.items())))
          ' 2>&1 | scrub
          echo "=== Wyze's own word: online or offline, per camera (the Wyze app's 'The device is offline'; DR-1097 sixth read) ==="
          WTOK="$(cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null || $SUDO cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null)"
          if [ -n "$WTOK" ]; then curl -s -m 25 -H "Authorization: Bearer $WTOK" http://127.0.0.1:8773/devices | python3 -c '
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception as e: print("(devices unreadable: %s)" % e); sys.exit(0)
          devs=d.get("devices") if isinstance(d,dict) else None
          if not isinstance(devs,list): print("(no devices: %s%s%s)" % (d.get("error") if isinstance(d,dict) else "?", (" -- " + str(d.get("detail"))[:160]) if isinstance(d,dict) and d.get("detail") else "", (" -- asks again in %s s" % d.get("retry_in")) if isinstance(d,dict) and d.get("retry_in") else "")); sys.exit(0)
          if isinstance(d,dict) and (d.get("age_s") is not None or d.get("wyze_wait_s")): print("(the Wyze list is %s s old%s)" % (d.get("age_s"), ("; the NAS waits %s s before asking Wyze again" % d.get("wyze_wait_s")) if d.get("wyze_wait_s") else ""))
          on=sum(1 for x in devs if x.get("online"))
          for x in sorted(devs, key=lambda x: (bool(x.get("online")), str(x.get("nickname")))):
              print("%-34s %-8s %-16s stream=%s" % (str(x.get("nickname"))[:34], "online" if x.get("online") else "OFFLINE", str(x.get("model"))[:16], x.get("stream")))
          print("Wyze says: %d online, %d offline, of %d cameras" % (on, len(devs)-on, len(devs)))
          ' 2>&1 | scrub; else echo "(token file unreadable by this user)"; fi
          # The live ends are read twice (DR-1097, eighteenth read): before the probes
          # they say how the family's own views ended; after them they must hold
          # the probe's own end, or the record is not catching what it claims to.
          live_ends() {
          if [ -n "$WTOK" ]; then curl -s -m 25 -H "Authorization: Bearer $WTOK" http://127.0.0.1:8773/streams/health | python3 -c '
          import json,sys,time
          try: d=json.load(sys.stdin)
          except Exception as e: print("(stream health unreadable: %s)" % e); sys.exit(0)
          le=d.get("live_ends") if isinstance(d,dict) else None
          if not isinstance(le,dict): print("(this forwarder does not keep live ends yet)"); sys.exit(0)
          print("by who ended it: %s" % (", ".join("%s=%d" % kv for kv in sorted(le.get("by_why",{}).items())) or "none yet"))
          now=time.time()
          for e in le.get("ends",[])[:40]:
              print("  %5ds ago  %-34s %6.1f s %7d KB  %s" % (now-e.get("at",now), str(e.get("camera"))[:34], e.get("s",0), e.get("kb",0), e.get("why")))
          ' 2>&1 | scrub; fi
          }
          echo "=== how each live view ended, newest first (DR-1097 sixteenth read: who hangs up a blinking tile) ==="
          live_ends
          echo "=== Kinesis offers Wyze never answered (go2rtc gives up when Amazon closes the idle socket, 10 min later) ==="
          curl -s -m 10 "http://127.0.0.1:1984/api/log" | grep -c 'close 1001 (going away)' || true
          echo "=== forwarder journal (last 40 lines) ==="
          $SUDO journalctl -u poetech-cams -n 40 --no-pager 2>&1 | scrub || true
          echo "=== NAS network: which LAN is this box on (the restreamer reaches only THIS LAN) ==="
          ip -4 addr show 2>/dev/null | grep -E "inet " | grep -v 127.0.0.1 || ifconfig 2>/dev/null | grep "inet " | grep -v 127.0.0.1
          if [ -n "$CAMERA" ]; then
            echo "=== one timed frame probe: $CAMERA ==="
            curl -s -m 20 -o /tmp/probe.jpg -w 'HTTP %{http_code} in %{time_total}s, %{size_download} bytes\n' "http://127.0.0.1:1984/api/frame.jpeg?src=$CAMERA" || echo "probe failed/timed out"
            if command -v strings >/dev/null 2>&1; then head -c 300 /tmp/probe.jpg 2>/dev/null | scrub | strings | head -5; fi; rm -f /tmp/probe.jpg
            echo "=== forwarder /why/$CAMERA (bearer from the box's own secret file) ==="
            TOK="$(cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null || $SUDO cat /volume1/PoeTech/secrets/chat-bridge-token.txt 2>/dev/null)"
            if [ -n "$TOK" ]; then curl -s -m 25 -H "Authorization: Bearer $TOK" "http://127.0.0.1:8773/why/$CAMERA" | scrub; echo; else echo "(token file unreadable by this user)"; fi
            echo "=== a 35s stream probe: $CAMERA (bytes received while go2rtc waits up to #timeout=30 for the on-demand camera) ==="
            curl -s -m 35 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s, %{size_download} bytes\n' "http://127.0.0.1:1984/api/stream.mp4?src=$CAMERA" || echo "stream probe ended/timed out"
            # DR-1097 fifteenth read: the road the PHONE takes. The app's build points
            # at the Funnel (deploy-cloudflare-pages.yml UNLOCK_CAMS_BASE), and every
            # instrument above asks loopback. So ask the way the tab asks: Funnel
            # hostname, Origin poetech.us, the family bearer, a ticket, then the
            # tile's own frame and its own live MP4. The bearer and the ticket are
            # never printed; only codes, sizes, timings, headers named below and
            # the codec boxes the first bytes carry.
            if [ -n "$TOK" ]; then
              for ROAD in "http://127.0.0.1:8773" "https://poetech.tail5a2f35.ts.net/cams"; do
                echo "=== the tab's own asks for $CAMERA via $ROAD ==="
                curl -s -m 25 -o /tmp/tab.jpg -D /tmp/tab.h -w '  frame ?w=640: HTTP %{http_code} in %{time_total}s, %{size_download} bytes\n' \
                  -H "Authorization: Bearer $TOK" -H 'Origin: https://poetech.us' "$ROAD/snap/$CAMERA.jpg?w=640" || echo "  frame: no answer"
                grep -i -E '^(content-type|access-control-allow-origin):' /tmp/tab.h 2>/dev/null | sed 's/^/    /' | tr -d '\r'
                TK="$(curl -s -m 15 -X POST -H "Authorization: Bearer $TOK" -H 'Origin: https://poetech.us' -H 'Content-Type: application/json' \
                  --data "{\"camera\":\"$CAMERA\"}" "$ROAD/ticket" | python3 -c 'import json,sys
          try: print(json.load(sys.stdin).get("ticket") or "")
          except Exception: print("")')"
                if [ -z "$TK" ]; then echo "  ticket: none issued"; continue; fi
                echo "  ticket: issued (never printed)"
                # DR-1097 sixteenth read (Darrell: "only stream for a few to 20
                # seconds and blinks"): 90 s of the live MP4 with a timeline, so a
                # stream the NAS ends is told apart from one the tab hangs up.
                # Bytes per 5 s, the longest silence between chunks, and when and
                # how the stream ended. Nothing but sizes and times is printed.
                { curl -sN -m 90 -D /tmp/tab.mh -H 'Origin: https://poetech.us' "$ROAD/live/$CAMERA.mp4?t=$TK"; echo "$?" > /tmp/tab.rc; } | python3 -c '
          import sys, time
          t0 = time.time(); first = None; last = t0; gap = 0.0; gap_at = 0.0; total = 0; buckets = {}; head = b""
          buf = b""; scale = 0; frags = []
          def walk(b, path):
              i = 0
              while i + 8 <= len(b):
                  n = int.from_bytes(b[i:i+4], "big"); k = b[i+4:i+8]
                  if n < 8:
                      return None
                  if k == path[0]:
                      return b[i+8:i+n] if len(path) == 1 else walk(b[i+8:i+n], path[1:])
                  i += n
              return None
          def mdhd_scale(moov):
              m = walk(moov, [b"trak", b"mdia", b"mdhd"])
              if not m:
                  return 0
              return int.from_bytes(m[20:24] if m[0] == 1 else m[12:16], "big")
          def tfdt_of(moof):
              t = walk(moof, [b"traf", b"tfdt"])
              if not t:
                  return None
              return int.from_bytes(t[4:12] if t[0] == 1 else t[4:8], "big")
          def sync_of(moof):
              t = walk(moof, [b"traf", b"trun"])
              return t is not None
          src = sys.stdin.buffer
          while True:
              c = src.read1(65536)
              now = time.time()
              if not c:
                  break
              if first is None:
                  first = now - t0
              if now - last > gap:
                  gap, gap_at = now - last, last - t0
              last = now; total += len(c)
              k = int((now - t0) // 5) * 5
              buckets[k] = buckets.get(k, 0) + len(c)
              if len(head) < 512 * 1024:
                  head += c[: 512 * 1024 - len(head)]
              buf += c
              while len(buf) >= 8:
                  n = int.from_bytes(buf[0:4], "big"); kind = buf[4:8]
                  if n < 8 or len(buf) < n:
                      break
                  box = buf[8:n]; buf = buf[n:]
                  if kind == b"moov":
                      scale = mdhd_scale(box) or scale
                  elif kind == b"moof":
                      d = tfdt_of(box)
                      if d is not None and scale:
                          frags.append((now - t0, d / float(scale), sync_of(box)))
          end = time.time() - t0
          print("  live .mp4 for up to 90 s: first byte at %s, %d bytes, ended at %.1f s" % ("%.2f s" % first if first is not None else "never", total, end))
          print("    bytes per 5 s: " + " ".join("%d:%dK" % (k, v // 1024) for k, v in sorted(buckets.items())))
          print("    longest silence between chunks: %.1f s, starting at %.1f s" % (gap, gap_at))
          # The stream own clock against the wall: a media clock that runs ahead
          # of or behind the real one makes the tab lag and freeze rules hang up a
          # stream that is still flowing (DR-1097 sixteenth read).
          if len(frags) >= 2:
              w0, m0, _x = frags[0]
              marks = [f for f in frags if f[0] - w0 >= 0]
              step = max(1, len(marks) // 9)
              print("    fragments: %d; wall s -> media s (from the first fragment): %s" % (len(frags), " ".join("%.0f->%.1f" % (w - w0, m - m0) for (w, m, _x) in marks[::step])))
              wl, ml, _x = frags[-1]
              if wl - w0 > 0:
                  print("    media clock runs at %.3f x the wall clock over %.0f s (1.000 = real time); lead at the end %+.1f s" % ((ml - m0) / (wl - w0), wl - w0, (ml - m0) - (wl - w0)))
              durs = [b[1] - a[1] for a, b in zip(frags, frags[1:])]
              print("    fragment media length: min %.2f s, max %.2f s" % (min(durs), max(durs)))
          else:
              print("    fragments: %d (no media clock read)" % len(frags))
          boxes = [k for k in (b"ftyp", b"moov", b"moof", b"mdat", b"avc1", b"avc3", b"hvc1", b"hev1", b"mp4a", b"opus") if k in head]
          print("    codec boxes in the first %d bytes: %s" % (len(head), ", ".join(x.decode() for x in boxes) or "none"))
          '
                echo "    curl exit $(cat /tmp/tab.rc 2>/dev/null) (0 = the NAS ended the stream; 28 = still flowing at 90 s)"
                grep -i -E '^(HTTP/|content-type|access-control-allow-origin|x-live-max-seconds):' /tmp/tab.mh 2>/dev/null | sed 's/^/    /' | tr -d '\r'
                rm -f /tmp/tab.jpg /tmp/tab.h /tmp/tab.mh /tmp/tab.rc
              done
            fi
            echo "=== docker logs poetech-wyze-bridge AFTER the probes (last 30 lines, scrubbed): the bridge's reaction to $CAMERA ==="
            if [ -n "$DOCKER" ]; then $DOCKER logs --tail 30 poetech-wyze-bridge 2>&1 | scrub; fi
          fi
          echo "=== how each live view ended, AFTER the probes (the probe's own 90 s views must appear here) ==="
          live_ends
          echo "=== done ==="
          EOS
