name: Kids episode media fetch (runner audio into the working branch)
# The sandbox cannot download Actions artifacts (their blob host is outside its
# network), so this copies a narration render's artifacts into the working
# branch under media-staging/, compressed (FLAC lines, MP3 auditions), where a
# git fetch reaches them. Staging only: these files are removed from the
# branch before its PR merges (the PR carries the hold label meanwhile).
on:
  push:
    paths:
      - '.github/workflows/kids-episode-media-fetch.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: kids-episode-media-fetch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ID: '44532674806'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: dl
      - name: Compress and stage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg flac >/dev/null
          mkdir -p media-staging/jonah-narration
          for d in dl/jonah-narration-*; do
            v=${d#dl/jonah-narration-}
            ffmpeg -loglevel error -y -i "$d/sample-$v/sample-$v.wav" -b:a 128k "media-staging/jonah-narration/sample-$v.mp3"
            mkdir -p "media-staging/jonah-narration/$v"
            for w in "$d/full-$v"/*.wav; do flac -s -8 -f "$w" -o "media-staging/jonah-narration/$v/$(basename "${w%.wav}").flac"; done
            sed 's/\.wav"/.flac"/g' "$d/full-$v/timings.json" > "media-staging/jonah-narration/$v/timings.json"
          done
          du -sh media-staging/jonah-narration/*
      - name: Commit to the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898309+github-actions[bot]@users.noreply.github.com"
          git add media-staging
          git commit -m "media-staging: Jonah narration renders (temporary, removed before merge)"
          git push origin HEAD:${{ github.ref_name }}
