# =============================================================================
# Ask Cloudflare itself why no Pages Function runs (#2057) — READ-ONLY
# =============================================================================
# WHY THIS EXISTS. #2057 has been open since 2026-10-09 with 35 comments, EVERY
# ONE written by a bot, every one the same observation: "NO PAGES FUNCTION IS
# RUNNING ... Cloudflare-side ... no code change in this repository reaches it."
# Five days of re-measuring the symptom, and nobody ever asked Cloudflare what it
# believes is deployed. The one attempted fix (#2060, 2026-10-09) added an
# explicit app/public/_routes.json naming 25 routes INCLUDING /automation-status
# -- and /automation-status is the exact road the probe still finds dark. So the
# stated remedy is in place AND ineffective, which nothing on the ledger says.
#
# Meanwhile every deploy reports success: "Compiled Worker successfully",
# "Uploading Functions bundle", "Uploading _routes.json", a fresh deployment URL.
# Both halves cannot be true at once, and the half nobody has read is Cloudflare's.
#
# READ-ONLY AND DISPATCH-ONLY. It GETs the live site and the Cloudflare API and
# prints what comes back. It deploys nothing, changes no setting, writes no file.
# No schedule, so it spawns nothing on a clock and carries no budget/lock/kill
# (DR-0247 governs timer-driven compute; this is a person pressing a button).
#
# NO SECRET IS PRINTED: the token is only ever a request header. What reaches the
# log is status codes, content types, names and booleans.
name: Diagnose the Pages Functions outage (#2057, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ask:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: poetech-app
      UA: "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
    steps:
      - name: Start the findings file
        run: |
          : > /tmp/findings.md
          echo "$(date -u +%FT%TZ) — **FIRST ACTUAL DIAGNOSIS.** This ledger has carried 35" >> /tmp/findings.md
          echo 'comments, every one a bot re-measuring the same symptom. Nobody had asked' >> /tmp/findings.md
          echo 'Cloudflare what it believes is deployed. This run asks. Read-only.' >> /tmp/findings.md
          echo '' >> /tmp/findings.md
          echo '```' >> /tmp/findings.md

      - name: 1. What the LIVE site serves on EVERY Function route (the truth table)
        run: |
          set -uo pipefail
          exec > >(tee -a /tmp/findings.md) 2>&1
          # ONE ROAD IS NOT THE LAYER (2026-10-17). Until this run, every
          # diagnosis of #2057 -- seven days of them -- probed exactly ONE path,
          # /automation-status, and generalized from it: "EVERY NAS-backed road
          # is dark at once: /sb sign-in, /n8n, /cams, /taxes, ...". That
          # sentence was never measured. Meanwhile site-health's OWN /sb checks
          # (status, content-type, and a real sign-in POST) were passing in the
          # same minute, so the ledger's headline and the ledger's own evidence
          # disagreed and nobody read them side by side.
          #
          # A claim about a LAYER needs more than one road. This asks each road
          # separately and prints a tally, so "all of them" and "one of them"
          # can never again look the same from outside. Only paths this
          # repository already probes elsewhere are used -- no invented health
          # routes, which would read as dark for the wrong reason.
          #
          # AND THE VERDICT IS READ, NOT INFERRED (DR-1090). The content type
          # cannot answer "did a Function run" -- a proxy's job is to return
          # somebody else's content type, and taking text/html for "the SPA
          # shell" is precisely the misreading that kept #2057 open for eight
          # days while every road was working. Each road now signs its answer
          # `x-poetech-road` (pages-function from app/functions/_lib/funnel-
          # proxy.js, worker from the zone Worker). Only code running at the
          # edge can set a response header; a static fallback sets none. The
          # content type is still printed, as a NOTE, because it is useful once
          # the verdict is already settled.
          #
          # A 502 signed by our own proxy still counts as A FUNCTION ANSWERED:
          # that is the Function running and correctly reporting the NAS
          # unreachable. This step asks whether the Function RAN, never whether
          # the NAS is well (cf-roads-worker's probe step asks that).
          RAN=0; DARK=0
          probe() {
            label="$1"; url="$2"
            body=$(mktemp); hdr=$(mktemp)
            code=$(curl -sS -o "$body" -D "$hdr" -w '%{http_code}' -A "$UA" --max-time 25 "$url" 2>/dev/null || echo 000)
            tr -d '\r' < "$hdr" > "$hdr.clean"
            road=$(awk -F': ' 'tolower($1)=="x-poetech-road"{print $2}' "$hdr.clean" | tail -1)
            ctype=$(awk -F': ' 'tolower($1)=="content-type"{print $2}' "$hdr.clean" | tail -1)
            echo "--- $label"
            echo "    url          : $url"
            echo "    http         : $code"
            # OUR OWN SHELL, IDENTIFIED POSITIVELY. Vite writes every asset of
            # this app under /poetech-app/assets/ -- eight times in
            # dist/index.html, and in no page the NAS serves. "Is this OUR
            # fallback?" is a question with an answer; "is this HTML?" is not.
            if grep -q '/poetech-app/assets/' "$body" 2>/dev/null; then shell=yes; else shell=no; fi
            echo "    signed by    : ${road:-<unsigned>}"
            echo "    our SPA shell: ${shell}"
            echo "    content-type : ${ctype:-<none>}   (a note, not the verdict)"
            echo "    first 160    : $(head -c 160 "$body" | tr '\n' ' ')"
            case "${road:-}" in
              pages-function|worker)
                echo "    VERDICT      : A FUNCTION ANSWERED (signed ${road})"; RAN=$((RAN+1)) ;;
              *)
                if [ "$shell" = "yes" ]; then
                  echo "    VERDICT      : DARK - unsigned AND our own SPA shell, so no Function ran"; DARK=$((DARK+1))
                else
                  # Both keys must agree before a road is called dark, so that a
                  # build deployed before the signature existed is never
                  # mistaken for an outage -- which is the original mistake in a
                  # new costume, and the whole point of this record.
                  echo "    VERDICT      : A FUNCTION ANSWERED (unsigned, but NOT our shell - a build older than DR-1090)"; RAN=$((RAN+1))
                fi ;;
            esac
            rm -f "$body" "$hdr" "$hdr.clean"
          }
          # Every path here is one some other probe in this repository already
          # calls, so a dark reading means the road is dark and not that the
          # path was made up: /sb/auth/v1/health, /cams/health,
          # /nas-photos/healthz and /property-history are site-health.yml's own.
          ROADS="/automation-status /sb/auth/v1/health /cams/health /nas-photos/healthz /property-history?channel=diagnose"
          for host in poetech.us poetech-app.pages.dev; do
            echo "=== https://$host ==="
            for road in $ROADS; do
              probe "$host$road" "https://$host$road"
            done
          done
          echo
          echo "=== THE TALLY: $RAN road(s) ran a Function, $DARK served the shell ==="
          if [ "$RAN" -gt 0 ] && [ "$DARK" -gt 0 ]; then
            echo "MIXED. Functions ARE being invoked on this project, so the cause is"
            echo "NOT 'every Pages Function stopped' and NOT account-wide. It is"
            echo "per-route. The roads that ran and the roads that did not are listed"
            echo "above; compare them against public/_routes.json include entries."
          elif [ "$RAN" -eq 0 ]; then
            echo "ALL DARK. No Function ran on any road on any host -- only now is the"
            echo "project-wide claim on #2057 a measured statement rather than an"
            echo "inference from one path."
          else
            echo "ALL LIT. Every road ran its Function. If sign-in is still failing,"
            echo "the fault is past the transport -- ask the NAS, not Cloudflare."
          fi

      - name: 2. Is _routes.json being served as a static asset?
        run: |
          set -uo pipefail
          exec > >(tee -a /tmp/findings.md) 2>&1
          # CORRECTED 2026-10-15 (run 38696507997 read wrong). The HTTP CODE
          # decides nothing here: a Pages SPA answers 200 to EVERY unknown path
          # with the index shell, so 200 is the normal, uninformative case. The
          # BODY decides. Only JSON means Pages is handing out the routing
          # config as a file instead of reading it -- that would darken every
          # road at once. The shell means the asset is not there to serve, which
          # is what a correctly-consumed _routes.json looks like from outside.
          for host in poetech.us poetech-app.pages.dev; do
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -A "$UA" --max-time 25 "https://$host/_routes.json" || echo 000)
            echo "--- https://$host/_routes.json -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "    NOT 200 - nothing served on this path."
            elif jq -e . /tmp/r.json >/dev/null 2>&1; then
              echo "    *** SERVED AS A STATIC FILE (the body is JSON). First 900 bytes:"
              head -c 900 /tmp/r.json
              echo
            else
              echo "    200 but the body is NOT JSON - this is the SPA shell"
              echo "    fallback, the normal answer for a path with no asset."
              echo "    It neither proves nor disproves anything about routing."
              echo "    first 160    : $(head -c 160 /tmp/r.json | tr '\n' ' ')"
            fi
          done

      - name: 3. Can the API token verify at all?
        run: |
          set -uo pipefail
          exec > >(tee -a /tmp/findings.md) 2>&1
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not available here"
            exit 1
          fi
          curl -sS --max-time 30 -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | jq -r '"  success: \(.success)  status: \(.result.status // "n/a")", (.errors[]? | "  error: \(.code) \(.message)")'

      - name: 4. The Pages project as Cloudflare holds it
        run: |
          set -uo pipefail
          exec > >(tee -a /tmp/findings.md) 2>&1
          curl -sS --max-time 30 -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT" \
            | jq -r '
              if .success then
                .result as $r |
                "  name              : \($r.name)",
                "  production_branch : \($r.production_branch)",
                "  domains           : \($r.domains | tostring)",
                "  build_config      : \($r.build_config | tostring)",
                ($r.deployment_configs.production // {}) as $p |
                "  compat_date       : \($p.compatibility_date // "unset")",
                "  compat_flags      : \($p.compatibility_flags | tostring)",
                "  usage_model       : \($p.usage_model // "unset")",
                "  placement         : \($p.placement | tostring)",
                "  env var names     : \(($p.env_vars // {}) | keys | tostring)",
                "  bindings kv/d1/r2 : \((($p.kv_namespaces // {}) | length)) / \((($p.d1_databases // {}) | length)) / \((($p.r2_buckets // {}) | length))"
              else
                "  FAILED: \(.errors | tostring)"
              end'

      - name: 5. The last five deployments, stage by stage
        run: |
          set -uo pipefail
          exec > >(tee -a /tmp/findings.md) 2>&1
          curl -sS --max-time 30 -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/deployments?per_page=5" \
            | jq -r '
              if .success then
                .result[] |
                "  ---",
                "   id          : \(.id)",
                "   url         : \(.url)",
                "   environment : \(.environment)",
                "   created_on  : \(.created_on)",
                "   commit      : \((.deployment_trigger.metadata.commit_hash // "")[0:7])",
                "   latest_stage: \(.latest_stage.name) \(.latest_stage.status)",
                (.stages[]? | "     stage     : \(.name) -> \(.status)")
              else
                "  FAILED: \(.errors | tostring)"
              end'

      - name: Post the diagnosis to #2057, once
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo '```' >> /tmp/findings.md
          # ONE comment carrying the whole reading. The ledger's problem is not
          # too few notes, it is 35 notes that all say the same nothing (P53).
          gh issue comment 2057 --repo "$GITHUB_REPOSITORY" --body-file /tmp/findings.md
          echo 'posted to #2057'

      - name: How to read the above
        if: always()
        run: |
          echo "=============================================================="
          echo 'Step 1 "A FUNCTION ANSWERED" on any host => Functions are alive there'
          echo '  and the outage is narrower than the ledger claims.'
          echo 'Step 1 "the SPA shell" on the pages.dev alias too => the fault is in'
          echo '  the deployment or the project, not in front of the custom domain.'
          echo 'Step 2 read the BODY, never the code. 200 + the SPA shell is the'
          echo '  ordinary fallback and means NOTHING. Only 200 + JSON says'
          echo '  _routes.json is served as an ASSET instead of read as routing'
          echo '  config, and that alone would darken every road.'
          echo 'Step 3 a token that cannot verify => every "Cloudflare-side" claim on'
          echo '  #2057 has been unverifiable from CI all along. Its own finding.'
          echo 'Step 5 compare the stages against what wrangler printed. Wrangler said'
          echo '  "Compiled Worker successfully / Uploading Functions bundle"; if'
          echo '  Cloudflare own record disagrees, that disagreement IS the bug.'
