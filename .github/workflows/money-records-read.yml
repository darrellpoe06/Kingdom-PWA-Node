# money-records-read -- TEMPORARY, READ-ONLY. One verification pass of the Money
# records in the database the app actually reads (the sovereign NAS Supabase),
# approved by Darrell 2026-11-05. Removed from the repo once the pass is done.
#
# Road: the one every sovereign lane walks (DR-1159 road 1) -- a GitHub runner
# joins the tailnet, ssh to the NAS, docker exec psql inside supabase-db --
# through scripts/live-sql.sh. The SQL is scripts/money-records-read.sql and it
# opens with BEGIN READ ONLY, so the server itself refuses any write.
# Balances are rounded to $100 and payments to $10 before they are printed;
# no descriptions, notes, emails or full ids leave the database.
#
# Dispatch only (not the timer class): a person asks, it answers, it stops.
# Budget: 10 minutes. Lock: concurrency group.
name: money-records-read

on:
  workflow_dispatch: {}
  # workflow_dispatch only knows workflows on main; this one never lands on
  # main, so it runs on a push of its own two files on its own branch.
  push:
    branches: ['ccr-055dea31-qi5vfm']
    paths: ['.github/workflows/money-records-read.yml', 'scripts/money-records-read.sql']

concurrency:
  group: money-records-read
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Read the Money records (BEGIN READ ONLY)
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -o pipefail
          bash scripts/live-sql.sh '|' < scripts/money-records-read.sql | tee money-records.txt
          { echo '## Money records (live NAS database, read-only, rounded)'; echo '```'; cat money-records.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
