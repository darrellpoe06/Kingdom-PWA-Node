# Sovereign migration drift — READ-ONLY witness (DR-0317)
#
# WHY THIS EXISTS. On 2026-08-31, while verifying that migration 0163 had
# actually reached the database, the ledger was measured in the wrong place and
# the real gap surfaced: `db-migrate.yml` applies every migration through the
# `SUPABASE_DB_URL` secret, which still names the HOSTED project — while the app
# has read the SOVEREIGN stack since REPOINT-ARMED landed on 2026-08-19. MEASURED
# that day: 0163's `moore_showcase_read` policy exists on the hosted database,
# and the hosted `_schema_migrations` ledger carries 176 rows with 0163 newest,
# applied 13:38:51Z. Nothing replays migrations to the sovereign side —
# `replay_migrations.sh` is invoked only by `install.sh`, a one-time path. So a
# merged migration lands on a database the app no longer reads, and CI stays
# green either way. Same shape as the blob gap this DR opened with: the repoint
# moved one thing, left another behind, and nothing watched.
#
# This workflow ONLY OBSERVES. It runs SELECTs against the sovereign ledger and
# prints the difference against the repo's own migration files. It applies
# nothing, writes nothing, and heals nothing — closing the gap is a decision
# about where migrations should land, and that is Darrell's to make with the
# real number in front of him rather than a guess.
#
# Dispatch-only, so it is NOT the timer-driven class the three-brakes rule
# governs (P10/P11/P12): no schedule, no self-trigger, it exits when it has
# counted. Unknown never reads as healthy (DR-0076) — if the NAS cannot be
# reached, this FAILS loudly rather than reporting "no drift".
name: Sovereign migration drift (read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    name: count what the sovereign database is missing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Read the sovereign ledger and diff it against the repo
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -uo pipefail
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          umask 077
          printf '%s\n' "$NAS_SSH_KEY" > /tmp/nas_key

          SSH="ssh -i /tmp/nas_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
               -o BatchMode=yes dpoe@poetech.tail5a2f35.ts.net"

          # REACHABILITY FIRST, and NEVER swallow the reason (the 2026-08-31 fix
          # to this file's own first run): the original piped stderr to
          # /dev/null, so when the very first dispatch failed in one second the
          # witness could say only "NOT MEASURED" — honest, but blind, which
          # makes it useless for acting on. A witness has to report WHY.
          # MagicDNS is also not always resolvable the instant tailscaled comes
          # up, so a single immediate attempt can fail on timing alone.
          probe=""; err=""
          for attempt in 1 2 3; do
            if err=$($SSH "echo READY" 2>&1); then probe="$err"; break; fi
            sleep 5
          done
          if [ "$probe" != "READY" ]; then
            rm -f /tmp/nas_key
            note "## Sovereign migration drift — NOT MEASURED"
            note ""
            note "The NAS was not reachable over the tailnet after 3 attempts. Last error:"
            note ""
            note '```'
            note "$err"
            note '```'
            note ""
            note "An unmeasured dimension is never reported as healthy (DR-0076)."
            echo "::error::NAS unreachable — sovereign drift is UNKNOWN, not zero"
            exit 1
          fi

          # SELECT only. `docker exec` runs psql inside the stack's own db
          # container, so no port or password ever leaves the NAS. Try without
          # sudo first (dpoe may be in the docker group); fall back to sudo -n,
          # which is the channel the deploy workflow already uses.
          Q="select filename from public._schema_migrations order by filename"
          LEDGER=""; dberr=""
          for runner in "docker" "sudo -n docker"; do
            if out=$($SSH "$runner exec supabase-db psql -U supabase_admin -d postgres -tAc \"$Q\"" 2>&1); then
              LEDGER="$out"; break
            fi
            dberr="$out"
          done
          rm -f /tmp/nas_key

          if [ -z "$LEDGER" ]; then
            note "## Sovereign migration drift — NOT MEASURED"
            note ""
            note "The NAS answered, but the ledger query did not. Last error:"
            note ""
            note '```'
            note "$dberr"
            note '```'
            note ""
            note "Either \`public._schema_migrations\` does not exist on the sovereign database — which would itself mean NO migration ledger was ever replayed there — or the db container/credentials differ from \`supabase-db\` / \`supabase_admin\`."
            note "An unmeasured dimension is never reported as healthy (DR-0076)."
            echo "::error::sovereign ledger unreadable — drift is UNKNOWN, not zero"
            exit 1
          fi

          printf '%s\n' "$LEDGER" | sed '/^$/d' | sort > /tmp/sovereign.txt
          ls infra/supabase/migrations-auto/*.sql | xargs -n1 basename | sort > /tmp/repo.txt

          repo_n=$(wc -l < /tmp/repo.txt)
          sov_n=$(wc -l < /tmp/sovereign.txt)
          missing=$(comm -23 /tmp/repo.txt /tmp/sovereign.txt)
          missing_n=$(printf '%s\n' "$missing" | sed '/^$/d' | wc -l)

          note "## Sovereign migration drift — $(date -u +%FT%TZ)"
          note ""
          note "- migrations in the repo: **$repo_n**"
          note "- applied on the sovereign database: **$sov_n**"
          note "- **missing from the database the app actually reads: $missing_n**"
          note ""
          if [ "$missing_n" -gt 0 ]; then
            note "<details><summary>the $missing_n missing migrations</summary>"
            note ""
            printf '%s\n' "$missing" | sed '/^$/d' | while read -r m; do note "- \`$m\`"; done
            note ""
            note "</details>"
            note ""
            note "Each one is a schema change that merged green and never reached the live database."
            echo "::warning::$missing_n migrations are missing from the sovereign database (DR-0317)"
          else
            note "**No drift.** Every repo migration is present on the sovereign database."
          fi
