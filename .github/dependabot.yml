# Dependency-update witness (2026-07-30 access evaluation): the repo had NO
# automated eye on dependency CVEs. Weekly, grouped, low-churn. SAFE WITH THE
# AUTO-MERGE LANE BY CONSTRUCTION: dependabot/* branches do not match the
# lane's prefix filter (feat/fix/merge/docs/claude), so nothing here ever
# merges unattended — every update PR waits for the Governor's hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      all-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
  # DR-1330 D3 (2026-11-05): the Python the workflows install, pinned in one
  # file (infra/requirements-ci.txt) and watched here; and the two NAS images
  # that pin a base (pytorch/pytorch). Same lane posture as the npm entry: a
  # dependabot/* branch never auto-merges.
  - package-ecosystem: pip
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /infra/avatar-studio
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
  - package-ecosystem: docker
    directory: /infra/voice-studio
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
