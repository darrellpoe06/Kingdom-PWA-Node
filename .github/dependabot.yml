# Dependency-update witness (2026-07-30 access evaluation): the repo had NO
# automated eye on dependency CVEs. Weekly, grouped, low-churn. SAFE WITH THE
# AUTO-MERGE LANE BY CONSTRUCTION: dependabot/* branches do not match the
# lane's prefix filter (feat/fix/merge/docs/claude), so nothing here ever
# merges unattended — every update PR waits for the Governor's hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      all-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
