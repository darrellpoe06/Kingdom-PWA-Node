# Kong declarative config -- the single front door.
# Routes mirror the hosted product EXACTLY, which is what lets the app swap URL
# + anon key without touching any of its 333 supabase.* call sites.
# reload-nonce: 20260819a -- this line exists to change the file's hash so
# install.sh's kong-restart mechanism fires (measured 2026-08-19: the live
# kong answered /sb/auth/v1 but 404'd /sb/rest/v1 -- serving a config OLDER
# than this file, so sign-in's PostgREST leg died while health passed).
_format_version: "2.1"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths: [/auth/v1/]
      # /sb mirror (DR-0307): the public funnel mounts /sb -> kong with the
      # full path preserved; these twins strip the /sb prefix so the same
      # services answer poetech.us/sb/* with zero extra hops.
      - name: auth-v1-sb
        strip_path: true
        paths: [/sb/auth/v1/]
    plugins:
      - name: cors
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths: [/rest/v1/]
      - name: rest-v1-sb
        strip_path: true
        paths: [/sb/rest/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: true, key_names: [apikey] }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }
  - name: realtime-v1
    url: http://realtime:4000/socket/
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths: [/realtime/v1/]
      - name: realtime-v1-sb
        strip_path: true
        paths: [/sb/realtime/v1/]
    plugins:
      - name: cors
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths: [/storage/v1/]
      - name: storage-v1-sb
        strip_path: true
        paths: [/sb/storage/v1/]
    plugins:
      - name: cors
