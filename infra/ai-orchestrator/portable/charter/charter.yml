# =============================================================================
# charter.yml  --  the orchestrator's policy, as DATA the container reads.
# =============================================================================
# SKELETON / PLACEHOLDER. This is a working stand-in so the bundle is complete
# and runnable. The CANONICAL Charter is approved by Darrell separately; until
# then this file governs, and it ships in the safest possible posture:
# disarmed, kill-switch engaged, self-drive NOT implemented.
#
# The orchestrator reads this at runtime (mounted read-only at /charter). Editing
# it is how you change policy -- no rebuild, no code edit. The one value the
# supervisor enforces as a HARD gate today is `autonomy.self_drive_implemented`.
#
# Typographic theology (CLAUDE.md Layer 0) is in force in this file and every
# artifact: God references capitalized; the adversary's names never are.
# =============================================================================

meta:
  name: poetech-portable-orchestrator
  charter_version: 0.1.0-skeleton
  status: SKELETON                # not the canonical Charter; placeholder
  approval: pending-darrell       # canonical Charter approved separately
  self_contained: true            # no external dependency beyond pinned images

# --- Autonomy posture -------------------------------------------------------
autonomy:
  default: disarmed               # ships disarmed; arm is a deliberate, audited act
  self_drive_implemented: false   # HARD gate the supervisor honors above all else
  vendor_summoning: forbidden_until_armed
  # June-6 runaway rule: nothing self-activates unattended, ever, and never while
  # the principal is traveling. Arm only with someone watching.
  arm_requires:
    - kill_switch_disengaged      # remove state/KILL_SWITCH
    - arm_flag_set                # create state/ARMED (arm.sh)
    - budgets_configured          # per-task AND daily ceilings > 0

# --- The three brakes (CLAUDE.md: "Autonomous Automation Requires Three Brakes")
brakes:
  budget:
    per_task_usd: 0.00            # ceiling per single vendor-LLM task (0 = unset = blocked)
    daily_usd: 0.00               # ceiling per UTC day across all summons
    on_ceiling: refuse            # reach the ceiling -> refuse; never continue
  concurrency:
    max_concurrent: 1             # single-instance; a second start SKIPS
    mechanism: atomic-lockdir     # state/orchestrator.lock
  kill_switch:
    engaged_by_default: true      # bundle ships with state/KILL_SWITCH present
    on_engaged: inert             # auto-pause; never auto-continue into a runaway
    file: state/KILL_SWITCH

# --- Ask-vs-Act (the heart of the policy; SKELETON lists) -------------------
# When (and only when) autonomy is armed AND self-drive is implemented, the
# orchestrator may ACT on `act` items within budget, and must ASK (surface for
# human approval, take no side effect) on `ask` items. Anything not listed is
# implicitly ASK. These lists are placeholders for the canonical Charter.
ask_vs_act:
  may_act_autonomously:           # low-risk, reversible, observable
    - read_health_status
    - read_event_log
    - summarize_local_state
    - propose_action              # propose only; execution still gated
  must_ask_first:                 # human approval required, no side effect until granted
    - summon_vendor_llm           # any paid/cloud model call (budget-gated too)
    - write_outside_bundle
    - touch_network_gear
    - change_routing_or_vlan      # forbidden entirely on protected VLANs (see Cage)
    - spend_money
    - send_outbound_message
  forbidden_always:               # never, armed or not
    - modify_audit_log            # the event log is append-only
    - disable_own_brakes
    - alter_protected_vlan_routing

# --- Standing rules the orchestrator operates under -------------------------
standing_rules:
  - id: three-brakes
    rule: >
      No autonomous, timer-driven, or self-triggering behavior runs without a
      budget, a concurrency lock, AND a kill-switch. Missing any one = inert.
  - id: tier-c-to-arm
    rule: >
      Arming autonomy is a Tier C change (RELEASE-TIERS.md): family-visible,
      reviewed, signed off, and turned on only with someone watching. Never Tier A.
  - id: ship-inert
    rule: >
      The bundle ships inert. Standing up gives control and observability; it
      does not start self-drive. Self-drive arms later, deliberately.
  - id: append-only-truth
    rule: >
      Every outcome is appended to the local JSONL event log. Nothing rewrites
      or deletes it. Observability is non-optional.
  - id: self-contained
    rule: >
      The orchestrator relies on nothing outside this bundle except its pinned
      container image. No external registry, no cloud, no phone-home.
