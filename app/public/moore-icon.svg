<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Moore Divahs install mark (DR-0227) — built from MOORE_BRAND (accent
       #B85838, sewing craft: the dashed stitch line). Distinct from the
       PoeTech "P" so her installed app is unmistakably HERS. Interim mark
       from her own brand record; swaps in one file when supplied artwork
       lands (board: md-door). -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#FAF8F4" stroke="#B85838" stroke-width="20"/>
  <text x="256" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="220" fill="#B85838">MD</text>
  <!-- the stitch: her craft, in one line -->
  <line x1="120" y1="366" x2="392" y2="366" stroke="#B85838" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 40"/>
  <text x="256" y="432" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="6" fill="#1A1815">DIVAHS</text>
</svg>
