<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Belt-and-suspenders no-cache for iOS Safari PWA. Bundle filenames are
         content-hashed by Vite, so freshness is guaranteed even if these
         headers are stripped somewhere upstream. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>PoeTech Family OS</title>
    <meta name="description" content="Sovereign family stewardship — financial, household, ministry. Local-first by design." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1A1815" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignores SVG apple-touch-icons on several versions; ship a real PNG so
         Add-to-Home-Screen shows the brand mark (also required for the App Store). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PoeTech" />
    <!-- Leaflet is no longer loaded here. It powers ONE surface (the Rentals
         property map) and used to load render-blocking from unpkg on every cold
         load. It now loads on demand when that map mounts (src/lib/leaflet-loader.js). -->
    <!-- Modulepreload the main app chunk so it downloads in PARALLEL with the entry
         chunk instead of waiting behind it (kills one waterfall RTT on cold load).
         Only for the full-app boot — the lightweight standalone boots (?register,
         ?join, ?audience, etc.) never import the monolith, so they must NOT preload
         it. The hashed href is injected at build time (vite.config.js plugin). -->
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        var standalone = ['join', 'invites', 'register', 'audience', 'teach', 'login', 'request-space', 'share', 'oauth_popup']
          .some(function (k) { return p.get(k) === '1'; });
        var href = '__MONOLITH_PRELOAD_HREF__';
        if (!standalone && href.charAt(0) === '/') {
          var l = document.createElement('link');
          l.rel = 'modulepreload';
          l.href = href;
          l.crossOrigin = '';
          document.head.appendChild(l);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
